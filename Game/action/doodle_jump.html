<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Hopper</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#1a1a3d);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:12px;max-width:400px;width:100%;display:flex;flex-direction:column;height:100%;max-height:800px;position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-size:14px;font-weight:800;color:#00f5ff}
.stage{flex:1;min-height:0;border-radius:14px;overflow:hidden}
canvas{width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;background:rgba(15,12,41,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:26px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);pointer-events:none}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Sky Hopper</h1>
    <div class="sc" id="score">0</div>
  </div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="hint">Drag left/right to move • auto-jump on platforms</div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">You Fell!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="init()">Play Again</button></div>
</div>
<script src="../ads.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
function fit(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
window.addEventListener('resize',fit);
let W,H,player,platforms,score,over,camY,best=+(localStorage.getItem('hopperBest')||0),moveDir,touchX,raf,running=false;
function init(){
  fit(); W=cv.clientWidth; H=cv.clientHeight;
  player={x:W/2,y:H-100,vy:-14,vx:0,r:16};
  platforms=[]; camY=0; score=0; over=false; moveDir=0; touchX=null;
  let y=H-40;
  for(let i=0;i<14;i++){
    platforms.push({x:20+Math.random()*(W-70),y:y,w:60,moving: Math.random()<0.3});
    y -= 70+Math.random()*30;
  }
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').classList.remove('show');
  if(!running){ running=true; raf=requestAnimationFrame(loop); }
}
cv.addEventListener('touchstart',e=>{ touchX=e.touches[0].clientX; });
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  const dx=e.touches[0].clientX-touchX;
  moveDir=dx;
  touchX=e.touches[0].clientX;
},{passive:false});
cv.addEventListener('touchend',()=>{ moveDir=0; });
document.addEventListener('keydown',e=>{ if(e.key==='ArrowLeft')moveDir=-6; if(e.key==='ArrowRight')moveDir=6; });
document.addEventListener('keyup',e=>{ if(e.key==='ArrowLeft'||e.key==='ArrowRight')moveDir=0; });
cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  const cx2=e.clientX-r.left;
  moveDir=(cx2-player.x)*0.15;
});
function loop(){
  if(!over) update();
  draw();
  if(running) raf=requestAnimationFrame(loop);
}
function update(){
  player.vx += (moveDir*0.6 - player.vx)*0.2;
  player.x += player.vx;
  if(player.x<10)player.x=W-10; if(player.x>W-10)player.x=10;
  player.vy += 0.5;
  player.y += player.vy;
  if(player.vy>0){
    platforms.forEach(p=>{
      if(player.x>p.x-6 && player.x<p.x+p.w+6 && player.y+player.r>p.y && player.y+player.r<p.y+14+player.vy){
        player.vy=-14;
      }
    });
  }
  if(player.y < H*0.4){
    const dy=H*0.4-player.y;
    player.y=H*0.4;
    camY+=dy;
    score=Math.max(score,Math.floor(camY/10));
    document.getElementById('score').textContent=score;
    platforms.forEach(p=>p.y+=dy);
    platforms=platforms.filter(p=>p.y<H+20);
    while(platforms.length<14){
      const topY=Math.min(...platforms.map(p=>p.y));
      platforms.push({x:20+Math.random()*(W-70),y:topY-(70+Math.random()*30),w:60,moving:Math.random()<0.3});
    }
  }
  platforms.forEach(p=>{ if(p.moving){ p.x+=Math.sin(Date.now()/600+p.y)*1.2; p.x=Math.max(10,Math.min(W-70,p.x)); } });
  if(player.y>H+30) endGame();
}
function draw(){
  const grad=cx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'#1a1a3d');grad.addColorStop(1,'#0b0b1e');
  cx.fillStyle=grad; cx.fillRect(0,0,W,H);
  platforms.forEach(p=>{
    cx.fillStyle=p.moving?'#ff9f43':'#38f9a1';
    cx.beginPath();
    if(cx.roundRect) cx.roundRect(p.x,p.y,p.w,12,6); else cx.rect(p.x,p.y,p.w,12);
    cx.fill();
  });
  cx.beginPath(); cx.arc(player.x,player.y,player.r,0,Math.PI*2);
  cx.fillStyle='#00f5ff'; cx.fill();
  cx.fillStyle='#0b0b1e';
  cx.beginPath(); cx.arc(player.x-5,player.y-3,2.5,0,Math.PI*2); cx.fill();
  cx.beginPath(); cx.arc(player.x+5,player.y-3,2.5,0,Math.PI*2); cx.fill();
}
function endGame(){
  over=true;
  running=false;
  if(window.KQFX)KQFX.play('blast');
  if(score>best){best=score;localStorage.setItem('hopperBest',best);}
  document.getElementById('finalScore').textContent='Height: '+score+'  •  Best: '+best;
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
init();
</script></body></html>
