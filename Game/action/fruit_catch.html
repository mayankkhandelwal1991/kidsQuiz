<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Fruit Catch</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ffd166,#34d399);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:440px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:14px}
canvas{width:100%;border-radius:18px;display:block;background:linear-gradient(180deg,#e0f7ff,#fdfff0);touch-action:none}
.hint{text-align:center;color:#888;font-size:12px;margin-top:6px;font-weight:600}

/* mobile fit */
.wrap{display:flex;flex-direction:column;height:100%;max-height:820px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0}
canvas{max-height:100%}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">⭐ <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="stage"><canvas id="cv" width="400" height="560"></canvas></div>
  <div class="hint">Drag finger / move mouse / use ← → arrows</div>
</div>
<script src="../ads.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const FRUITS=['🍎','🍌','🍇','🍓','🍊','🍉'];
let bx,items,score,lives,playing,dead,frame,keys={},best=+(localStorage.getItem('fruitBest')||0);
document.getElementById('best').textContent=best;
function reset(){bx=cv.width/2;items=[];score=0;lives=3;playing=false;dead=false;frame=0;
  document.getElementById('score').textContent=0;document.getElementById('lives').textContent=3;}
function setX(clientX){
  const r=cv.getBoundingClientRect();
  bx=Math.max(30,Math.min(cv.width-30,(clientX-r.left)/r.width*cv.width));
  if(dead)reset();playing=true;
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();setX(e.clientX);});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e.clientX);});
cv.addEventListener('touchmove',e=>{e.preventDefault();setX(e.touches[0].clientX);},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(dead){reset();}playing=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
function update(){
  frame++;
  if(keys['ArrowLeft'])bx=Math.max(30,bx-7);
  if(keys['ArrowRight'])bx=Math.min(cv.width-30,bx+7);
  if(playing&&!dead){
    if(frame%Math.max(30,55-Math.floor(score/4))===0){
      const bomb=Math.random()<0.18;
      items.push({x:30+Math.random()*(cv.width-60),y:-20,e:bomb?'💣':FRUITS[Math.floor(Math.random()*FRUITS.length)],bomb,v:2.2+score*0.04+Math.random()});
    }
    for(let i=items.length-1;i>=0;i--){
      const it=items[i];it.y+=it.v;
      if(it.y>cv.height-58&&it.y<cv.height-20&&Math.abs(it.x-bx)<38){
        items.splice(i,1);
        if(it.bomb)loseLife();
        else{score++;document.getElementById('score').textContent=score;if(window.KQFX)KQFX.play('pop');}
      }else if(it.y>cv.height+20){
        items.splice(i,1);
        if(!it.bomb)loseLife();
      }
    }
  }
  draw();requestAnimationFrame(update);
}
function loseLife(){
  lives--;document.getElementById('lives').textContent=lives;
  if(lives<=0){dead=true;if(window.KQFX)KQFX.lose();onGameComplete();
    if(score>best){best=score;localStorage.setItem('fruitBest',best);document.getElementById('best').textContent=best;}
  }
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.font='30px serif';cx.textAlign='center';
  items.forEach(it=>cx.fillText(it.e,it.x,it.y));
  cx.font='44px serif';cx.fillText('🧺',bx,cv.height-18);
  cx.fillStyle='#ff5a8a';cx.font='bold 20px sans-serif';
  if(!playing&&!dead)cx.fillText('Touch or move to start!',cv.width/2,200);
  if(dead){cx.fillText('💥 Game over! Score: '+score,cv.width/2,190);cx.font='bold 14px sans-serif';cx.fillText('Touch to play again',cv.width/2,220);}
  cx.textAlign='left';
}
reset();update();
</script></body></html>
