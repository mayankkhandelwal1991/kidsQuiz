<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Piano Tiles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#1a1a3d);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:12px;max-width:380px;width:100%;display:flex;flex-direction:column;height:100%;max-height:800px;position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:19px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-size:14px;font-weight:800;color:#00f5ff}
.stage{flex:1;min-height:0;position:relative;border-radius:14px;overflow:hidden;background:#0b0b1e}
.lane{position:absolute;top:0;bottom:0;width:25%;border-right:1px solid rgba(255,255,255,.06)}
.tile{position:absolute;width:100%;border-radius:8px;background:linear-gradient(135deg,#1a1a3d,#2d2b55);border:1px solid rgba(0,245,255,.4)}
.hitline{position:absolute;left:0;right:0;bottom:15%;height:2px;background:rgba(0,245,255,.5)}
.overlay{position:absolute;inset:0;background:rgba(15,12,41,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:26px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.starttxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#aaa;font-size:14px;padding:20px;z-index:5}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Piano Tiles</h1>
    <div class="sc" id="score">0</div>
  </div>
  <div class="stage" id="stage">
    <div class="lane" style="left:0"></div><div class="lane" style="left:25%"></div><div class="lane" style="left:50%"></div><div class="lane" style="left:75%"></div>
    <div class="hitline"></div>
    <div class="starttxt" id="starttxt">Tap the black tiles as they cross the line.<br>Tap anywhere to start!</div>
  </div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">Game Over</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="startGame()">Play Again</button></div>
</div>
<script src="../ads.js"></script>
<script>
const stage=document.getElementById('stage');
let tiles,score,speed,over,started,spawnTimer,raf,running=false,best=+(localStorage.getItem('pianoBest')||0);
function laneX(l){return l*25;}
function startGame(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('starttxt').style.display='none';
  tiles=[];score=0;speed=2.6;over=false;started=true;
  document.getElementById('score').textContent=0;
  document.querySelectorAll('.tile').forEach(t=>t.remove());
  spawnTile();
  clearInterval(spawnTimer);
  spawnTimer=setInterval(()=>{ if(!over) maybeSpawn(); },550);
  if(!running){ running=true; raf=requestAnimationFrame(loop); }
}
let lastSpawnLane=-1;
function spawnTile(){
  let lane=Math.floor(Math.random()*4);
  const h=stage.clientHeight*0.22;
  const el=document.createElement('div');
  el.className='tile';
  el.style.height=h+'px';
  el.style.left=laneX(lane)+'%';
  el.style.top=(-h)+'px';
  stage.appendChild(el);
  const tile={el,lane,y:-h,h,hit:false};
  tiles.push(tile);
  el.addEventListener('touchstart',ev=>{ev.preventDefault();hitTile(tile);},{passive:false});
  el.addEventListener('mousedown',ev=>{hitTile(tile);});
}
function maybeSpawn(){ spawnTile(); }
function hitTile(tile){
  if(tile.hit||over)return;
  const hitLineY=stage.clientHeight*0.85;
  if(tile.y+tile.h < hitLineY-stage.clientHeight*0.35){ endGame(); return; }
  tile.hit=true;
  tile.el.style.background='linear-gradient(135deg,#00f5ff,#7c3aed)';
  tile.el.style.opacity='0';
  if(window.KQFX)KQFX.play('tap');
  score++;
  document.getElementById('score').textContent=score;
  speed=2.6+score*0.045;
  setTimeout(()=>tile.el.remove(),120);
}
function loop(){
  if(!over){
    const h=stage.clientHeight;
    tiles.forEach(t=>{
      t.y+=speed;
      t.el.style.top=t.y+'px';
      if(t.y>h && !t.hit){ endGame(); }
    });
    tiles=tiles.filter(t=>t.y<=h+50);
  }
  if(running) raf=requestAnimationFrame(loop);
}
stage.addEventListener('touchstart',e=>{ if(!started){ startGame(); } },{passive:true});
stage.addEventListener('click',e=>{ if(!started){ startGame(); } });
function endGame(){
  if(over)return;
  over=true;started=false;
  running=false;
  if(window.KQFX)KQFX.play('blast');
  clearInterval(spawnTimer);
  if(score>best){best=score;localStorage.setItem('pianoBest',best);}
  document.getElementById('finalScore').textContent='Score: '+score+'  •  Best: '+best;
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
</script></body></html>
