<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Gravity Maze 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#05050f;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{width:100%;height:100%;max-width:480px;max-height:900px;position:relative;background:#05050f;margin:auto}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;z-index:5}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:16px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-size:13px;font-weight:800;color:#00f5ff}
#scene{position:absolute;inset:0}
.overlay{position:absolute;inset:0;background:rgba(5,5,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);z-index:5}
.startCard{position:absolute;inset:0;background:rgba(5,5,20,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:8;text-align:center;padding:20px}
</style><link rel="stylesheet" href="game-theme.css"></head><body>
<div class="wrap">
  <div id="scene"></div>
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Gravity Maze 3D</h1>
    <div class="sc" id="timer">0:00</div>
  </div>
  <div class="hint">Drag anywhere to tilt the maze and roll the ball to the goal</div>
  <div class="startCard" id="startCard">
    <h2 style="font-size:22px;background:linear-gradient(135deg,#00f5ff,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent">Gravity Maze 3D</h2>
    <p style="font-size:13px;color:#ccc;max-width:260px">Drag to tilt the board and guide the glowing ball through the maze to the golden goal.</p>
    <button class="newbtn" onclick="startGame()">▶ Start Maze</button>
  </div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent">🎉 Reached Goal!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="startGame()">Play Again</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="ads.js"></script>
<script>
const container=document.getElementById('scene');
let scene,camera,renderer,boardGroup,ball,goal,walls=[],ballVel,tiltX=0,tiltZ=0,targetTiltX=0,targetTiltZ=0,over,started,startTs,timerId,best=+(localStorage.getItem('mazeBest')||0);
const N=9, CELL=0.9;
function genMaze(n){
  const grid=Array.from({length:n},()=>Array(n).fill(1));
  function carve(x,y){
    grid[y][x]=0;
    const dirs=[[2,0],[-2,0],[0,2],[0,-2]].sort(()=>Math.random()-0.5);
    dirs.forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx>0&&nx<n-1&&ny>0&&ny<n-1&&grid[ny][nx]===1){
        grid[y+dy/2][x+dx/2]=0;
        carve(nx,ny);
      }
    });
  }
  carve(1,1);
  grid[n-2][n-2]=0;
  return grid;
}
let mazeGrid;
function initScene(){
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x05050f,8,26);
  camera=new THREE.PerspectiveCamera(50,container.clientWidth/container.clientHeight,0.1,100);
  camera.position.set(0,8.5,6.5);
  camera.lookAt(0,0,0);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(container.clientWidth,container.clientHeight);
  renderer.setClearColor(0x05050f);
  container.innerHTML=''; container.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.75));
  const dir=new THREE.DirectionalLight(0xffffff,0.6); dir.position.set(3,10,4); scene.add(dir);
  boardGroup=new THREE.Group();
  scene.add(boardGroup);
}
function buildMaze(){
  while(boardGroup.children.length) boardGroup.remove(boardGroup.children[0]);
  walls=[];
  mazeGrid=genMaze(N);
  const size=N*CELL;
  const floor=new THREE.Mesh(new THREE.BoxGeometry(size,0.2,size),new THREE.MeshStandardMaterial({color:0x1a1a3d}));
  floor.position.y=-0.1;
  boardGroup.add(floor);
  const wallMat=new THREE.MeshStandardMaterial({color:0x7c3aed,emissive:0x2a1050,emissiveIntensity:0.4});
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    if(mazeGrid[y][x]===1){
      const w=new THREE.Mesh(new THREE.BoxGeometry(CELL,0.5,CELL),wallMat);
      w.position.set((x-N/2+0.5)*CELL,0.25,(y-N/2+0.5)*CELL);
      boardGroup.add(w);
      walls.push({x:(x-N/2+0.5)*CELL,z:(y-N/2+0.5)*CELL});
    }
  }
  const goalGeo=new THREE.CylinderGeometry(0.3,0.3,0.08,20);
  goal=new THREE.Mesh(goalGeo,new THREE.MeshStandardMaterial({color:0xffe066,emissive:0xffe066,emissiveIntensity:0.6}));
  goal.position.set((N-2-N/2+0.5)*CELL,0.05,(N-2-N/2+0.5)*CELL);
  boardGroup.add(goal);
  const ballGeo=new THREE.SphereGeometry(0.28,16,16);
  ball=new THREE.Mesh(ballGeo,new THREE.MeshStandardMaterial({color:0x00f5ff,emissive:0x003a3a,emissiveIntensity:0.5}));
  ball.position.set((1-N/2+0.5)*CELL,0.4,(1-N/2+0.5)*CELL);
  boardGroup.add(ball);
  const stripe=new THREE.Mesh(new THREE.TorusGeometry(.285,.035,8,16),new THREE.MeshStandardMaterial({color:0xffffff})); stripe.rotation.x=Math.PI/2; ball.add(stripe);
  ballVel={x:0,z:0};
}
function resetGame(){
  buildMaze();
  tiltX=0;tiltZ=0;targetTiltX=0;targetTiltZ=0;over=false;
  boardGroup.rotation.set(0,0,0);
  startTs=Date.now();
  document.getElementById('overlay').classList.remove('show');
  clearInterval(timerId);
  timerId=setInterval(()=>{
    const s=Math.floor((Date.now()-startTs)/1000);
    document.getElementById('timer').textContent=Math.floor(s/60)+':'+(s%60<10?'0':'')+(s%60);
  },250);
}
function startGame(){
  document.getElementById('startCard').style.display='none';
  if(!scene) initScene();
  resetGame();
  if(!started){ started=true; requestAnimationFrame(loop); }
}
let dragging=false,lastX=0,lastY=0;
container.addEventListener('touchstart',e=>{ dragging=true; lastX=e.touches[0].clientX; lastY=e.touches[0].clientY; },{passive:true});
container.addEventListener('touchmove',e=>{
  if(!dragging)return;
  const dx=e.touches[0].clientX-lastX, dy=e.touches[0].clientY-lastY;
  targetTiltZ = Math.max(-0.35,Math.min(0.35,targetTiltZ + dx*0.0025));
  targetTiltX = Math.max(-0.35,Math.min(0.35,targetTiltX - dy*0.0025));
  lastX=e.touches[0].clientX; lastY=e.touches[0].clientY;
},{passive:true});
container.addEventListener('touchend',()=>{ dragging=false; });
container.addEventListener('mousedown',e=>{ dragging=true; lastX=e.clientX; lastY=e.clientY; });
container.addEventListener('mousemove',e=>{
  if(!dragging)return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY;
  targetTiltZ = Math.max(-0.35,Math.min(0.35,targetTiltZ + dx*0.0025));
  targetTiltX = Math.max(-0.35,Math.min(0.35,targetTiltX - dy*0.0025));
  lastX=e.clientX; lastY=e.clientY;
});
container.addEventListener('mouseup',()=>{ dragging=false; });
function loop(){
  if(!over) update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function collides(x,z){
  const half=CELL*0.42;
  for(const w of walls){
    if(Math.abs(x-w.x)<half+0.28 && Math.abs(z-w.z)<half+0.28) return w;
  }
  return null;
}
function update(){
  targetTiltX*=0.995; targetTiltZ*=0.995;
  tiltX += (targetTiltX-tiltX)*0.15;
  tiltZ += (targetTiltZ-tiltZ)*0.15;
  boardGroup.rotation.x=tiltX;
  boardGroup.rotation.z=tiltZ;
  ballVel.x += Math.sin(tiltZ)*0.02;
  ballVel.z -= Math.sin(tiltX)*0.02;
  ballVel.x*=0.94; ballVel.z*=0.94;
  let nx=ball.position.x+ballVel.x, nz=ball.position.z+ballVel.z;
  if(!collides(nx,ball.position.z)) ball.position.x=nx; else ballVel.x=0;
  if(!collides(ball.position.x,nz)) ball.position.z=nz; else ballVel.z=0;
  const dx=ball.position.x-goal.position.x, dz=ball.position.z-goal.position.z;
  if(Math.sqrt(dx*dx+dz*dz)<0.35) win();
}
function win(){
  over=true; clearInterval(timerId);
  if(window.KQFX)KQFX.win();
  const t=Math.floor((Date.now()-startTs)/1000);
  if(!best || t<best){ best=t; localStorage.setItem('mazeBest',best); }
  document.getElementById('finalScore').textContent='Time: '+t+'s  •  Best: '+best+'s';
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth,container.clientHeight);
});
</script></body></html>
