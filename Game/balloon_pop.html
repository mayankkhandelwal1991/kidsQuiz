<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Balloon Pop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#6ee7ff,#ff7ac6);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:440px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:14px}
#area{position:relative;flex:1;min-height:320px;border-radius:18px;background:linear-gradient(180deg,#d9f6ff,#f0fcff);overflow:hidden}
.b{position:absolute;font-size:44px;cursor:pointer;user-select:none;transition:transform .1s}
.b:active{transform:scale(1.3)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.85);z-index:5}
.overlay h2{color:#ff5a8a;font-size:24px}
.overlay button{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:12px 36px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px}
.hidden{display:none}

/* mobile fit */
.wrap{display:flex;flex-direction:column;height:100%;max-height:820px}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">⭐ <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="start()">↻</button>
  </div>
  <div id="area">
    <div class="overlay" id="overlay">
      <h2 id="oTitle">🎈 Balloon Pop</h2>
      <p style="color:#666;font-weight:600" id="oText">Pop balloons before they escape. Avoid the 💣!</p>
      <button onclick="start()">▶ Start</button>
    </div>
  </div>
</div>
<script>
const area=document.getElementById('area'),overlay=document.getElementById('overlay');
const COLORS=['🎈','🟠','🟣','🔵'].map(()=>'🎈');
let score,lives,spawnT,playing=false,best=+(localStorage.getItem('balloonBest')||0);
document.getElementById('best').textContent=best;
function start(){
  [...area.querySelectorAll('.b')].forEach(b=>b.remove());
  score=0;lives=3;playing=true;
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  overlay.classList.add('hidden');
  clearInterval(spawnT);
  spawnT=setInterval(spawn,Math.max(500,900));
  spawn();
}
function spawn(){
  if(!playing)return;
  const b=document.createElement('div');
  const isBomb=Math.random()<0.15;
  b.className='b';b.textContent=isBomb?'💣':'🎈';
  if(!isBomb)b.style.filter='hue-rotate('+Math.floor(Math.random()*360)+'deg)';
  b.style.left=(10+Math.random()*80)+'%';
  b.style.top=area.clientHeight+'px';
  area.appendChild(b);
  const speed=1.2+score*0.03+Math.random();
  let y=area.clientHeight;
  const mv=setInterval(()=>{
    y-=speed*3;b.style.top=y+'px';
    if(y<-50){
      clearInterval(mv);b.remove();
      if(!isBomb&&playing)loseLife();
    }
  },30);
  b.onpointerdown=e=>{
    e.preventDefault();
    if(!playing)return;
    clearInterval(mv);
    if(isBomb){b.textContent='💥';setTimeout(()=>b.remove(),200);loseLife();}
    else{
      b.textContent='✨';setTimeout(()=>b.remove(),150);
      score++;document.getElementById('score').textContent=score;
      if(score%10===0){clearInterval(spawnT);spawnT=setInterval(spawn,Math.max(400,900-score*20));}
    }
  };
}
function loseLife(){
  lives--;document.getElementById('lives').textContent=lives;
  if(lives<=0)end();
}
function end(){
  playing=false;clearInterval(spawnT);
  if(score>best){best=score;localStorage.setItem('balloonBest',best);document.getElementById('best').textContent=best;}
  document.getElementById('oTitle').textContent='🎈 Score: '+score;
  document.getElementById('oText').textContent='Great popping! Try again?';
  overlay.classList.remove('hidden');
}
</script></body></html>
