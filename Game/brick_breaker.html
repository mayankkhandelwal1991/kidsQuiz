<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Brick Breaker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ff7ac6,#8b5cf6);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:440px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:14px}
canvas{width:100%;border-radius:18px;display:block;background:#1e2a4a;touch-action:none}
.hint{text-align:center;color:#888;font-size:12px;margin-top:6px;font-weight:600}

/* mobile fit */
.wrap{display:flex;flex-direction:column;height:100%;max-height:820px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0}
canvas{max-height:100%}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">⭐ <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="stage"><canvas id="cv" width="400" height="560"></canvas></div>
  <div class="hint">Drag finger / move mouse / use ← → to move paddle</div>
</div>
<script src="ads.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const COLS=8,ROWS=5,BW=46,BH=20,PAD=3;
const COLORS=['#ff5a5a','#ffb703','#ffe066','#8bd450','#5ab8ff'];
let px,ball,bricks,score,lives,playing,dead,won,keys={};
function reset(){
  px=cv.width/2;score=0;lives=3;playing=false;dead=false;won=false;
  ball={x:cv.width/2,y:cv.height-120,vx:3,vy:-3.4};
  bricks=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)
    bricks.push({x:8+c*(BW+PAD),y:50+r*(BH+PAD),alive:true,color:COLORS[r]});
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
}
function setX(clientX){
  const r=cv.getBoundingClientRect();
  px=Math.max(40,Math.min(cv.width-40,(clientX-r.left)/r.width*cv.width));
  if(dead||won)reset();playing=true;
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();setX(e.clientX);});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e.clientX);});
cv.addEventListener('touchmove',e=>{e.preventDefault();setX(e.touches[0].clientX);},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(dead||won)reset();playing=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
function update(){
  if(keys['ArrowLeft'])px=Math.max(40,px-8);
  if(keys['ArrowRight'])px=Math.min(cv.width-40,px+8);
  if(playing&&!dead&&!won){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<8||ball.x>cv.width-8)ball.vx*=-1;
    if(ball.y<8)ball.vy*=-1;
    if(ball.y>cv.height-30&&ball.y<cv.height-16&&Math.abs(ball.x-px)<44&&ball.vy>0){
      ball.vy=-Math.abs(ball.vy);
      ball.vx=(ball.x-px)*0.14;
      if(window.KQFX)KQFX.play('hit');
    }
    if(ball.y>cv.height+10){
      lives--;document.getElementById('lives').textContent=lives;
      if(lives<=0){dead=true;if(window.KQFX)KQFX.lose();onGameComplete();}
      else{ball={x:px,y:cv.height-120,vx:3,vy:-3.4};if(window.KQFX)KQFX.play('wrong');}
    }
    for(const b of bricks){
      if(!b.alive)continue;
      if(ball.x>b.x-6&&ball.x<b.x+BW+6&&ball.y>b.y-6&&ball.y<b.y+BH+6){
        b.alive=false;ball.vy*=-1;
        score+=10;document.getElementById('score').textContent=score;
        if(window.KQFX)KQFX.play('blast');
        break;
      }
    }
    if(bricks.every(b=>!b.alive)){won=true;if(window.KQFX)KQFX.win();onGameComplete();}
  }
  draw();requestAnimationFrame(update);
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  bricks.forEach(b=>{
    if(!b.alive)return;
    cx.fillStyle=b.color;
    cx.beginPath();cx.roundRect(b.x,b.y,BW,BH,5);cx.fill();
  });
  cx.fillStyle='#fff';
  cx.beginPath();cx.roundRect(px-44,cv.height-26,88,12,6);cx.fill();
  cx.fillStyle='#ffe066';
  cx.beginPath();cx.arc(ball.x,ball.y,8,0,7);cx.fill();
  cx.textAlign='center';cx.fillStyle='#fff';cx.font='bold 20px sans-serif';
  if(!playing)cx.fillText('Touch or press arrow to start!',cv.width/2,300);
  if(dead)cx.fillText('💥 Game over! Score: '+score+' — tap to retry',cv.width/2,300);
  if(won)cx.fillText('🎉 You cleared all bricks! '+score,cv.width/2,300);
  cx.textAlign='left';
}
reset();update();
</script></body></html>
