<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Car Race</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ffd166,#ff7ac6);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:420px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:16px}
canvas{width:100%;border-radius:18px;display:block;background:#555}
.ctrl{display:flex;gap:10px;margin-top:8px}
.ctrl button{flex:1;font-size:24px;padding:12px;border:none;border-radius:16px;background:linear-gradient(135deg,#34d399,#06b6d4);color:#fff;cursor:pointer;font-weight:800}

/* mobile fit */
.wrap{display:flex;flex-direction:column;height:100%;max-height:820px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0}
canvas{max-height:100%}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">⭐ <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="stage"><canvas id="cv" width="360" height="560"></canvas></div>
  <div class="ctrl"><button onclick="move(-1)">⬅️</button><button onclick="move(1)">➡️</button></div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const LANES=[60,180,300];
let lane,cars,score,speed,playing,dead,frame,best=+(localStorage.getItem('raceBest')||0);
document.getElementById('best').textContent=best;
function reset(){lane=1;cars=[];score=0;speed=3.5;playing=false;dead=false;frame=0;}
function move(d){
  if(dead){reset();return;}
  playing=true;
  lane=Math.max(0,Math.min(2,lane+d));
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')move(-1);
  if(e.key==='ArrowRight')move(1);
});
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  move(e.clientX-r.left<r.width/2?-1:1);
});
const ENEMIES=['🚙','🚕','🚌','🚚','🚓'];
function update(){
  frame++;
  if(playing&&!dead){
    speed=3.5+score*0.03;
    if(frame%Math.max(28,60-Math.floor(score/3))===0){
      cars.push({lane:Math.floor(Math.random()*3),y:-40,e:ENEMIES[Math.floor(Math.random()*ENEMIES.length)]});
    }
    cars.forEach(c=>c.y+=speed);
    if(cars.length&&cars[0].y>cv.height+40){cars.shift();score++;document.getElementById('score').textContent=score;}
    for(const c of cars){
      if(c.lane===lane&&c.y>cv.height-120&&c.y<cv.height-40){
        dead=true;
        if(score>best){best=score;localStorage.setItem('raceBest',best);document.getElementById('best').textContent=best;}
      }
    }
  }
  draw();requestAnimationFrame(update);
}
function draw(){
  cx.fillStyle='#4a4a4a';cx.fillRect(0,0,cv.width,cv.height);
  cx.strokeStyle='#fff';cx.lineWidth=5;cx.setLineDash([26,22]);
  cx.lineDashOffset=-(frame*speed)%48;
  [120,240].forEach(x=>{cx.beginPath();cx.moveTo(x,0);cx.lineTo(x,cv.height);cx.stroke();});
  cx.setLineDash([]);
  cx.fillStyle='#7cc576';cx.fillRect(0,0,14,cv.height);cx.fillRect(cv.width-14,0,14,cv.height);
  cx.font='40px serif';cx.textAlign='center';
  cars.forEach(c=>cx.fillText(c.e,LANES[c.lane],c.y));
  cx.fillText('🏎️',LANES[lane],cv.height-60);
  cx.fillStyle='#fff';cx.font='bold 20px sans-serif';
  if(!playing&&!dead)cx.fillText('Tap left/right to start!',cv.width/2,200);
  if(dead){cx.fillText('💥 Crash! Score: '+score,cv.width/2,200);cx.font='bold 14px sans-serif';cx.fillText('Tap to play again',cv.width/2,230);}
  cx.textAlign='left';
}
reset();update();
</script></body></html>
