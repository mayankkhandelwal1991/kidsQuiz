<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Category Sort</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ff9a9e,#fecfef);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#be185d;font-size:15px}
.progwrap{background:#fce7f3;border-radius:20px;height:10px;overflow:hidden;margin-bottom:10px}
.progbar{height:100%;background:linear-gradient(135deg,#ec4899,#f472b6);width:0%;transition:width .4s ease}
.card{margin:10px auto 16px;width:130px;padding:14px 0;border-radius:18px;background:linear-gradient(135deg,#fff8e6,#fff);border:3px dashed #ffb703;transition:transform .25s, opacity .25s}
.card.fly{transform:scale(.2) translateY(-40px);opacity:0}
.card .em{font-size:44px}
.card .wd{font-size:18px;font-weight:800;color:#be185d;margin-top:2px}
.buckets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.bucket{border-radius:16px;padding:12px 4px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-weight:800;font-size:12px;cursor:pointer;transition:transform .1s}
.bucket:active{transform:scale(.92)}
.bucket .be{font-size:24px;display:block;margin-bottom:2px}
.bucket.correct{background:linear-gradient(135deg,#34d399,#06b6d4);animation:pop .4s ease}
.bucket.wrong{background:linear-gradient(135deg,#f87171,#fb923c);animation:shake .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{color:#be185d;font-weight:800;font-size:15px;min-height:22px}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card2{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#be185d;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🗂️ <span id="score">0</span>/<span id="totalW">10</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="progwrap"><div class="progbar" id="prog"></div></div>
  <div class="card" id="card"><div class="em" id="em"></div><div class="wd" id="wd"></div></div>
  <div class="buckets" id="buckets"></div>
  <div class="msg" id="msg">Tap the bucket it belongs to!</div>
</div>
<div class="end" id="end">
  <div class="card2">
    <div class="big">🏆</div>
    <h2>Round Complete!</h2>
    <p id="endMsg">Great sorting!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="ads.js"></script>
<script>
const CATS=[
 {name:'Animals',icon:'🐾',words:[['CAT','🐱'],['DOG','🐶'],['TIGER','🐯'],['ZEBRA','🦓'],['RABBIT','🐰'],['SHARK','🦈'],['WHALE','🐳'],['MOUSE','🐭'],['PANDA','🐼'],['SNAKE','🐍'],['HORSE','🐴'],['FROG','🐸'],['BIRD','🐦'],['MONKEY','🐵']]},
 {name:'Fruits',icon:'🍎',words:[['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['BANANA','🍌'],['ORANGE','🍊']]},
 {name:'Things',icon:'🏠',words:[['HOUSE','🏠'],['TRAIN','🚂'],['PLANE','✈️'],['CLOCK','⏰'],['GUITAR','🎸'],['CAMERA','📷'],['SCHOOL','🏫'],['PENCIL','✏️'],['ROCKET','🚀']]}
];
const ROUND_LEN=10;
let round=[],idx=0,score=0,cur=null;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(){
  let all=[];
  CATS.forEach(c=>c.words.forEach(w=>all.push({word:w,cat:c.name})));
  round=shuffleArr(all).slice(0,ROUND_LEN);
  idx=0;score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('totalW').textContent=round.length;
  document.getElementById('end').classList.remove('show');
  renderBuckets();
  loadRound();
}

function renderBuckets(){
  const b=document.getElementById('buckets');b.innerHTML='';
  CATS.forEach(c=>{
    const d=document.createElement('div');d.className='bucket';
    d.innerHTML='<span class="be">'+c.icon+'</span>'+c.name;
    d.onclick=()=>pick(c.name,d);
    b.appendChild(d);
  });
}

function loadRound(){
  if(idx>=round.length){finish();return;}
  cur=round[idx];
  const card=document.getElementById('card');
  card.classList.remove('fly');
  document.getElementById('em').textContent=cur.word[1];
  document.getElementById('wd').textContent=cur.word[0];
  document.getElementById('prog').style.width=Math.round(idx/round.length*100)+'%';
  document.getElementById('msg').textContent='Round '+(idx+1)+' of '+round.length;
  document.querySelectorAll('.bucket').forEach(x=>{x.classList.remove('correct','wrong');x.style.pointerEvents='auto';});
}

function pick(catName,el){
  document.querySelectorAll('.bucket').forEach(o=>o.style.pointerEvents='none');
  if(catName===cur.cat){
    el.classList.add('correct');
    score++;document.getElementById('score').textContent=score;
    document.getElementById('msg').textContent='🎉 '+cur.word[0]+' is a '+cur.cat.slice(0,-1)+'!';
    document.getElementById('card').classList.add('fly');
    burstConfetti();
  }else{
    el.classList.add('wrong');
    document.getElementById('msg').textContent='❌ '+cur.word[0]+' belongs in '+cur.cat+'!';
  }
  idx++;
  setTimeout(loadRound,1000);
}

function finish(){
  document.getElementById('prog').style.width='100%';
  document.getElementById('endMsg').textContent='You sorted '+score+' out of '+round.length+' correctly!';
  document.getElementById('end').classList.add('show');
  onGameComplete();
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
