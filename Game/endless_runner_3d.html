<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Runner 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#05050f;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{width:100%;height:100%;max-width:480px;max-height:900px;position:relative;background:#05050f;border-radius:0;overflow:hidden;margin:auto}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;z-index:5;pointer-events:none}
.bar button{pointer-events:auto;background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:16px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 12px rgba(0,245,255,.3)}
.sc{font-size:14px;font-weight:800;color:#00f5ff}
#scene{position:absolute;inset:0}
.overlay{position:absolute;inset:0;background:rgba(5,5,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);z-index:5}
.startCard{position:absolute;inset:0;background:rgba(5,5,20,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:8;text-align:center;padding:20px}
</style><link rel="stylesheet" href="game-theme.css"></head><body>
<div class="wrap">
  <div id="scene"></div>
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Neon Runner 3D</h1>
    <div class="sc" id="score">0</div>
  </div>
  <div class="hint">Swipe left/right to change lane • swipe up to jump</div>
  <div class="startCard" id="startCard">
    <h2 style="font-size:22px;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">Neon Runner 3D</h2>
    <p style="font-size:13px;color:#ccc;max-width:260px">Swipe left/right to switch lanes, swipe up to jump the barriers. Survive as long as you can!</p>
    <button class="newbtn" onclick="startGame()">▶ Start Run</button>
  </div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">Crashed!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="startGame()">Run Again</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="assets/GLTFLoader-r128.js"></script>
<script src="ads.js"></script>
<script>
const container=document.getElementById('scene');
let scene,camera,renderer,player,lanes=[-2.2,0,2.2],curLane=1,obstacles=[],score,over,speed,best=+(localStorage.getItem('runner3dBest')||0),jumpVel=0,jumping=false,started=false;
function initScene(){
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x05050f,10,55);
  camera=new THREE.PerspectiveCamera(65,container.clientWidth/container.clientHeight,0.1,100);
  camera.position.set(0,4.2,8);
  camera.lookAt(0,1,-6);
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setSize(container.clientWidth,container.clientHeight);
  renderer.setClearColor(0x05050f);
  container.innerHTML='';
  container.appendChild(renderer.domElement);

  const amb=new THREE.AmbientLight(0x8080ff,0.6); scene.add(amb);
  const dir=new THREE.DirectionalLight(0x00f5ff,0.8); dir.position.set(2,6,3); scene.add(dir);

  const roadGeo=new THREE.PlaneGeometry(8,200);
  const roadMat=new THREE.MeshStandardMaterial({color:0x14142e});
  const road=new THREE.Mesh(roadGeo,roadMat);
  road.rotation.x=-Math.PI/2; road.position.z=-80;
  scene.add(road);

  // lane lines
  for(let i=-1;i<=1;i+=2){
    const lineGeo=new THREE.PlaneGeometry(0.08,200);
    const lineMat=new THREE.MeshBasicMaterial({color:0x00f5ff});
    const line=new THREE.Mesh(lineGeo,lineMat);
    line.rotation.x=-Math.PI/2; line.position.set(i*1.1,0.01,-80);
    scene.add(line);
  }

  player=new THREE.Group();
  const bodyGeo=new THREE.CylinderGeometry(0.4,0.5,1.05,12);
  const bodyMat=new THREE.MeshStandardMaterial({color:0xff5a8a});
  const body=new THREE.Mesh(bodyGeo,bodyMat); player.add(body);
  player.position.set(0,0.8,2);
  scene.add(player);
  const headGeo=new THREE.SphereGeometry(0.32,12,12);
  const head=new THREE.Mesh(headGeo,new THREE.MeshStandardMaterial({color:0x00f5ff,emissive:0x003333}));
  head.position.y=0.78;
  player.add(head);
  [[-.27,-.48],[.27,-.48]].forEach(([x,z])=>{const leg=new THREE.Mesh(new THREE.CylinderGeometry(.11,.13,.62,8),new THREE.MeshStandardMaterial({color:0x4f46a5}));leg.position.set(x,-.78,z);player.add(leg);});
  [[-.52,0],[.52,0]].forEach(([x,z])=>{const arm=new THREE.Mesh(new THREE.CylinderGeometry(.09,.1,.62,8),new THREE.MeshStandardMaterial({color:0xffd2b8}));arm.rotation.z=x<0?.45:-.45;arm.position.set(x,0,z);player.add(arm);});
  if(THREE.GLTFLoader){
    new THREE.GLTFLoader().load('assets/cesium-man.glb',gltf=>{
      const runner=gltf.scene; runner.scale.setScalar(.68); runner.position.y=-.85; runner.rotation.y=Math.PI;
      player.visible=false; const modelHolder=new THREE.Group(); modelHolder.add(runner); modelHolder.position.copy(player.position); player=modelHolder; scene.add(player);
      const clip=gltf.animations&&gltf.animations[0];
      if(clip){ const mixer=new THREE.AnimationMixer(runner); mixer.clipAction(clip).play(); const clock=new THREE.Clock(); (function animateModel(){ requestAnimationFrame(animateModel); mixer.update(clock.getDelta()); })(); }
    });
  }
}
function spawnObstacleRow(z){
  const lane=Math.floor(Math.random()*3);
  const type=Math.random()<0.35?'jump':'block';
  const geo = type==='jump' ? new THREE.BoxGeometry(1.6,0.5,0.5) : new THREE.BoxGeometry(1.6,1.4,0.6);
  const color = type==='jump' ? 0xffe066 : 0xff5a8a;
  const mat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:0.3});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.position.set(lanes[lane], type==='jump'?0.3:0.7, z);
  scene.add(mesh);
  obstacles.push({mesh,lane,type,passed:false});
}
function resetGame(){
  obstacles.forEach(o=>scene.remove(o.mesh));
  obstacles=[];
  score=0; over=false; speed=0.22; curLane=1; jumping=false; jumpVel=0;
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').classList.remove('show');
  player.position.set(lanes[1],0.8,2);
  for(let i=0;i<12;i++) spawnObstacleRow(-10-i*8);
}
function startGame(){
  document.getElementById('startCard').style.display='none';
  if(!scene) initScene();
  resetGame();
  if(!started){ started=true; requestAnimationFrame(loop); }
}
let touchStartX=0,touchStartY=0;
container.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; },{passive:true});
container.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX, dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>30){ changeLane(dx>0?1:-1); }
  else if(dy<-30){ doJump(); }
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')changeLane(-1);
  if(e.key==='ArrowRight')changeLane(1);
  if(e.key==='ArrowUp'||e.key===' ')doJump();
});
function changeLane(d){
  if(over)return;
  curLane=Math.max(0,Math.min(2,curLane+d));
}
function doJump(){
  if(over||jumping)return;
  jumping=true; jumpVel=0.19;
}
function loop(){
  if(!over) update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function update(){
  speed=Math.min(0.5,speed+0.00012);
  score++;
  document.getElementById('score').textContent=Math.floor(score/6);
  const targetX=lanes[curLane];
  player.position.x += (targetX-player.position.x)*0.25;
  if(jumping){
    player.position.y += jumpVel;
    jumpVel -= 0.012;
    if(player.position.y<=0.8){ player.position.y=0.8; jumping=false; }
  }
  player.rotation.y = Math.sin(Date.now()*0.01)*0.05;
  obstacles.forEach(o=>{
    o.mesh.position.z += speed;
    if(!o.passed && o.mesh.position.z>2 && o.mesh.position.z<3){
      o.passed=true;
      const sameLane=Math.abs(o.mesh.position.x-player.position.x)<0.9;
      if(sameLane){
        const clearedByJump = o.type==='jump' && player.position.y>0.95;
        if(!clearedByJump){ endGame(); }
      }
    }
    if(o.mesh.position.z>10){
      scene.remove(o.mesh);
    }
  });
  obstacles=obstacles.filter(o=>o.mesh.position.z<=10);
  while(obstacles.length<12){
    const minZ=Math.min(...obstacles.map(o=>o.mesh.position.z),-10);
    spawnObstacleRow(minZ-8-Math.random()*3);
  }
}
function endGame(){
  over=true;
  if(window.KQFX)KQFX.play('blast');
  const finalScore=Math.floor(score/6);
  if(finalScore>best){ best=finalScore; localStorage.setItem('runner3dBest',best); }
  document.getElementById('finalScore').textContent='Score: '+finalScore+'  •  Best: '+best;
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth,container.clientHeight);
});
</script></body></html>
