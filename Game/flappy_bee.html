<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Flappy Bee</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ffd166,#6ee7ff);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:420px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
canvas{width:100%;border-radius:18px;display:block;background:linear-gradient(180deg,#aee8ff,#e8fbff 80%,#c8f7c5 80%)}
.hint{text-align:center;color:#888;font-size:12px;margin-top:6px;font-weight:600}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🐝 <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <canvas id="cv" width="380" height="480"></canvas>
  <div class="hint">Tap or press SPACE to flap</div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const GAP=150,PW=56,G=0.42,FLAP=-7.2;
let by,vy,pipes,score,playing,dead,frame,best=+(localStorage.getItem('beeBest')||0);
document.getElementById('best').textContent=best;
function reset(){by=220;vy=0;pipes=[];score=0;playing=false;dead=false;frame=0;
  document.getElementById('score').textContent=0;}
function flap(){
  if(dead){reset();return;}
  playing=true;vy=FLAP;
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();flap();}});
function update(){
  frame++;
  if(playing&&!dead){
    vy+=G;by+=vy;
    if(frame%110===0){
      const top=60+Math.random()*(cv.height-GAP-180);
      pipes.push({x:cv.width,top,passed:false});
    }
    pipes.forEach(p=>p.x-=2.4);
    if(pipes.length&&pipes[0].x<-PW)pipes.shift();
    for(const p of pipes){
      if(!p.passed&&p.x+PW<70){p.passed=true;score++;document.getElementById('score').textContent=score;}
      if(70+16>p.x&&70-16<p.x+PW&&(by-14<p.top||by+14>p.top+GAP))die();
    }
    if(by>cv.height-46||by<10)die();
  }
  draw();requestAnimationFrame(update);
}
function die(){
  if(dead)return;dead=true;
  if(score>best){best=score;localStorage.setItem('beeBest',best);document.getElementById('best').textContent=best;}
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.font='24px serif';
  cx.fillText('☁️',(300-frame*0.4%700+400)%700-50,60);
  cx.fillText('☁️',(100-frame*0.3%700+400)%700-50,110);
  pipes.forEach(p=>{
    cx.fillStyle='#5cb85c';
    cx.beginPath();cx.roundRect(p.x,0,PW,p.top,[0,0,10,10]);cx.fill();
    cx.beginPath();cx.roundRect(p.x,p.top+GAP,PW,cv.height-p.top-GAP-36,[10,10,0,0]);cx.fill();
    cx.fillStyle='#4a9d4a';
    cx.fillRect(p.x-4,p.top-14,PW+8,14);
    cx.fillRect(p.x-4,p.top+GAP,PW+8,14);
  });
  cx.fillStyle='#8bc34a';cx.fillRect(0,cv.height-36,cv.width,36);
  cx.save();cx.translate(70,by);cx.rotate(Math.max(-.4,Math.min(.6,vy*0.06)));
  cx.font='30px serif';cx.fillText('🐝',-16,10);cx.restore();
  cx.textAlign='center';cx.fillStyle='#ff5a8a';cx.font='bold 22px sans-serif';
  if(!playing&&!dead)cx.fillText('Tap to fly!',cv.width/2,200);
  if(dead){cx.fillText('💥 Score: '+score,cv.width/2,200);cx.font='bold 14px sans-serif';cx.fillText('Tap to play again',cv.width/2,230);}
  cx.textAlign='left';
}
reset();update();
</script></body></html>
