<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Maze Run</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ffd166,#8b5cf6);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:420px;width:100%;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:14px}
canvas{width:100%;border-radius:16px;display:block;background:#fffbea}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:190px;margin:10px auto 0}
.pad button{font-size:20px;padding:10px;border:none;border-radius:12px;background:linear-gradient(135deg,#ffb703,#ff7a59);color:#fff;cursor:pointer}
.pad .e{visibility:hidden}
.msg{color:#ff5a8a;font-weight:800;min-height:24px;margin-top:6px}

/* mobile fit */
.wrap{display:flex;flex-direction:column;height:100%;max-height:820px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0}
canvas{max-height:100%}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">Level: <span id="lvl">1</span> &nbsp; Moves: <span id="mv">0</span></div>
    <button onclick="newMaze()">↻ New Maze</button>
  </div>
  <div class="stage"><canvas id="cv" width="390" height="390"></canvas></div>
  <div class="pad">
    <button class="e"></button><button onclick="mv(0,-1)">⬆️</button><button class="e"></button>
    <button onclick="mv(-1,0)">⬅️</button><button onclick="mv(0,1)">⬇️</button><button onclick="mv(1,0)">➡️</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script src="ads.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let N=9,cells,player,moves,level=1,won=false;
function idx(x,y){return y*N+x;}
function genMaze(){
  // each cell: walls [top,right,bottom,left]
  cells=Array.from({length:N*N},()=>({w:[1,1,1,1],v:false}));
  const stack=[{x:0,y:0}];cells[0].v=true;
  while(stack.length){
    const c=stack[stack.length-1];
    const nbs=[];
    if(c.y>0&&!cells[idx(c.x,c.y-1)].v)nbs.push({x:c.x,y:c.y-1,d:0});
    if(c.x<N-1&&!cells[idx(c.x+1,c.y)].v)nbs.push({x:c.x+1,y:c.y,d:1});
    if(c.y<N-1&&!cells[idx(c.x,c.y+1)].v)nbs.push({x:c.x,y:c.y+1,d:2});
    if(c.x>0&&!cells[idx(c.x-1,c.y)].v)nbs.push({x:c.x-1,y:c.y,d:3});
    if(!nbs.length){stack.pop();continue;}
    const n=nbs[Math.floor(Math.random()*nbs.length)];
    cells[idx(c.x,c.y)].w[n.d]=0;
    cells[idx(n.x,n.y)].w[(n.d+2)%4]=0;
    cells[idx(n.x,n.y)].v=true;
    stack.push({x:n.x,y:n.y});
  }
}
function newMaze(){
  N=Math.min(15,7+level*2);
  genMaze();player={x:0,y:0};moves=0;won=false;
  document.getElementById('mv').textContent=0;
  document.getElementById('lvl').textContent=level;
  document.getElementById('msg').textContent='';
  draw();
}
function mv(dx,dy){
  if(won){level++;newMaze();return;}
  const c=cells[idx(player.x,player.y)];
  const d=dy===-1?0:dx===1?1:dy===1?2:3;
  if(c.w[d])return;
  player.x+=dx;player.y+=dy;moves++;
  document.getElementById('mv').textContent=moves;
  if(player.x===N-1&&player.y===N-1){
    won=true;onGameComplete();
    document.getElementById('msg').textContent='🎉 You got the cheese in '+moves+' moves! Press any arrow for level '+(level+1);
  }
  draw();
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')mv(0,-1);if(e.key==='ArrowDown')mv(0,1);
  if(e.key==='ArrowLeft')mv(-1,0);if(e.key==='ArrowRight')mv(1,0);
});
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)<15&&Math.abs(dy)<15)return;
  if(Math.abs(dx)>Math.abs(dy))mv(dx>0?1:-1,0);else mv(0,dy>0?1:-1);
},{passive:true});
function draw(){
  const S=cv.width/N;
  cx.clearRect(0,0,cv.width,cv.height);
  cx.strokeStyle='#8b5cf6';cx.lineWidth=3;cx.lineCap='round';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const c=cells[idx(x,y)],px=x*S,py=y*S;
    cx.beginPath();
    if(c.w[0]){cx.moveTo(px,py);cx.lineTo(px+S,py);}
    if(c.w[1]){cx.moveTo(px+S,py);cx.lineTo(px+S,py+S);}
    if(c.w[2]){cx.moveTo(px,py+S);cx.lineTo(px+S,py+S);}
    if(c.w[3]){cx.moveTo(px,py);cx.lineTo(px,py+S);}
    cx.stroke();
  }
  cx.font=(S*0.62)+'px serif';cx.textAlign='center';
  cx.fillText('🧀',(N-1)*S+S/2,(N-1)*S+S*0.72);
  cx.fillText('🐭',player.x*S+S/2,player.y*S+S*0.72);
  cx.textAlign='left';
}
newMaze();
</script></body></html>
