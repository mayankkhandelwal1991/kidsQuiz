<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Missing Letter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#43e97b,#38f9d7);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#0d9488;font-size:15px}
.progwrap{background:#d9fbe9;border-radius:20px;height:10px;overflow:hidden;margin-bottom:10px}
.progbar{height:100%;background:linear-gradient(135deg,#34d399,#06b6d4);width:0%;transition:width .4s ease}
.hintbox{font-size:64px;margin:8px 0;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:14px 0;font-size:0}
.wl{display:inline-flex;align-items:center;justify-content:center;width:38px;height:48px;font-size:26px;font-weight:800;color:#0d9488;background:#f0fdf9;border-radius:10px;margin:2px}
.wl.blank{background:linear-gradient(135deg,#fff8cc,#fff0f6);border:3px dashed #ffb703;color:#ffb703}
.options{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.opt{padding:14px 0;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#06b6d4);color:#fff;font-size:22px;font-weight:800;cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.9)}
.opt.correct{background:linear-gradient(135deg,#34d399,#06b6d4);animation:pop .4s ease}
.opt.wrong{background:linear-gradient(135deg,#f87171,#fb923c);animation:shake .35s}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{color:#0d9488;font-weight:800;font-size:15px;min-height:22px}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#0d9488;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🌱 <span id="score">0</span>/<span id="totalW">10</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="progwrap"><div class="progbar" id="prog"></div></div>
  <div class="hintbox" id="hint"></div>
  <div class="word" id="word"></div>
  <div class="options" id="options"></div>
  <div class="msg" id="msg">Pick the missing letter!</div>
</div>
<div class="end" id="end">
  <div class="card">
    <div class="big">🏆</div>
    <h2>Round Complete!</h2>
    <p id="endMsg">Nice work!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="ads.js"></script>
<script>
const POOL=[
['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['FISH','🐟'],['BIRD','🐦'],['FROG','🐸'],
['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['TIGER','🐯'],['ZEBRA','🦓'],
['HOUSE','🏠'],['TRAIN','🚂'],['PLANE','✈️'],['CLOCK','⏰'],['STAR','⭐'],['MOON','🌙'],
['FLOWER','🌸'],['MONKEY','🐵'],['RABBIT','🐰'],['ROCKET','🚀'],['GUITAR','🎸'],['CAMERA','📷'],
['BANANA','🍌'],['ORANGE','🍊'],['SCHOOL','🏫'],['PENCIL','✏️'],['BUTTER','🧈'],['CHEESE','🧀'],
['SHARK','🦈'],['WHALE','🐳'],['MOUSE','🐭'],['PANDA','🐼'],['SNAKE','🐍'],['HORSE','🐴']
];
const ROUND_LEN=10;
let round=[],idx=0,score=0,cur=null,blankPos=0;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(){
  round=shuffleArr([...POOL]).slice(0,ROUND_LEN);
  idx=0;score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('totalW').textContent=round.length;
  document.getElementById('end').classList.remove('show');
  loadWord();
}

function loadWord(){
  if(idx>=round.length){finish();return;}
  cur=round[idx];
  blankPos=Math.floor(Math.random()*cur[0].length);
  document.getElementById('hint').textContent=cur[1];
  document.getElementById('msg').textContent='Word '+(idx+1)+' of '+round.length;
  document.getElementById('prog').style.width=Math.round(idx/round.length*100)+'%';
  renderWord();renderOptions();
}

function renderWord(){
  const w=document.getElementById('word');w.innerHTML='';
  cur[0].split('').forEach((ch,i)=>{
    const d=document.createElement('div');
    d.className='wl'+(i===blankPos?' blank':'');
    d.id='wl_'+i;
    d.textContent=i===blankPos?'?':ch;
    w.appendChild(d);
  });
}

function renderOptions(){
  const correct=cur[0][blankPos];
  const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(c=>c!==correct);
  const decoys=shuffleArr(alphabet).slice(0,3);
  const opts=shuffleArr([correct,...decoys]);
  const box=document.getElementById('options');box.innerHTML='';
  opts.forEach(ch=>{
    const b=document.createElement('div');b.className='opt';b.textContent=ch;
    b.onclick=()=>pick(ch,b,correct);
    box.appendChild(b);
  });
}

function pick(ch,el,correct){
  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
  if(ch===correct){
    el.classList.add('correct');if(window.KQFX)KQFX.play('ding');
    const wl=document.getElementById('wl_'+blankPos);wl.textContent=ch;wl.classList.add('reveal');
    score++;document.getElementById('score').textContent=score;
    document.getElementById('msg').textContent='🎉 Correct! '+cur[0];
    burstConfetti();
    idx++;
    setTimeout(loadWord,900);
  }else{
    el.classList.add('wrong');if(window.KQFX)KQFX.play('wrong');
    document.getElementById('msg').textContent='❌ It was "'+correct+'" — '+cur[0];
    idx++;
    setTimeout(loadWord,1100);
  }
}

function finish(){
  document.getElementById('prog').style.width='100%';
  document.getElementById('endMsg').textContent='You got '+score+' out of '+round.length+' correct!';
  document.getElementById('end').classList.add('show');
  onGameComplete();
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
