<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ping Pong</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#34d399,#06b6d4);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:440px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
canvas{width:100%;border-radius:18px;display:block;background:#0e5c3f;touch-action:none}
.hint{text-align:center;color:#888;font-size:12px;margin-top:6px;font-weight:600}

/* mobile fit */
.wrap{display:flex;flex-direction:column;height:100%;max-height:820px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0}
canvas{max-height:100%}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">You <span id="ps">0</span> — <span id="cs">0</span> 🤖 (first to 5)</div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="stage"><canvas id="cv" width="400" height="560"></canvas></div>
  <div class="hint">Drag / move mouse / ← → to move your paddle (bottom)</div>
</div>
<script src="ads.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
let px,ax,ball,ps,cs,playing,over,msg='',keys={};
function newBall(dir){ball={x:cv.width/2,y:cv.height/2,vx:(Math.random()<.5?-1:1)*3,vy:4.2*dir};}
function reset(){px=cv.width/2;ax=cv.width/2;ps=0;cs=0;playing=false;over=false;msg='';newBall(1);
  document.getElementById('ps').textContent=0;document.getElementById('cs').textContent=0;}
function setX(clientX){
  const r=cv.getBoundingClientRect();
  px=Math.max(45,Math.min(cv.width-45,(clientX-r.left)/r.width*cv.width));
  if(over)reset();playing=true;
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();setX(e.clientX);});
cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')setX(e.clientX);});
cv.addEventListener('touchmove',e=>{e.preventDefault();setX(e.touches[0].clientX);},{passive:false});
document.addEventListener('keydown',e=>{keys[e.key]=true;if(over)reset();playing=true;});
document.addEventListener('keyup',e=>{keys[e.key]=false;});
function update(){
  if(keys['ArrowLeft'])px=Math.max(45,px-8);
  if(keys['ArrowRight'])px=Math.min(cv.width-45,px+8);
  if(playing&&!over){
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<10||ball.x>cv.width-10)ball.vx*=-1;
    // AI follows with limited speed
    ax+=Math.max(-3.3,Math.min(3.3,ball.x-ax));
    ax=Math.max(45,Math.min(cv.width-45,ax));
    // player paddle
    if(ball.y>cv.height-34&&ball.y<cv.height-20&&Math.abs(ball.x-px)<48&&ball.vy>0){
      ball.vy=-Math.abs(ball.vy)*1.03;ball.vx=(ball.x-px)*0.13;
    }
    // AI paddle
    if(ball.y<34&&ball.y>20&&Math.abs(ball.x-ax)<48&&ball.vy<0){
      ball.vy=Math.abs(ball.vy)*1.03;ball.vx=(ball.x-ax)*0.13;
    }
    if(ball.y>cv.height+10){cs++;point();}
    if(ball.y<-10){ps++;point();}
  }
  draw();requestAnimationFrame(update);
}
function point(){
  document.getElementById('ps').textContent=ps;
  document.getElementById('cs').textContent=cs;
  if(ps>=5){over=true;msg='🎉 You win '+ps+'-'+cs+'!';onGameComplete();}
  else if(cs>=5){over=true;msg='🤖 Computer wins '+cs+'-'+ps+'!';onGameComplete();}
  else newBall(ps+cs%2?1:-1);
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.strokeStyle='rgba(255,255,255,.5)';cx.setLineDash([10,10]);cx.lineWidth=2;
  cx.beginPath();cx.moveTo(0,cv.height/2);cx.lineTo(cv.width,cv.height/2);cx.stroke();cx.setLineDash([]);
  cx.fillStyle='#ffe066';
  cx.beginPath();cx.roundRect(px-48,cv.height-26,96,12,6);cx.fill();
  cx.fillStyle='#ff8fb0';
  cx.beginPath();cx.roundRect(ax-48,16,96,12,6);cx.fill();
  cx.font='24px serif';cx.textAlign='center';
  cx.fillText('🏓',ball.x,ball.y+8);
  cx.fillStyle='#fff';cx.font='bold 20px sans-serif';
  if(!playing)cx.fillText('Touch or press arrows to start!',cv.width/2,cv.height/2-40);
  if(over){cx.fillText(msg,cv.width/2,cv.height/2-40);cx.font='bold 14px sans-serif';cx.fillText('Touch to play again',cv.width/2,cv.height/2-14);}
  cx.textAlign='left';
}
reset();update();
</script></body></html>
