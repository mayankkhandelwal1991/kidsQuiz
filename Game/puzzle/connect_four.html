<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Connect Four</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#1a1a3d);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;height:100%;max-height:800px;position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.turn{font-size:12px;text-align:right}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#board{background:#1155cc;border-radius:14px;padding:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%;max-width:380px;aspect-ratio:7/6}
.cell{background:#0b0b1e;border-radius:50%;position:relative;cursor:pointer}
.cell .disc{position:absolute;inset:6%;border-radius:50%;transition:transform .2s}
.msg{text-align:center;font-size:12px;color:#aaa;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(15,12,41,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:26px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Connect Four</h1>
    <div class="turn" id="turn">Your Turn 🔴</div>
  </div>
  <div class="stage"><div id="board"></div></div>
  <div class="msg">Tap a column to drop your disc. Get 4 in a row to win!</div>
  <div class="overlay" id="overlay"><h2 id="overTitle" style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">You Win!</h2><button class="newbtn" onclick="init()">Play Again</button></div>
</div>
<script src="../ads.js"></script>
<script>
const ROWS=6,COLS=7;
let grid,turn,over,board=document.getElementById('board');
function init(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  turn=1; over=false;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('turn').textContent='Your Turn 🔴';
  render();
}
function render(){
  board.innerHTML='';
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.onclick=()=>play(c);
    const v=grid[r][c];
    if(v){ const d=document.createElement('div'); d.className='disc'; d.style.background=v===1?'radial-gradient(circle at 35% 30%,#ff8fa8,#ff5a8a)':'radial-gradient(circle at 35% 30%,#ffe680,#ffcc33)'; cell.appendChild(d); }
    board.appendChild(cell);
  }
}
function lowestEmptyRow(c){
  for(let r=ROWS-1;r>=0;r--) if(!grid[r][c]) return r;
  return -1;
}
function play(c){
  if(over||turn!==1)return;
  const r=lowestEmptyRow(c);
  if(r<0)return;
  grid[r][c]=1; render();
  if(window.KQFX)KQFX.play('drop');
  if(checkWin(1)){ endGame('You Win! 🎉', 'win'); return; }
  if(isFull()){ endGame("It's a Draw!", 'draw'); return; }
  turn=2;
  document.getElementById('turn').textContent="Computer's Turn 🟡";
  setTimeout(aiMove,500);
}
function isFull(){ return grid[0].every(v=>v); }
function aiMove(){
  if(over)return;
  const c=bestMove();
  const r=lowestEmptyRow(c);
  if(r>=0){ grid[r][c]=2; render(); if(window.KQFX)KQFX.play('drop'); }
  if(checkWin(2)){ endGame('Computer Wins! 🤖', 'lose'); return; }
  if(isFull()){ endGame("It's a Draw!", 'draw'); return; }
  turn=1;
  document.getElementById('turn').textContent='Your Turn 🔴';
}
function bestMove(){
  // try win
  for(let c=0;c<COLS;c++){ const r=lowestEmptyRow(c); if(r<0)continue; grid[r][c]=2; if(checkWin(2)){grid[r][c]=0;return c;} grid[r][c]=0; }
  // block player win
  for(let c=0;c<COLS;c++){ const r=lowestEmptyRow(c); if(r<0)continue; grid[r][c]=1; if(checkWin(1)){grid[r][c]=0;return c;} grid[r][c]=0; }
  // prefer center columns
  const order=[3,2,4,1,5,0,6].filter(c=>lowestEmptyRow(c)>=0);
  return order[0];
}
function checkWin(p){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(grid[r][c]!==p)continue;
    if(c+3<COLS && grid[r][c+1]===p&&grid[r][c+2]===p&&grid[r][c+3]===p) return true;
    if(r+3<ROWS && grid[r+1][c]===p&&grid[r+2][c]===p&&grid[r+3][c]===p) return true;
    if(r+3<ROWS&&c+3<COLS && grid[r+1][c+1]===p&&grid[r+2][c+2]===p&&grid[r+3][c+3]===p) return true;
    if(r+3<ROWS&&c-3>=0 && grid[r+1][c-1]===p&&grid[r+2][c-2]===p&&grid[r+3][c-3]===p) return true;
  }
  return false;
}
function endGame(title, outcome){
  over=true;
  document.getElementById('overTitle').textContent=title;
  document.getElementById('overlay').classList.add('show');
  if(window.KQFX){
    if(outcome==='win')KQFX.win();
    else if(outcome==='lose')KQFX.lose();
    else KQFX.play('draw');
  }
  onGameComplete();
}
init();
</script></body></html>
