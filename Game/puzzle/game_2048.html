<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2048</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);border-radius:28px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;height:100%;max-height:760px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;font-size:13px}
h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.scores{display:flex;gap:8px}
.scorebox{background:rgba(255,255,255,.1);border-radius:10px;padding:4px 10px;text-align:center;font-size:11px}
.scorebox b{display:block;font-size:16px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:6px 0}
#board{position:relative;background:rgba(0,0,0,.35);border-radius:18px;padding:8px;width:100%;max-width:380px;aspect-ratio:1/1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px}
.cell{background:rgba(255,255,255,.06);border-radius:10px}
.tile{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:800;font-size:26px;transition:all .12s ease;color:#0f0c29}
.msg{text-align:center;font-size:13px;color:#c7c7f2;margin-top:6px}
.overlay{position:absolute;inset:0;background:rgba(15,12,41,.85);border-radius:18px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;text-align:center;padding:12px}
.overlay.show{display:flex}
.overlay h2{font-size:24px;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 30px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <h1>2048</h1>
    <div class="scores">
      <div class="scorebox">SCORE<b id="score">0</b></div>
      <div class="scorebox">BEST<b id="best">0</b></div>
    </div>
  </div>
  <div class="stage">
    <div id="board">
      <div class="overlay" id="overlay"><h2 id="overText">Game Over</h2><button class="newbtn" onclick="newGame()">New Game</button></div>
    </div>
  </div>
  <div class="msg">Swipe to move tiles. Merge same numbers to reach 2048!</div>
</div>
<script src="../ads.js"></script>
<script>
const boardEl=document.getElementById('board');
const N=4;
let grid,score,best=+(localStorage.getItem('g2048Best')||0),over,won;
document.getElementById('best').textContent=best;
const colors={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#00f5ff'};
function newGame(){
  grid=Array.from({length:N},()=>Array(N).fill(0));
  score=0;over=false;won=false;
  document.getElementById('score').textContent=0;
  document.getElementById('overlay').classList.remove('show');
  addTile();addTile();render();
}
function addTile(){
  const empty=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])empty.push([r,c]);
  if(!empty.length)return;
  const [r,c]=empty[Math.floor(Math.random()*empty.length)];
  grid[r][c]=Math.random()<0.9?2:4;
}
function render(){
  document.querySelectorAll('.cell,.tile').forEach(e=>e.remove());
  for(let i=0;i<N*N;i++){const cell=document.createElement('div');cell.className='cell';boardEl.appendChild(cell);}
  const gap=8,pad=8;
  requestAnimationFrame(()=>{
    const rect=boardEl.getBoundingClientRect();
    const size=(rect.width-pad*2-gap*(N-1))/N;
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      const v=grid[r][c];
      if(!v)continue;
      const t=document.createElement('div');
      t.className='tile';
      t.style.width=size+'px';t.style.height=size+'px';
      t.style.left=(pad+c*(size+gap))+'px';t.style.top=(pad+r*(size+gap))+'px';
      t.style.background=colors[v]||'#3c3a32';
      t.style.color=v<=4?'#5c5142':'#fff';
      t.style.fontSize=(v>=1024?18:26)+'px';
      t.textContent=v;
      boardEl.appendChild(t);
    }
  });
}
function slideRow(row){
  let arr=row.filter(v=>v);
  let gained=0;
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){arr[i]*=2;gained+=arr[i];arr.splice(i+1,1);if(arr[i]===2048)won=true;}
  }
  while(arr.length<N)arr.push(0);
  return {arr,gained};
}
function move(dir){
  if(over)return;
  let moved=false,totalGain=0;
  for(let i=0;i<N;i++){
    let line=[];
    for(let j=0;j<N;j++){
      line.push(dir==='left'||dir==='right'? grid[i][j] : grid[j][i]);
    }
    if(dir==='right'||dir==='down')line.reverse();
    const {arr,gained}=slideRow(line);
    totalGain+=gained;
    if(dir==='right'||dir==='down')arr.reverse();
    for(let j=0;j<N;j++){
      const val=arr[j];
      const cur=dir==='left'||dir==='right'? grid[i][j] : grid[j][i];
      if(cur!==val)moved=true;
      if(dir==='left'||dir==='right')grid[i][j]=val; else grid[j][i]=val;
    }
  }
  if(moved){
    score+=totalGain;
    document.getElementById('score').textContent=score;
    if(totalGain>0&&window.KQFX)KQFX.play(totalGain>=64?'coin':'pop');
    if(score>best){best=score;localStorage.setItem('g2048Best',best);document.getElementById('best').textContent=best;}
    addTile();render();
    checkOver();
  }
}
function checkOver(){
  let hasEmpty=false,canMerge=false;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!grid[r][c])hasEmpty=true;
    if(c<N-1&&grid[r][c]===grid[r][c+1]&&grid[r][c])canMerge=true;
    if(r<N-1&&grid[r][c]===grid[r+1][c]&&grid[r][c])canMerge=true;
  }
  if(won){over=true;document.getElementById('overText').textContent='🎉 You reached 2048!';document.getElementById('overlay').classList.add('show');if(window.KQFX)KQFX.win();onGameComplete();return;}
  if(!hasEmpty&&!canMerge){over=true;document.getElementById('overText').textContent='Game Over! Score: '+score;document.getElementById('overlay').classList.add('show');if(window.KQFX)KQFX.lose();onGameComplete();}
}
document.addEventListener('keydown',e=>{
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};
  if(map[e.key]){e.preventDefault();move(map[e.key]);}
});
let sx,sy;
boardEl.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
boardEl.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');else move(dy>0?'down':'up');
},{passive:true});
newGame();
</script></body></html>
