<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Find Hidden Objects</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#6ee7ff,#8b5cf6,#ff7ac6,#ffd166);background-size:400% 400%;animation:bg 14s ease infinite;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

.wrap{background:linear-gradient(180deg,#fff,#fef6ff);border:5px solid #fff;border-radius:26px;box-shadow:0 14px 36px rgba(0,0,0,.22);width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;overflow:hidden}

/* Top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:8px 13px;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:.1s}
.bar button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.title{font-size:15px;font-weight:800;color:#7c3aed;display:flex;align-items:center;gap:5px;white-space:nowrap}
.stats{display:flex;gap:8px;align-items:center;font-size:12px;font-weight:800}
.stats .pill{background:#fff;border:2px solid #eee;border-radius:20px;padding:3px 9px;color:#e85d88;box-shadow:0 2px 5px rgba(0,0,0,.06);white-space:nowrap}
.stats .pill.t{color:#5b43b8}
.stats .pill.b{color:#f59e0b}

/* Object tray */
.tray{display:flex;gap:7px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:thin}
.tray::-webkit-scrollbar{height:5px}
.tray::-webkit-scrollbar-thumb{background:#d6c6ff;border-radius:6px}
.chip{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid #eadcff;border-radius:14px;padding:6px 9px 5px;min-width:58px;position:relative;transition:.15s}
.chip .ce{font-size:22px;line-height:1}
.chip .cn{font-size:9.5px;font-weight:800;color:#4a5680;text-align:center;line-height:1.05;letter-spacing:.2px}
.chip.found{background:#eafaf0;border-color:#b6ecc8;opacity:.65}
.chip.found .ce{filter:grayscale(.4)}
.chip.found::after{content:'✓';position:absolute;top:-6px;right:-6px;background:#22c55e;color:#fff;width:18px;height:18px;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.chip.hintpulse{animation:chipHint .8s ease 2}
@keyframes chipHint{0%,100%{transform:scale(1)}50%{transform:scale(1.14);border-color:#f59e0b}}

/* Scene */
.scenebox{position:relative;margin:0 12px 12px;border-radius:16px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.18);flex:1;min-height:0;display:flex}
.scene{position:relative;width:100%;aspect-ratio:500/317;max-height:100%;margin:auto;cursor:crosshair;background:#111}
.scene img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.ring{position:absolute;border:3px solid #22c55e;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.85),0 0 14px rgba(34,197,94,.6);transform:translate(-50%,-50%) scale(0);animation:ringPop .5s cubic-bezier(.34,1.56,.64,1) forwards;pointer-events:none;z-index:4}
@keyframes ringPop{to{transform:translate(-50%,-50%) scale(1)}}
.ring b{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:10px;white-space:nowrap}
.hintring{position:absolute;border:3px dashed #f59e0b;border-radius:50%;transform:translate(-50%,-50%);animation:hintFade 1.6s ease forwards;pointer-events:none;z-index:3;box-shadow:0 0 12px rgba(245,158,11,.7)}
@keyframes hintFade{0%{opacity:0;transform:translate(-50%,-50%) scale(1.5)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
.miss{position:absolute;color:#ff3b6b;font-weight:800;font-size:26px;transform:translate(-50%,-50%);animation:missPop .5s ease forwards;pointer-events:none;z-index:5;text-shadow:0 2px 4px rgba(0,0,0,.4)}
@keyframes missPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.shake{animation:shk .28s}
@keyframes shk{0%,100%{transform:translate(0)}25%{transform:translate(-5px)}75%{transform:translate(5px)}}
.plus{position:absolute;color:#fff;font-weight:800;font-size:16px;transform:translate(-50%,-50%);animation:plusUp .8s ease forwards;pointer-events:none;z-index:5;text-shadow:0 2px 5px rgba(0,0,0,.5)}
@keyframes plusUp{0%{opacity:0}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-130%)}}

.foot{display:flex;gap:8px;justify-content:center;padding:0 12px 12px;flex-wrap:wrap}
.foot button{border:none;border-radius:14px;padding:9px 18px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.16);transition:.1s}
.foot button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.16)}
.hintbtn{background:linear-gradient(135deg,#fbbf24,#f97316)}
.restartbtn{background:linear-gradient(135deg,#38bdf8,#6366f1)}

/* Overlays */
.overlay{position:absolute;inset:0;background:rgba(40,20,70,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.hide{display:none}
.card{background:linear-gradient(180deg,#fff,#fff2fb);border:4px solid #fff;border-radius:22px;padding:22px 20px;text-align:center;max-width:340px;width:100%;box-shadow:0 16px 40px rgba(0,0,0,.3);animation:cardPop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes cardPop{0%{opacity:0;transform:scale(.7)}100%{opacity:1;transform:scale(1)}}
.card .em{font-size:46px}
.card h2{color:#7c3aed;font-size:22px;margin:4px 0 6px}
.card p{color:#5b6478;font-size:13.5px;line-height:1.5;margin-bottom:14px}
.card .go{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:13px 40px;font-family:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 8px 18px rgba(255,79,163,.35);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.card .res{display:flex;justify-content:space-around;margin-bottom:14px;gap:8px}
.card .res div{background:#f4f0ff;border-radius:14px;padding:8px 10px;flex:1}
.card .res span{display:block;font-size:11px;color:#8b7fb5;font-weight:700}
.card .res b{font-size:19px;color:#5b43b8}

@media(max-width:600px){
  .title{font-size:13px}
  .stats{font-size:11px}
  .stats .pill{padding:3px 7px}
  .chip{min-width:52px;padding:5px 7px 4px}
  .chip .ce{font-size:19px}
  .wrap{border-radius:18px}
}
@media(max-width:600px) and (max-height:560px){
  .scenebox{margin-bottom:8px}
}
</style></head>
<body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <div class="title">🔍 Hidden Objects</div>
    <div class="stats">
      <span class="pill t">⏱ <span id="time">0:00</span></span>
      <span class="pill">✔ <span id="found">0</span>/<span id="total">0</span></span>
      <span class="pill b">🏆 <span id="best">0</span></span>
    </div>
  </div>

  <div class="tray" id="tray"></div>

  <div class="scenebox">
    <div class="scene" id="scene">
      <img src="../assets/hidden_objects_scene.jpg" alt="Hidden object scene" id="sceneImg" draggable="false">
      <div class="overlay" id="startOv">
        <div class="card">
          <div class="em">🔍</div>
          <h2>Find the Hidden Objects!</h2>
          <p>Tap each object from the list above where you spot it in the picture. Find them all as fast as you can — quick finds score more!</p>
          <button class="go" onclick="startGame()">▶ Start</button>
        </div>
      </div>
      <div class="overlay hide" id="winOv">
        <div class="card">
          <div class="em" id="winEm">🎉</div>
          <h2 id="winTitle">You found them all!</h2>
          <div class="res">
            <div><span>Time</span><b id="winTime">0:00</b></div>
            <div><span>Score</span><b id="winScore">0</b></div>
          </div>
          <p id="winMsg"></p>
          <button class="go" onclick="startGame()">▶ Play Again</button>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <button class="hintbtn" id="hintBtn" onclick="useHint()">💡 Hint (<span id="hintN">3</span>)</button>
    <button class="restartbtn" onclick="startGame()">↻ Restart</button>
  </div>
</div>

<script src="../ads.js"></script>
<script>
/* Hotspots are stored as PERCENTAGES of the image (left,top,width,height) so
   they scale perfectly on any screen size. Coordinates were mapped against the
   original 500x317 artwork. */
const OBJECTS=[
 {id:'teapot',   nm:'Teapot',      ic:'🫖', x:1.5,  y:0.8,  w:9.5,  h:12.8},
 {id:'trophy',   nm:'Trophy',      ic:'🏆', x:22.6, y:25.5, w:8.4,  h:17.5},
 {id:'globe',    nm:'Globe',       ic:'🌍', x:0.6,  y:39.5, w:11.0, h:19.0},
 {id:'laptop',   nm:'Laptop',      ic:'💻', x:34.0, y:31.5, w:20.0, h:23.0},
 {id:'ribbon',   nm:'Ribbon',      ic:'🎗️', x:56.0, y:27.2, w:9.2,  h:17.6},
 {id:'bike',     nm:'Bike Sign',   ic:'🚲', x:69.8, y:1.8,  w:13.4, h:18.4},
 {id:'plate',    nm:'Plate',       ic:'🍽️', x:82.2, y:0.4,  w:13.0, h:18.4},
 {id:'lamp',     nm:'Lamp',        ic:'💡', x:65.4, y:13.5, w:17.2, h:21.6},
 {id:'birdcage', nm:'Bird Cage',   ic:'🐦', x:84.2, y:20.0, w:15.8, h:35.5},
 {id:'umbrella', nm:'Umbrella',    ic:'☂️', x:0.0,  y:52.8, w:10.0, h:18.4},
 {id:'duck',     nm:'Rubber Duck', ic:'🦆', x:12.8, y:56.2, w:9.8,  h:11.8},
 {id:'violin',   nm:'Violin',      ic:'🎻', x:0.2,  y:68.5, w:11.2, h:27.6},
 {id:'frog',     nm:'Frog',        ic:'🐸', x:9.6,  y:78.5, w:11.4, h:21.4},
 {id:'guitar',   nm:'Guitar',      ic:'🎸', x:44.4, y:76.5, w:20.6, h:23.5},
 {id:'can',      nm:'Drink Can',   ic:'🥫', x:58.8, y:42.5, w:6.6,  h:17.0},
 {id:'backpack', nm:'Backpack',    ic:'🎒', x:82.2, y:64.8, w:17.6, h:35.2}
];

const scene=document.getElementById('scene');
const tray=document.getElementById('tray');
const startOv=document.getElementById('startOv');
const winOv=document.getElementById('winOv');
const HINTS_START=3;

let found={}, foundCount=0, misses=0, hintsLeft=HINTS_START, playing=false;
let startT=0, elapsed=0, timer=null;
let best=+(localStorage.getItem('hiddenBest')||0);

document.getElementById('total').textContent=OBJECTS.length;
document.getElementById('best').textContent=best;

function fx(n){ if(window.KQFX) try{KQFX.play(n);}catch(e){} }
function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+':'+(r<10?'0':'')+r; }

function buildTray(){
  tray.innerHTML='';
  OBJECTS.forEach(o=>{
    const c=document.createElement('div');
    c.className='chip'; c.id='chip_'+o.id;
    c.innerHTML='<span class="ce">'+o.ic+'</span><span class="cn">'+o.nm+'</span>';
    tray.appendChild(c);
  });
}

function clearMarks(){
  scene.querySelectorAll('.ring,.hintring,.miss,.plus').forEach(e=>e.remove());
}

function startGame(){
  clearInterval(timer); clearMarks();
  found={}; foundCount=0; misses=0; hintsLeft=HINTS_START; playing=true;
  elapsed=0; startT=Date.now();
  document.getElementById('found').textContent=0;
  document.getElementById('time').textContent='0:00';
  document.getElementById('hintN').textContent=hintsLeft;
  document.getElementById('hintBtn').disabled=false;
  document.getElementById('hintBtn').style.opacity=1;
  buildTray();
  startOv.classList.add('hide');
  winOv.classList.add('hide');
  timer=setInterval(()=>{
    elapsed=Math.floor((Date.now()-startT)/1000);
    document.getElementById('time').textContent=fmt(elapsed);
  },500);
}

function center(o){ return {cx:o.x+o.w/2, cy:o.y+o.h/2}; }

function markFound(o, px, py){
  found[o.id]=true; foundCount++;
  document.getElementById('found').textContent=foundCount;
  document.getElementById('chip_'+o.id).classList.add('found');
  const c=center(o);
  // success ring on the object
  const ring=document.createElement('div');
  ring.className='ring';
  const size=Math.max(o.w,o.h)*0.95;
  ring.style.left=c.cx+'%'; ring.style.top=c.cy+'%';
  ring.style.width=size+'%'; ring.style.aspectRatio='1';
  ring.innerHTML='<b>'+o.nm+' ✓</b>';
  scene.appendChild(ring);
  // floating points at tap position
  const p=document.createElement('div');
  p.className='plus'; p.style.left=px+'%'; p.style.top=py+'%'; p.textContent='+100';
  scene.appendChild(p); setTimeout(()=>p.remove(),800);
  fx(foundCount%5===0?'levelup':'coin');
  if(foundCount===OBJECTS.length) win();
}

function miss(px,py){
  misses++;
  fx('wrong');
  const m=document.createElement('div');
  m.className='miss'; m.style.left=px+'%'; m.style.top=py+'%'; m.textContent='✗';
  scene.appendChild(m); setTimeout(()=>m.remove(),500);
  scene.classList.add('shake'); setTimeout(()=>scene.classList.remove('shake'),280);
}

scene.addEventListener('click', e=>{
  if(!playing) return;
  const r=scene.getBoundingClientRect();
  const px=((e.clientX-r.left)/r.width)*100;
  const py=((e.clientY-r.top)/r.height)*100;
  // pick the smallest unfound hotspot that contains the tap (handles overlaps)
  let hit=null, hitArea=1e9;
  OBJECTS.forEach(o=>{
    if(found[o.id]) return;
    if(px>=o.x && px<=o.x+o.w && py>=o.y && py<=o.y+o.h){
      const a=o.w*o.h; if(a<hitArea){hitArea=a; hit=o;}
    }
  });
  if(hit) markFound(hit,px,py); else miss(px,py);
});

function useHint(){
  if(!playing || hintsLeft<=0) return;
  const remaining=OBJECTS.filter(o=>!found[o.id]);
  if(!remaining.length) return;
  hintsLeft--;
  document.getElementById('hintN').textContent=hintsLeft;
  if(hintsLeft<=0){ document.getElementById('hintBtn').disabled=true; document.getElementById('hintBtn').style.opacity=.5; }
  const o=remaining[Math.floor(Math.random()*remaining.length)];
  const c=center(o);
  const ring=document.createElement('div');
  ring.className='hintring';
  const size=Math.max(o.w,o.h)*1.4;
  ring.style.left=c.cx+'%'; ring.style.top=c.cy+'%';
  ring.style.width=size+'%'; ring.style.aspectRatio='1';
  scene.appendChild(ring); setTimeout(()=>ring.remove(),1600);
  const chip=document.getElementById('chip_'+o.id);
  chip.classList.add('hintpulse');
  chip.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  setTimeout(()=>chip.classList.remove('hintpulse'),1600);
  fx('pop');
}

function computeScore(){
  const timeBonus=Math.max(0,(240-elapsed))*5;   // finish faster -> bigger bonus
  const hintBonus=hintsLeft*60;                    // reward unused hints
  let s=OBJECTS.length*100 + timeBonus + hintBonus - misses*15;
  return Math.max(OBJECTS.length*10, Math.round(s));
}

function win(){
  playing=false; clearInterval(timer);
  const score=computeScore();
  document.getElementById('winTime').textContent=fmt(elapsed);
  document.getElementById('winScore').textContent=score;
  let em='🎉', msg='Great spotting!';
  if(misses===0){ em='🌟'; msg='Flawless — no wrong taps!'; }
  else if(elapsed<45){ em='⚡'; msg='Lightning fast!'; }
  document.getElementById('winEm').textContent=em;
  document.getElementById('winMsg').textContent=msg+' Misses: '+misses;
  fx('win');
  if(score>best){
    best=score;
    document.getElementById('best').textContent=best;
    localStorage.setItem('hiddenBest',best); // auto-submitted to leaderboard by ads.js
  }
  if(typeof onGameComplete==='function') onGameComplete(score);
  winOv.classList.remove('hide');
}

buildTray();
</script>
</body></html>
