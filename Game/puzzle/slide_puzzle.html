<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Slide Puzzle</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#06b6d4,#ffd166);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:380px;width:100%;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:290px;margin:0 auto}
.tile{aspect-ratio:1;border-radius:16px;background:linear-gradient(135deg,#ffb703,#ff7a59);color:#fff;font-size:34px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .1s;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.tile:active{transform:scale(.94)}
.tile.blank{background:transparent;box-shadow:none;cursor:default}
.msg{color:#ff5a8a;font-weight:800;font-size:18px;min-height:26px;margin-top:14px}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">Moves: <span id="mv">0</span> &nbsp; 🏆 Best: <span id="best">—</span></div>
    <button onclick="shuffleBoard()">↻ Shuffle</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">Put 1–8 in order!</div>
</div>
<script src="../ads.js"></script>
<script>
let board,moves,solvedOnce=false,best=localStorage.getItem('slideBest');
document.getElementById('best').textContent=best||'—';
function render(){
  const g=document.getElementById('grid');g.innerHTML='';
  board.forEach((v,i)=>{
    const t=document.createElement('div');
    t.className='tile'+(v===0?' blank':'');
    t.textContent=v===0?'':v;
    t.onclick=()=>tap(i);
    g.appendChild(t);
  });
}
function tap(i){
  const b=board.indexOf(0);
  const r1=Math.floor(i/3),c1=i%3,r2=Math.floor(b/3),c2=b%3;
  if(Math.abs(r1-r2)+Math.abs(c1-c2)!==1)return;
  [board[i],board[b]]=[board[b],board[i]];
  moves++;document.getElementById('mv').textContent=moves;
  if(window.KQFX)KQFX.play('tick');
  render();
  if(board.join()==='1,2,3,4,5,6,7,8,0'){
    document.getElementById('msg').textContent='🎉 Solved in '+moves+' moves!';if(window.KQFX)KQFX.win();onGameComplete();
    if(!best||moves<+best){best=moves;localStorage.setItem('slideBest',best);document.getElementById('best').textContent=best;}
  }
}
function shuffleBoard(){
  board=[1,2,3,4,5,6,7,8,0];
  // random valid moves so it is always solvable
  for(let k=0;k<200;k++){
    const b=board.indexOf(0),r=Math.floor(b/3),c=b%3,opts=[];
    if(r>0)opts.push(b-3);if(r<2)opts.push(b+3);
    if(c>0)opts.push(b-1);if(c<2)opts.push(b+1);
    const s=opts[Math.floor(Math.random()*opts.length)];
    [board[b],board[s]]=[board[s],board[b]];
  }
  moves=0;document.getElementById('mv').textContent=0;
  document.getElementById('msg').textContent='Put 1–8 in order!';
  render();
}
shuffleBoard();
</script></body></html>
