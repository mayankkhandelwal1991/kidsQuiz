<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#34d399,#ffd166);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:none}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:420px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
canvas{width:100%;border-radius:16px;display:block;background:#eafbe7}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:190px;margin:10px auto 0}
.pad button{font-size:20px;padding:10px;border:none;border-radius:12px;background:linear-gradient(135deg,#34d399,#06b6d4);color:#fff;cursor:pointer}
.pad .e{visibility:hidden}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🍎 <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <canvas id="cv" width="380" height="380"></canvas>
  <div class="pad">
    <button class="e"></button><button onclick="dir(0,-1)">⬆️</button><button class="e"></button>
    <button onclick="dir(-1,0)">⬅️</button><button onclick="dir(0,1)">⬇️</button><button onclick="dir(1,0)">➡️</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const N=19,S=20;
let snake,d,nd,food,score,dead,started,timer,best=+(localStorage.getItem('snakeBest')||0);
document.getElementById('best').textContent=best;
function reset(){
  snake=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];d={x:1,y:0};nd=d;score=0;dead=false;started=false;
  document.getElementById('score').textContent=0;
  placeFood();clearInterval(timer);timer=setInterval(tick,160);draw();
}
function placeFood(){
  do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}
  while(snake.some(s=>s.x===food.x&&s.y===food.y));
}
function dir(x,y){
  if(dead){reset();return;}
  started=true;
  if(x===-d.x&&y===-d.y)return;
  nd={x,y};
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp')dir(0,-1);if(e.key==='ArrowDown')dir(0,1);
  if(e.key==='ArrowLeft')dir(-1,0);if(e.key==='ArrowRight')dir(1,0);
});
let tx,ty;
cv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
cv.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy))dir(dx>0?1:-1,0);else dir(0,dy>0?1:-1);
},{passive:true});
function tick(){
  if(!started||dead){draw();return;}
  d=nd;
  const h={x:snake[0].x+d.x,y:snake[0].y+d.y};
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){
    dead=true;
    if(score>best){best=score;localStorage.setItem('snakeBest',best);document.getElementById('best').textContent=best;}
    draw();return;
  }
  snake.unshift(h);
  if(h.x===food.x&&h.y===food.y){score++;document.getElementById('score').textContent=score;placeFood();}
  else snake.pop();
  draw();
}
function draw(){
  cx.clearRect(0,0,cv.width,cv.height);
  cx.fillStyle='rgba(124,197,118,.15)';
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if((i+j)%2===0)cx.fillRect(i*S,j*S,S,S);
  cx.font='18px serif';
  cx.fillText('🍎',food.x*S,food.y*S+16);
  snake.forEach((s,i)=>{
    cx.fillStyle=i===0?'#2e7d32':'#66bb6a';
    cx.beginPath();cx.roundRect(s.x*S+1,s.y*S+1,S-2,S-2,6);cx.fill();
  });
  cx.textAlign='center';cx.fillStyle='#ff5a8a';cx.font='bold 20px sans-serif';
  if(!started&&!dead)cx.fillText('Swipe or press arrows to start',cv.width/2,180);
  if(dead){cx.fillText('💥 Game over! Score: '+score,cv.width/2,170);cx.font='bold 14px sans-serif';cx.fillText('Press any arrow to restart',cv.width/2,200);}
  cx.textAlign='left';
}
reset();
</script></body></html>
