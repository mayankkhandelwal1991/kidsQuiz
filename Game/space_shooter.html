<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Space Shooter</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#000;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.5);padding:12px;max-width:420px;width:100%;display:flex;flex-direction:column;height:100%;max-height:800px;position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-size:12px;text-align:right;line-height:1.3}
.sc b{color:#00f5ff}
.stage{flex:1;min-height:0;border-radius:14px;overflow:hidden;position:relative}
canvas{width:100%;height:100%;display:block;background:#000}
.overlay{position:absolute;inset:0;background:rgba(5,5,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:26px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Space Shooter</h1>
    <div class="sc">SCORE <b id="score">0</b><br>LIVES <b id="lives">3</b></div>
  </div>
  <div class="stage"><canvas id="cv"></canvas></div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">Ship Destroyed!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="init()">Play Again</button></div>
</div>
<script src="ads.js"></script>
<script>
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
function fit(){ cv.width=cv.clientWidth*devicePixelRatio; cv.height=cv.clientHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
window.addEventListener('resize',fit);
let W,H,ship,bullets,enemies,estars,score,lives,over,frame,best=+(localStorage.getItem('spaceBest')||0),spawnRate;
function init(){
  fit(); W=cv.clientWidth; H=cv.clientHeight;
  ship={x:W/2,y:H-60,w:34,h:34};
  bullets=[];enemies=[];score=0;lives=3;over=false;frame=0;spawnRate=70;
  estars=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+0.5}));
  document.getElementById('score').textContent=0;
  document.getElementById('lives').textContent=3;
  document.getElementById('overlay').classList.remove('show');
  requestAnimationFrame(loop);
}
let targetX=null;
cv.addEventListener('touchmove',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); targetX=e.touches[0].clientX-r.left; },{passive:false});
cv.addEventListener('touchstart',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); targetX=e.touches[0].clientX-r.left; fireBullet(); },{passive:false});
cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect(); targetX=e.clientX-r.left; });
cv.addEventListener('mousedown',()=>fireBullet());
let keys={};
document.addEventListener('keydown',e=>{ keys[e.key]=true; if(e.key===' ')fireBullet(); });
document.addEventListener('keyup',e=>{ keys[e.key]=false; });
function fireBullet(){
  if(over)return;
  if(frame - (fireBullet.last||0) < 12) return;
  fireBullet.last=frame;
  bullets.push({x:ship.x,y:ship.y-20,vy:-9});
}
function spawnEnemy(){
  const type=Math.random()<0.15?'boss':'normal';
  enemies.push({
    x:30+Math.random()*(W-60), y:-30,
    w:type==='boss'?46:28, h:type==='boss'?46:28,
    vy:type==='boss'?1.4:2+Math.random()*1.5,
    hp:type==='boss'?4:1,
    color: type==='boss' ? '#ff5a8a' : ['#00f5ff','#38f9a1','#ffe066','#c77dff'][Math.floor(Math.random()*4)]
  });
}
function loop(){
  frame++;
  update();
  draw();
  if(!over) requestAnimationFrame(loop);
}
function update(){
  if(targetX!==null){ ship.x += (targetX-ship.x)*0.25; }
  if(keys['ArrowLeft']) ship.x-=5;
  if(keys['ArrowRight']) ship.x+=5;
  ship.x=Math.max(20,Math.min(W-20,ship.x));
  bullets.forEach(b=>b.y+=b.vy);
  bullets=bullets.filter(b=>b.y>-20);
  if(frame%Math.max(24,spawnRate)===0) spawnEnemy();
  if(frame%600===0 && spawnRate>28) spawnRate-=6;
  enemies.forEach(en=>en.y+=en.vy);
  enemies.forEach(en=>{
    bullets.forEach(b=>{
      if(!b.dead && !en.dead && Math.abs(b.x-en.x)<en.w/2 && Math.abs(b.y-en.y)<en.h/2){
        b.dead=true; en.hp--;
        if(en.hp<=0){ en.dead=true; score+= en.w>30?50:10; document.getElementById('score').textContent=score; }
      }
    });
  });
  bullets=bullets.filter(b=>!b.dead);
  enemies.forEach(en=>{
    if(!en.dead && Math.abs(en.x-ship.x)<(en.w+ship.w)/2*0.8 && Math.abs(en.y-ship.y)<(en.h+ship.h)/2*0.8){
      en.dead=true; hitShip();
    }
    if(en.y>H+40 && !en.dead) en.dead=true;
  });
  enemies=enemies.filter(e=>!e.dead);
  estars.forEach(s=>{ s.y+=s.s; if(s.y>H) s.y=0; });
}
function hitShip(){
  lives--;
  document.getElementById('lives').textContent=lives;
  if(lives<=0) endGame();
}
function draw(){
  cx.fillStyle='#000'; cx.fillRect(0,0,W,H);
  cx.fillStyle='rgba(255,255,255,.6)';
  estars.forEach(s=>cx.fillRect(s.x,s.y,s.s,s.s));
  bullets.forEach(b=>{
    cx.fillStyle='#00f5ff'; cx.fillRect(b.x-2,b.y-8,4,10);
  });
  enemies.forEach(en=>{
    cx.save(); cx.translate(en.x,en.y);
    cx.fillStyle=en.color;
    cx.beginPath();
    cx.moveTo(0,-en.h/2); cx.lineTo(en.w/2,en.h/2); cx.lineTo(-en.w/2,en.h/2);
    cx.closePath(); cx.fill();
    cx.restore();
  });
  cx.save(); cx.translate(ship.x,ship.y);
  cx.fillStyle='#fff';
  cx.beginPath();
  cx.moveTo(0,-18); cx.lineTo(16,16); cx.lineTo(0,8); cx.lineTo(-16,16);
  cx.closePath(); cx.fill();
  cx.fillStyle='#00f5ff';
  cx.beginPath(); cx.moveTo(0,-18); cx.lineTo(6,4); cx.lineTo(-6,4); cx.closePath(); cx.fill();
  cx.restore();
}
function endGame(){
  over=true;
  if(score>best){best=score;localStorage.setItem('spaceBest',best);}
  document.getElementById('finalScore').textContent='Score: '+score+'  •  Best: '+best;
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
init();
</script></body></html>
