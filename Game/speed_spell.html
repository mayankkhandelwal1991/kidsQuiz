<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Speed Spell</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ff416c,#ff4b2b);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:16px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#dc2626;font-size:15px}
.timerwrap{background:#fee2e2;border-radius:20px;height:12px;overflow:hidden;margin-bottom:8px}
.timerbar{height:100%;background:linear-gradient(135deg,#22c55e,#84cc16);width:100%;transition:width .1s linear}
.timerbar.warn{background:linear-gradient(135deg,#f59e0b,#f97316)}
.timerbar.danger{background:linear-gradient(135deg,#ef4444,#dc2626);animation:pulse .4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.hintbox{font-size:56px;margin:6px 0}
.blanks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.bl{width:32px;height:42px;border-bottom:4px solid #fca5a5;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#dc2626;background:#fff5f5;border-radius:8px 8px 0 0}
.bl.filled{animation:fillpop .3s ease}
@keyframes fillpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.key{aspect-ratio:1/1;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#ff4fa3);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .1s}
.key:active{transform:scale(.88)}
.key.wrong{animation:shake .3s;background:linear-gradient(135deg,#94a3b8,#64748b)}
.key.used{opacity:.3;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{color:#dc2626;font-weight:800;font-size:15px;min-height:22px}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#dc2626;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">⚡ <span id="score">0</span>/<span id="totalW">10</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="timerwrap"><div class="timerbar" id="timerbar"></div></div>
  <div class="hintbox" id="hint"></div>
  <div class="blanks" id="blanks"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="msg" id="msg">Spell fast before time runs out!</div>
</div>
<div class="end" id="end">
  <div class="card">
    <div class="big" id="endIcon">🏆</div>
    <h2>Round Complete!</h2>
    <p id="endMsg">Nice speed!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="ads.js"></script>
<script>
const POOL=[
['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['FISH','🐟'],['BIRD','🐦'],['FROG','🐸'],
['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['TIGER','🐯'],['ZEBRA','🦓'],
['HOUSE','🏠'],['TRAIN','🚂'],['STAR','⭐'],['MOON','🌙'],
['FLOWER','🌸'],['MONKEY','🐵'],['RABBIT','🐰'],['ROCKET','🚀'],
['BANANA','🍌'],['ORANGE','🍊'],['PENCIL','✏️'],['BUTTER','🧈'],['CHEESE','🧀'],
['SHARK','🦈'],['WHALE','🐳'],['MOUSE','🐭'],['PANDA','🐼'],['SNAKE','🐍'],['HORSE','🐴']
];
const ROUND_LEN=10, TIME_MS=8000;
let round=[],idx=0,score=0,cur=null,filled=[],timerId=null,startTime=0;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(){
  round=shuffleArr([...POOL]).slice(0,ROUND_LEN);
  idx=0;score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('totalW').textContent=round.length;
  document.getElementById('end').classList.remove('show');
  loadWord();
}

function loadWord(){
  clearInterval(timerId);
  if(idx>=round.length){finish();return;}
  cur=round[idx];filled=[];
  document.getElementById('hint').textContent=cur[1];
  document.getElementById('msg').textContent='Word '+(idx+1)+' of '+round.length;
  renderBlanks();renderKeyboard();
  startTimer();
}

function renderBlanks(){
  const b=document.getElementById('blanks');b.innerHTML='';
  for(let i=0;i<cur[0].length;i++){
    const d=document.createElement('div');d.className='bl';d.id='bl_'+i;
    d.textContent=filled[i]||'';
    b.appendChild(d);
  }
}

function renderKeyboard(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  const need=new Set(cur[0].split(''));
  let pool=new Set(need);
  const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  while(pool.size<Math.min(14,alpha.length)){
    pool.add(alpha[Math.floor(Math.random()*alpha.length)]);
  }
  const keys=shuffleArr([...pool]);
  keys.forEach(ch=>{
    const k=document.createElement('div');k.className='key';k.textContent=ch;
    k.onclick=()=>pressKey(ch,k);
    kb.appendChild(k);
  });
}

function startTimer(){
  startTime=Date.now();
  const bar=document.getElementById('timerbar');
  bar.style.width='100%';bar.classList.remove('warn','danger');
  timerId=setInterval(()=>{
    const pct=Math.max(0,100-((Date.now()-startTime)/TIME_MS*100));
    bar.style.width=pct+'%';
    if(pct<50)bar.classList.add('warn');
    if(pct<20)bar.classList.add('danger');
    if(pct<=0){
      clearInterval(timerId);
      document.getElementById('msg').textContent='⏰ Time up! It was '+cur[0];
      idx++;
      setTimeout(loadWord,900);
    }
  },80);
}

function pressKey(ch,el){
  const need=cur[0][filled.length];
  if(ch===need){
    filled.push(ch);
    const bl=document.getElementById('bl_'+(filled.length-1));
    bl.textContent=ch;bl.classList.add('filled');
    el.classList.add('used');
    if(filled.length===cur[0].length){
      clearInterval(timerId);
      score++;
      document.getElementById('score').textContent=score;
      document.getElementById('msg').textContent='🎉 Correct! '+cur[0];
      burstConfetti();
      idx++;
      setTimeout(loadWord,700);
    }
  }else{
    el.classList.add('wrong');if(window.KQFX)KQFX.play('wrong');
    setTimeout(()=>el.classList.remove('wrong'),300);
  }
}

function finish(){
  document.getElementById('endIcon').textContent=score>=round.length*0.7?'🏆':'⚡';
  document.getElementById('endMsg').textContent='You spelled '+score+' out of '+round.length+' words in time!';
  document.getElementById('end').classList.add('show');
  onGameComplete();
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
