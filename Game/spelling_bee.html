<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Spelling Bee</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#f7971e,#ffd200);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:16px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#b8860b;font-size:15px}
.progwrap{background:#fff3d6;border-radius:20px;height:10px;overflow:hidden;margin-bottom:8px}
.progbar{height:100%;background:linear-gradient(135deg,#ffb703,#ff7a59);width:0%;transition:width .4s ease}
.lives{font-size:16px;margin-bottom:4px;letter-spacing:3px}
.hintbox{font-size:64px;margin:6px 0;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.blanks{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.bl{width:34px;height:44px;border-bottom:4px solid #ffb703;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#5a3d00;background:#fff8e6;border-radius:8px 8px 0 0;transition:.2s}
.bl.filled{animation:fillpop .3s ease}
@keyframes fillpop{0%{transform:scale(0.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.key{aspect-ratio:1/1;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#ff4fa3);color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .1s}
.key:active{transform:scale(.9)}
.key.wrong{animation:shake .35s;background:linear-gradient(135deg,#94a3b8,#64748b)}
.key.used{opacity:.3;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.msg{color:#b8860b;font-weight:800;font-size:16px;min-height:24px;margin-top:6px}
.row{display:flex;gap:8px;justify-content:center;margin-top:6px}
.row button{border:none;border-radius:14px;padding:9px 18px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;color:#fff}
.row .hintbtn{background:linear-gradient(135deg,#38bdf8,#818cf8)}
.row .cl{background:#95a5a6}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#b8860b;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🐝 <span id="score">0</span>/<span id="totalW">10</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="progwrap"><div class="progbar" id="prog"></div></div>
  <div class="lives" id="lives">❤️❤️❤️</div>
  <div class="hintbox" id="hint"></div>
  <div class="blanks" id="blanks"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="row">
    <button class="cl" onclick="clearWord()">Clear</button>
    <button class="hintbtn" onclick="useHint()">💡 Hint</button>
  </div>
  <div class="msg" id="msg">Spell the word letter by letter!</div>
</div>
<div class="end" id="end">
  <div class="card">
    <div class="big" id="endIcon">🏆</div>
    <h2 id="endTitle">Round Complete!</h2>
    <p id="endMsg">Nice spelling!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="ads.js"></script>
<script>
const POOL=[
['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['FISH','🐟'],['BIRD','🐦'],['FROG','🐸'],
['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['TIGER','🐯'],['ZEBRA','🦓'],
['HOUSE','🏠'],['TRAIN','🚂'],['PLANE','✈️'],['CLOCK','⏰'],['STAR','⭐'],['MOON','🌙'],
['FLOWER','🌸'],['MONKEY','🐵'],['RABBIT','🐰'],['ROCKET','🚀'],['GUITAR','🎸'],['CAMERA','📷'],
['BANANA','🍌'],['ORANGE','🍊'],['SCHOOL','🏫'],['PENCIL','✏️'],['BUTTER','🧈'],['CHEESE','🧀'],
['SHARK','🦈'],['WHALE','🐳'],['MOUSE','🐭'],['PANDA','🐼'],['SNAKE','🐍'],['HORSE','🐴']
];
const ROUND_LEN=10, MAX_LIVES=3;
let round=[],idx=0,score=0,lives=MAX_LIVES,cur=null,filled=[],hintUsed=false;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(){
  round=shuffleArr([...POOL]).slice(0,ROUND_LEN);
  idx=0;score=0;lives=MAX_LIVES;
  document.getElementById('score').textContent=0;
  document.getElementById('totalW').textContent=ROUND_LEN;
  document.getElementById('end').classList.remove('show');
  updateLives();
  loadWord();
}

function updateLives(){
  document.getElementById('lives').textContent='❤️'.repeat(lives)+'🤍'.repeat(MAX_LIVES-lives);
}

function loadWord(){
  if(idx>=round.length){finishRound(true);return;}
  cur=round[idx];hintUsed=false;
  filled=[];
  document.getElementById('hint').textContent=cur[1];
  document.getElementById('msg').textContent='Word '+(idx+1)+' of '+round.length;
  document.getElementById('prog').style.width=Math.round(idx/round.length*100)+'%';
  renderBlanks();
  renderKeyboard();
}

function renderBlanks(){
  const b=document.getElementById('blanks');b.innerHTML='';
  for(let i=0;i<cur[0].length;i++){
    const d=document.createElement('div');d.className='bl';d.id='bl_'+i;
    d.textContent=filled[i]||'';
    b.appendChild(d);
  }
}

function renderKeyboard(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  const need=new Set(cur[0].split(''));
  let pool=new Set(need);
  const alpha='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  while(pool.size<Math.min(14,alpha.length)){
    pool.add(alpha[Math.floor(Math.random()*alpha.length)]);
  }
  const keys=shuffleArr([...pool]);
  keys.forEach(ch=>{
    const k=document.createElement('div');k.className='key';k.textContent=ch;
    k.onclick=()=>pressKey(ch,k);
    kb.appendChild(k);
  });
}

function pressKey(ch,el){
  const need=cur[0][filled.length];
  if(ch===need){
    filled.push(ch);
    const bl=document.getElementById('bl_'+(filled.length-1));
    bl.textContent=ch;bl.classList.add('filled');
    el.classList.add('used');
    if(filled.length===cur[0].length){
      wordComplete();
    }
  }else{
    el.classList.add('wrong');if(window.KQFX)KQFX.play('wrong');
    setTimeout(()=>el.classList.remove('wrong'),350);
    loseLife();
  }
}

function loseLife(){
  lives--;updateLives();
  document.getElementById('msg').textContent='❌ Try again!';
  if(lives<=0){
    setTimeout(()=>finishRound(false),600);
  }
}

function wordComplete(){
  score++;
  document.getElementById('score').textContent=score;
  document.getElementById('msg').textContent='🎉 Correct! '+cur[0];
  burstConfetti();
  idx++;
  setTimeout(loadWord,900);
}

function clearWord(){
  filled=[];
  renderBlanks();
  document.querySelectorAll('.key').forEach(k=>k.classList.remove('used'));
}

function useHint(){
  if(hintUsed||filled.length>=cur[0].length)return;
  hintUsed=true;
  const need=cur[0][filled.length];
  const keys=[...document.getElementById('keyboard').children];
  const match=keys.find(k=>k.textContent===need && !k.classList.contains('used'));
  if(match){
    match.style.boxShadow='0 0 0 4px #38bdf8';
    setTimeout(()=>match.style.boxShadow='',900);
  }
}

function finishRound(won){
  const icon=document.getElementById('endIcon');
  const title=document.getElementById('endTitle');
  const msg=document.getElementById('endMsg');
  document.getElementById('prog').style.width='100%';
  if(won){
    icon.textContent='🏆';title.textContent='Round Complete!';
    msg.textContent='You spelled '+score+' out of '+round.length+' words!';
  }else{
    icon.textContent='🐝';title.textContent='Out of Lives!';
    msg.textContent='You spelled '+score+' words correctly. Try again!';
  }
  document.getElementById('end').classList.add('show');
  onGameComplete();
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
