<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Rock Paper Scissors</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#8b5cf6,#34d399);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:400px;width:100%;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
.arena{display:flex;justify-content:space-around;align-items:center;font-size:64px;background:linear-gradient(135deg,#fff8cc,#fff0f6);border:4px dashed #ffb703;border-radius:22px;padding:20px 8px;margin-bottom:14px;min-height:120px}
.vs{font-size:22px;font-weight:800;color:#ff5a8a}
.choices{display:flex;gap:10px;justify-content:center}
.choices button{font-size:42px;padding:12px 18px;border:3px solid #dbeafe;background:#fff;border-radius:18px;cursor:pointer;transition:.12s}
.choices button:hover{transform:scale(1.1);border-color:#8b5cf6}
.msg{color:#ff5a8a;font-weight:800;font-size:18px;min-height:28px;margin-top:14px}

/* mobile fit */
.wrap{display:flex;flex-direction:column;max-height:100%;overflow-y:auto}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">You: <span id="ps">0</span> — 🤖: <span id="cs">0</span> (to 5)</div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="arena">
    <span id="pHand">❔</span><span class="vs">VS</span><span id="cHand">❔</span>
  </div>
  <div class="choices">
    <button onclick="play(0)">✊</button>
    <button onclick="play(1)">✋</button>
    <button onclick="play(2)">✌️</button>
  </div>
  <div class="msg" id="msg">Pick rock, paper, or scissors!</div>
</div>
<script src="../ads.js"></script>
<script>
const H=['✊','✋','✌️'],NAMES=['Rock','Paper','Scissors'];
let ps=0,cs=0,over=false,anim=null;
function reset(){ps=0;cs=0;over=false;
  document.getElementById('ps').textContent=0;document.getElementById('cs').textContent=0;
  document.getElementById('pHand').textContent='❔';document.getElementById('cHand').textContent='❔';
  document.getElementById('msg').textContent='Pick rock, paper, or scissors!';}
function play(p){
  if(over){reset();return;}
  if(anim)return;
  const c=Math.floor(Math.random()*3);
  let n=0;
  document.getElementById('pHand').textContent='✊';
  document.getElementById('cHand').textContent='✊';
  anim=setInterval(()=>{
    n++;
    const shake=n%2?'✊':'🤜';
    document.getElementById('pHand').textContent=shake;
    document.getElementById('cHand').textContent=shake;
    if(n>=5){
      clearInterval(anim);anim=null;
      document.getElementById('pHand').textContent=H[p];
      document.getElementById('cHand').textContent=H[c];
      settle(p,c);
    }
  },130);
}
function settle(p,c){
  let m;
  if(p===c)m='🤝 Tie! Both picked '+NAMES[p];
  else if((p===0&&c===2)||(p===1&&c===0)||(p===2&&c===1)){ps++;m='🎉 '+NAMES[p]+' beats '+NAMES[c]+' — you score!';if(window.KQFX)KQFX.play('success');}
  else{cs++;m='😅 '+NAMES[c]+' beats '+NAMES[p]+' — computer scores!';if(window.KQFX)KQFX.play('wrong');}
  document.getElementById('ps').textContent=ps;
  document.getElementById('cs').textContent=cs;
  if(ps>=5){m='🏆 YOU WIN THE MATCH '+ps+'-'+cs+'! Tap any hand to restart.';over=true;if(window.KQFX)KQFX.win();onGameComplete();}
  if(cs>=5){m='🤖 Computer wins the match '+cs+'-'+ps+'. Tap any hand to restart.';over=true;if(window.KQFX)KQFX.lose();onGameComplete();}
  document.getElementById('msg').textContent=m;
}
</script></body></html>
