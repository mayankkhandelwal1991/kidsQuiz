<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tic Tac Toe</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#8b5cf6,#6ee7ff);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:380px;width:100%;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cell{position:relative;height:0;padding-bottom:calc(100% - 6px);border-radius:16px;background:linear-gradient(135deg,#eef9ff,#f5edff);border:3px solid #dbeafe;font-size:44px;cursor:pointer;user-select:none;font-weight:800}
.cell span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.cell.x{color:#ff4fa3}.cell.o{color:#06b6d4}
.cell.win{background:#fff3b0;border-color:#ffb703}
.msg{color:#ff5a8a;font-weight:800;font-size:18px;min-height:28px;margin-top:12px}

/* mobile fit */
.wrap{display:flex;flex-direction:column;max-height:100%;overflow-y:auto}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <div class="sc">You: <span id="pw">0</span> &nbsp; 🤖: <span id="cw">0</span> &nbsp; 🤝: <span id="dw">0</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">You are ❌ — tap a square!</div>
</div>
<script src="../ads.js"></script>
<script>
const WINS=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let board,over,pw=0,cw=0,dw=0;
const grid=document.getElementById('grid'),msg=document.getElementById('msg');
for(let i=0;i<9;i++){
  const c=document.createElement('div');c.className='cell';
  c.onclick=()=>play(i);grid.appendChild(c);
}
const cells=[...document.querySelectorAll('.cell')];
function reset(){
  board=Array(9).fill('');over=false;
  cells.forEach(c=>{c.textContent='';c.className='cell';});
  msg.textContent='You are ❌ — tap a square!';
}
function winner(b){
  for(const w of WINS)if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return w;
  return null;
}
function play(i){
  if(over||board[i])return;
  mark(i,'X');
  if(check())return;
  setTimeout(()=>{aiMove();check();},350);
}
function mark(i,p){
  board[i]=p;
  cells[i].innerHTML='<span>'+(p==='X'?'❌':'⭕')+'</span>';
  cells[i].classList.add(p.toLowerCase());
}
function aiMove(){
  if(over)return;
  let m=findMove('O');            // win
  if(m===-1)m=findMove('X');      // block
  if(m===-1&&!board[4])m=4;       // center
  if(m===-1){
    const free=board.map((v,i)=>v?-1:i).filter(i=>i>=0);
    m=free[Math.floor(Math.random()*free.length)];
  }
  if(m!==undefined&&m>=0)mark(m,'O');
}
function findMove(p){
  for(const w of WINS){
    const vals=w.map(i=>board[i]);
    if(vals.filter(v=>v===p).length===2&&vals.includes(''))
      return w[vals.indexOf('')];
  }
  return -1;
}
function check(){
  const w=winner(board);
  if(w){
    over=true;w.forEach(i=>cells[i].classList.add('win'));
    if(board[w[0]]==='X'){pw++;msg.textContent='🎉 You win!';if(window.KQFX){KQFX.win();KQFX.bounce(msg);}}
    else{cw++;msg.textContent='🤖 Computer wins!';if(window.KQFX){KQFX.lose();KQFX.shake(msg);}}
  }else if(!board.includes('')){over=true;dw++;msg.textContent='🤝 It\u2019s a draw!';if(window.KQFX)KQFX.play('draw');}
  document.getElementById('pw').textContent=pw;
  document.getElementById('cw').textContent=cw;
  document.getElementById('dw').textContent=dw;
  if(over){onGameComplete();setTimeout(reset,1800);}
  return over;
}
reset();
</script></body></html>
