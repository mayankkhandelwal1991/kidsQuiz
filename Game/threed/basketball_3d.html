<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hoops 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#05050f;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{width:100%;height:100%;max-width:480px;max-height:900px;position:relative;background:#05050f;margin:auto}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;z-index:5}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:16px;font-weight:800;background:linear-gradient(135deg,#ff9f43,#ff5a8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-size:13px;font-weight:800;color:#ff9f43;text-align:right}
#scene{position:absolute;inset:0}
.overlay{position:absolute;inset:0;background:rgba(5,5,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);z-index:5}
.startCard{position:absolute;inset:0;background:rgba(5,5,20,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:8;text-align:center;padding:20px}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div id="scene"></div>
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Hoops 3D</h1>
    <div class="sc">SCORE <span id="score">0</span><br>TIME <span id="time">30</span>s</div>
  </div>
  <div class="hint">Swipe up on the ball to shoot — aim for the hoop!</div>
  <div class="startCard" id="startCard">
    <h2 style="font-size:22px;background:linear-gradient(135deg,#ff9f43,#ff5a8a);-webkit-background-clip:text;background-clip:text;color:transparent">Hoops 3D</h2>
    <p style="font-size:13px;color:#ccc;max-width:260px">Swipe up on the ball to shoot it toward the hoop. Score as many baskets as you can in 30 seconds!</p>
    <button class="newbtn" onclick="startGame()">▶ Start</button>
  </div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#ff9f43,#ff5a8a);-webkit-background-clip:text;background-clip:text;color:transparent">Time's Up!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="startGame()">Shoot Again</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../assets/GLTFLoader-r128.js"></script>
<script src="../ads.js"></script>
<script>
const container=document.getElementById('scene');
let scene,camera,renderer,ball,hoopRing,ballState,score,timeLeft,over,timerId,best=+(localStorage.getItem('hoopsBest')||0),started=false;
const GRAV=-0.014, HOOP_POS={x:0,y:3.2,z:-6};
function initScene(){
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0x05050f,10,30);
  camera=new THREE.PerspectiveCamera(55,container.clientWidth/container.clientHeight,0.1,100);
  camera.position.set(0,1.6,3.2);
  camera.lookAt(0,2.2,-6);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(container.clientWidth,container.clientHeight);
  renderer.setClearColor(0x05050f);
  container.innerHTML=''; container.appendChild(renderer.domElement);
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dir=new THREE.DirectionalLight(0xffffff,0.7); dir.position.set(2,6,2); scene.add(dir);

  const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,20),new THREE.MeshStandardMaterial({color:0x1a1a3d}));
  floor.rotation.x=-Math.PI/2; floor.position.z=-6;
  scene.add(floor);

  const boardGeo=new THREE.BoxGeometry(2.4,1.6,0.1);
  const board=new THREE.Mesh(boardGeo,new THREE.MeshStandardMaterial({color:0xffffff,opacity:0.85,transparent:true}));
  board.position.set(0,3.7,-7.1);
  scene.add(board);

  const poleGeo=new THREE.CylinderGeometry(0.08,0.08,3.6,8);
  const pole=new THREE.Mesh(poleGeo,new THREE.MeshStandardMaterial({color:0x555555}));
  pole.position.set(0,1.8,-7.3);
  scene.add(pole);

  const ringGeo=new THREE.TorusGeometry(0.5,0.05,8,24);
  hoopRing=new THREE.Mesh(ringGeo,new THREE.MeshStandardMaterial({color:0xff5a8a,emissive:0xff5a8a,emissiveIntensity:0.4}));
  hoopRing.rotation.x=Math.PI/2;
  hoopRing.position.set(HOOP_POS.x,HOOP_POS.y,HOOP_POS.z);
  scene.add(hoopRing);

  const netMat=new THREE.LineBasicMaterial({color:0xffffff});
  for(let i=0;i<8;i++){
    const ang=(i/8)*Math.PI*2;
    const x1=HOOP_POS.x+Math.cos(ang)*0.5, z1=HOOP_POS.z+Math.sin(ang)*0.5;
    const geo=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,HOOP_POS.y,z1), new THREE.Vector3(HOOP_POS.x+Math.cos(ang)*0.2,HOOP_POS.y-0.5,HOOP_POS.z+Math.sin(ang)*0.2)]);
    scene.add(new THREE.Line(geo,netMat));
  }

  const ballGeo=new THREE.SphereGeometry(0.28,16,16);
  ball=new THREE.Mesh(ballGeo,new THREE.MeshStandardMaterial({color:0xff9f43}));
  scene.add(ball);
  const shooter=new THREE.Group(); shooter.position.set(-1.25,0,2.35); scene.add(shooter);
  const jersey=new THREE.Mesh(new THREE.CylinderGeometry(.28,.36,.9,10),new THREE.MeshStandardMaterial({color:0x60a5fa}));jersey.position.y=.9;shooter.add(jersey);
  const face=new THREE.Mesh(new THREE.SphereGeometry(.25,12,12),new THREE.MeshStandardMaterial({color:0xffd2b8}));face.position.y=1.55;shooter.add(face);
  [-.18,.18].forEach(x=>{const leg=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,.7,8),new THREE.MeshStandardMaterial({color:0x334155}));leg.position.set(x,.3,0);shooter.add(leg);});
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.07,.09,.85,8),new THREE.MeshStandardMaterial({color:0xffd2b8}));arm.rotation.z=-.8;arm.position.set(.38,1.15,-.1);shooter.add(arm);
  if(THREE.GLTFLoader){
    new THREE.GLTFLoader().load('../assets/cesium-man.glb',gltf=>{
      const athlete=gltf.scene; athlete.scale.setScalar(.72); athlete.position.set(-1.25,0,2.35); athlete.rotation.y=Math.PI;
      shooter.visible=false; scene.add(athlete);
      const clip=gltf.animations&&gltf.animations[0];
      if(clip){ const mixer=new THREE.AnimationMixer(athlete); mixer.clipAction(clip).play(); const clock=new THREE.Clock(); (function animateModel(){ requestAnimationFrame(animateModel); mixer.update(clock.getDelta()); })(); }
    });
  }
}
function resetBall(){
  ball.position.set(0,1.3,2.2);
  ballState={x:0,y:1.3,z:2.2,vx:0,vy:0,vz:0,flying:false,scored:false};
}
function resetGame(){
  score=0; timeLeft=30; over=false;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('overlay').classList.remove('show');
  resetBall();
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--; document.getElementById('time').textContent=timeLeft;
    if(timeLeft<=0) endGame();
  },1000);
}
function startGame(){
  document.getElementById('startCard').style.display='none';
  if(!scene) initScene();
  resetGame();
  if(!started){ started=true; requestAnimationFrame(loop); }
}
let dragStart=null;
container.addEventListener('touchstart',e=>{ if(ballState.flying)return; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY,t:Date.now()}; },{passive:true});
container.addEventListener('touchend',e=>{
  if(!dragStart||ballState.flying)return;
  const dx=e.changedTouches[0].clientX-dragStart.x, dy=e.changedTouches[0].clientY-dragStart.y;
  const dt=Math.max(Date.now()-dragStart.t,50);
  shoot(dx,dy,dt);
  dragStart=null;
},{passive:true});
container.addEventListener('mousedown',e=>{ if(ballState.flying)return; dragStart={x:e.clientX,y:e.clientY,t:Date.now()}; });
container.addEventListener('mouseup',e=>{
  if(!dragStart||ballState.flying)return;
  const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
  const dt=Math.max(Date.now()-dragStart.t,50);
  shoot(dx,dy,dt);
  dragStart=null;
});
function shoot(dx,dy,dt){
  if(dy>-40)return; // must swipe upward
  const power=Math.min(Math.abs(dy)/dt*10,1.4);
  ballState.vy=0.28+power*0.15;
  ballState.vz=-0.22-power*0.08;
  ballState.vx=(dx/200)*0.12;
  ballState.flying=true;
  ballState.scored=false;
}
function loop(){
  if(!over) update();
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function update(){
  if(ballState.flying){
    ballState.vy+=GRAV;
    ballState.x+=ballState.vx; ballState.y+=ballState.vy; ballState.z+=ballState.vz;
    ball.position.set(ballState.x,ballState.y,ballState.z);
    const dx=ballState.x-HOOP_POS.x, dy=ballState.y-HOOP_POS.y, dz=ballState.z-HOOP_POS.z;
    if(!ballState.scored && Math.abs(dy)<0.28 && Math.sqrt(dx*dx+dz*dz)<0.62 && ballState.vy<0){
      ballState.scored=true;
      score++; document.getElementById('score').textContent=score;
      if(window.KQFX)KQFX.play('ding');
      hoopRing.material.emissiveIntensity=1;
      setTimeout(()=>{ hoopRing.material.emissiveIntensity=0.4; },200);
    }
    if(ballState.y<0.3 || ballState.z<-9){
      setTimeout(resetBall,250);
      ballState.flying=false;
    }
  }
}
function endGame(){
  over=true; clearInterval(timerId);
  if(score>best){ best=score; localStorage.setItem('hoopsBest',best); }
  document.getElementById('finalScore').textContent='Score: '+score+'  •  Best: '+best;
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth,container.clientHeight);
});
</script></body></html>
