<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Car Race 3D</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ffd166,#ff7ac6);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;height:100%;max-height:820px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:16px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:2px 0;position:relative}
#stage3d{width:100%;height:100%;border-radius:18px;overflow:hidden;background:#87ceeb}
canvas{display:block}
.ctrl{display:flex;gap:10px;margin-top:8px}
.ctrl button{flex:1;font-size:24px;padding:12px;border:none;border-radius:16px;background:linear-gradient(135deg,#34d399,#06b6d4);color:#fff;cursor:pointer;font-weight:800}
.msg{position:absolute;top:10px;left:0;right:0;text-align:center;color:#fff;font-weight:800;font-size:15px;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <div class="sc">⭐ <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="stage"><div id="stage3d"></div><div class="msg" id="msg">Tap left/right to start!</div></div>
  <div class="ctrl"><button onclick="move(-1)">⬅️</button><button onclick="move(1)">➡️</button></div>
</div>
<script src="../ads.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/128/three.min.js"></script>
<script>
const container=document.getElementById('stage3d');
const msg=document.getElementById('msg');
let W=container.clientWidth,H=container.clientHeight;
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x87ceeb,20,90);
scene.background=new THREE.Color(0x87ceeb);
const camera=new THREE.PerspectiveCamera(65,W/H,0.1,200);
camera.position.set(0,5.2,9);
camera.lookAt(0,1,-10);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(W,H);
container.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.7));
const sun=new THREE.DirectionalLight(0xffffff,0.8);
sun.position.set(5,10,5);
scene.add(sun);

const LANE_X=[-2.4,0,2.4];
// road
const road=new THREE.Mesh(new THREE.PlaneGeometry(8,400),new THREE.MeshStandardMaterial({color:0x444444}));
road.rotation.x=-Math.PI/2; road.position.z=-150; scene.add(road);
// grass sides
[-6,6].forEach(x=>{
  const g=new THREE.Mesh(new THREE.PlaneGeometry(6,400),new THREE.MeshStandardMaterial({color:0x7cc576}));
  g.rotation.x=-Math.PI/2; g.position.set(x,-0.01,-150); scene.add(g);
});
// lane markers (dashes) - group that scrolls
const dashGroup=new THREE.Group();
for(let i=0;i<40;i++){
  [-1.2,1.2].forEach(lx=>{
    const d=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.02,1.2),new THREE.MeshStandardMaterial({color:0xffffff}));
    d.position.set(lx,0.01,-i*6);
    dashGroup.add(d);
  });
}
scene.add(dashGroup);

function makeCar(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.2,0.5,2.2),new THREE.MeshStandardMaterial({color}));
  body.position.y=0.5; g.add(body);
  const cabin=new THREE.Mesh(new THREE.BoxGeometry(0.9,0.4,1.1),new THREE.MeshStandardMaterial({color:0x333333}));
  cabin.position.set(0,0.9,-0.1); g.add(cabin);
  [-.52,.52].forEach(x=>[-.65,.65].forEach(z=>{const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,.14,10),new THREE.MeshStandardMaterial({color:0x171923}));wheel.rotation.z=Math.PI/2;wheel.position.set(x,.28,z);g.add(wheel);}));
  [-.35,.35].forEach(x=>{const lamp=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xfff3a6}));lamp.position.set(x,.55,-1.11);g.add(lamp);});
  return g;
}
const player=makeCar(0xff4757);
player.position.set(0,0,2);
scene.add(player);

let lane,cars,score,speed,playing,dead,frame,best=+(localStorage.getItem('race3dBest')||0);
document.getElementById('best').textContent=best;
const ENEMY_COLORS=[0x1e90ff,0xffa502,0x2ed573,0xeccc68,0x7bed9f];

function reset(){
  lane=1;score=0;speed=0.28;playing=false;dead=false;frame=0;
  cars.forEach(c=>scene.remove(c.mesh));
  cars=[];
  player.position.x=LANE_X[lane];
  document.getElementById('score').textContent=0;
  msg.textContent='Tap left/right to start!';
  msg.style.display='block';
}
cars=[];
function move(d){
  if(dead){reset();return;}
  playing=true;
  lane=Math.max(0,Math.min(2,lane+d));
  msg.style.display='none';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')move(-1);
  if(e.key==='ArrowRight')move(1);
});
renderer.domElement.addEventListener('pointerdown',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  move(e.clientX-r.left<r.width/2?-1:1);
});

function spawnCar(){
  const l=Math.floor(Math.random()*3);
  const mesh=makeCar(ENEMY_COLORS[Math.floor(Math.random()*ENEMY_COLORS.length)]);
  mesh.position.set(LANE_X[l],0,-60);
  scene.add(mesh);
  cars.push({lane:l,mesh});
}

function update(){
  frame++;
  player.position.x+=(LANE_X[lane]-player.position.x)*0.25;
  if(playing&&!dead){
    speed=0.28+score*0.0025;
    if(frame%Math.max(24,55-Math.floor(score/3))===0) spawnCar();
    dashGroup.children.forEach(d=>{ d.position.z+=speed*4; if(d.position.z>10) d.position.z-=240; });
    for(let i=cars.length-1;i>=0;i--){
      const c=cars[i];
      c.mesh.position.z+=speed*4;
      if(c.mesh.position.z>10){
        scene.remove(c.mesh); cars.splice(i,1); score++; document.getElementById('score').textContent=score; if(window.KQFX)KQFX.play('whoosh'); continue;
      }
      if(c.lane===lane && c.mesh.position.z>1 && c.mesh.position.z<3.2){
        dead=true; playing=false; if(window.KQFX)KQFX.play('blast'); onGameComplete();
        if(score>best){best=score;localStorage.setItem('race3dBest',best);document.getElementById('best').textContent=best;}
        msg.textContent='💥 Crash! Score: '+score+' — Tap to retry';
        msg.style.display='block';
      }
    }
  }
  renderer.render(scene,camera);
  requestAnimationFrame(update);
}
function onResize(){
  W=container.clientWidth;H=container.clientHeight;
  camera.aspect=W/H; camera.updateProjectionMatrix();
  renderer.setSize(W,H);
}
window.addEventListener('resize',onResize);
reset(); onResize(); update();
</script></body></html>
