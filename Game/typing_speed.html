<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Typing Speed</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#1a1a3d);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:16px;max-width:460px;width:100%;display:flex;flex-direction:column;height:100%;max-height:760px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.timerbox{font-size:14px;font-weight:800;color:#ffe066}
.textbox{background:rgba(255,255,255,.05);border-radius:16px;padding:16px;font-size:17px;line-height:1.7;margin:10px 0;min-height:110px}
.textbox span.correct{color:#38f9a1}
.textbox span.wrong{color:#ff5a8a;text-decoration:underline}
.textbox span.current{background:rgba(0,245,255,.3);border-radius:3px}
textarea{width:100%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:14px;color:#fff;font-family:inherit;font-size:16px;padding:12px;resize:none;height:70px}
textarea:focus{outline:none;border-color:#00f5ff}
.stats{display:flex;justify-content:space-around;margin-top:12px}
.stat{text-align:center;font-size:11px;color:#aaa}
.stat b{display:block;font-size:22px;color:#00f5ff}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:12px;align-self:center}
</style><link rel="stylesheet" href="game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Typing Speed</h1>
    <div class="timerbox" id="timer">30s</div>
  </div>
  <div class="textbox" id="textbox"></div>
  <textarea id="input" placeholder="Start typing here..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
  <div class="stats">
    <div class="stat">WPM<b id="wpm">0</b></div>
    <div class="stat">ACCURACY<b id="acc">100%</b></div>
    <div class="stat">BEST WPM<b id="best">0</b></div>
  </div>
  <button class="newbtn" onclick="init()">New Text</button>
</div>
<script src="ads.js"></script>
<script>
const SENTS=[
"The quick brown fox jumps over the lazy dog while the sun sets slowly behind the hills.",
"Success is not final, failure is not fatal, it is the courage to continue that truly counts.",
"Practice makes perfect, and every keystroke brings you one step closer to mastering the keyboard.",
"Video games and coding both reward patience, quick thinking, and a willingness to keep trying.",
"The best way to predict the future is to create it with hard work and determination.",
"A journey of a thousand miles begins with a single step, so start typing and do not stop.",
"Technology moves fast, but the fundamentals of focus and practice never really change at all.",
"Believe you can and you are halfway there, so keep your fingers moving across the keys.",
"Great things are done by a series of small things brought together with consistent effort.",
"Stay curious, stay hungry for knowledge, and never stop learning new skills every single day."
];
let target,started,startTime,timeLeft,timerId,best=+(localStorage.getItem('typingBest')||0),over;
document.getElementById('best').textContent=best;
function init(){
  target=SENTS[Math.floor(Math.random()*SENTS.length)];
  started=false; over=false; timeLeft=30;
  document.getElementById('timer').textContent=timeLeft+'s';
  document.getElementById('wpm').textContent=0;
  document.getElementById('acc').textContent='100%';
  document.getElementById('input').value='';
  document.getElementById('input').disabled=false;
  clearInterval(timerId);
  renderText('');
}
function renderText(typed){
  const box=document.getElementById('textbox');
  let html='';
  for(let i=0;i<target.length;i++){
    const ch=target[i];
    if(i<typed.length){
      html += '<span class="'+(typed[i]===ch?'correct':'wrong')+'">'+escapeHtml(ch)+'</span>';
    } else if(i===typed.length){
      html += '<span class="current">'+escapeHtml(ch)+'</span>';
    } else {
      html += escapeHtml(ch);
    }
  }
  box.innerHTML=html;
}
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
document.getElementById('input').addEventListener('input',e=>{
  if(over)return;
  const typed=e.target.value;
  if(!started){
    started=true; startTime=Date.now();
    timerId=setInterval(()=>{
      timeLeft--;
      document.getElementById('timer').textContent=timeLeft+'s';
      updateStats(document.getElementById('input').value);
      if(timeLeft<=0) endGame();
    },1000);
  }
  renderText(typed);
  updateStats(typed);
  if(typed===target) endGame();
});
function updateStats(typed){
  const elapsedMin=Math.max((Date.now()-startTime)/60000,1/60);
  const wordsTyped=typed.length/5;
  const wpm=Math.round(wordsTyped/elapsedMin);
  document.getElementById('wpm').textContent=isFinite(wpm)?wpm:0;
  let correct=0;
  for(let i=0;i<typed.length;i++) if(typed[i]===target[i]) correct++;
  const acc=typed.length? Math.round(correct/typed.length*100) : 100;
  document.getElementById('acc').textContent=acc+'%';
}
function endGame(){
  if(over)return;
  over=true; clearInterval(timerId);
  document.getElementById('input').disabled=true;
  const wpm=+document.getElementById('wpm').textContent;
  if(wpm>best){ best=wpm; localStorage.setItem('typingBest',best); document.getElementById('best').textContent=best; }
  onGameComplete();
}
init();
</script></body></html>
