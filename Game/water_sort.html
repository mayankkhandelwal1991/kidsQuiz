<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Water Sort Puzzle</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#1a1a3d);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:14px;max-width:440px;width:100%;display:flex;flex-direction:column;height:100%;max-height:800px;position:relative}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sc{font-size:12px;text-align:right}
.sc b{color:#00f5ff;font-size:16px;display:block}
.stage{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:14px;padding:10px}
.tube{width:52px;height:170px;border:3px solid rgba(255,255,255,.35);border-bottom-left-radius:16px;border-bottom-right-radius:16px;display:flex;flex-direction:column-reverse;padding:4px;gap:3px;cursor:pointer;transition:transform .15s;background:rgba(255,255,255,.03)}
.tube.sel{transform:translateY(-14px);border-color:#00f5ff;box-shadow:0 0 14px rgba(0,245,255,.5)}
.layer{width:100%;flex:1;border-radius:4px}
.msg{text-align:center;font-size:12px;color:#aaa;margin-top:4px}
.overlay{position:absolute;inset:0;background:rgba(15,12,41,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;border-radius:26px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.tools{display:flex;justify-content:center;gap:10px;margin-top:6px}
.tools button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer}
</style><link rel="stylesheet" href="game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <h1>Water Sort</h1>
    <div class="sc">LEVEL <b id="level">1</b></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="msg">Tap a tube to pick up, tap another to pour. Sort each color into one tube!</div>
  <div class="tools">
    <button onclick="undo()">↩ Undo</button>
    <button onclick="genLevel()">↻ Restart</button>
  </div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">🎉 Solved!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="nextLevel()">Next Level</button></div>
</div>
<script src="ads.js"></script>
<script>
const COLORS=['#ff5a8a','#00f5ff','#38f9a1','#ffe066','#c77dff','#ff9f43','#5390f6','#ff2d55'];
let level=+(localStorage.getItem('watersortLevel')||1);
document.getElementById('level').textContent=level;
let tubes,sel,history,capacity=4;
function genLevel(){
  const numColors=Math.min(4+Math.floor(level/2),8);
  const emptyTubes=2;
  capacity=4;
  let pool=[];
  for(let i=0;i<numColors;i++) for(let j=0;j<capacity;j++) pool.push(COLORS[i]);
  // shuffle
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  tubes=[];
  for(let i=0;i<numColors;i++) tubes.push(pool.splice(0,capacity));
  for(let i=0;i<emptyTubes;i++) tubes.push([]);
  sel=-1; history=[];
  document.getElementById('overlay').classList.remove('show');
  render();
}
function render(){
  const stage=document.getElementById('stage');
  stage.innerHTML='';
  tubes.forEach((t,i)=>{
    const el=document.createElement('div');
    el.className='tube'+(i===sel?' sel':'');
    for(let k=t.length-1;k>=0;k--){
      const l=document.createElement('div');
      l.className='layer'; l.style.background=t[k];
      el.appendChild(l);
    }
    for(let k=t.length;k<capacity;k++){}
    el.onclick=()=>tap(i);
    stage.appendChild(el);
  });
}
function tap(i){
  if(sel===-1){
    if(tubes[i].length===0)return;
    sel=i; render(); return;
  }
  if(sel===i){ sel=-1; render(); return; }
  pour(sel,i);
  sel=-1; render();
  checkWin();
}
function pour(from,to){
  const f=tubes[from], t=tubes[to];
  if(f.length===0)return;
  const color=f[f.length-1];
  if(t.length>=capacity)return;
  if(t.length>0 && t[t.length-1]!==color)return;
  let count=0;
  while(f.length && f[f.length-1]===color && t.length<capacity){
    t.push(f.pop()); count++;
  }
  if(count>0) history.push({from,to,count});
}
function undo(){
  const h=history.pop();
  if(!h)return;
  for(let i=0;i<h.count;i++) tubes[h.from].push(tubes[h.to].pop());
  sel=-1; render();
}
function checkWin(){
  const solved=tubes.every(t=>t.length===0 || (t.length===capacity && t.every(c=>c===t[0])));
  if(solved){
    if(window.KQFX)KQFX.win();
    document.getElementById('finalScore').textContent='Level '+level+' complete!';
    document.getElementById('overlay').classList.add('show');
    onGameComplete();
  }
}
function nextLevel(){
  level++;
  localStorage.setItem('watersortLevel',level);
  document.getElementById('level').textContent=level;
  genLevel();
}
genLevel();
</script></body></html>
