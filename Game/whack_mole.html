<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Whack-a-Mole</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ffb703,#ff7a59);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:16px;max-width:420px;width:100%;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 65%,#6d4c41 55%,#4e342e 56%);display:flex;align-items:flex-end;justify-content:center;font-size:44px;cursor:pointer;user-select:none;overflow:hidden}
.hole span{transform:translateY(110%);transition:transform .12s}
.hole.up span{transform:translateY(6%)}
.start{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:12px 36px;font-family:inherit;font-weight:800;font-size:16px;cursor:pointer;margin-top:12px}
.msg{color:#ff5a8a;font-weight:800;font-size:18px;min-height:26px;margin-top:8px}

/* mobile fit */
.wrap{display:flex;flex-direction:column;max-height:100%;overflow-y:auto}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">⏱ <span id="time">30</span>s &nbsp; ⭐ <span id="score">0</span> &nbsp; 🏆 <span id="best">0</span></div>
    <button onclick="stopAll();start()">↻</button>
  </div>
  <div class="grid" id="grid"></div>
  <button class="start" id="startBtn" onclick="start()">▶ Start</button>
  <div class="msg" id="msg"></div>
</div>
<script>
const grid=document.getElementById('grid');
let score=0,time=30,timer=null,popTimer=null,playing=false,cur=-1;
let best=+(localStorage.getItem('moleBest')||0);
document.getElementById('best').textContent=best;
for(let i=0;i<9;i++){
  const h=document.createElement('div');h.className='hole';h.innerHTML='<span>🐹</span>';
  h.onclick=()=>whack(i,h);grid.appendChild(h);
}
const holes=[...document.querySelectorAll('.hole')];
function whack(i,h){
  if(!playing||i!==cur)return;
  score++;document.getElementById('score').textContent=score;
  h.classList.remove('up');cur=-1;
}
function pop(){
  holes.forEach(h=>h.classList.remove('up'));
  cur=Math.floor(Math.random()*9);
  holes[cur].classList.add('up');
  const delay=Math.max(450,900-score*15);
  popTimer=setTimeout(pop,delay);
}
function stopAll(){clearInterval(timer);clearTimeout(popTimer);holes.forEach(h=>h.classList.remove('up'));playing=false;}
function start(){
  stopAll();score=0;time=30;playing=true;
  document.getElementById('score').textContent=0;
  document.getElementById('time').textContent=30;
  document.getElementById('msg').textContent='';
  document.getElementById('startBtn').style.display='none';
  pop();
  timer=setInterval(()=>{
    time--;document.getElementById('time').textContent=time;
    if(time<=0){
      stopAll();
      if(score>best){best=score;localStorage.setItem('moleBest',best);document.getElementById('best').textContent=best;}
      document.getElementById('msg').textContent='⏰ Time up! You whacked '+score+' moles!';
      document.getElementById('startBtn').style.display='inline-block';
      document.getElementById('startBtn').textContent='▶ Play Again';
    }
  },1000);
}
</script></body></html>
