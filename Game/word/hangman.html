<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Hangman</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#a18cd1,#fbc2eb);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:16px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#7c3aed;font-size:15px}
.stage{font-size:56px;margin:6px 0;transition:transform .25s}
.stage.hit{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-4deg)}75%{transform:translateX(6px) rotate(4deg)}}
.hintline{color:#7c3aed;font-weight:700;font-size:13px;margin-bottom:4px}
.word{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.wl{width:30px;height:40px;border-bottom:4px solid #c084fc;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#5b21b6;background:#f5f0ff;border-radius:8px 8px 0 0}
.wl.reveal{animation:fillpop .3s ease}
@keyframes fillpop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.key{aspect-ratio:1/1;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;transition:transform .1s}
.key:active{transform:scale(.88)}
.key.good{background:linear-gradient(135deg,#34d399,#06b6d4)}
.key.bad{background:linear-gradient(135deg,#94a3b8,#64748b);animation:shake .35s}
.key.used{pointer-events:none;opacity:.55}
.msg{color:#7c3aed;font-weight:800;font-size:15px;min-height:22px;margin-top:4px}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#7c3aed;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🟣 <span id="score">0</span>/<span id="totalW">10</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="hintline" id="hintline">Guess the word!</div>
  <div class="stage" id="stage">🙂</div>
  <div class="word" id="word"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="end" id="end">
  <div class="card">
    <div class="big" id="endIcon">🏆</div>
    <h2 id="endTitle">Round Complete!</h2>
    <p id="endMsg">Nice guessing!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="../ads.js"></script>
<script>
const POOL=[
['CAT','🐱'],['DOG','🐶'],['FISH','🐟'],['BIRD','🐦'],['FROG','🐸'],
['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['TIGER','🐯'],['ZEBRA','🦓'],
['HOUSE','🏠'],['TRAIN','🚂'],['PLANE','✈️'],['CLOCK','⏰'],['STAR','⭐'],['MOON','🌙'],
['FLOWER','🌸'],['MONKEY','🐵'],['RABBIT','🐰'],['ROCKET','🚀'],['GUITAR','🎸'],['CAMERA','📷'],
['BANANA','🍌'],['ORANGE','🍊'],['SCHOOL','🏫'],['PENCIL','✏️'],['BUTTER','🧈'],['CHEESE','🧀'],
['SHARK','🦈'],['WHALE','🐳'],['MOUSE','🐭'],['PANDA','🐼'],['SNAKE','🐍'],['HORSE','🐴']
];
const STAGES=['🙂','😐','😟','😨','😰','😱','💀'];
const MAX_WRONG=6, ROUND_LEN=10;
let round=[],idx=0,score=0,cur=null,revealed=[],wrong=0;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(){
  round=shuffleArr([...POOL]).slice(0,ROUND_LEN);
  idx=0;score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('totalW').textContent=round.length;
  document.getElementById('end').classList.remove('show');
  loadWord();
}

function loadWord(){
  if(idx>=round.length){finish();return;}
  cur=round[idx];wrong=0;
  revealed=cur[0].split('').map(()=>false);
  document.getElementById('hintline').textContent='Word '+(idx+1)+' of '+round.length+'  '+cur[1];
  document.getElementById('stage').textContent=STAGES[0];
  document.getElementById('stage').classList.remove('hit');
  document.getElementById('msg').textContent='';
  renderWord();renderKeyboard();
}

function renderWord(){
  const w=document.getElementById('word');w.innerHTML='';
  cur[0].split('').forEach((ch,i)=>{
    const d=document.createElement('div');d.className='wl';d.id='wl_'+i;
    d.textContent=revealed[i]?ch:'';
    w.appendChild(d);
  });
}

function renderKeyboard(){
  const kb=document.getElementById('keyboard');kb.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{
    const k=document.createElement('div');k.className='key';k.textContent=ch;
    k.onclick=()=>guess(ch,k);
    kb.appendChild(k);
  });
}

function guess(ch,el){
  el.classList.add('used');
  if(cur[0].includes(ch)){
    el.classList.add('good');
    if(window.KQFX)KQFX.play('ding');
    cur[0].split('').forEach((c,i)=>{ if(c===ch){revealed[i]=true; const wl=document.getElementById('wl_'+i); wl.textContent=c; wl.classList.add('reveal');} });
    if(revealed.every(r=>r)){
      score++;document.getElementById('score').textContent=score;
      document.getElementById('msg').textContent='🎉 You saved the day! It was '+cur[0];
      if(window.KQFX)KQFX.win();
      burstConfetti();
      idx++;
      setTimeout(loadWord,1100);
    }
  }else{
    el.classList.add('bad');
    if(window.KQFX)KQFX.play('wrong');
    wrong++;
    document.getElementById('stage').textContent=STAGES[Math.min(wrong,STAGES.length-1)];
    document.getElementById('stage').classList.remove('hit');void document.getElementById('stage').offsetWidth;document.getElementById('stage').classList.add('hit');
    if(wrong>=MAX_WRONG){
      revealed=revealed.map(()=>true);renderWord();
      document.getElementById('msg').textContent='😢 It was '+cur[0]+' — next word!';
      if(window.KQFX)KQFX.lose();
      idx++;
      setTimeout(loadWord,1300);
    }
  }
}

function finish(){
  document.getElementById('endIcon').textContent=score>=round.length*0.7?'🏆':'🎈';
  document.getElementById('endTitle').textContent='Round Complete!';
  document.getElementById('endMsg').textContent='You guessed '+score+' out of '+round.length+' words!';
  document.getElementById('end').classList.add('show');
  onGameComplete();
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
