<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Scramble</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#ff7ac6,#ffd166);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:420px;width:100%;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
.hintbox{font-size:60px;margin:8px 0}
.answer{min-height:56px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0;padding:8px;background:linear-gradient(135deg,#fff8cc,#fff0f6);border:3px dashed #ffb703;border-radius:16px}
.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.lt{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#ff4fa3);color:#fff;font-size:24px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.lt.used{opacity:.25;pointer-events:none}
.answer .lt{background:linear-gradient(135deg,#34d399,#06b6d4)}
.msg{color:#ff5a8a;font-weight:800;font-size:17px;min-height:24px;margin-top:6px}
.row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.row button{border:none;border-radius:14px;padding:10px 20px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;color:#fff}
.row .cl{background:#95a5a6}.row .sk{background:linear-gradient(135deg,#ffb703,#ff7a59)}

/* mobile fit */
.wrap{display:flex;flex-direction:column;max-height:100%;overflow-y:auto}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <div class="sc">⭐ <span id="score">0</span> / <span id="total">0</span></div>
    <button onclick="next()">↻</button>
  </div>
  <div class="hintbox" id="hint"></div>
  <div class="answer" id="answer"></div>
  <div class="letters" id="letters"></div>
  <div class="row">
    <button class="cl" onclick="clearWord()">Clear</button>
    <button class="sk" onclick="skip()">Skip →</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script src="../ads.js"></script>
<script>
const WORDS=[
['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['FISH','🐟'],['BIRD','🐦'],['FROG','🐸'],
['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['TIGER','🐯'],['ZEBRA','🦓'],
['HOUSE','🏠'],['TRAIN','🚂'],['PLANE','✈️'],['CLOCK','⏰'],['STAR','⭐'],['MOON','🌙'],
['FLOWER','🌸'],['MONKEY','🐵'],['RABBIT','🐰'],['ROCKET','🚀'],['GUITAR','🎸'],['CAMERA','📷'],
['BANANA','🍌'],['ORANGE','🍊'],['SCHOOL','🏫'],['PENCIL','✏️'],['BUTTER','🧈'],['CHEESE','🧀']
];
let cur,picked,score=0,total=0,order=[];
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function next(){
  if(!order.length)order=shuffleArr([...WORDS.keys()]);
  cur=WORDS[order.pop()];
  picked=[];
  document.getElementById('hint').textContent=cur[1];
  document.getElementById('msg').textContent='';
  let letters=cur[0].split('');
  do{shuffleArr(letters);}while(letters.join('')===cur[0]);
  const lbox=document.getElementById('letters');lbox.innerHTML='';
  letters.forEach((ch,i)=>{
    const d=document.createElement('div');d.className='lt';d.textContent=ch;
    d.onclick=()=>pickLetter(d,ch);
    lbox.appendChild(d);
  });
  renderAnswer();
}
function pickLetter(el,ch){
  el.classList.add('used');
  picked.push({el,ch});
  renderAnswer();
  if(picked.length===cur[0].length)checkWord();
}
function renderAnswer(){
  const a=document.getElementById('answer');a.innerHTML='';
  picked.forEach((p,i)=>{
    const d=document.createElement('div');d.className='lt';d.textContent=p.ch;
    d.onclick=()=>{p.el.classList.remove('used');picked.splice(i,1);renderAnswer();};
    a.appendChild(d);
  });
}
function clearWord(){
  picked.forEach(p=>p.el.classList.remove('used'));
  picked=[];renderAnswer();
}
function checkWord(){
  total++;document.getElementById('total').textContent=total;
  const guess=picked.map(p=>p.ch).join('');
  if(guess===cur[0]){
    score++;document.getElementById('score').textContent=score;if(window.KQFX)KQFX.play('ding');if(score%10===0)onGameComplete();
    document.getElementById('msg').textContent='🎉 Correct! '+cur[0];
    setTimeout(next,900);
  }else{
    document.getElementById('msg').textContent='❌ Not quite — try again!';
    if(window.KQFX)KQFX.play('wrong');
    setTimeout(clearWord,700);
    total--;document.getElementById('total').textContent=total;
  }
}
function skip(){
  document.getElementById('msg').textContent='It was: '+cur[0];
  setTimeout(next,900);
}
next();
</script></body></html>
