<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Ladder</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:18px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#5b21b6;font-size:15px}
.progwrap{background:#ede9fe;border-radius:20px;height:10px;overflow:hidden;margin-bottom:10px}
.progbar{height:100%;background:linear-gradient(135deg,#7c3aed,#a855f7);width:0%;transition:width .4s ease}
.ladder{display:flex;flex-direction:column;align-items:center;gap:6px;margin:10px 0}
.rung{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#f5f3ff,#fff);border:2px solid #ddd6fe;border-radius:12px;padding:8px 14px;font-weight:800;font-size:18px;color:#5b21b6;animation:pop .35s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.rung .em{font-size:22px}
.arrow{font-size:16px;color:#a78bfa}
.options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.opt{padding:12px 4px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:transform .1s}
.opt:active{transform:scale(.92)}
.opt.correct{background:linear-gradient(135deg,#34d399,#06b6d4);animation:popbig .4s ease}
.opt.wrong{background:linear-gradient(135deg,#f87171,#fb923c);animation:shake .35s}
@keyframes popbig{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.msg{color:#5b21b6;font-weight:800;font-size:14px;min-height:22px}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#5b21b6;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🪜 <span id="score">0</span>/<span id="totalW">10</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="progwrap"><div class="progbar" id="prog"></div></div>
  <div class="msg" id="topmsg">Change one letter to climb the ladder!</div>
  <div class="ladder" id="ladder"></div>
  <div class="options" id="options"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="end" id="end">
  <div class="card">
    <div class="big">🏆</div>
    <h2>Round Complete!</h2>
    <p id="endMsg">Great climbing!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="ads.js"></script>
<script>
const STEPS=[
 {start:['CAT','🐱'],target:['BAT','🦇'],decoys:['COT','CAB']},
 {start:['DOG','🐶'],target:['LOG','🪵'],decoys:['DOT','DIG']},
 {start:['HAT','🎩'],target:['HEN','🐔'],decoys:['HIT','HOT']},
 {start:['PIG','🐷'],target:['PIN','📌'],decoys:['BIG','PIT']},
 {start:['SUN','☀️'],target:['FUN','🎉'],decoys:['RUN','SUM']},
 {start:['BUS','🚌'],target:['BUN','🥐'],decoys:['BUG','BUT']},
 {start:['STAR','⭐'],target:['SCAR','🩹'],decoys:['STAY','SOAR']},
 {start:['MOON','🌙'],target:['NOON','🕛'],decoys:['MOOD','MOAN']},
 {start:['FISH','🐟'],target:['WISH','🌠'],decoys:['FISY','DISH']},
 {start:['RING','💍'],target:['KING','👑'],decoys:['RANG','WING']},
 {start:['CAKE','🎂'],target:['LAKE','🏞️'],decoys:['CASE','RAKE']},
 {start:['STAR','⭐'],target:['SPAR','🥊'],decoys:['STIR','SCAR']}
];
const ROUND_LEN=10;
let round=[],idx=0,score=0,cur=null;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(){
  round=shuffleArr([...STEPS]).slice(0,ROUND_LEN);
  idx=0;score=0;
  document.getElementById('score').textContent=0;
  document.getElementById('totalW').textContent=round.length;
  document.getElementById('end').classList.remove('show');
  loadRound();
}

function loadRound(){
  if(idx>=round.length){finish();return;}
  cur=round[idx];
  document.getElementById('prog').style.width=Math.round(idx/round.length*100)+'%';
  document.getElementById('topmsg').textContent='Round '+(idx+1)+' of '+round.length;
  document.getElementById('msg').textContent='';
  const ladder=document.getElementById('ladder');ladder.innerHTML='';
  const rung=document.createElement('div');rung.className='rung';
  rung.innerHTML='<span class="em">'+cur.start[1]+'</span>'+cur.start[0];
  ladder.appendChild(rung);
  const arrow=document.createElement('div');arrow.className='arrow';arrow.textContent='⬇ change one letter';
  ladder.appendChild(arrow);
  const opts=shuffleArr([cur.target[0],...cur.decoys]);
  const box=document.getElementById('options');box.innerHTML='';
  opts.forEach(w=>{
    const d=document.createElement('div');d.className='opt';d.textContent=w;
    d.onclick=()=>pick(w,d);
    box.appendChild(d);
  });
}

function pick(w,el){
  document.querySelectorAll('.opt').forEach(o=>o.style.pointerEvents='none');
  if(w===cur.target[0]){
    el.classList.add('correct');
    const ladder=document.getElementById('ladder');
    const rung=document.createElement('div');rung.className='rung';
    rung.innerHTML='<span class="em">'+cur.target[1]+'</span>'+cur.target[0];
    ladder.appendChild(rung);
    score++;document.getElementById('score').textContent=score;
    document.getElementById('msg').textContent='🎉 You climbed to '+cur.target[0]+'!';
    burstConfetti();
  }else{
    el.classList.add('wrong');
    document.getElementById('msg').textContent='❌ The next rung was '+cur.target[0]+'!';
  }
  idx++;
  setTimeout(loadRound,1100);
}

function finish(){
  document.getElementById('prog').style.width='100%';
  document.getElementById('endMsg').textContent='You climbed '+score+' out of '+round.length+' rungs!';
  document.getElementById('end').classList.add('show');
  onGameComplete();
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<20;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
