<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Word Match</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#fa709a,#fee140);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:14px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;max-height:100%;overflow-y:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#db2777;font-size:15px}
.grid{
    display:grid;
    width:100%;
    gap:8px;
    margin-bottom:8px;
}

.card{
    width:100%;
    aspect-ratio:1;
}
.card-in{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .4s}
.card.flip .card-in{transform:rotateY(180deg)}
.card.matched .card-in{transform:rotateY(180deg) scale(.94);animation:matchpop .5s ease}
@keyframes matchpop{0%{filter:brightness(1)}50%{filter:brightness(1.4)}100%{filter:brightness(1)}}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800}
.front{background:linear-gradient(135deg,#8b5cf6,#ec4899);color:#fff;font-size:22px}
.back{background:linear-gradient(135deg,#fff8e6,#fff);transform:rotateY(180deg);font-size:13px;color:#db2777;border:2px solid #ffd166;padding:2px;text-align:center}
.back.emoji{font-size:26px}
.card.matched .back{background:linear-gradient(135deg,#34d399,#06b6d4);color:#fff;border-color:transparent}
.msg{color:#db2777;font-weight:800;font-size:15px;min-height:22px}
.end{display:none;position:fixed;inset:0;background:rgba(15,20,40,.55);align-items:center;justify-content:center;z-index:20}
.end.show{display:flex}
.end .card2{background:#fff;border-radius:24px;padding:26px 22px;text-align:center;max-width:300px;animation:winpop .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes winpop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.end .big{font-size:50px}
.end h2{color:#db2777;margin:8px 0}
.end button{margin-top:10px;background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.confetti{position:fixed;top:-10px;width:8px;height:14px;border-radius:2px;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
.levels{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:12px;
    flex-wrap:wrap;
}

.levels button{
    padding:8px 14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#22c55e,#06b6d4);
    color:#fff;
    font-weight:700;
    cursor:pointer;
}
.levels button.active{
    background:linear-gradient(135deg,#22c55e,#16a34a);
    color:#fff;
    transform:scale(1.08);
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='index.html'">← Games</button>
    <div class="sc">🃏 <span id="pairs">0</span>/<span id="totalP">6</span></div>
    <button onclick="restart()">↻</button>
  </div>
  <div class="levels">
    <button onclick="restart(4,this)">Easy</button>
    <button class="active" onclick="restart(6,this)">Medium</button>
    <button onclick="restart(8,this)">Hard</button>
    <button onclick="restart(10,this)">Expert</button>
</div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">Flip cards to match each word with its picture!</div>
</div>
<div class="end" id="end">
  <div class="card2">
    <div class="big">🏆</div>
    <h2>All Matched!</h2>
    <p id="endMsg">Great memory!</p>
    <button onclick="restart()">Play Again</button>
  </div>
</div>
<script src="ads.js"></script>
<script>
const POOL=[
['CAT','🐱'],['DOG','🐶'],['SUN','☀️'],['FISH','🐟'],['BIRD','🐦'],['FROG','🐸'],
['APPLE','🍎'],['MANGO','🥭'],['GRAPE','🍇'],['LEMON','🍋'],['TIGER','🐯'],['ZEBRA','🦓'],
['STAR','⭐'],['MOON','🌙'],['FLOWER','🌸'],['MONKEY','🐵'],['RABBIT','🐰'],['ROCKET','🚀'],
['BANANA','🍌'],['ORANGE','🍊'],['SHARK','🦈'],['WHALE','🐳'],['PANDA','🐼'],['SNAKE','🐍']
];
let PAIRS=6;
let deck=[],flipped=[],matched=0,lock=false;

function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function restart(pairCount = 6, btn = null){

  PAIRS = pairCount;

// Highlight selected button
    if(btn){
        document.querySelectorAll(".levels button").forEach(b =>
            b.classList.remove("active")
        );
        btn.classList.add("active");
    }


  const chosen = shuffleArr([...POOL]).slice(0, PAIRS);

  deck=[];
  chosen.forEach((w,i)=>{
    deck.push({id:i,type:'word',val:w[0]});
    deck.push({id:i,type:'emoji',val:w[1]});
  });
  shuffleArr(deck);
  matched=0;flipped=[];lock=false;
  document.getElementById('pairs').textContent=0;
  document.getElementById('totalP').textContent=PAIRS;
  document.getElementById('end').classList.remove('show');
  document.getElementById('msg').textContent='Flip cards to match each word with its picture!';
  renderGrid();
  
}

function renderGrid(){
	const g = document.getElementById("grid");

	let cols = 4;
	let rows = 4;

	switch(PAIRS){
	    case 4:
		cols = 4;
		rows = 2;
		break;

	    case 6:
		cols = 4;
		rows = 3;
		break;

	    case 8:
		cols = 4;
		rows = 4;
		break;

	    case 10:
		cols = 5;
		rows = 4;
		break;

	    case 12:
		cols = 6;
		rows = 4;
		break;
	}

	g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
	g.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  
  g.innerHTML='';
  deck.forEach((c,i)=>{
    const card=document.createElement('div');card.className='card';card.id='card_'+i;
    card.innerHTML='<div class="card-in"><div class="face front">?</div>'+
      '<div class="face back'+(c.type==='emoji'?' emoji':'')+'">'+c.val+'</div></div>';
    card.onclick=()=>flip(i,card);
    g.appendChild(card);
  });
}

function flip(i,card){
  if(lock||card.classList.contains('flip')||card.classList.contains('matched'))return;
  card.classList.add('flip');
  if(window.KQFX){KQFX.play('flip');KQFX.flipEl(card);}
  flipped.push({i,card});
  if(flipped.length===2){
    lock=true;
    const [a,b]=flipped;
    if(deck[a.i].id===deck[b.i].id && deck[a.i].type!==deck[b.i].type){
      setTimeout(()=>{
        a.card.classList.add('matched');b.card.classList.add('matched');
        matched++;document.getElementById('pairs').textContent=matched;
        document.getElementById('msg').textContent='🎉 Match found!';
        if(window.KQFX)KQFX.play('ding');
        burstConfetti();
        flipped=[];lock=false;
        if(matched===PAIRS){
          setTimeout(()=>{
            document.getElementById('endMsg').textContent='You matched all '+PAIRS+' pairs!';
            document.getElementById('end').classList.add('show');
            if(window.KQFX)KQFX.win();
            onGameComplete();
          },500);
        }
      },350);
    }else{
      document.getElementById('msg').textContent='Try again!';
      if(window.KQFX)KQFX.play('wrong');
      setTimeout(()=>{
        a.card.classList.remove('flip');b.card.classList.remove('flip');
        flipped=[];lock=false;
      },700);
    }
  }
}

function burstConfetti(){
  const colors=['#ff5a8a','#ffd166','#34d399','#60a5fa','#c084fc'];
  for(let i=0;i<18;i++){
    const d=document.createElement('div');
    d.className='confetti';
    d.style.left=(Math.random()*100)+'vw';
    d.style.background=colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration=(1+Math.random()*0.8)+'s';
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),2000);
  }
}

restart();
</script></body></html>
