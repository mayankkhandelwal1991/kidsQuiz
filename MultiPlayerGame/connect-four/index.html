<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Connect Four Arena</title>
<meta name="description" content="Real-time multiplayer Connect Four — drop discs and connect four before your opponent does." />
<link rel="stylesheet" href="../common/theme.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="landing-screen">
    <div class="landing-bg"></div>
    <div class="landing-card">
      <div class="logo-row">
        <span class="logo-icon">🔴🟡</span>
        <h1 class="game-title">CONNECT FOUR ARENA</h1>
      </div>
      <p class="game-subtitle">Real-time 1v1 &middot; drop, connect, win</p>

      <div class="field">
        <label for="nickname-input">Nickname</label>
        <input id="nickname-input" type="text" maxlength="14" placeholder="Enter your nickname" autocomplete="off" />
      </div>

      <div class="button-row">
        <button id="play-btn" class="btn btn-primary">Play</button>
      </div>

      <div id="landing-error" class="landing-error"></div>
      <div class="landing-footnote">We'll pair you with anyone waiting. No one around? You'll play the Computer after 30 seconds.</div>

      <button id="advanced-toggle" class="advanced-toggle">Have a friend's room code?</button>
      <div id="advanced-panel" class="advanced-panel hidden">
        <div class="field">
          <label for="roomcode-input">Room code</label>
          <input id="roomcode-input" type="text" maxlength="6" placeholder="E.G. K3F9Q2" autocomplete="off" />
        </div>
        <button id="join-room-btn" class="btn btn-secondary" style="width:100%">Join that room</button>
      </div>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <div class="arena-bg"></div>

    <div class="topbar">
      <div class="room-pill"><span class="label">Room</span><span id="hud-room-code">------</span></div>
      <div class="chrome-buttons">
        <button id="share-room-btn" class="icon-btn" title="Share room link">🔗</button>
        <button id="sound-toggle-btn" class="icon-btn" title="Toggle sound">🔊</button>
        <button id="leave-room-btn" class="icon-btn" title="Leave room">✕</button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="players-row">
        <div id="card-r" class="player-card seat-r">
          <span class="player-symbol">🔴</span>
          <span id="name-r" class="player-name">--</span>
          <span id="score-r" class="player-score">0</span>
        </div>
        <div class="vs-label">VS</div>
        <div id="card-y" class="player-card seat-y">
          <span class="player-symbol">🟡</span>
          <span id="name-y" class="player-name">--</span>
          <span id="score-y" class="player-score">0</span>
        </div>
      </div>

      <div id="status-bar" class="status-bar">Waiting for an opponent to join…</div>
      <div id="waiting-bar" class="waiting-bar hidden"></div>

      <div id="board" class="c4-board"></div>

      <div id="spectator-count" class="spectator-count"></div>
      <button id="play-again-btn" class="btn btn-primary hidden">Play Again</button>
    </div>

    <div id="toast-container"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../common/firebase-config.js"></script>
  <script>window.KQ_CONTEXT = { category: 'multi', gameId: 'connect-four', title: 'Connect Four' };</script>
  <script src="../../Game/kq-leaderboard.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
