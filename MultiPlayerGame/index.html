<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Game Zone - Kids Quiz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#6ee7ff,#8b5cf6,#ff7ac6,#ffd166);background-size:400% 400%;animation:bg 12s ease infinite;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none}
@keyframes bg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.container{background:linear-gradient(180deg,#fff,#fef6ff);border:6px solid #fff;border-radius:32px;box-shadow:0 15px 40px rgba(0,0,0,.18);max-width:820px;width:100%;padding:18px;display:flex;flex-direction:column;max-height:100%}
h1{color:#ff5a8a;text-align:center;font-size:26px;font-weight:800}
.subtitle{color:#6b7280;text-align:center;font-size:13px;margin-bottom:14px}
.topbar{display:flex;justify-content:flex-start;margin-bottom:8px}
.back-btn{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:14px;padding:8px 16px;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:1;min-height:0;overflow-y:auto;padding:4px}
.card{padding:12px 6px;border-radius:20px;border:3px solid rgba(255,255,255,.8);cursor:pointer;text-align:center;transition:.15s;background:#fff;position:relative}
.card:nth-child(4n+1){background:linear-gradient(135deg,#ffe082,#fff8e1)}
.card:nth-child(4n+2){background:linear-gradient(135deg,#80deea,#e0f7fa)}
.card:nth-child(4n+3){background:linear-gradient(135deg,#c5e1a5,#f1f8e9)}
.card:nth-child(4n+4){background:linear-gradient(135deg,#f8bbd0,#fce4ec)}
.card:hover,.card.sel{transform:translateY(-4px) scale(1.04);border-color:#8b5cf6}
.card .ic{font-size:34px}
.card .nm{font-size:12px;font-weight:700;color:#374151;line-height:1.2;margin-top:4px}
.card .new-badge{position:absolute;top:4px;right:6px;background:#ff5a8a;color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:8px;letter-spacing:.5px}
.detail{display:none;margin-top:14px;background:linear-gradient(135deg,#fff8cc,#fff0f6);border:4px dashed #ffb703;border-radius:24px;padding:16px;text-align:center}
.detail.show{display:block}
.detail .big{font-size:48px}
.detail h2{color:#ff5a8a;font-size:20px}
.detail p{color:#555;font-size:13px;margin:6px 0 12px;line-height:1.5}
.start-btn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:18px;padding:13px 42px;font-family:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 8px 18px rgba(255,79,163,.35);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}.card .ic{font-size:28px}.card .nm{font-size:10px}}
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><button class="back-btn" onclick="goBack()">← Quiz Home</button></div>
  <h1>🎮 Game Zone</h1>
  <p class="subtitle">Pick a game, then press Start to play!</p>
  <div class="grid" id="grid"></div>
  <div class="detail" id="detail">
    <div class="big" id="dIcon"></div>
    <h2 id="dName"></h2>
    <p id="dHow"></p>
    <button class="start-btn" onclick="startGame()">▶ Start</button>
    <button class="start-btn" style="background:linear-gradient(135deg,#f59e0b,#f43f5e);box-shadow:0 8px 18px rgba(244,63,94,.35);margin-left:8px" onclick="openBoard()">🏆 Leaderboard</button>
  </div>
</div>
<script>
const GAMES=[
 {f:'tic-tack-toe/index.html',id:'tic-tac-toe',ic:'❌⭕',nm:'Tic Tac Toe',how:'Enter your name and tap Play. You\'ll be matched with whoever\'s waiting, or the Computer after 10 seconds. First to get 3 in a row wins!'},
 {f:'connect-four/index.html',id:'connect-four',ic:'🔴',nm:'Connect Four',how:'Enter your name and tap Play to get matched instantly. Drop discs into columns — first to connect 4 in a row (any direction) wins!'},
 {f:'rock-paper-scissors/index.html',id:'rps',ic:'✊',nm:'RPS Duel',how:'Enter your name and tap Play. Pick rock, paper, or scissors each round — first to win 3 rounds takes the duel!'},
 {f:'word-duel/index.html',id:'word-duel',ic:'🔤',nm:'Word Duel',how:'Enter your name and tap Play. A scrambled word appears — type the answer before your opponent does. First to 4 points wins!'},
 {f:'typing-race/index.html',id:'typing-race',ic:'⌨️',nm:'Typing Race',how:'Enter your name and tap Play. Both racers type the same passage — fastest, most accurate typer to the finish wins!'},
 {f:'memory-match/index.html',id:'memory-match',ic:'🧠',nm:'Memory Match',how:'Enter your name and tap Play. Take turns flipping two cards — match a pair and go again. Most pairs when the board clears wins!'},
 {f:'reaction-duel/index.html',id:'reaction-duel',ic:'⚡',nm:'Reaction Duel',how:'Enter your name and tap Play. Wait for the panel to flash green, then tap as fast as you can — first to win 3 rounds wins!'},
 {f:'trivia-battle/index.html',id:'trivia-battle',ic:'❓',nm:'Trivia Battle',how:'Enter your name and tap Play. Answer multiple-choice questions — fastest correct answer scores. First to 5 points wins!'},
 {f:'dots-and-boxes/index.html',id:'dots-and-boxes',ic:'🔲',nm:'Dots & Boxes',how:'Enter your name and tap Play. Take turns drawing lines between dots — complete a box to score and go again. Most boxes wins!'},
 {f:'battleship/index.html',id:'battleship',ic:'🚢',nm:'Battleship',how:'Enter your name and tap Play. Your fleet is placed automatically — take turns firing at the enemy grid. Sink all their ships to win!'},
 {f:'pong-duel/index.html',id:'pong-duel',ic:'🏓',nm:'Pong Duel',how:'Enter your name and tap Play. Move your paddle (drag, touch, or arrow keys) to keep the ball in play — first to 7 points wins!'},
 {f:'space-blaster/index.html',id:'space-blaster',ic:'🚀',nm:'Space Blaster Duel',how:'Enter your name and tap Play. Asteroids fall down the same field for both of you — tap the fastest to blast them first. First to 15 wins!',isNew:true},
 {f:'blaster-arena/index.html',id:'blaster-arena',ic:'🔫',nm:'Blaster Arena',how:'Enter your name and tap Play. Move with WASD/arrows or the on-screen pad, then tap the arena to fire foam bolts. First to 5 hits wins!',isNew:true},
 {f:'basketball-shootout/index.html',id:'basketball-shootout',ic:'🏀',nm:'Basketball Shootout',how:'Enter your name and tap Play. Tap when the marker hits the glowing zone to sink a basket. Most baskets in 45 seconds wins!',isNew:true},
 {f:'bubble-shooter/index.html',id:'bubble-shooter',ic:'🫧',nm:'Bubble Shooter Duel',how:'Enter your name and tap Play. Tap to aim and pop 3+ matching bubbles on your own board. First to 120 points wins!',isNew:true},
 {f:'archery-duel/index.html',id:'archery-duel',ic:'🏹',nm:'Archery Duel',how:'Enter your name and tap Play. A crosshair drifts across the target — tap the instant it\'s on the bullseye. Best of 5 rounds wins!',isNew:true},
 {f:'snake-duel/index.html',id:'snake-duel',ic:'🐍',nm:'Snake Duel',how:'Enter your name and tap Play. Steer your snake with arrows, swipes, or the on-screen pad — crash into a wall, yourself, or your rival and they score. First to 5 round wins takes the duel!',isNew:true},
 {f:'wordle-duel/index.html',id:'wordle-duel',ic:'🟩',nm:'Wordle Duel',how:'Enter your name and tap Play. You and your rival guess the same secret 5-letter word — green means right spot, yellow means wrong spot. First to solve 2 words wins!',isNew:true},
 {f:'whack-a-mole/index.html',id:'whack-a-mole',ic:'🔨',nm:'Whack-a-Mole',how:'Enter your name and tap Play. The same mole pops up for both of you — tap it first to score. Most whacks when the 30-second clock runs out wins!',isNew:true},
 {f:'doodle-guess/index.html',id:'doodle-guess',ic:'✏️',nm:'Doodle Guess',how:'Enter your name and tap Play. Take turns drawing a secret word while the other player races to guess it. Roles swap each round — most correct guesses after 6 rounds wins!',isNew:true},
 {f:'math-blitz/index.html',id:'math-blitz',ic:'➕',nm:'Math Blitz',how:'Enter your name, pick a difficulty, and tap Play. Same math question for both of you — fastest correct answer scores. First to 7 points wins!',isNew:true},
 {f:'ludo-royale/index.html',id:'ludo-royale',ic:'🎲',nm:'Ludo Royale',how:'Enter your name and tap Play to join a room of 2-4 players. Once at least 2 have joined, anyone can tap Start. Roll the dice, race all 4 tokens home, and capture opponents along the way!',isNew:true,multi:true},
];
let sel=-1;
const grid=document.getElementById('grid');
GAMES.forEach((g,i)=>{
  const d=document.createElement('div');
  d.className='card';
  d.innerHTML=(g.isNew?'<span class="new-badge">NEW</span>':'')+'<div class="ic">'+g.ic+'</div><div class="nm">'+g.nm+'</div>';
  d.onclick=()=>select(i,d);
  grid.appendChild(d);
});
function select(i,card){
  sel=i;
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
  card.classList.add('sel');
  const g=GAMES[i];
  document.getElementById('dIcon').textContent=g.ic;
  document.getElementById('dName').textContent=g.nm;
  document.getElementById('dHow').textContent=g.how;
  document.getElementById('detail').classList.add('show');
  document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function startGame(){ if(sel>=0) window.location.href=GAMES[sel].f; }
function goBack(){ window.location.href='../quiz2.html'; }
function openBoard(){ if(sel>=0 && window.KQ&&KQ.open) { const g=GAMES[sel]; KQ.open('multi',g.id,g.nm); } }
</script>
<script src="../Game/kq-leaderboard.js"></script>
</body>
</html>
