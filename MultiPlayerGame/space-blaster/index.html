<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Space Blaster Duel</title>
<meta name="description" content="Real-time multiplayer space shooter — blast falling asteroids before your opponent does, first to 15 wins." />
<link rel="stylesheet" href="../common/theme.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div id="landing-screen">
    <div class="landing-bg"></div>
    <div class="landing-card">
      <div class="logo-row">
        <span class="logo-icon">🚀</span>
        <h1 class="game-title">SPACE BLASTER DUEL</h1>
      </div>
      <p class="game-subtitle">Real-time 1v1 &middot; blast asteroids, first to 15 wins</p>

      <div class="field">
        <label for="nickname-input">Nickname</label>
        <input id="nickname-input" type="text" maxlength="14" placeholder="Enter your nickname" autocomplete="off" />
      </div>

      <div class="button-row">
        <button id="play-btn" class="btn btn-primary">Play</button>
      </div>

      <div id="landing-error" class="landing-error"></div>
      <div class="landing-footnote">We'll pair you with anyone waiting. No one around? You'll play the Computer after 10 seconds.</div>

      <button id="advanced-toggle" class="advanced-toggle">Have a friend's room code?</button>
      <div id="advanced-panel" class="advanced-panel hidden">
        <div class="field">
          <label for="roomcode-input">Room code</label>
          <input id="roomcode-input" type="text" maxlength="6" placeholder="E.G. K3F9Q2" autocomplete="off" />
        </div>
        <button id="join-room-btn" class="btn btn-secondary" style="width:100%">Join that room</button>
      </div>
    </div>
  </div>

  <div id="game-screen" class="hidden">
    <div class="arena-bg"></div>

    <div class="topbar">
      <div class="room-pill"><span class="label">Room</span><span id="hud-room-code">------</span></div>
      <div class="chrome-buttons">
        <button id="share-room-btn" class="icon-btn" title="Share room link">🔗</button>
        <button id="sound-toggle-btn" class="icon-btn" title="Toggle sound">🔊</button>
        <button id="leave-room-btn" class="icon-btn" title="Leave room">✕</button>
      </div>
    </div>

    <div class="board-wrap">
      <div class="players-row">
        <div id="card-p1" class="player-card seat-p1">
          <span id="name-p1" class="player-name">--</span>
          <span id="score-p1" class="player-score">0</span>
        </div>
        <div class="vs-label">FIRST TO 15</div>
        <div id="card-p2" class="player-card seat-p2">
          <span id="name-p2" class="player-name">--</span>
          <span id="score-p2" class="player-score">0</span>
        </div>
      </div>

      <div id="status-bar" class="status-bar">Waiting for an opponent to join…</div>
      <div id="waiting-bar" class="waiting-bar hidden"></div>

      <canvas id="game-canvas" width="480" height="320"></canvas>
      <div class="hint-line">Tap or click an asteroid to blast it — fastest shot scores!</div>

      <div id="spectator-count" class="spectator-count"></div>
      <button id="play-again-btn" class="btn btn-primary hidden">Play Again</button>
    </div>

    <div id="toast-container"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../common/firebase-config.js"></script>
  <script>window.KQ_CONTEXT = { category: 'multi', gameId: 'space-blaster', title: 'Space Blaster Duel' };</script>
  <script src="../../Game/kq-leaderboard.js"></script>
  <script src="../common/ads.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
