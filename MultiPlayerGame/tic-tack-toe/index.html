<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Tic-Tac-Toe Arena</title>
<meta name="description" content="Real-time multiplayer tic-tac-toe — challenge a friend from any device." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================================================================
       LANDING SCREEN
       =================================================================== -->
  <div id="landing-screen">
    <div class="landing-bg"></div>

    <div class="landing-card">
      <div class="logo-row">
        <span class="logo-icon">❌⭕</span>
        <h1 class="game-title">TIC-TAC-TOE ARENA</h1>
      </div>
      <p class="game-subtitle">Real-time 1v1 &middot; anyone, anywhere</p>

      <div class="field">
        <label for="nickname-input">Nickname</label>
        <input id="nickname-input" type="text" maxlength="14" placeholder="Enter your nickname" autocomplete="off" />
      </div>

      <div class="button-row">
        <button id="play-btn" class="btn btn-primary">Play</button>
      </div>

      <div id="landing-error" class="landing-error"></div>

      <div class="landing-footnote">
        We'll pair you with anyone waiting. No one around? You'll play the
        Computer after 30 seconds.
      </div>

      <button id="advanced-toggle" class="advanced-toggle">Have a friend's room code?</button>
      <div id="advanced-panel" class="advanced-panel hidden">
        <div class="field">
          <label for="roomcode-input">Room code</label>
          <input id="roomcode-input" type="text" maxlength="6" placeholder="E.G. K3F9Q2" autocomplete="off" />
        </div>
        <button id="join-room-btn" class="btn btn-secondary" style="width:100%">Join that room</button>
      </div>
    </div>
  </div>

  <!-- ===================================================================
       GAME SCREEN
       =================================================================== -->
  <div id="game-screen" class="hidden">
    <div class="arena-bg"></div>

    <!-- Top bar -->
    <div class="topbar">
      <div class="room-pill">
        <span class="label">Room</span>
        <span id="hud-room-code">------</span>
      </div>
      <div class="chrome-buttons">
        <button id="share-room-btn" class="icon-btn" title="Share room link">🔗</button>
        <button id="sound-toggle-btn" class="icon-btn" title="Toggle sound">🔊</button>
        <button id="leave-room-btn" class="icon-btn" title="Leave room">✕</button>
      </div>
    </div>

    <div class="board-wrap">
      <!-- Player cards + live scoreboard -->
      <div class="players-row">
        <div id="card-x" class="player-card symbol-x">
          <span class="player-symbol">X</span>
          <span id="name-x" class="player-name">--</span>
          <span id="score-x" class="player-score">0</span>
        </div>
        <div class="vs-label">VS</div>
        <div id="card-o" class="player-card symbol-o">
          <span class="player-symbol">O</span>
          <span id="name-o" class="player-name">--</span>
          <span id="score-o" class="player-score">0</span>
        </div>
      </div>

      <div id="status-bar" class="status-bar">Waiting for an opponent to join…</div>
      <div id="waiting-bar" class="waiting-bar hidden"></div>

      <!-- 3x3 board -->
      <div class="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
      </div>

      <div id="spectator-count" class="spectator-count"></div>

      <button id="play-again-btn" class="btn btn-primary hidden">Play Again</button>
    </div>

    <!-- Toast notifications -->
    <div id="toast-container"></div>
  </div>

  <!-- ===================================================================
       SCRIPTS
       =================================================================== -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../common/firebase-config.js"></script>
  <script>window.KQ_CONTEXT = { category: 'multi', gameId: 'tic-tac-toe', title: 'Tic Tac Toe' };</script>
  <script src="../../Game/kq-leaderboard.js"></script>
  <script type="module">
    import { Game } from './js/game.js';
    const game = new Game();
    game.init();
  </script>
</body>
</html>
