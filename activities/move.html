<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../images/favicon/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Move Like an Animal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<!-- A movement break: 6 animal moves, each read aloud with a short countdown. -->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: 'Baloo 2', system-ui, sans-serif; color: #1e1b4b; background: linear-gradient(180deg, #bbf7d0, #fef9c3 60%, #fed7aa); min-height: 100dvh; }
  button { font-family: inherit; cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; padding: max(10px, env(safe-area-inset-top)) 14px 24px; text-align: center; }
  .bar { display: flex; align-items: center; gap: 10px; }
  .bar h1 { flex: 1; margin: 0; font-size: 22px; text-align: left; }
  .rb { width: 48px; height: 48px; border: none; border-radius: 16px; background: #fff; font-size: 22px; box-shadow: 0 4px 0 rgba(0,0,0,.1); }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 12px 0; }
  .dots i { width: 26px; height: 8px; border-radius: 4px; background: rgba(0,0,0,.1); } .dots i.on { background: #16a34a; } .dots i.done { background: #86efac; }
  .card { background: #fff; border-radius: 30px; padding: 18px 14px; box-shadow: 0 8px 0 rgba(22,163,74,.2), 0 14px 30px rgba(0,0,0,.08); }
  .ani { width: min(56vw, 240px); height: min(56vw, 240px); margin: 0 auto; display: block; }
  .ani.hop { animation: hop .8s ease-in-out infinite; } .ani.sway { animation: sway 1.4s ease-in-out infinite; }
  .ani.stomp { animation: stomp .9s ease-in-out infinite; } .ani.stretch { animation: stretch 2s ease-in-out infinite; }
  .ani.spin { animation: spin 2.4s linear infinite; } .ani.fly { animation: fly 1.6s ease-in-out infinite; }
  @keyframes hop { 50% { transform: translateY(-22%); } } @keyframes sway { 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @keyframes stomp { 50% { transform: translateY(6%) scaleY(.92); } } @keyframes stretch { 50% { transform: scaleY(1.15) translateY(-6%); } }
  @keyframes spin { to { transform: rotate(360deg); } } @keyframes fly { 25% { transform: translate(-8%, -8%) rotate(-6deg); } 75% { transform: translate(8%, -4%) rotate(6deg); } }
  h2 { margin: 8px 0 2px; font-size: 28px; line-height: 1.15; }
  .how { font-size: 18px; font-weight: 700; color: #475569; margin: 0 0 10px; }
  .count { font-size: 64px; font-weight: 800; color: #16a34a; line-height: 1; min-height: 64px; }
  .btn { width: 100%; border: none; border-radius: 20px; padding: 14px; font-size: 21px; font-weight: 800; color: #fff; margin-top: 12px; box-shadow: 0 5px 0 rgba(0,0,0,.18); background: linear-gradient(135deg, #22c55e, #16a34a); }
  .btn.alt { background: #7c3aed; }
  @media (prefers-reduced-motion: reduce) { .ani { animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../quiz-shared.js?v=20261127b"></script>
<script>
(function () {
  'use strict';
  const MOVES = [
    ['🐸', 'Hop like a frog!', 'Bend your knees and jump. Hop, hop, hop!', 'hop'],
    ['🦒', 'Stretch like a giraffe!', 'Reach your hands up high, up to the sky!', 'stretch'],
    ['🐘', 'Stomp like an elephant!', 'Lift your knees and stomp, stomp, stomp!', 'stomp'],
    ['🐧', 'Waddle like a penguin!', 'Keep your feet together and waddle side to side.', 'sway'],
    ['🦅', 'Fly like an eagle!', 'Open your arms wide and fly around the room.', 'fly'],
    ['🐒', 'Swing like a monkey!', 'Swing your arms from side to side. Ooh ooh aah aah!', 'sway'],
    ['🐢', 'Breathe like a turtle!', 'Go slow. Breathe in… and breathe out. So calm.', 'stretch'],
    ['🐇', 'Jump like a rabbit!', 'Small quick jumps. Boing, boing, boing!', 'hop'],
    ['🦀', 'Walk like a crab!', 'Walk sideways, left and right.', 'sway'],
    ['🌀', 'Spin like a top!', 'Turn around slowly, one time. Stop. Now the other way!', 'spin'],
    ['🐻', 'Stretch like a sleepy bear!', 'Big yawn and a big stretch. Aaah!', 'stretch'],
    ['🦁', 'Roar like a lion!', 'Make your hands into paws and give a big ROAR!', 'stomp'],
  ];
  const SECS = 10, N = 6, $app = document.getElementById('app');
  const cp = (e) => Array.from(e).map((c) => c.codePointAt(0)).filter((c) => c !== 0xfe0f).map((c) => c.toString(16)).join('-');
  const shuffle = (a) => a.slice().sort(() => Math.random() - 0.5);
  let list = [], i = 0, timer = null;
  const say = (t) => { try { if (typeof speak === 'function') speak(t, { raw: false, rate: 0.9, pitch: 1.2 }); } catch (e) {} };
  function bar(title) {
    return '<div class="bar"><button class="rb" id="home" aria-label="Home">🏠</button><h1>' + title + '</h1></div>';
  }
  function bind() { const h = document.getElementById('home'); if (h) h.onclick = () => { clearInterval(timer); location.href = '../quiz-home.html'; }; }
  function start() { list = shuffle(MOVES).slice(0, N); i = 0; show(); }
  function show() {
    clearInterval(timer);
    const m = list[i];
    $app.innerHTML = bar('Move like an animal') + '<div class="dots">' + list.map((_, k) => '<i class="' + (k === i ? 'on' : k < i ? 'done' : '') + '"></i>').join('') + '</div>' +
      '<div class="card"><img class="ani ' + m[3] + '" src="../images/emoji/' + cp(m[0]) + '.svg" alt=""><h2>' + m[1] + '</h2><p class="how">' + m[2] + '</p>' +
      '<div class="count" id="cnt">' + SECS + '</div><button class="btn" id="next">' + (i < N - 1 ? 'Next move ▶' : 'Finish 🎉') + '</button></div>';
    bind();
    document.getElementById('next').onclick = next;
    say(m[1] + ' ' + m[2]);
    let left = SECS + 3; // a moment to listen first
    timer = setInterval(() => { left--; const c = document.getElementById('cnt'); if (!c) return clearInterval(timer); if (left <= SECS) c.textContent = Math.max(0, left); if (left <= 0) { clearInterval(timer); next(); } }, 1000);
  }
  function next() { i++; if (i < list.length) show(); else end(); }
  function end() {
    clearInterval(timer);
    $app.innerHTML = bar('Great moving!') + '<div class="card" style="margin-top:14px"><img class="ani hop" src="../images/emoji/1f3c6.svg" alt=""><h2>You moved like ' + N + ' animals!</h2>' +
      '<p class="how">Moving makes your body and brain happy. Have a drink of water 💧</p><button class="btn" id="again">↺ Move again</button><button class="btn alt" id="back">🏠 Back home</button></div>';
    bind();
    say('Great moving! You moved like ' + N + ' animals!');
    try { if (window.KQ && KQ.finished) KQ.finished(); } catch (e) {}
    document.getElementById('again').onclick = start;
    document.getElementById('back').onclick = () => { location.href = '../quiz-home.html'; };
  }
  window.addEventListener('pagehide', () => clearInterval(timer));
  start();
})();
</script>
<script>window.KQ_NO_WIDGET = true; window.KQFX_NO_MUTE = true;</script>
<script src="../games/kq-leaderboard.js?v=20261127b"></script>
</body>
</html>
