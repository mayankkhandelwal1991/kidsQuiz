<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Kids Quiz Admin Console</title>
<!--
  Admin portal: every player (Google + guest) from Firebase, with their scores,
  plays and time played, and deletion of a player's data.

  ACCESS: sign in with Google. The page itself holds no secret — what protects
  the data is the Firebase Realtime Database rules: only the admin account
  (set in the rules, with a verified email) may read /admin and delete from
  /attempts, /sessions and /leaderboards. Anyone else who opens this page just
  sees "not an admin". See admin/README-admin.md for the rules.
-->
<style>
  :root {
    --bg: #f4f3ff; --card: #ffffff; --ink: #1e1b4b; --muted: #6b7280; --line: #e7e5f5;
    --brand: #4f46e5; --brand-ink: #ffffff; --danger: #dc2626; --ok: #059669; --google: #2563eb; --guest: #9333ea;
    --chip: #eef2ff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f0e1a; --card: #1a1830; --ink: #eceaff; --muted: #a3a1c2; --line: #2c2948;
      --brand: #818cf8; --brand-ink: #0f0e1a; --danger: #f87171; --ok: #34d399; --google: #60a5fa; --guest: #c084fc; --chip: #24213f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bar h1 { font-size: 18px; margin: 0; flex: 1; min-width: 180px; }
  .bar a { color: var(--brand); text-decoration: none; font-weight: 600; font-size: 14px; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .center { max-width: 420px; margin: 60px auto; text-align: center; }
  .center h2 { margin: 6px 0 8px; }
  .muted { color: var(--muted); }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 14px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  .primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .ghost-danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #1f1f1f; border: 1px solid #747775; border-radius: 999px; padding: 10px 22px; font-weight: 600; }
  .gbtn svg { width: 18px; height: 18px; }
  .who { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .who img { width: 28px; height: 28px; border-radius: 50%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .kpi b { display: block; font-size: 22px; }
  .kpi span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .tools input[type=search] { flex: 1; min-width: 180px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .tools select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 8px 12px; }
  .seg button.on { background: var(--brand); color: var(--brand-ink); }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; background: color-mix(in srgb, var(--chip) 60%, var(--card)); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: color-mix(in srgb, var(--chip) 50%, transparent); }
  .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--brand); overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .tag.g { color: var(--google); background: color-mix(in srgb, var(--google) 14%, transparent); }
  .tag.u { color: var(--guest); background: color-mix(in srgb, var(--guest) 14%, transparent); }
  .key { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); word-break: break-all; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .overlay { position: fixed; inset: 0; background: rgba(10, 8, 30, .55); display: none; align-items: flex-start; justify-content: center; padding: 30px 16px; z-index: 20; overflow-y: auto; }
  .overlay.on { display: flex; }
  .modal { background: var(--card); border-radius: 18px; width: 100%; max-width: 720px; padding: 20px; border: 1px solid var(--line); }
  .modal h3 { margin: 0 0 4px; }
  .modal h4 { margin: 18px 0 6px; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .list { border: 1px solid var(--line); border-radius: 12px; max-height: 260px; overflow-y: auto; }
  .li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .li:last-child { border-bottom: 0; }
  .li small { color: var(--muted); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
  .checks label { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .confirm-in { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; margin-top: 6px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; display: none; z-index: 30; max-width: calc(100% - 32px); }
  .err { color: var(--danger); font-weight: 600; }
  /* charts: validated categorical slots 1-4 (sections), light + dark steps */
  :root { --s-quiz: #2a78d6; --s-single: #eb6834; --s-multi: #1baf7a; --s-olympiad: #eda100; --s-one: #2a78d6; --grid: #ecebf5; --axis: #6b7280; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --s-quiz: #3987e5; --s-single: #d95926; --s-multi: #199e70; --s-olympiad: #c98500; --s-one: #3987e5; --grid: #2c2948; --axis: #a3a1c2; }
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .tabs button { border-radius: 999px; }
  .tabs button.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .charts { display: grid; grid-template-columns: 1fr; gap: 14px; }
  @media (min-width: 980px) { .charts { grid-template-columns: 1fr 1fr; } .charts .wide { grid-column: 1 / -1; } }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 14px 10px; position: relative; min-width: 0; }
  .chart h3 { margin: 0; font-size: 15px; }
  .chart .sub { color: var(--muted); font-size: 12.5px; margin: 2px 0 8px; }
  .chart svg { width: 100%; height: auto; display: block; overflow: visible; }
  .chart svg text { fill: var(--axis); font: 11px system-ui, sans-serif; }
  .chart .gl { stroke: var(--grid); stroke-width: 1; }
  .chart .hit { fill: transparent; cursor: crosshair; }
  .chart .hit:hover { fill: color-mix(in srgb, var(--ink) 6%, transparent); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin: 4px 0 2px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .chart details { margin-top: 6px; font-size: 13px; }
  .chart details summary { cursor: pointer; color: var(--muted); }
  .chart details table { margin-top: 6px; font-size: 12.5px; }
  .chart details td, .chart details th { padding: 4px 8px; }
  .vtip { position: fixed; pointer-events: none; z-index: 40; background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 8px 24px rgba(0,0,0,.18); display: none; min-width: 130px; }
  .vtip b { display: block; margin-bottom: 4px; }
  .vtip .r { display: flex; justify-content: space-between; gap: 12px; }
  .vtip .r i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }
  .ccb { font: 800 10px/1 system-ui, sans-serif; letter-spacing: .04em; padding: 2px 4px; border-radius: 4px; background: var(--chip); color: var(--brand); }
  .hbar { display: grid; grid-template-columns: minmax(110px, 38%) 1fr auto; gap: 8px; align-items: center; font-size: 13px; padding: 4px 0; }
  .hbar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar .tr { height: 14px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar .v { font-variant-numeric: tabular-nums; color: var(--muted); }
  .tool { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .tool h3 { margin: 0 0 4px; font-size: 16px; }
  .tool p { margin: 0 0 10px; color: var(--muted); }
  .tool .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tool input[type=number], .tool select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; }
  .tool input[type=number] { width: 90px; }
  @media (max-width: 760px) {
    .hide-sm { display: none; }
    th, td { padding: 8px 6px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>⚙️ Kids Quiz Admin Console</h1>
    <div class="who" id="who"></div>
  </div>
</header>

<main id="app">
  <div class="card center"><p class="muted">Loading…</p></div>
</main>

<div class="overlay" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  'use strict';
  firebase.initializeApp({
    apiKey: "AIzaSyB0eMyeIUtCsuMVk-8LtRQs_iwOJV3ksv8",
    authDomain: "kidsgames-3987c.firebaseapp.com",
    databaseURL: "https://kidsgames-3987c-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kidsgames-3987c",
    storageBucket: "kidsgames-3987c.appspot.com",
    messagingSenderId: "851797718600",
    appId: "1:851797718600:web:e990b3435751d209228a7d"
  });
  const auth = firebase.auth(), db = firebase.database();
  const $app = document.getElementById('app'), $who = document.getElementById('who');
  const $ov = document.getElementById('ov'), $modal = document.getElementById('modal');

  /* ---------- helpers ---------- */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtNum = (n) => (Math.round((n || 0) * 100) / 100).toLocaleString();
  const fmtDur = (s) => { s = Math.round(s || 0); if (s < 60) return s + 's'; const m = Math.floor(s / 60), h = Math.floor(m / 60); return h ? h + 'h ' + String(m % 60).padStart(2, '0') + 'm' : m + 'm'; };
  const fmtDate = (t) => t ? new Date(t).toLocaleString([], { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
  const ago = (t) => { if (!t) return '—'; const d = (Date.now() - t) / 1000; if (d < 3600) return Math.max(1, Math.round(d / 60)) + 'm ago'; if (d < 86400) return Math.round(d / 3600) + 'h ago'; if (d < 86400 * 30) return Math.round(d / 86400) + 'd ago'; return new Date(t).toLocaleDateString(); };
  const initials = (n) => { const p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); };
  // Country (ISO code saved by the app/website; found on the player's device)
  const NO_FLAG_EMOJI = /Windows/.test(navigator.userAgent || '');
  let regionNames = null; try { regionNames = new Intl.DisplayNames(['en'], { type: 'region' }); } catch (e) {}
  const ccName = (cc) => { if (!cc) return 'Unknown'; try { return (regionNames && regionNames.of(cc)) || cc; } catch (e) { return cc; } };
  const flag = (cc) => !cc ? '<span class="muted">—</span>' : (NO_FLAG_EMOJI ? '<b class="ccb">' + esc(cc) + '</b>' : String.fromCodePoint(...[...cc].map((c) => 0x1F1E6 + c.charCodeAt(0) - 65)));
  const CAT = { quiz: '🎯 Quiz', single: '🎮 Game', multi: '👥 Multiplayer', olympiad: '🏅 Olympiad', travel: '🌍 Travel' };
  function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 3500); }
  function avatar(p) { return '<span class="av">' + (p.photo ? '<img src="' + esc(p.photo) + '" referrerpolicy="no-referrer" alt="">' : esc(initials(p.name))) + '</span>'; }
  const G_ICON = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';

  /* ---------- auth ---------- */
  function showSignIn(msg) {
    $who.innerHTML = '';
    $app.innerHTML = '<div class="card center"><div style="font-size:42px">🔐</div><h2>Admin sign-in</h2>' +
      '<p class="muted">Sign in with the admin Google account to manage players.</p>' +
      '<button class="gbtn" id="signin">' + G_ICON + 'Sign in with Google</button>' +
      (msg ? '<p class="err" style="margin-top:14px">' + esc(msg) + '</p>' : '') + '</div>';
    document.getElementById('signin').onclick = () => {
      const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      auth.signInWithPopup(p).catch((e) => {
        if (e && (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment')) return auth.signInWithRedirect(p);
        if (e && e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') showSignIn('Sign-in failed: ' + (e.message || e.code));
      });
    };
  }
  function showWho(u) {
    $who.innerHTML = (u.photoURL ? '<img src="' + esc(u.photoURL) + '" referrerpolicy="no-referrer" alt="">' : '') +
      '<span>' + esc(u.email || u.displayName || '') + '</span>' +
      '<button onclick="location.href=\'../quiz-home.html\'">🎮 Open app</button>' +
      '<button onclick="location.href=\'index.html\'">📸 Instagram Studio</button>' +
      '<button id="out">Sign out</button>';
    document.getElementById('out').onclick = () => auth.signOut();
  }
  auth.getRedirectResult().catch(() => {});
  auth.onAuthStateChanged((u) => {
    if (!u) return showSignIn();
    showWho(u);
    $app.innerHTML = '<div class="card center"><p class="muted">Checking admin access…</p></div>';
    // Only the admin account can read /admin (Firebase rules) — that is the access check.
    db.ref('admin/check').once('value').then(() => load(), (e) => {
      $app.innerHTML = '<div class="card center"><div style="font-size:42px">⛔</div><h2>Not an admin</h2>' +
        '<p class="muted">' + esc(u.email || '') + ' doesn\'t have admin access.</p>' +
        '<p class="muted" style="font-size:13px">' + esc(e && e.code === 'PERMISSION_DENIED' ? '' : (e && e.message) || '') + '</p>' +
        '<button id="sw">Use another account</button></div>';
      document.getElementById('sw').onclick = () => auth.signOut();
    });
  });

  /* ---------- data ---------- */
  let PLAYERS = [], BYKEY = new Map();
  const S = { q: '', type: 'all', sort: 'last', sel: new Set(), tab: 'dash', range: 30, cc: 'all' };
  let RAW = { lb: {}, ses: {}, att: {} };

  function load() {
    $app.innerHTML = '<div class="card center"><p class="muted">Loading players from Firebase…</p></div>';
    Promise.all(['leaderboards', 'sessions', 'attempts'].map((n) => db.ref(n).once('value').then((s) => s.val() || {})))
      .then(([lb, ses, att]) => { RAW = { lb, ses, att }; build(lb, ses, att); render(); })
      .catch((e) => { $app.innerHTML = '<div class="card center"><p class="err">Could not load: ' + esc(e.message) + '</p><button id="rt">Retry</button></div>'; document.getElementById('rt').onclick = load; });
  }
  function player(key) {
    let p = BYKEY.get(key);
    if (!p) { p = { key, name: '', photo: '', guest: /^g_/.test(key), boards: [], attempts: [], sessions: [], points: 0, time: 0, last: 0, first: 0, cc: '', ccAt: -1 }; BYKEY.set(key, p); }
    return p;
  }
  function seen(p, t, name, photo, guest, cc) {
    if (cc && /^[A-Z]{2}$/.test(cc) && (t || 0) >= p.ccAt) { p.cc = cc; p.ccAt = t || 0; } // latest known country
    if (t && t > p.last) { p.last = t; if (name) p.name = name; }
    if (t && (!p.first || t < p.first)) p.first = t;
    if (!p.name && name) p.name = name;
    if (!p.photo && photo) p.photo = photo;
    if (guest === true) p.guest = true;
  }
  function build(lb, ses, att) {
    BYKEY = new Map();
    Object.keys(lb).forEach((cat) => {
      const games = lb[cat] || {};
      Object.keys(games).forEach((game) => {
        const rows = games[game] || {};
        Object.keys(rows).forEach((key) => {
          const v = rows[key]; if (!v || typeof v !== 'object') return;
          const p = player(key), at = v.updatedAt || v.at || 0;
          p.boards.push({ cat, game, score: Number(v.score) || 0, at, lower: !!v.lowerIsBetter, path: 'leaderboards/' + cat + '/' + game + '/' + key });
          if (!v.lowerIsBetter) p.points += Number(v.score) || 0;
          seen(p, at, v.name, v.photo, v.guest, v.cc);
        });
      });
    });
    Object.keys(ses).forEach((key) => {
      const p = player(key);
      Object.keys(ses[key] || {}).forEach((id) => {
        const v = ses[key][id]; if (!v || typeof v !== 'object') return;
        p.sessions.push({ id, start: v.start || 0, last: v.last || v.start || 0, dur: v.dur || 0, pages: v.pages || 0 });
        p.time += v.dur || 0;
        seen(p, v.last || v.start, v.name, '', v.guest, v.cc);
      });
    });
    Object.keys(att).forEach((key) => {
      const p = player(key);
      Object.keys(att[key] || {}).forEach((id) => {
        const v = att[key][id]; if (!v || typeof v !== 'object') return;
        p.attempts.push({ id, cat: v.cat, game: v.gameId, title: v.title || '', score: v.score, at: v.at || 0, dur: v.dur || 0 });
        seen(p, v.at, v.name, '', undefined, v.cc);
      });
    });
    PLAYERS = [...BYKEY.values()];
    PLAYERS.forEach((p) => { if (!p.name) p.name = p.guest ? 'Guest' : 'Player'; p.attempts.sort((a, b) => b.at - a.at); p.sessions.sort((a, b) => b.start - a.start); p.boards.sort((a, b) => b.at - a.at); });
    S.sel = new Set([...S.sel].filter((k) => BYKEY.has(k)));
  }

  /* ---------- list ---------- */
  function filtered() {
    const q = S.q.trim().toLowerCase();
    let list = PLAYERS.filter((p) => (S.type === 'all' || (S.type === 'guest') === p.guest) && (S.cc === 'all' || (p.cc || '') === S.cc) &&
      (!q || p.name.toLowerCase().includes(q) || p.key.toLowerCase().includes(q)));
    const by = { last: (a, b) => b.last - a.last, points: (a, b) => b.points - a.points, plays: (a, b) => b.attempts.length - a.attempts.length,
      time: (a, b) => b.time - a.time, name: (a, b) => a.name.localeCompare(b.name), first: (a, b) => b.first - a.first,
      country: (a, b) => ccName(a.cc).localeCompare(ccName(b.cc)) || b.last - a.last }[S.sort];
    return list.sort(by);
  }
  function tabsHtml() {
    return '<div class="tabs" role="tablist">' + [['dash', '📊 Dashboard'], ['players', '👥 Players'], ['app', '📱 App settings'], ['tools', '🛠 Tools']].map(([v, l]) =>
      '<button role="tab" data-tab="' + v + '" class="' + (S.tab === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div>';
  }
  function bindTabs() { $app.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); }); }
  function render() {
    if (S.tab === 'dash') return renderDash();
    if (S.tab === 'tools') return renderTools();
    if (S.tab === 'app') return renderAppSettings();
    return renderPlayers();
  }

  /* ---------- dashboard ---------- */
  const DAY = 86400000;
  const SEC = [['quiz', 'Quiz'], ['single', 'Games'], ['multi', 'Multiplayer'], ['olympiad', 'Olympiad']];
  const dayKey = (t) => { const d = new Date(t); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
  const dayLabel = (t) => new Date(t).toLocaleDateString([], { day: 'numeric', month: 'short' });
  const prettyGame = (id) => String(id || '').replace(/__p(\d+)$/, ' · paper $1').replace(/__/g, ' · ').replace(/_/g, ' ');

  function dashData() {
    const n = S.range, today0 = new Date(); today0.setHours(0, 0, 0, 0);
    const start = today0.getTime() - (n - 1) * DAY;
    const days = [], idx = {};
    for (let i = 0; i < n; i++) { const t = start + i * DAY; idx[dayKey(t)] = i; days.push({ t, active: new Set(), fresh: 0, plays: { quiz: 0, single: 0, multi: 0, olympiad: 0 }, secs: 0 }); }
    const at = (t) => (t >= start ? idx[dayKey(t)] : undefined);
    const hours = new Array(24).fill(0), games = new Map(), activeAll = new Set();
    let plays = 0, secs = 0;
    PLAYERS.forEach((p) => {
      const fi = at(p.first); if (fi != null) days[fi].fresh++;
      p.sessions.forEach((x) => { const i = at(x.start); if (i == null) return; days[i].active.add(p.key); days[i].secs += x.dur || 0; secs += x.dur || 0; activeAll.add(p.key); hours[new Date(x.start).getHours()]++; });
      p.attempts.forEach((a) => {
        const i = at(a.at); if (i == null) return;
        days[i].active.add(p.key); activeAll.add(p.key); plays++;
        if (days[i].plays[a.cat] != null) days[i].plays[a.cat]++;
        const k = a.cat + '/' + a.game, g = games.get(k) || { cat: a.cat, name: a.title || prettyGame(a.game), n: 0, players: new Set() };
        g.n++; g.players.add(p.key); games.set(k, g);
      });
    });
    return { days, hours, plays, secs, activeAll, start, top: [...games.values()].sort((a, b) => b.n - a.n).slice(0, 12) };
  }

  const tip = (() => { let el = null; return {
    show(html, e) { if (!el) { el = document.createElement('div'); el.className = 'vtip'; document.body.appendChild(el); } el.innerHTML = html; el.style.display = 'block';
      const w = el.offsetWidth, h = el.offsetHeight; let x = e.clientX + 14, y = e.clientY - h - 10; if (x + w > innerWidth - 8) x = e.clientX - w - 14; if (y < 8) y = e.clientY + 16; el.style.left = x + 'px'; el.style.top = y + 'px'; },
    hide() { if (el) el.style.display = 'none'; } }; })();

  // Vertical bar chart (single or stacked series). One y-axis, recessive grid,
  // 2px gaps between stacked fills, rounded top on the top segment, hover tooltip
  // per column, legend for >= 2 series, and a table view.
  function barChart(id, cfg) {
    // wide charts get a wider viewBox (same height) so text stays the same size
    const W = cfg.wide ? 1300 : 640, H = 230, L = 46, B = 24, T = 8, Rr = 6, n = cfg.labels.length;
    const tot = cfg.labels.map((_, i) => cfg.series.reduce((s, se) => s + (se.values[i] || 0), 0));
    // "nice" whole-number ticks (counts: 1/2/5 x 10^k; durations: whole minutes/hours)
    const raw = Math.max(1, ...tot);
    const cands = cfg.fmt ? [60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400]
      : [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000];
    const tstep = cands.find((c) => raw / c <= 4) || cands[cands.length - 1];
    const ticks = Math.max(1, Math.ceil(raw / tstep)), max = ticks * tstep;
    const pw = W - L - Rr, ph = H - T - B, bw = pw / n, gap = Math.min(6, bw * 0.25), y = (v) => T + ph - v / max * ph;
    let g = '';
    for (let k = 0; k <= ticks; k++) { const v = tstep * k, yy = y(v); g += '<line class="gl" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + yy + '" y2="' + yy + '"/><text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(cfg.fmt ? cfg.fmt(v, true) : fmtNum(v)) + '</text>'; }
    const every = Math.ceil(n / 10);
    cfg.labels.forEach((lab, i) => {
      const x = L + i * bw + gap / 2, w = Math.max(1, bw - gap); let acc = 0;
      const segs = cfg.series.map((se) => ({ se, v: se.values[i] || 0 })).filter((s) => s.v > 0);
      segs.forEach((s, j) => {
        const y0 = y(acc), y1 = y(acc + s.v); acc += s.v;
        const top = j === segs.length - 1, hgt = Math.max(0, y0 - y1 - (j ? 2 : 0));
        if (hgt <= 0) return;
        const yy = y1, r = top ? Math.min(4, w / 2, hgt) : 0;
        g += r ? '<path fill="var(' + s.se.color + ')" d="M' + x + ',' + (yy + hgt) + 'V' + (yy + r) + 'Q' + x + ',' + yy + ' ' + (x + r) + ',' + yy + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + yy + ' ' + (x + w) + ',' + (yy + r) + 'V' + (yy + hgt) + 'Z"/>'
               : '<rect fill="var(' + s.se.color + ')" x="' + x + '" y="' + yy + '" width="' + w + '" height="' + hgt + '"/>';
      });
      if ((i % every === 0 && n - 1 - i >= every) || i === n - 1) g += '<text x="' + (L + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle">' + esc(lab) + '</text>';
      g += '<rect class="hit" data-i="' + i + '" x="' + (L + i * bw) + '" y="' + T + '" width="' + bw + '" height="' + ph + '"/>';
    });
    const legend = cfg.series.length > 1 ? '<div class="legend">' + cfg.series.map((se) => '<span><i style="background:var(' + se.color + ')"></i>' + esc(se.name) + '</span>').join('') + '</div>' : '';
    const table = '<details><summary>Show table</summary><table><thead><tr><th>' + esc(cfg.xName || 'Day') + '</th>' + cfg.series.map((se) => '<th class="num">' + esc(se.name) + '</th>').join('') + (cfg.series.length > 1 ? '<th class="num">Total</th>' : '') + '</tr></thead><tbody>' +
      cfg.labels.map((lab, i) => '<tr><td>' + esc(cfg.full ? cfg.full[i] : lab) + '</td>' + cfg.series.map((se) => '<td class="num">' + esc(cfg.fmt ? cfg.fmt(se.values[i] || 0) : fmtNum(se.values[i] || 0)) + '</td>').join('') + (cfg.series.length > 1 ? '<td class="num">' + esc(cfg.fmt ? cfg.fmt(tot[i]) : fmtNum(tot[i])) + '</td>' : '') + '</tr>').join('') + '</tbody></table></details>';
    return '<div class="chart' + (cfg.wide ? ' wide' : '') + '" id="' + id + '"><h3>' + esc(cfg.title) + '</h3><div class="sub">' + esc(cfg.sub || '') + '</div>' + legend +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(cfg.title) + '">' + g + '</svg>' + table + '</div>';
  }
  function bindChart(id, cfg) {
    const el = document.getElementById(id); if (!el) return;
    el.querySelectorAll('.hit').forEach((h) => {
      h.onmousemove = (e) => { const i = +h.dataset.i, tot = cfg.series.reduce((s, se) => s + (se.values[i] || 0), 0);
        tip.show('<b>' + esc(cfg.full ? cfg.full[i] : cfg.labels[i]) + '</b>' + cfg.series.map((se) => '<div class="r"><span><i style="background:var(' + se.color + ')"></i>' + esc(se.name) + '</span><span>' + esc(cfg.fmt ? cfg.fmt(se.values[i] || 0) : fmtNum(se.values[i] || 0)) + '</span></div>').join('') +
          (cfg.series.length > 1 ? '<div class="r" style="margin-top:4px;font-weight:700"><span>Total</span><span>' + esc(cfg.fmt ? cfg.fmt(tot) : fmtNum(tot)) + '</span></div>' : ''), e); };
      h.onmouseleave = () => tip.hide();
    });
  }

  function renderDash() {
    const D = dashData(), now = Date.now();
    const lab = D.days.map((d) => dayLabel(d.t)), full = D.days.map((d) => new Date(d.t).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }));
    const google = PLAYERS.filter((p) => !p.guest).length;
    const todayActive = D.days[D.days.length - 1].active.size;
    const fresh = D.days.reduce((s, d) => s + d.fresh, 0);
    const k = (v, l, s2) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span>' + (s2 ? '<div class="muted" style="font-size:12px;margin-top:2px">' + s2 + '</div>' : '') + '</div>';
    const rangeTxt = 'last ' + S.range + ' days';
    let h = tabsHtml() +
      '<div class="tools"><div class="seg">' + [7, 30, 90].map((r) => '<button data-range="' + r + '" class="' + (S.range === r ? 'on' : '') + '">' + r + ' days</button>').join('') + '</div>' +
      '<button id="reload">↻ Refresh</button><span class="muted" style="font-size:13px">Updated ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '</span></div>' +
      '<div class="kpis">' +
        k(fmtNum(PLAYERS.length), 'Players (all time)', google + ' Google · ' + (PLAYERS.length - google) + ' guests') +
        k(fmtNum(fresh), 'New players', rangeTxt) +
        k(fmtNum(todayActive), 'Active today') +
        k(fmtNum(D.activeAll.size), 'Active players', rangeTxt) +
        k(fmtNum(D.plays), 'Plays', rangeTxt) +
        k(fmtDur(D.secs), 'Time played', rangeTxt) +
        k(D.activeAll.size ? fmtDur(D.secs / D.activeAll.size) : '—', 'Avg time / player', rangeTxt) +
      '</div>';

    const cActive = { title: 'Active players per day', sub: 'Players who visited or played', labels: lab, full, series: [{ name: 'Active players', color: '--s-one', values: D.days.map((d) => d.active.size) }] };
    const cNew = { title: 'New players per day', sub: 'First time seen', labels: lab, full, series: [{ name: 'New players', color: '--s-one', values: D.days.map((d) => d.fresh) }] };
    const cPlays = { title: 'Plays per day by section', sub: 'Finished quizzes, games, papers and matches', labels: lab, full, wide: true,
      series: SEC.map(([c, nme]) => ({ name: nme, color: '--s-' + c, values: D.days.map((d) => d.plays[c]) })) };
    const cTime = { title: 'Time played per day', sub: 'Active minutes in the app / website', labels: lab, full, fmt: (v) => fmtDur(v), series: [{ name: 'Time played', color: '--s-one', values: D.days.map((d) => d.secs) }] };
    const cHour = { title: 'When kids play', sub: 'Visits and plays by hour of day (your time zone), ' + rangeTxt, xName: 'Hour',
      labels: D.hours.map((_, i) => (i % 12 || 12) + (i < 12 ? 'a' : 'p')), full: D.hours.map((_, i) => String(i).padStart(2, '0') + ':00–' + String(i).padStart(2, '0') + ':59'),
      series: [{ name: 'Visits + plays', color: '--s-one', values: D.hours }] };

    h += '<div class="charts">' + barChart('cA', cActive) + barChart('cN', cNew) + barChart('cP', cPlays) + barChart('cT', cTime) + barChart('cH', cHour);
    // top games: horizontal bars coloured by section (entity), legend + values on every row
    const maxN = D.top.length ? D.top[0].n : 1, catName = Object.fromEntries(SEC);
    h += '<div class="chart"><h3>Most played</h3><div class="sub">Top ' + D.top.length + ' by plays, ' + rangeTxt + '</div>' +
      '<div class="legend">' + SEC.map(([c, nme]) => '<span><i style="background:var(--s-' + c + ')"></i>' + nme + '</span>').join('') + '</div>' +
      (D.top.length ? D.top.map((g) => '<div class="hbar" title="' + esc(g.name) + ' — ' + g.n + ' plays by ' + g.players.size + ' players"><span class="lab">' + esc(g.name) + '</span>' +
        '<span><span class="tr" style="display:block;width:' + Math.max(1, g.n / maxN * 100) + '%;background:var(--s-' + (catName[g.cat] ? g.cat : 'one') + ')"></span></span><span class="v">' + g.n + '</span></div>').join('') : '<p class="muted">No plays in this range yet.</p>') +
      '<details><summary>Show table</summary><table><thead><tr><th>Game / quiz</th><th>Section</th><th class="num">Plays</th><th class="num">Players</th></tr></thead><tbody>' +
      D.top.map((g) => '<tr><td>' + esc(g.name) + '</td><td>' + esc(catName[g.cat] || g.cat) + '</td><td class="num">' + g.n + '</td><td class="num">' + g.players.size + '</td></tr>').join('') + '</tbody></table></details></div>';
    // players by country: active players in the range (and all-time players), top 10 + Other
    const byCc = new Map(); PLAYERS.forEach((p) => { const o = byCc.get(p.cc || '') || { all: 0, act: 0 }; o.all++; if (D.activeAll.has(p.key)) o.act++; byCc.set(p.cc || '', o); });
    let ccRows = [...byCc.entries()].map(([cc, o]) => ({ cc, ...o })).sort((a, b) => b.act - a.act || b.all - a.all);
    if (ccRows.length > 10) { const rest = ccRows.slice(10).reduce((t, r) => ({ cc: 'Other', all: t.all + r.all, act: t.act + r.act }), { cc: 'Other', all: 0, act: 0 }); ccRows = ccRows.slice(0, 10).concat([rest]); }
    const maxC = Math.max(1, ...ccRows.map((r) => r.act));
    const ccLabel = (r) => r.cc === 'Other' ? 'Other countries' : (r.cc ? flag(r.cc) + ' ' + esc(ccName(r.cc)) : 'Unknown');
    h += '<div class="chart"><h3>Players by country</h3><div class="sub">Active players, ' + rangeTxt + ' (country from the player\'s device)</div>' +
      (ccRows.some((r) => r.act) ? ccRows.filter((r) => r.act).map((r) => '<div class="hbar" title="' + esc(r.cc === 'Other' ? 'Other' : ccName(r.cc)) + ': ' + r.act + ' active, ' + r.all + ' all time"><span class="lab">' + ccLabel(r) + '</span>' +
        '<span><span class="tr" style="display:block;width:' + Math.max(1, r.act / maxC * 100) + '%;background:var(--s-one)"></span></span><span class="v">' + r.act + '</span></div>').join('') : '<p class="muted">No country data in this range yet.</p>') +
      '<details><summary>Show table</summary><table><thead><tr><th>Country</th><th class="num">Active (' + esc(rangeTxt) + ')</th><th class="num">All players</th></tr></thead><tbody>' +
      ccRows.map((r) => '<tr><td>' + ccLabel(r) + '</td><td class="num">' + r.act + '</td><td class="num">' + r.all + '</td></tr>').join('') + '</tbody></table></details></div>';
    h += '</div>';
    $app.innerHTML = h; bindTabs();
    $app.querySelectorAll('[data-range]').forEach((b) => b.onclick = () => { S.range = +b.dataset.range; render(); });
    document.getElementById('reload').onclick = load;
    [['cA', cActive], ['cN', cNew], ['cP', cPlays], ['cT', cTime], ['cH', cHour]].forEach(([i, c]) => bindChart(i, c));
  }

  /* ---------- app settings (config/app) ----------
     Read by the Android app on every launch and by the web pages. */
  const CFG_DEFAULT = {
    reminder: { enabled: false, frequency: 'daily', time: '18:00', weekday: 0, title: 'Your daily mission is ready! 🚀', body: 'Play a quick quiz or game and keep your streak going ⭐' },
    offline: { enabled: false },
    share: { enabled: true },
    app: { hideLeaderboardFab: true },
    ads: { banner: true, interstitial: true, everyN: 2, minGapSec: 60, quit: true, quitGapSec: 90 },
    rating: { enabled: true, afterN: 3, repeatDays: 30 },
    update: { mandatory: false, minVersionCode: 0, message: 'A new version of Kids Quiz is ready with new games and fixes. Please update to keep playing.' }
  };
  const merge = (a, b) => { const o = JSON.parse(JSON.stringify(a)); Object.keys(b || {}).forEach((k) => { o[k] = (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k])) ? Object.assign({}, o[k] || {}, b[k]) : b[k]; }); return o; };
  const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  function renderAppSettings() {

      const num = (id, v, min) => '<input type="number" id="' + id + '" min="' + min + '" value="' + esc(v) + '">';
      const txt = (id, v, ph) => '<input id="' + id + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '" maxlength="80" style="flex:1;min-width:220px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit">';
      let h = tabsHtml() + '<p class="muted" style="margin:0 0 12px">These control the Android app (and the website where it applies). Phones pick up changes the next time the app opens.' +

        '<div class="row" style="margin-top:10px">Title ' + txt('rTitle', r.title, CFG_DEFAULT.reminder.title) + '</div>' +
        '<div class="row" style="margin-top:8px">Message ' + txt('rBody', r.body, CFG_DEFAULT.reminder.body) + '</div>' +
        '<p class="muted" style="font-size:13px;margin:8px 0 0">Uses each phone\'s own time zone. Android 13+ asks the child\'s device once for permission to show notifications.</p></div>';
      h += '<div class="tool"><h3>📶 Internet</h3>' + chk('oOff', c.offline.enabled, 'Allow playing offline', 'Off (recommended): quizzes and games need internet — the app shows "No internet". On: pages already opened on the phone load from its saved copy without internet (scores sync only when online).') + '</div>';

      const up = c.update;

        chk('upOn', up.mandatory, 'Update is mandatory', 'Off: nobody sees an update popup. On: phones with an older version get Google Play\'s full-screen update screen (or, if Play can\'t do it, an “Update needed” box that only opens the Play Store) and can\'t play until they update.') +

      const rt = c.rating;

        const v = (id) => document.getElementById(id), n = (id, d, min) => Math.max(min, Math.round(+v(id).value || d));
        const f = v('rFreq').value;
        const cfg = {
          reminder: { enabled: f !== 'off', frequency: f === 'off' ? (r.frequency || 'daily') : f, time: v('rTime').value || '18:00', weekday: +v('rDay').value,
            title: v('rTitle').value.trim() || CFG_DEFAULT.reminder.title, body: v('rBody').value.trim() || CFG_DEFAULT.reminder.body },
          offline: { enabled: v('oOff').checked },
          share: { enabled: v('sShare').checked },
          app: { hideLeaderboardFab: v('aFab').checked },
          update: { mandatory: v('upOn').checked, minVersionCode: n('upMin', 0, 0), message: v('upMsg').value.trim() || CFG_DEFAULT.update.message },
          rating: { enabled: v('rtOn').checked, afterN: n('rtN', 3, 1), repeatDays: n('rtDays', 30, 0) },
          ads: { banner: v('adBanner').checked, interstitial: v('adInt').checked, everyN: n('adN', 2, 1), minGapSec: n('adGap', 60, 0), quit: v('adQuit').checked, quitGapSec: n('adQGap', 90, 0) },
          updatedAt: Date.now()
        };
        const btn = v('saveCfg'); btn.disabled = true;
        db.ref('config/app').set(cfg).then(() => { btn.disabled = false; v('cfgMsg').textContent = 'Saved ✓ — phones get it next time the app opens.'; toast('App settings saved'); },
          (e) => { btn.disabled = false; v('cfgMsg').innerHTML = '<span class="err">' + esc(/permission/i.test(e.message || '') ? 'Permission denied — add the "config" rule in Firebase (see README-admin.md).' : e.message) + '</span>'; });
      };
    }, (e) => { $app.innerHTML = tabsHtml() + '<div class="card center"><p class="err">Could not load settings: ' + esc(e.message) + '</p></div>'; bindTabs(); });
  }

  /* ---------- tools ---------- */
  function renderTools() {
    const boards = [];
    Object.keys(RAW.lb || {}).forEach((cat) => Object.keys(RAW.lb[cat] || {}).forEach((g) => boards.push({ cat, g, n: Object.keys(RAW.lb[cat][g] || {}).length })));
    boards.sort((a, b) => (a.cat + a.g).localeCompare(b.cat + b.g));
    const nAtt = Object.values(RAW.att || {}).reduce((s, x) => s + Object.keys(x || {}).length, 0), nSes = Object.values(RAW.ses || {}).reduce((s, x) => s + Object.keys(x || {}).length, 0);
    let h = tabsHtml() +
      '<div class="tool"><h3>💾 Backup</h3><p>Download everything (leaderboards, play history, visits) as one JSON file. Do this before big clean-ups.</p>' +
        '<div class="row"><button class="primary" id="tBackup">Download backup</button><span class="muted">' + PLAYERS.length + ' players · ' + nAtt + ' plays · ' + nSes + ' visits</span></div></div>' +
      '<div class="tool"><h3>🧹 Remove inactive guests</h3><p>Delete all data of guest players not seen for a number of days (Google players are never touched).</p>' +
        '<div class="row">Not seen for <input type="number" id="tDays" min="1" value="60"> days <button id="tPrev">Find</button><span id="tInfo" class="muted"></span></div></div>' +
      '<div class="tool"><h3>🗓 Trim old history</h3><p>Delete plays and visits older than a number of days for everyone. Best scores and leaderboards stay.</p>' +
        '<div class="row">Older than <input type="number" id="tOld" min="7" value="180"> days <button id="tOldGo">Find</button><span id="tOldInfo" class="muted"></span></div></div>' +
      '<div class="tool"><h3>🏆 Reset a leaderboard</h3><p>Clear every score on one board (for example after changing a game\'s scoring).</p>' +
        '<div class="row"><select id="tBoard">' + boards.map((b, i) => '<option value="' + i + '">' + esc((CAT[b.cat] || b.cat) + ' · ' + prettyGame(b.g)) + ' (' + b.n + ')</option>').join('') + '</select><button class="ghost-danger" id="tReset"' + (boards.length ? '' : ' disabled') + '>Reset board</button></div></div>';
    $app.innerHTML = h; bindTabs();
    document.getElementById('tBackup').onclick = () => {
      const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), leaderboards: RAW.lb, attempts: RAW.att, sessions: RAW.ses })], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsquiz-backup-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
    };
    document.getElementById('tPrev').onclick = () => {
      const d = Math.max(1, +document.getElementById('tDays').value || 60), cut = Date.now() - d * DAY;
      const list = PLAYERS.filter((p) => p.guest && (p.last || 0) < cut);
      const info = document.getElementById('tInfo');
      if (!list.length) { info.textContent = 'No guests inactive for ' + d + ' days.'; return; }
      info.innerHTML = list.length + ' guests found. <button class="danger" id="tDel">Delete them…</button>';
      document.getElementById('tDel').onclick = () => confirmDelete(list);
    };
    document.getElementById('tOldGo').onclick = () => {
      const d = Math.max(7, +document.getElementById('tOld').value || 180), cut = Date.now() - d * DAY, paths = {};
      Object.keys(RAW.att || {}).forEach((k2) => Object.keys(RAW.att[k2] || {}).forEach((id) => { const v = RAW.att[k2][id]; if (v && (v.at || 0) < cut) paths['attempts/' + k2 + '/' + id] = null; }));
      Object.keys(RAW.ses || {}).forEach((k2) => Object.keys(RAW.ses[k2] || {}).forEach((id) => { const v = RAW.ses[k2][id]; if (v && (v.last || v.start || 0) < cut) paths['sessions/' + k2 + '/' + id] = null; }));
      const n2 = Object.keys(paths).length, info = document.getElementById('tOldInfo');
      if (!n2) { info.textContent = 'Nothing older than ' + d + ' days.'; return; }
      info.innerHTML = n2 + ' old records found. <button class="danger" id="tOldDel">Delete them…</button>';
      document.getElementById('tOldDel').onclick = () => confirmPaths('Delete ' + n2 + ' plays/visits older than ' + d + ' days?', paths);
    };
    document.getElementById('tReset').onclick = () => {
      const b = boards[+document.getElementById('tBoard').value]; if (!b) return;
      confirmPaths('Reset the leaderboard "' + (CAT[b.cat] || b.cat) + ' · ' + prettyGame(b.g) + '" (' + b.n + ' scores)?', { ['leaderboards/' + b.cat + '/' + b.g]: null });
    };
  }
  function confirmPaths(title, paths) {
    $modal.innerHTML = '<h3>' + esc(title) + '</h3><p class="muted">This permanently removes it from Firebase and can\'t be undone. Download a backup first if unsure.</p>' +
      '<p style="margin:14px 0 0">Type <b>DELETE</b> to confirm:</p><input class="confirm-in" id="cIn" autocomplete="off" placeholder="DELETE">' +
      '<div class="actions"><button id="cn">Cancel</button><button class="danger" id="go" disabled>Delete permanently</button></div>';
    $ov.classList.add('on');
    const go = document.getElementById('go'), inp = document.getElementById('cIn');
    inp.oninput = () => { go.disabled = inp.value.trim() !== 'DELETE'; }; inp.focus();
    document.getElementById('cn').onclick = closeModal;
    go.onclick = () => {
      go.disabled = true; go.textContent = 'Deleting…';
      const keys = Object.keys(paths), chunks = [];
      for (let i = 0; i < keys.length; i += 500) { const c = {}; keys.slice(i, i + 500).forEach((k2) => { c[k2] = null; }); chunks.push(c); }
      chunks.reduce((pr, c) => pr.then(() => db.ref().update(c)), Promise.resolve())
        .then(() => { closeModal(); toast('Deleted ' + keys.length + ' item' + (keys.length === 1 ? '' : 's')); load(); })
        .catch((e) => { go.disabled = false; go.textContent = 'Delete permanently';
          $modal.insertAdjacentHTML('beforeend', '<p class="err">' + esc(/permission/i.test(e.message || '') ? 'Permission denied — check the admin rules in Firebase.' : e.message) + '</p>'); });
    };
  }

  function renderPlayers() {
    const now = Date.now(), DAY = 86400000;
    const google = PLAYERS.filter((p) => !p.guest).length;
    const k = (v, l) => '<div class="kpi"><b>' + v + '</b><span>' + l + '</span></div>';
    const list = filtered();
    let h = '<div class="kpis">' + k(PLAYERS.length, 'Players') + k(google, 'Google') + k(PLAYERS.length - google, 'Guests') +
      k(PLAYERS.filter((p) => now - p.last < DAY).length, 'Active 24h') + k(PLAYERS.filter((p) => now - p.last < 7 * DAY).length, 'Active 7 days') +
      k(fmtNum(PLAYERS.reduce((s, p) => s + p.attempts.length, 0)), 'Plays') + k(fmtDur(PLAYERS.reduce((s, p) => s + p.time, 0)), 'Time played') + '</div>';
    h += '<div class="tools"><input type="search" id="q" placeholder="Search name or ID…" value="' + esc(S.q) + '">' +
      '<div class="seg">' + [['all', 'All'], ['google', 'Google'], ['guest', 'Guests']].map(([v, l]) => '<button data-type="' + v + '" class="' + (S.type === v ? 'on' : '') + '">' + l + '</button>').join('') + '</div>' +
      (() => { const cnt = {}; PLAYERS.forEach((p) => { cnt[p.cc || ''] = (cnt[p.cc || ''] || 0) + 1; });
        return '<select id="ccSel" aria-label="Country"><option value="all">🌍 All countries</option>' + Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).map((c) =>
          '<option value="' + esc(c) + '"' + (S.cc === c ? ' selected' : '') + '>' + esc(ccName(c)) + ' (' + cnt[c] + ')</option>').join('') + '</select>'; })() +
      '<select id="sort">' + [['last', 'Last active'], ['first', 'Newest'], ['points', 'Points'], ['plays', 'Plays'], ['time', 'Time played'], ['name', 'Name'], ['country', 'Country']].map(([v, l]) => '<option value="' + v + '"' + (S.sort === v ? ' selected' : '') + '>Sort: ' + l + '</option>').join('') + '</select>' +
      '<button id="csv">⬇ CSV</button><button id="reload">↻ Refresh</button>' +
      '<button class="danger" id="delsel"' + (S.sel.size ? '' : ' disabled') + '>🗑 Delete selected (' + S.sel.size + ')</button></div>';
    if (!list.length) h += '<div class="card empty">No players match.</div>';
    else {
      const allSel = list.every((p) => S.sel.has(p.key));
      h += '<table><thead><tr><th style="width:34px"><input type="checkbox" id="selall"' + (allSel ? ' checked' : '') + ' aria-label="Select all shown"></th><th>Player</th><th class="hide-sm">Type</th><th>Country</th>' +
        '<th class="num">Points</th><th class="num hide-sm">Plays</th><th class="num hide-sm">Time</th><th class="num">Last active</th></tr></thead><tbody>' +
        list.slice(0, 500).map((p) => '<tr class="row" data-key="' + esc(p.key) + '"><td><input type="checkbox" class="sel" data-key="' + esc(p.key) + '"' + (S.sel.has(p.key) ? ' checked' : '') + ' aria-label="Select"></td>' +
          '<td><div class="nm">' + avatar(p) + '<div style="min-width:0"><div><b>' + esc(p.name) + '</b></div><div class="key">' + esc(p.key) + '</div></div></div></td>' +
          '<td class="hide-sm"><span class="tag ' + (p.guest ? 'u">Guest' : 'g">Google') + '</span></td>' +
          '<td title="' + esc(ccName(p.cc)) + '">' + flag(p.cc) + ' <span class="hide-sm">' + esc(p.cc ? ccName(p.cc) : '') + '</span></td>' +
          '<td class="num">' + fmtNum(p.points) + '</td><td class="num hide-sm">' + p.attempts.length + '</td><td class="num hide-sm">' + fmtDur(p.time) + '</td>' +
          '<td class="num" title="' + esc(fmtDate(p.last)) + '">' + ago(p.last) + '</td></tr>').join('') + '</tbody></table>' +
        (list.length > 500 ? '<p class="muted">Showing 500 of ' + list.length + ' — use search to narrow down.</p>' : '');
    }
    $app.innerHTML = tabsHtml() + h; bindTabs();
    const q = document.getElementById('q');
    q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); };
    $app.querySelectorAll('[data-type]').forEach((b) => b.onclick = () => { S.type = b.dataset.type; render(); });
    document.getElementById('sort').onchange = (e) => { S.sort = e.target.value; render(); };
    document.getElementById('ccSel').onchange = (e) => { S.cc = e.target.value; render(); };
    document.getElementById('reload').onclick = load;
    document.getElementById('csv').onclick = () => csv(list);
    document.getElementById('delsel').onclick = () => confirmDelete([...S.sel].map((k2) => BYKEY.get(k2)).filter(Boolean));
    const sa = document.getElementById('selall');
    if (sa) sa.onchange = () => { list.forEach((p) => sa.checked ? S.sel.add(p.key) : S.sel.delete(p.key)); render(); };
    $app.querySelectorAll('.sel').forEach((c) => { c.onclick = (e) => e.stopPropagation(); c.onchange = () => { c.checked ? S.sel.add(c.dataset.key) : S.sel.delete(c.dataset.key); render(); }; });
    $app.querySelectorAll('tr.row').forEach((r) => r.onclick = () => detail(BYKEY.get(r.dataset.key)));
  }
  function csv(list) {
    const q = (v) => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const rows = [['id', 'name', 'type', 'country', 'points', 'best_scores', 'plays', 'sessions', 'time_seconds', 'first_seen', 'last_active']]
      .concat(list.map((p) => [p.key, p.name, p.guest ? 'guest' : 'google', p.cc || '', p.points, p.boards.length, p.attempts.length, p.sessions.length, p.time,
        p.first ? new Date(p.first).toISOString() : '', p.last ? new Date(p.last).toISOString() : '']));
    const blob = new Blob([rows.map((r) => r.map(q).join(',')).join('\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kidsquiz-players.csv'; a.click();
  }

  /* ---------- detail ---------- */
  function closeModal() { $ov.classList.remove('on'); $modal.innerHTML = ''; }
  $ov.onclick = (e) => { if (e.target === $ov) closeModal(); };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
  function detail(p) {
    if (!p) return;
    const li = (a, b) => '<div class="li"><span>' + a + '</span><small>' + b + '</small></div>';
    let h = '<div class="nm" style="gap:12px">' + avatar(p) + '<div><h3>' + esc(p.name) + ' <span class="tag ' + (p.guest ? 'u">Guest' : 'g">Google') + '</span></h3>' +
      '<div class="key">' + esc(p.key) + '</div></div></div>' +
      '<p class="muted" style="margin:10px 0 0">' + flag(p.cc) + ' ' + esc(ccName(p.cc)) + ' · First seen ' + esc(fmtDate(p.first)) + ' · Last active ' + esc(fmtDate(p.last)) + '<br>' +
      fmtNum(p.points) + ' points · ' + p.boards.length + ' best scores · ' + p.attempts.length + ' plays · ' + p.sessions.length + ' visits · ' + fmtDur(p.time) + ' played</p>';
    h += '<h4>Best scores (' + p.boards.length + ')</h4>' + (p.boards.length ? '<div class="list">' + p.boards.map((b) =>
      li(esc(CAT[b.cat] || b.cat) + ' · ' + esc(b.game.replace(/__/g, ' · ')), '<b>' + fmtNum(b.score) + '</b>' + (b.lower ? ' (low)' : '') + ' · ' + esc(ago(b.at)))).join('') + '</div>' : '<p class="muted">None</p>');
    h += '<h4>Recent plays (' + p.attempts.length + ')</h4>' + (p.attempts.length ? '<div class="list">' + p.attempts.slice(0, 50).map((a) =>
      li(esc(CAT[a.cat] || a.cat || '') + ' · ' + esc(a.title || String(a.game || '').replace(/__/g, ' · ')), 'score ' + esc(fmtNum(a.score)) + (a.dur ? ' · ' + fmtDur(a.dur) : '') + ' · ' + esc(fmtDate(a.at)))).join('') + '</div>' : '<p class="muted">None</p>');
    h += '<h4>Visits (' + p.sessions.length + ')</h4>' + (p.sessions.length ? '<div class="list">' + p.sessions.slice(0, 30).map((s) =>
      li(esc(fmtDate(s.start)), fmtDur(s.dur) + ' · ' + s.pages + ' page' + (s.pages === 1 ? '' : 's'))).join('') + '</div>' : '<p class="muted">None</p>');
    h += '<div class="actions"><button id="cl">Close</button><button class="danger" id="del">🗑 Delete this player\'s data</button></div>';
    $modal.innerHTML = h; $ov.classList.add('on');
    document.getElementById('cl').onclick = closeModal;
    document.getElementById('del').onclick = () => confirmDelete([p]);
  }

  /* ---------- delete ---------- */
  function confirmDelete(players) {
    if (!players.length) return;
    const nB = players.reduce((s, p) => s + p.boards.length, 0), nA = players.reduce((s, p) => s + p.attempts.length, 0), nS = players.reduce((s, p) => s + p.sessions.length, 0);
    const who = players.length === 1 ? '<b>' + esc(players[0].name) + '</b> <span class="key">(' + esc(players[0].key) + ')</span>' : '<b>' + players.length + ' players</b>';
    $modal.innerHTML = '<h3>Delete data for ' + who + '?</h3><p class="muted">This permanently removes it from Firebase and can\'t be undone.</p>' +
      '<div class="checks"><label><input type="checkbox" id="cB" checked> Best scores / leaderboard entries (' + nB + ')</label>' +
      '<label><input type="checkbox" id="cA" checked> Play history (' + nA + ')</label>' +
      '<label><input type="checkbox" id="cS" checked> Visits / time played (' + nS + ')</label></div>' +
      '<p style="margin:14px 0 0">Type <b>DELETE</b> to confirm:</p><input class="confirm-in" id="cIn" autocomplete="off" placeholder="DELETE">' +
      '<p class="muted" style="font-size:13px">Their Google sign-in account itself stays; remove it in Firebase console → Authentication if needed.</p>' +
      '<div class="actions"><button id="cn">Cancel</button><button class="danger" id="go" disabled>Delete permanently</button></div>';
    $ov.classList.add('on');
    const go = document.getElementById('go'), inp = document.getElementById('cIn');
    inp.oninput = () => { go.disabled = inp.value.trim() !== 'DELETE'; };
    inp.focus();
    document.getElementById('cn').onclick = closeModal;
    go.onclick = () => {
      const wB = document.getElementById('cB').checked, wA = document.getElementById('cA').checked, wS = document.getElementById('cS').checked;
      const up = {};
      players.forEach((p) => {
        if (wB) p.boards.forEach((b) => { up[b.path] = null; });
        if (wA) up['attempts/' + p.key] = null;
        if (wS) up['sessions/' + p.key] = null;
      });
      if (!Object.keys(up).length) { closeModal(); return; }
      go.disabled = true; go.textContent = 'Deleting…';
      db.ref().update(up).then(() => {
        players.forEach((p) => S.sel.delete(p.key));
        closeModal(); toast('Deleted data for ' + (players.length === 1 ? players[0].name : players.length + ' players'));
        load();
      }).catch((e) => {
        go.disabled = false; go.textContent = 'Delete permanently';
        const msg = e && /permission/i.test(e.message || e.code || '') ? 'Permission denied — check the admin rules in Firebase (admin/README-admin.md).' : (e.message || String(e));
        $modal.insertAdjacentHTML('beforeend', '<p class="err">' + esc(msg) + '</p>');
      });
    };
  }
})();
</script>
</body>
</html>
