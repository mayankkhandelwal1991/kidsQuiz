<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<link rel="icon" href="../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../images/favicon/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Kids Quiz – free on Google Play</title>
<meta property="og:title" content="Kids Quiz – learn & play">
<meta property="og:description" content="Fun quizzes, 50+ games and Olympiad practice for LKG – Class 5. Free on Google Play.">
<meta property="og:image" content="https://mayankkhandelwal1991.github.io/kidsQuiz/PlayStoreThings/store-listing/feature-graphic.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;text-align:center}
  .c{padding:24px}img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 24px rgba(0,0,0,.25)}
  a{display:inline-block;margin-top:16px;background:#fff;color:#6d28d9;font-weight:800;border-radius:999px;padding:12px 22px;text-decoration:none}
</style>
</head><body>
<div class="c"><img src="../images/app-logo.png" alt="Kids Quiz"><h1>Kids Quiz</h1><p>Opening Google Play…</p><a id="go" href="https://play.google.com/store/apps/details?id=com.mk.kidsquiz">Get it on Google Play</a></div>
<script>
/* Tracking link for posts:  /kidsQuiz/app/?s=ig&m=reel&p=<post code>
     s = network (ig, fb, yt, wa, web, school …)   m = post | reel | story | bio …
     p = the post code made by the Instagram Studio
   1. counts the click in Firebase: promo/clicks/<p>/<auto id> = { t, s, m }
   2. opens Google Play with  referrer=utm_source=…&utm_medium=…&utm_campaign=<p>
      -> Play Console shows installs per source / campaign. */
(function () {
  var q = new URLSearchParams(location.search);
  var clean = function (v, d) { v = String(v || '').toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, 24); return v || d; };
  var NET = { ig: 'instagram', fb: 'facebook', yt: 'youtube', wa: 'whatsapp', tw: 'x', web: 'website' };
  var s = clean(q.get('s') || q.get('utm_source'), 'direct'), m = clean(q.get('m') || q.get('utm_medium'), 'link'), p = clean(q.get('p') || q.get('utm_campaign'), 'none');
  var ref = 'utm_source=' + (NET[s] || s) + '&utm_medium=' + m + '&utm_campaign=' + p;
  var play = 'https://play.google.com/store/apps/details?id=com.mk.kidsquiz&referrer=' + encodeURIComponent(ref);
  document.getElementById('go').href = play;
  var done = false, go = function () { if (!done) { done = true; location.replace(play); } };
  try {
    fetch('https://kidsgames-3987c-default-rtdb.asia-southeast1.firebasedatabase.app/promo/clicks/' + p + '.json', {
      method: 'POST', keepalive: true, body: JSON.stringify({ t: { '.sv': 'timestamp' }, s: s, m: m })
    }).then(go, go);
  } catch (e) {}
  setTimeout(go, 900);   // never wait long for the counter
})();
</script>
</body></html>
