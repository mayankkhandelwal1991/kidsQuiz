<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Master</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: rise 15s infinite ease-in;
        }

        @keyframes rise {
            to {
                bottom: 110%;
                transform: translateX(100px) rotate(360deg);
            }
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .game-header {
            text-align: center;
            margin-bottom: 30px;
            animation: slideDown 0.8s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: white;
            font-size: 3em;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .stats-container {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            min-width: 120px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .game-board {
            display: grid;
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            perspective: 1000px;
        }

        .card {
            aspect-ratio: 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1);
            animation: cardEntrance 0.6s ease-out backwards;
        }

        @keyframes cardEntrance {
            from {
                opacity: 0;
                transform: scale(0.3) rotateY(180deg);
            }
            to {
                opacity: 1;
                transform: scale(1) rotateY(0deg);
            }
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card.matched {
            animation: matchPulse 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes matchPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1) rotateY(180deg);
            }
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            transition: box-shadow 0.3s ease;
        }

        .card:hover .card-face {
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transform: rotateY(180deg);
        }

        .card-back {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            position: relative;
            overflow: hidden;
        }

        .card-back::before {
            content: "?";
            color: white;
            font-size: 2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .card-back::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255, 255, 255, 0.1) 10px,
                rgba(255, 255, 255, 0.1) 20px
            );
            animation: shimmer 3s linear infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translate(-50%, -50%);
            }
            100% {
                transform: translate(0%, 0%);
            }
        }

        .start-screen, .game-over-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal-content {
            background: white;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: scaleIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.5) rotate(-5deg);
                opacity: 0;
            }
            to {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .modal-content h2 {
            font-size: 2.5em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .modal-content p {
            font-size: 1.2em;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 5px;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        .difficulty-selector {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 12px 25px;
            font-size: 1em;
        }

        .difficulty-btn.selected {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            transform: scale(1.05);
        }

        .combo-display {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 30px 50px;
            border-radius: 20px;
            font-size: 3em;
            font-weight: bold;
            z-index: 999;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: comboPopup 1s ease-out forwards;
            pointer-events: none;
        }

        @keyframes comboPopup {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1) translateY(-100px);
            }
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 998;
            font-size: 2em;
            animation: particleFloat 1.5s ease-out forwards;
        }

        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(-200px) scale(0.5) rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        .timer {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .timer .stat-value {
            color: #f5576c;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }

            .stats-container {
                gap: 10px;
            }

            .stat-box {
                padding: 10px 20px;
                min-width: 80px;
            }

            .stat-value {
                font-size: 1.5em;
            }

            .game-board {
                gap: 10px;
                padding: 10px;
            }

            .card-face {
                font-size: 2em;
                border-radius: 15px;
            }

            .modal-content {
                padding: 30px 20px;
            }

            .modal-content h2 {
                font-size: 2em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }

        .level-complete {
            animation: levelUp 1s ease-out;
        }

        @keyframes levelUp {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="background-animation" id="bubbleContainer"></div>
    
    <div class="container">
        <div class="game-header">
            <h1>🎮 Memory Match Master</h1>
            
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-label">Level</div>
                    <div class="stat-value" id="levelDisplay">1</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="levelProgress"></div>
                    </div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Score</div>
                    <div class="stat-value" id="scoreDisplay">0</div>
                </div>
                
                <div class="stat-box">
                    <div class="stat-label">Combo</div>
                    <div class="stat-value" id="comboDisplay">0x</div>
                </div>
                
                <div class="stat-box timer">
                    <div class="stat-label">Time</div>
                    <div class="stat-value" id="timerDisplay">0:00</div>
                </div>
            </div>
        </div>
        
        <div class="game-board" id="gameBoard"></div>
    </div>

    <div class="start-screen" id="startScreen">
        <div class="modal-content">
            <h2>🎯 Memory Match Master</h2>
            <p>Match all the pairs to advance through levels! Build combos for bonus points!</p>
            
            <div class="difficulty-selector">
                <button class="difficulty-btn selected" data-difficulty="easy">Easy (4x4)</button>
                <button class="difficulty-btn" data-difficulty="medium">Medium (4x5)</button>
                <button class="difficulty-btn" data-difficulty="hard">Hard (6x6)</button>
            </div>
            
            <button id="startButton">Start Game</button>
        </div>
    </div>

    <div class="game-over-screen hidden" id="gameOverScreen">
        <div class="modal-content">
            <h2 id="gameOverTitle">🎉 Level Complete!</h2>
            <p id="gameOverMessage"></p>
            <div class="stats-container">
                <div class="stat-box">
                    <div class="stat-label">Final Score</div>
                    <div class="stat-value" id="finalScore">0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">Time</div>
                    <div class="stat-value" id="finalTime">0:00</div>
                </div>
            </div>
            <button id="nextLevelButton">Next Level</button>
            <button id="restartButton">Restart</button>
        </div>
    </div>

    <script>
        // Audio Context for sound effects
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = frequency;
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playMatchSound() {
            playSound(523.25, 0.2, 'sine');
            setTimeout(() => playSound(659.25, 0.2, 'sine'), 100);
        }

        function playFlipSound() {
            playSound(440, 0.1, 'square');
        }

        function playComboSound(combo) {
            const baseFreq = 440;
            for (let i = 0; i < Math.min(combo, 5); i++) {
                setTimeout(() => playSound(baseFreq * (1 + i * 0.2), 0.15, 'sine'), i * 80);
            }
        }

        function playLevelUpSound() {
            playSound(523.25, 0.2, 'sine');
            setTimeout(() => playSound(659.25, 0.2, 'sine'), 150);
            setTimeout(() => playSound(783.99, 0.3, 'sine'), 300);
        }

        // Game State
        const game = {
            level: 1,
            score: 0,
            combo: 0,
            flippedCards: [],
            matchedPairs: 0,
            totalPairs: 0,
            isProcessing: false,
            startTime: null,
            timerInterval: null,
            difficulty: 'easy',
            gridSizes: {
                easy: { rows: 4, cols: 4 },
                medium: { rows: 4, cols: 5 },
                hard: { rows: 6, cols: 6 }
            }
        };

        // Emoji sets for cards
        const emojiSets = [
            ['🐶', '🐱', '🐭', '🐹', '🐰', '🦊', '🐻', '🐼', '🐨', '🐯', '🦁', '🐮', '🐷', '🐸', '🐵', '🦄', '🦋', '🐝'],
            ['🍎', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍒', '🍑', '🥝', '🥑', '🍆', '🥕', '🌽', '🥔', '🥦', '🍅', '🥒'],
            ['⚽', '🏀', '🏈', '⚾', '🎾', '🏐', '🏉', '🎱', '🏓', '🏸', '🥊', '🎯', '🎪', '🎨', '🎭', '🎪', '🎸', '🎺'],
            ['🚗', '🚕', '🚙', '🚌', '🚎', '🏎️', '🚓', '🚑', '🚒', '🚐', '🚚', '🚛', '🚜', '🏍️', '🚲', '✈️', '🚁', '🚂']
        ];

        function getEmojisForLevel(level, pairCount) {
            const setIndex = Math.floor((level - 1) / 3) % emojiSets.length;
            const emojis = [...emojiSets[setIndex]];
            return emojis.slice(0, pairCount);
        }

        function createBubbles() {
            const container = document.getElementById('bubbleContainer');
            for (let i = 0; i < 10; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 100 + 50;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + '%';
                bubble.style.animationDelay = Math.random() * 15 + 's';
                bubble.style.animationDuration = (Math.random() * 10 + 10) + 's';
                container.appendChild(bubble);
            }
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function createBoard() {
            const board = document.getElementById('gameBoard');
            board.innerHTML = '';
            
            const gridSize = game.gridSizes[game.difficulty];
            const totalCards = gridSize.rows * gridSize.cols;
            game.totalPairs = totalCards / 2;
            
            board.style.gridTemplateColumns = `repeat(${gridSize.cols}, 1fr)`;
            
            const emojis = getEmojisForLevel(game.level, game.totalPairs);
            const cardPairs = [...emojis, ...emojis];
            const shuffledCards = shuffleArray(cardPairs);
            
            shuffledCards.forEach((emoji, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.dataset.emoji = emoji;
                card.dataset.index = index;
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="card-face card-front">${emoji}</div>
                    <div class="card-face card-back"></div>
                `;
                
                card.addEventListener('click', () => handleCardClick(card));
                board.appendChild(card);
            });
        }

        function handleCardClick(card) {
            if (game.isProcessing || 
                card.classList.contains('flipped') || 
                card.classList.contains('matched') ||
                game.flippedCards.length >= 2) {
                return;
            }
            
            playFlipSound();
            card.classList.add('flipped');
            game.flippedCards.push(card);
            
            if (game.flippedCards.length === 2) {
                game.isProcessing = true;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = game.flippedCards;
            const emoji1 = card1.dataset.emoji;
            const emoji2 = card2.dataset.emoji;
            
            if (emoji1 === emoji2) {
                setTimeout(() => {
                    card1.classList.add('matched');
                    card2.classList.add('matched');
                    game.matchedPairs++;
                    game.combo++;
                    
                    playMatchSound();
                    updateCombo();
                    
                    const baseScore = 100;
                    const comboBonus = game.combo * 50;
                    const levelBonus = game.level * 25;
                    const totalScore = baseScore + comboBonus + levelBonus;
                    
                    game.score += totalScore;
                    updateScore();
                    
                    if (game.combo > 1) {
                        showComboPopup(game.combo);
                        playComboSound(game.combo);
                    }
                    
                    createParticles(card1);
                    createParticles(card2);
                    
                    game.flippedCards = [];
                    game.isProcessing = false;
                    
                    if (game.matchedPairs === game.totalPairs) {
                        setTimeout(() => levelComplete(), 500);
                    }
                }, 600);
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    game.flippedCards = [];
                    game.isProcessing = false;
                    game.combo = 0;
                    updateCombo();
                }, 1000);
            }
        }

        function createParticles(card) {
            const rect = card.getBoundingClientRect();
            const particles = ['✨', '⭐', '💫', '🌟', '✨'];
            
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.textContent = particles[Math.floor(Math.random() * particles.length)];
                particle.style.left = rect.left + rect.width / 2 + 'px';
                particle.style.top = rect.top + rect.height / 2 + 'px';
                particle.style.animationDelay = `${i * 0.1}s`;
                
                const angle = (Math.PI * 2 * i) / 5;
                const distance = 100;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 1500);
            }
        }

        function showComboPopup(combo) {
            const popup = document.createElement('div');
            popup.className = 'combo-display';
            popup.textContent = `${combo}x COMBO! 🔥`;
            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 1000);
        }

        function updateScore() {
            document.getElementById('scoreDisplay').textContent = game.score;
        }

        function updateCombo() {
            document.getElementById('comboDisplay').textContent = game.combo + 'x';
        }

        function updateLevel() {
            document.getElementById('levelDisplay').textContent = game.level;
            const progress = ((game.matchedPairs / game.totalPairs) * 100);
            document.getElementById('levelProgress').style.width = progress + '%';
        }

        function startTimer() {
            game.startTime = Date.now();
            game.timerInterval = setInterval(updateTimer, 100);
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - game.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            document.getElementById('timerDisplay').textContent = 
                `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function stopTimer() {
            if (game.timerInterval) {
                clearInterval(game.timerInterval);
                game.timerInterval = null;
            }
        }

        function getElapsedTime() {
            const elapsed = Math.floor((Date.now() - game.startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function levelComplete() {
            stopTimer();
            playLevelUpSound();
            
            const timeBonus = Math.max(0, 1000 - ((Date.now() - game.startTime) / 10));
            game.score += Math.floor(timeBonus);
            
            document.getElementById('gameOverTitle').textContent = '🎉 Level Complete!';
            document.getElementById('gameOverMessage').textContent = 
                `Amazing! You completed level ${game.level}! Ready for the next challenge?`;
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('finalTime').textContent = getElapsedTime();
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function nextLevel() {
            game.level++;
            game.matchedPairs = 0;
            game.combo = 0;
            game.flippedCards = [];
            
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            updateLevel();
            updateCombo();
            createBoard();
            startTimer();
        }

        function restartGame() {
            game.level = 1;
            game.score = 0;
            game.matchedPairs = 0;
            game.combo = 0;
            game.flippedCards = [];
            
            document.getElementById('gameOverScreen').classList.add('hidden');
            
            updateScore();
            updateLevel();
            updateCombo();
            createBoard();
            startTimer();
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            game.startTime = Date.now();
            createBoard();
            startTimer();
        }

        // Event Listeners
        document.getElementById('startButton').addEventListener('click', startGame);
        document.getElementById('nextLevelButton').addEventListener('click', nextLevel);
        document.getElementById('restartButton').addEventListener('click', restartGame);

        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('selected'));
                this.classList.add('selected');
                game.difficulty = this.dataset.difficulty;
            });
        });

        // Initialize
        createBubbles();
        updateScore();
        updateLevel();
        updateCombo();
    </script>
</body>
</html>
