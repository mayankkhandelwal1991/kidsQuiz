<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super Over Cricket</title>
</head><body>
<script src="../threed/kq3d.js?v=20261123d"></script>
<script src="../ads.js"></script>
<script>
/* Super Over Cricket — chase the target in 6 balls with 2 wickets.
   Tap when the ball reaches the glowing zone: perfect = SIX, good = FOUR. */
const TEAMS = [{ icon: '🇮🇳', name: 'India', col: '#2563eb' }, { icon: '🇦🇺', name: 'Australia', col: '#eab308' }, { icon: '🇬🇧', name: 'England', col: '#1e3a8a' }];
const G = KQ3D.init({
  id: 'cricket_superover', title: 'Super Over Cricket', bestKey: 'cricketBest', music: true,
  hero: ['🏏', '🇮🇳', '🏆'], colors: ['#16a34a', '#2563eb'],
  how: [['🏏', 'Tap (or press Space) to swing the bat'], ['🎯', 'Hit when the ball reaches the glowing zone'], ['6️⃣', 'Perfect timing = SIX! Good timing = FOUR'], ['🏆', 'Chase the target in 6 balls — you have 2 wickets']],
  hud: [{ id: 'need', icon: '🎯' }, { id: 'balls', icon: '⚾' }, { id: 'wk', icon: '🏏' }], scoreIcon: '🏏', stars: [150, 300, 450],
  pick: { label: 'Pick your team', options: TEAMS },
  onReset: (t) => reset(t)
});
const C = KQ3D.canvas(G.scene), ctx = C.ctx;
let team = G.choice || TEAMS[0], runs, target, ballNo, wkts, phase, t, dur, swingT, ball, result, resultT, fly, cheer, onStumps, spin, log, played = 0;
function reset(tm) { team = tm || TEAMS[0]; runs = 0; ballNo = 0; wkts = 0; target = 14 + Math.floor(Math.random() * 9) + played * 2; log = []; G.score(0); upd(); nextBall(); }
function upd() { G.hudSet('need', Math.max(0, target - runs)); G.hudSet('balls', 6 - ballNo); G.hudSet('wk', 2 - wkts); }
function nextBall() { phase = 'runup'; t = 0; swingT = 0; result = null; fly = null; spin = Math.random() < 0.4; dur = spin ? 1.35 : Math.max(0.85, 1.1 - ballNo * 0.03); onStumps = Math.random() < 0.55; ball = { line: onStumps ? (Math.random() - 0.5) * 0.12 : (Math.random() < 0.5 ? -1 : 1) * (0.25 + Math.random() * 0.15) }; }
function geo() { const w = C.w, h = C.h; return { bx: w / 2, by: h * 0.28, kx: w / 2, ky: h * 0.78, pw: Math.min(w * 0.36, 180) }; }
function swing() {
  if (G.state !== 'play' || swingT > 0 || phase === 'result') return;
  swingT = 0.001; KQ3D.sfx('whoosh');
  if (phase !== 'flight') return;
  const d = Math.abs(t - 0.93);
  let r;
  if (t < 0.8 || t > 1.02) r = 'miss';
  else if (d < 0.025) r = 6; else if (d < 0.05) r = 4; else if (d < 0.075) r = 2; else if (d < 0.1) r = 1; else r = 'miss';
  if (r === 'miss') return;   // swung and missed — the ball carries on
  score(r);
}
function score(r) {
  phase = 'result'; result = r; resultT = 1.8; runs += r; G.score(runs * 10); log.push(String(r));
  const g = geo(), a = (Math.random() - 0.5) * 2.2;
  fly = { x: g.kx, y: g.ky - 40, vx: Math.sin(a) * (r >= 4 ? 900 : 380), vy: -(r === 6 ? 1100 : r === 4 ? 420 : 300), h: 0, vh: r === 6 ? 900 : 120 };
  KQ3D.sfx(r === 6 ? 'win' : r === 4 ? 'coin' : 'pop'); cheer = r >= 4 ? 1.6 : 0.5;
  G.pop(r === 6 ? 'SIX! 🎉' : r === 4 ? 'FOUR! 🔥' : r + (r === 1 ? ' run' : ' runs'), null, C.h * 0.4, r >= 4 ? '#fde047' : '#fff');
  if (r === 6) try { if (window.KQFX) KQFX.celebrate({ power: 0.5 }); } catch (e) {}
  upd();
}
function endBall() {
  ballNo++; upd();
  if (runs >= target) return finish(true);
  if (wkts >= 2 || ballNo >= 6) return finish(false);
  G.later(() => { nextBall(); }, 200);
}
function finish(won) {
  played++;
  const final = runs * 10 + (won ? 100 + (6 - ballNo) * 20 + (2 - wkts) * 30 : 0);
  G.over({ score: final, result: won ? 'win' : 'lose', title: won ? team.icon + ' ' + team.name + ' WIN! 🏆' : 'So close! Try again 🏏', lines: ['🏏 ' + runs + '/' + wkts + ' (' + ballNo + ' balls)', '🎯 Target ' + target, log.join(' · ')] });
}
G.scene.addEventListener('pointerdown', swing);
document.addEventListener('keydown', (e) => { if (e.key === ' ' && G.state === 'play') { e.preventDefault(); swing(); } });

function stumps(x, y, s) { ctx.fillStyle = '#fef3c7'; for (let k = -1; k <= 1; k++) ctx.fillRect(x + k * 7 * s - 2 * s, y - 40 * s, 4 * s, 40 * s); ctx.fillStyle = '#f59e0b'; ctx.fillRect(x - 12 * s, y - 42 * s, 24 * s, 3 * s); }
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  const w = C.w, h = C.h, g = geo(), playing = G.state === 'play';
  // ground + crowd
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.22); sky.addColorStop(0, '#38bdf8'); sky.addColorStop(1, '#bae6fd'); ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#334155'; ctx.fillRect(0, h * 0.12, w, h * 0.1);
  const jump = cheer > 0 ? Math.abs(Math.sin(now / 90)) * 6 : 0; cheer = Math.max(0, (cheer || 0) - dt);
  for (let k = 0; k < 18; k++) { const cx = (k + 0.5) * w / 18; ctx.fillStyle = ['#f97316', '#fff', '#22c55e', '#2563eb', '#ef4444'][k % 5]; ctx.beginPath(); ctx.arc(cx, h * 0.17 - (k % 2 ? jump : jump * 0.6), 8, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#16a34a'; ctx.fillRect(0, h * 0.22, w, h);
  for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? '#15803d' : '#16a34a'; ctx.fillRect(0, h * 0.22 + k * (h * 0.78 / 8), w, h * 0.78 / 8); }
  // pitch (perspective)
  ctx.fillStyle = '#d6b37a'; ctx.beginPath(); ctx.moveTo(g.bx - g.pw * 0.3, g.by - 30); ctx.lineTo(g.bx + g.pw * 0.3, g.by - 30); ctx.lineTo(g.kx + g.pw * 0.55, g.ky + 30); ctx.lineTo(g.kx - g.pw * 0.55, g.ky + 30); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(g.kx - g.pw * 0.5, g.ky - 26); ctx.lineTo(g.kx + g.pw * 0.5, g.ky - 26); ctx.stroke();
  stumps(g.bx, g.by, 0.5);
  // hitting zone glow
  if (phase === 'flight') { const a = Math.max(0, 1 - Math.abs(t - 0.93) * 8); ctx.fillStyle = 'rgba(253,224,71,' + (0.25 + a * 0.5) + ')'; ctx.beginPath(); ctx.ellipse(g.kx, g.ky - 34, g.pw * 0.45, 18, 0, 0, 7); ctx.fill(); }
  // bowler
  const run = phase === 'runup' ? t / 0.9 : 1;
  KQ3D.drawPic(ctx, '🏃', g.bx + 26, g.by - 30 - (1 - run) * 30 + Math.abs(Math.sin(now / 80)) * 4 * (phase === 'runup' ? 1 : 0), 40);
  if (playing || G.state === 'menu') {
    if (phase === 'runup') { t += dt; if (t >= 0.9) { phase = 'flight'; t = 0; KQ3D.sfx('tick'); } }
    else if (phase === 'flight') {
      t += dt / dur;
      if (t > 1.15) {
        phase = 'result'; resultT = 1.4;
        if (onStumps) { wkts++; result = 'OUT'; log.push('W'); KQ3D.sfx('lose'); G.flash('#fecaca'); G.pop('BOWLED! OUT 😮', null, C.h * 0.4, '#fecaca'); }
        else { result = 'dot'; log.push('•'); KQ3D.sfx('tap'); G.pop('Dot ball', null, C.h * 0.4, '#fff'); }
        upd();
      }
    } else if (phase === 'result' && G.state === 'play') { resultT -= dt; if (resultT <= 0) { phase = 'wait'; endBall(); } }
    if (G.state === 'menu' && phase === 'result') nextBall();
  }
  // ball
  if (phase === 'flight') {
    const tt = Math.min(1.15, t), bounce = 0.68;
    const x = g.bx + (g.kx - g.bx + ball.line * g.pw * 2) * tt + (spin && tt > bounce ? (tt - bounce) * 40 * Math.sign(-ball.line || 1) : 0);
    const groundY = g.by + (g.ky - 30 - g.by) * tt;
    const air = tt < bounce ? (1 - tt / bounce) * 50 + Math.sin(tt / bounce * Math.PI) * 10 : Math.sin((tt - bounce) / (1 - bounce) * Math.PI) * 22;
    const s = 0.45 + tt * 0.75;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x, groundY, 7 * s, 3 * s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(x, groundY - air, 8 * s, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x, groundY - air, 8 * s, -0.6, 0.6); ctx.stroke();
  }
  if (fly) { fly.x += fly.vx * dt; fly.y += fly.vy * dt; fly.vy *= 0.985; ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(fly.x, fly.y, 9, 0, 7); ctx.fill(); }
  // batter + stumps
  stumps(g.kx, g.ky + 6, 1);
  if (result === 'OUT') { ctx.fillStyle = '#fef3c7'; ctx.save(); ctx.translate(g.kx, g.ky - 34); ctx.rotate(0.6); ctx.fillRect(-12, -4, 24, 4); ctx.restore(); }
  const sw = swingT > 0 ? Math.min(1, swingT / 0.25) : 0; if (swingT > 0) { swingT += dt; if (swingT > 0.5) swingT = 0; }
  KQ3D.drawPic(ctx, '🧒', g.kx + 34, g.ky - 54, 60);
  ctx.save(); ctx.translate(g.kx + 22, g.ky - 40); ctx.rotate(-1.2 + sw * 2.2); KQ3D.drawPic(ctx, '🏏', -10, 24, 54, 0.6); ctx.restore();
  KQ3D.drawPic(ctx, team.icon, 34, 100, 34);
  // score board
  ctx.fillStyle = 'rgba(15,23,42,.75)'; KQ3D.roundRect(ctx, w / 2 - 130, h * 0.83, 260, 44, 14); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = '800 18px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(team.name + ' ' + runs + '/' + wkts + '  ·  need ' + Math.max(0, target - runs) + ' off ' + (6 - ballNo), w / 2, h * 0.83 + 22);
  ctx.textBaseline = 'alphabetic';
  if (playing && phase === 'runup' && ballNo === 0) { ctx.fillStyle = '#fff'; ctx.font = '800 17px "Baloo 2",sans-serif'; ctx.fillText((spin ? 'Spinner' : 'Fast bowler') + ' — tap when the ball reaches the yellow zone!', w / 2, h * 0.95); }
  else if (playing && phase === 'runup') { ctx.fillStyle = '#fff'; ctx.font = '800 16px "Baloo 2",sans-serif'; ctx.fillText(spin ? '🌀 Spin ball' : '⚡ Fast ball', w / 2, h * 0.95); }
}
reset(team);
requestAnimationFrame(frame);
</script>
</body></html>
