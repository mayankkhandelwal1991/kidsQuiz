<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super Over Cricket</title>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js?v=20261126b"></script>
<script>
/* Super Over Cricket — chase the target in 6 balls with 2 wickets.
   Batting view: the camera sits behind the batter, who stands side-on, taps
   the bat and lifts it as the bowler runs in. Tap when the ball reaches the ring:
     on time    -> lofted SIX / FOUR into a gap
     early      -> pulled to the leg side (left), late -> cut to the off side (right)
     a bit off  -> pushed into the field: the batters run 1, and YOU decide if
                   they run again (tap RUN) before the fielder's throw reaches
                   the keeper. Too slow = RUN OUT!
     miss       -> bowled if the ball was on the stumps, else a dot ball
   After a hit the camera flies up to a TV view of the whole ground: the ball,
   the fielders chasing and throwing, the batters running, the crowd.
   All drawn on a 2D canvas with a small 3D camera. World in metres:
   x = right (off side), d = down the pitch towards the bowler, y = up. */
const TEAMS = [
  { icon: '🇮🇳', name: 'India', shirt: '#2563eb', pants: '#1e3a8a', helmet: '#1e3a8a', foe: '#facc15', foeName: 'Australia' },
  { icon: '🇦🇺', name: 'Australia', shirt: '#facc15', pants: '#166534', helmet: '#166534', foe: '#2563eb', foeName: 'India' },
  { icon: '🇬🇧', name: 'England', shirt: '#1e40af', pants: '#f8fafc', helmet: '#1e3a8a', foe: '#16a34a', foeName: 'Pakistan' }
];
const G = KQ3D.init({
  id: 'cricket_superover', title: 'Super Over Cricket', bestKey: 'cricketBest', music: true,
  hero: ['🏏', '🇮🇳', '🏆'], colors: ['#16a34a', '#2563eb'],
  how: [['🏃', 'The bowler runs in — watch the ball bounce'], ['👆', 'Tap (or Space) when the ball reaches the yellow ring'], ['🎯', 'Perfect = SIX! Early hits go left, late hits go right'], ['🧤', 'In the field? Tap RUN for more runs — beat the throw!'], ['🏆', 'Chase the target in 6 balls — you have 2 wickets']],
  hud: [{ id: 'need', icon: '🎯' }, { id: 'balls', icon: '⚾' }, { id: 'wk', icon: '🏏' }], scoreIcon: '🏏', stars: [150, 300, 450],
  pick: { label: 'Pick your team', options: TEAMS },
  onReset: (t) => reset(t)
});
const C = KQ3D.canvas(G.scene), ctx = C.ctx;

/* ---------- the ground ---------- */
const D_STUMPS = 8.8;          // batter's stumps
const D_CREASE = 10;           // batter's popping crease
const D_BAT = 10.35;           // where bat meets ball
const D_FAR_STUMPS = D_STUMPS + 20.12;
const D_RELEASE = D_FAR_STUMPS - 0.9;
const FIELD_C = 19, FIELD_R = 62;              // boundary rope: circle round the middle of the pitch
const NEAR_END = D_CREASE - 0.55, FAR_END = D_FAR_STUMPS - 1.22 + 0.55;   // where runners ground the bat
const RUN_T = 1.9;             // seconds for one run
const F_SPEED = 7.2, THROW_V = 27, HOLD = 0.35, DRAG = 1.1;
const KEEP = { x: 0, d: D_STUMPS - 0.5 };     // the keeper takes throws here
const STRIKER = { x: -0.38, d: D_CREASE + 0.02 };
const OPEN = 0.6;   // the batter's chest turns this much (radians) towards the camera, so you can see his bat
const R1 = FIELD_R + 4.2, R2 = FIELD_R + 22, RB = FIELD_R + 2, Y1 = 1.6, Y2 = 10;
const ring = (a, r, y) => [Math.sin(a) * r, FIELD_C + Math.cos(a) * r, y || 0];
const circle = (r, n, cz) => { const o = []; for (let i = 0; i <= n; i++) { const a = i / n * Math.PI * 2; o.push([Math.sin(a) * r, (cz == null ? FIELD_C : cz) + Math.cos(a) * r, 0]); } return o; };
const DISK = circle(R1, 72), ROPE = circle(FIELD_R, 96), INNER = circle(27.4, 64, (D_STUMPS + D_FAR_STUMPS) / 2);
const BOARDS = ['#ef4444', '#2563eb', '#facc15', '#16a34a', '#f97316', '#a855f7'];
const CROWD = ['#f97316', '#fff', '#22c55e', '#2563eb', '#ef4444', '#facc15'];
const SEGS = 48, STANDS = [];
for (let i = 0; i < SEGS; i++) STANDS.push({ i, a0: (i - 0.5) / SEGS * Math.PI * 2, a1: (i + 0.5) / SEGS * Math.PI * 2, screen: i === 0 || i === SEGS / 2, seats: i % 2 ? '#64748b' : '#56657a', board: BOARDS[i % 6] });

/* ---------- camera: eases between the batting view and a high TV view ---------- */
const cam = { px: 0, pz: 0, py: 3.2, tx: 0, tz: 60, ty: 3.2, fx: 300, fy: 900, cy: 100, b: 0 };
let camMode = 'bowl', camInit = false, CX, CY, FX, FY, cyw = 1, syw = 0, cpt = 1, spt = 0, HZ;
function camWant() {
  const w = C.w, h = C.h, base = Math.min(w, h * 0.62);
  if (camMode === 'bowl') return { px: 0, pz: 0, py: 3.2, tx: 0, tz: 60, ty: 3.2, fx: base * 1.35, fy: h * 1.75, cy: h * 0.2, b: 0 };
  const s = shot || { x: 0, d: FIELD_C, h: 0, r: 1 };
  const f = s.r >= 4 ? 0.8 : 0.45;
  const tx = s.x * f, tz = FIELD_C + (s.d - FIELD_C) * f, ty = Math.min(s.h, 12) * 0.35;
  const px = tx * 0.3, pz = tz - 27, py = 15;
  const F = base * 1.2 * Math.max(1, Math.min(1.6, Math.hypot(tx - px, tz - pz) / 34));
  return { px, pz, py, tx, tz, ty, fx: F, fy: F, cy: h * 0.42, b: 1 };
}
function camStep(dt) {
  const W = camWant(), k = camInit ? 1 - Math.exp(-dt * (camMode === 'bowl' ? 4.5 : 3)) : 1; camInit = true;
  for (const key in W) cam[key] += (W[key] - cam[key]) * k;
  const dx = cam.tx - cam.px, dz = cam.tz - cam.pz, dy = cam.ty - cam.py;
  const yaw = Math.atan2(dx, dz), pitch = Math.atan2(-dy, Math.hypot(dx, dz));   // pitch > 0 = looking down
  cyw = Math.cos(yaw); syw = Math.sin(yaw); cpt = Math.cos(pitch); spt = Math.sin(pitch);
  CX = C.w / 2; CY = cam.cy; FX = cam.fx; FY = cam.fy; HZ = CY - FY * Math.tan(pitch);
}
/* camera space: [right, up, depth] */
function cs(x, d, y) { const rx = x - cam.px, rz = d - cam.pz, ry = (y || 0) - cam.py, X = rx * cyw - rz * syw, Z = rx * syw + rz * cyw; return [X, Z * spt + ry * cpt, Z * cpt - ry * spt]; }
/* screen: [sx, sy, pixels per metre, depth] */
function P(x, d, y) { const c = cs(x, d, y), z = Math.max(c[2], 0.05); return [CX + FX * c[0] / z, CY - FY * c[1] / z, FY / z, c[2]]; }
const NEAR = 0.4;
const sc = (c) => [CX + FX * c[0] / c[2], CY - FY * c[1] / c[2]];
const cut = (a, b) => { const t = (NEAR - a[2]) / (b[2] - a[2]); return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, NEAR]; };
function tracePoly(pts) {   // world polygon -> canvas path, clipped in front of the camera
  const c = pts.map((p) => cs(p[0], p[1], p[2])), o = [];
  for (let i = 0; i < c.length; i++) { const a = c[i], b = c[(i + 1) % c.length], ai = a[2] >= NEAR, bi = b[2] >= NEAR; if (ai) o.push(a); if (ai !== bi) o.push(ai ? cut(b, a) : cut(a, b)); }
  if (o.length < 3) return false;
  ctx.beginPath(); o.forEach((q, i) => { const s = sc(q); i ? ctx.lineTo(s[0], s[1]) : ctx.moveTo(s[0], s[1]); }); ctx.closePath(); return true;
}
function wpoly(pts, fill) { if (tracePoly(pts)) { ctx.fillStyle = fill; ctx.fill(); } }
function wline(pts, col, px) {
  ctx.strokeStyle = col; ctx.lineWidth = px; ctx.beginPath(); let pen = false;
  for (let i = 0; i < pts.length - 1; i++) {
    let a = cs(pts[i][0], pts[i][1], pts[i][2]), b = cs(pts[i + 1][0], pts[i + 1][1], pts[i + 1][2]);
    if (a[2] < NEAR && b[2] < NEAR) { pen = false; continue; }
    if (a[2] < NEAR) { a = cut(a, b); pen = false; }
    let bc = false; if (b[2] < NEAR) { b = cut(b, a); bc = true; }
    const A = sc(a), B = sc(b); if (!pen) ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); pen = !bc;
  }
  ctx.stroke();
}

/* ---------- state ---------- */
let team = G.choice || TEAMS[0], runs, target, ballNo, wkts, log, played = 0;
let phase, pt, ball, del, shot, swing, bails, fielders, cheer = 0, msg = null, ringT = 0, flash = 0;
let rs = null, keeperHas = false, striker = 0, celebrate = 0, bowlerD = D_RELEASE, chaser = null;
const NUMS = ['7', '18'];
const BODY_W = 0.75;   // body width (vs height) in the batting view, whose width is squeezed
const BALL_TYPES = [
  { name: '⚡ Fast', kmh: [128, 142], dur: [0.82, 0.92], spin: 0 },
  { name: '🎯 Medium', kmh: [112, 124], dur: [0.95, 1.05], spin: 0 },
  { name: '🌀 Spin', kmh: [78, 90], dur: [1.2, 1.35], spin: 1 }
];
const LENGTHS = [{ n: 'full', L: 2.4, hb: 0.35 }, { n: 'good', L: 5, hb: 0.75 }, { n: 'short', L: 8, hb: 1.2 }];
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ez = (t) => t * t * (3 - 2 * t);
const L3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function reset(tm) {
  team = tm || TEAMS[0]; runs = 0; ballNo = 0; wkts = 0; log = []; striker = 0;
  target = 14 + Math.floor(Math.random() * 9) + Math.min(played, 4) * 2;
  G.score(0); upd(); placeFielders(); camMode = 'bowl'; nextBall();
}
function upd() { G.hudSet('need', Math.max(0, target - runs)); G.hudSet('balls', 6 - ballNo); G.hudSet('wk', 2 - wkts); }
function placeFielders() {
  // angle 0 = straight down the ground from the bat; the last two stand behind square
  fielders = [[-1.25, 24], [-0.8, 36], [-0.35, 24], [0.25, 36], [0.7, 24], [1.15, 36], [0, 42], [-2.3, 30], [2.4, 32]].map(([a, r]) => {
    const x = Math.sin(a) * r, d = D_BAT + Math.cos(a) * r;
    return { hx: x, hd: d, x, d, mode: 'home', t: Math.random() * 6, mv: 0, delay: 0 };
  });
}
function nextBall() {
  const bt = BALL_TYPES[Math.random() < 0.3 ? 2 : Math.random() < 0.5 ? 0 : 1], len = LENGTHS[Math.floor(Math.random() * 3)];
  const speedUp = 1 - ballNo * 0.02;
  const onStumps = Math.random() < 0.55;
  const xe = onStumps ? rnd(-0.07, 0.07) : rnd(0.24, 0.42) * (Math.random() < 0.8 ? 1 : -1);   // mostly outside off
  const turn = bt.spin ? (Math.random() < 0.5 ? -1 : 1) * rnd(0.1, 0.22) : 0;
  del = {
    type: bt, len, kmh: Math.round(rnd(bt.kmh[0], bt.kmh[1])), dur: rnd(bt.dur[0], bt.dur[1]) * speedUp,
    x0: 0.45, h0: 2.15, xe: xe - turn, turn, db: D_BAT + len.L, onStumps
  };
  ball = null; shot = null; swing = null; bails = null; msg = null; ringT = 0;
  rs = null; keeperHas = false; celebrate = 0; chaser = null; bowlerD = D_RELEASE;
  phase = 'runup'; pt = camMode === 'tv' ? -0.4 : 0;   // a short pause after a TV replay
  if (camMode === 'tv') camInit = false;                // cut straight back to the batting view
  camMode = 'bowl';
  fielders.forEach((f) => { f.x = f.hx; f.d = f.hd; f.mode = 'home'; f.mv = 0; f.delay = 0; });
}
/* ball position at time u (0 = release, 1 = at the bat) */
function ballAt(u) {
  const d = D_RELEASE + (D_BAT - D_RELEASE) * u;
  const ub = (D_RELEASE - del.db) / (D_RELEASE - D_BAT);   // bounce time
  let x, h;
  const xb = del.x0 + (del.xe - del.x0) * ub;
  if (u < ub) { const v = u / ub; x = del.x0 + (xb - del.x0) * v; h = del.h0 * Math.pow(1 - v, 1.25) + 0.25 * v * (1 - v); }
  else { const v = (u - ub) / (1 - ub); x = xb + (del.xe - xb) * v + del.turn * v; h = del.len.hb * (1 - Math.pow(1 - Math.min(v, 1.4), 2)); if (v > 1) h = Math.max(0.05, del.len.hb - (v - 1) * 1.5); }
  return { x, d, h: Math.max(0, h), bounced: u >= ub };
}

/* ---------- batting ---------- */
function tap() {
  if (G.state !== 'play') return;
  if (phase === 'shot') {   // running between the wickets
    const p = runPrompt();
    if (p && p.on) { if (rs.u != null) rs.queued = true; else rs.u = 0; KQ3D.sfx('tap'); }
    return;
  }
  if (swing) return;
  if (phase === 'flight' && del.swung) return;       // one swing per ball
  if (phase !== 'flight' && phase !== 'runup') return;
  swing = { t: 0 }; KQ3D.sfx('whoosh');
  if (phase !== 'flight') return;
  del.swung = true;
  // the bat reaches the ball ~0.09 s after the tap
  const e = (pt + 0.09 / del.dur - 1) * del.dur, q = Math.abs(e);
  let r = null;
  if (q < 0.045) r = 6; else if (q < 0.085) r = 4; else if (q < 0.125) r = 2; else if (q < 0.17) r = 1;
  if (r == null) {
    // just too late on a ball outside off: an edge to the keeper
    if (e > 0 && e < 0.23 && del.xe > 0.18 && Math.random() < 0.45) { swing.edge = true; }
    return;
  }
  swing.hit = { r, e };
  msg = { t: q < 0.045 ? 'PERFECT! 🎯' : e < 0 ? 'Early ⏪' : 'Late ⏩', l: 1.1, c: q < 0.045 ? '#fde047' : '#fff' };
}
G.scene.addEventListener('pointerdown', tap);
document.addEventListener('keydown', (e) => { if (e.key === ' ' && G.state === 'play') { e.preventDefault(); tap(); } });

/* where the ball will be t seconds from now (rolling with drag, or flying straight) */
function travel(s, t) { const k = s.drag ? (1 - Math.exp(-s.drag * t)) / s.drag : t; return { x: s.x + s.vx * k, d: s.d + s.vd * k }; }
function intercept(f, s) {
  const w = f.delay || 0;
  for (let t = 0; t < 8; t += 0.05) { const p = travel(s, t); if (Math.hypot(p.x - f.x, p.d - f.d) / F_SPEED + w <= t) return { t, x: p.x, d: p.d }; }
  const p = travel(s, 8); return { t: 8 + Math.hypot(p.x - f.x, p.d - f.d) / F_SPEED, x: p.x, d: p.d };
}
function ropePoint(s) { for (let t = 0; t < 8; t += 0.05) { const p = travel(s, t); if (Math.hypot(p.x, p.d - FIELD_C) > FIELD_R - 2) return p; } return travel(s, 8); }
const throwT = (x, d) => Math.hypot(x - KEEP.x, d - KEEP.d) / THROW_V + 0.05;
/* seconds until the keeper has the ball */
function etaKeeper() {
  const s = shot; if (!s || !chaser) return 99;
  if (s.state === 'roll') { const ic = intercept(chaser, s); return ic.t + HOLD + throwT(ic.x, ic.d); }
  if (s.state === 'held') return HOLD - s.ht + throwT(s.x, s.d);
  if (s.state === 'throw') return s.T - s.tt;
  return 0;
}
/* fours find the gap between the fielders */
function gapAngle(a) {
  const fa = fielders.map((f) => Math.atan2(f.hx, f.hd - D_BAT));
  let best = a, bs = -1;
  for (let c = a - 0.35; c <= a + 0.35; c += 0.02) { if (Math.abs(c) > 1.45) continue; const m = Math.min(...fa.map((x) => Math.abs(x - c))); if (m > bs) { bs = m; best = c; } }
  return best;
}
function playShot(r, e, from) {
  phase = 'shot'; pt = 0;
  // early -> leg side (left on screen), late -> off side (right), perfect -> straight-ish
  let a = clamp(e / 0.15, -1, 1) * 1.15 + rnd(-0.22, 0.22);
  if (r === 6) a *= 0.55;
  if (r === 4 || r === 2) a = gapAngle(a);       // well-timed shots find the gaps
  const sp = r === 6 ? 31 : r === 4 ? 34 : r === 2 ? 27 : 15;
  shot = { r, x: from.x, d: from.d, h: Math.max(0.6, from.h), vx: Math.sin(a) * sp, vd: Math.cos(a) * sp, vh: r === 6 ? 15 : r === 4 ? 2 : 3,
    air: r === 6, drag: r === 4 ? 0.15 : r === 6 ? 0 : r === 2 ? 0.8 : DRAG, state: 'roll', done: false, trail: [] };
  KQ3D.sfx(r >= 4 ? 'hit' : 'tap');
  if (r <= 2) {
    rs = { n: 0, u: null, queued: false, started: false, ended: false };
    let best = null; fielders.forEach((f) => { const t = intercept(f, shot).t; if (!best || t < best.t) best = { f, t }; });
    chaser = best.f; chaser.mode = 'chase';
    // a soft push is safe for 1 run, a good one for 2 (the fielder is slower to it); one more is risky
    const need = 0.3 + RUN_T * (r === 2 ? 2 : 1) + 0.35, eta = etaKeeper();
    if (eta < need) chaser.delay = need - eta;
  } else {
    // someone chases it to the rope (too late!)
    const p = ropePoint(shot), f = fielders.slice().sort((u, v) => Math.hypot(u.x - p.x, u.d - p.d) - Math.hypot(v.x - p.x, v.d - p.d))[0];
    f.mode = 'go'; f.tx = p.x; f.td = p.d; f.delay = 0.2;
  }
}
function scoreRuns(r) {
  runs += r; G.score(runs * 10); log.push(String(r)); upd();
  cheer = r >= 4 ? 2.5 : 0.6;
  G.pop(r === 6 ? 'SIX! 🎉' : r === 4 ? 'FOUR! 🔥' : r + (r === 1 ? ' run' : ' runs'), null, C.h * 0.42, r >= 4 ? '#fde047' : '#fff');
  KQ3D.sfx(r === 6 ? 'win' : r === 4 ? 'coin' : 'pop');
  if (r === 6) try { if (window.KQFX) KQFX.celebrate({ power: 0.6 }); } catch (e) {}
}
function out(how) {
  wkts++; log.push('W'); upd(); KQ3D.sfx('lose'); G.flash('#fecaca');
  G.pop(how, null, C.h * 0.42, '#fecaca');
}
function endBall(delay) {
  if (phase !== 'shot') phase = 'over';      // in a shot, keep animating the field until the next ball
  G.later(() => {
    ballNo++; upd();
    if (runs >= target) return finish(true);
    if (wkts >= 2 || ballNo >= 6) return finish(false);
    nextBall();
  }, delay);
}
function finish(won) {
  played++;
  const final = runs * 10 + (won ? 100 + (6 - ballNo) * 20 + (2 - wkts) * 30 : 0);
  G.over({ score: final, result: won ? 'win' : 'lose', title: won ? team.icon + ' ' + team.name + ' WIN! 🏆' : 'So close! Try again 🏏', lines: ['🏏 ' + runs + '/' + wkts + ' (' + ballNo + ' balls)', '🎯 Target ' + target, log.join(' · ')] });
}

/* ---------- running between the wickets ---------- */
function runPrompt() {
  if (phase !== 'shot' || !rs || !rs.started || rs.ended || keeperHas || runs + (rs.u != null ? 1 : 0) >= target) return null;
  if (rs.queued) return { t: '✔ Going for ' + (rs.n + 2) + '!', c: '#0ea5e9', on: false };
  if (rs.u != null && rs.u < 0.3) return null;
  const left = (rs.u != null ? (1 - rs.u) * RUN_T : 0) + RUN_T, safe = etaKeeper() > left + 0.1;
  return { t: safe ? '🏃 TAP to RUN again!' : '⚠️ Risky! Run again?', c: safe ? '#16a34a' : '#f97316', on: true };
}
function finishRuns(runout, delay) {
  if (rs.ended) return; rs.ended = true;
  if (!runout) { log.push(rs.n ? String(rs.n) : '•'); G.pop(rs.n + (rs.n === 1 ? ' run' : ' runs'), null, C.h * 0.42, '#fff'); }
  if (rs.n % 2) striker ^= 1;                  // odd runs: the batters swapped ends
  shot.done = true; endBall(delay);
}
function runUpdate() {
  if (rs.ended) return;
  if (!rs.started && pt > 0.3) { rs.started = true; rs.u = 0; }
  if (rs.u == null) return;
  rs.u += dtNow / RUN_T;
  if (rs.u >= 1) {
    rs.n++; rs.u = null; runs++; G.score(runs * 10); upd(); KQ3D.sfx('pop'); cheer = Math.max(cheer, 0.5);
    msg = { t: rs.n + (rs.n === 1 ? ' run ✔' : ' runs ✔'), l: 0.9, c: '#fff' };
    if (runs >= target) { celebrate = 3; finishRuns(false, 1300); return; }
    if (keeperHas) finishRuns(false, 700);
    else if (rs.queued) { rs.queued = false; rs.u = 0; }
  }
}
function keeperGot() {
  const s = shot; s.state = 'keeper'; keeperHas = true; s.trail = []; KQ3D.sfx('tap');
  if (!rs || rs.ended) return;
  if (rs.u != null) {
    if (rs.n === 0) return;                    // first run is never a run out: finish it, then stop
    bails = { t: 0, x: 0 }; rs.u = null; rs.queued = false;
    out('RUN OUT! 😮'); msg = { t: 'Too slow!', l: 1.3, c: '#fecaca' }; finishRuns(true, 1800);
  } else finishRuns(false, 900);
}

/* ---------- update ---------- */
let dtNow = 0;
function update(dt) {
  dtNow = dt;
  if (swing) { swing.t += dt; if (swing.t > 0.7 && phase !== 'shot' && !(phase === 'flight' && (swing.hit || swing.edge))) swing = null; }
  fielders.forEach((f) => {
    f.t += dt; f.mv = 0;
    if (f.mode !== 'chase' && f.mode !== 'go') return;

  ctx.fillStyle = '#3f4f63'; ctx.fillRect(0, 0, w, h);
  if (HZ > 0) { const sky = ctx.createLinearGradient(0, 0, 0, HZ); sky.addColorStop(0, '#38bdf8'); sky.addColorStop(1, '#bae6fd'); ctx.fillStyle = sky; ctx.fillRect(0, 0, w, Math.min(h, HZ)); }
  // grass with mowing stripes
  if (tracePoly(DISK)) {
    ctx.fillStyle = '#16a34a'; ctx.fill(); ctx.save(); ctx.clip();
    for (let z = -48; z < 88; z += 8) wpoly([[-70, z, 0], [70, z, 0], [70, z + 4, 0], [-70, z + 4, 0]], '#15803d');
    ctx.restore();
  }
  ctx.setLineDash([6, 6]); wline(INNER, 'rgba(255,255,255,.45)', 1.5); ctx.setLineDash([]);
  wline(ROPE, flash > 0 ? 'rgba(253,224,71,' + (0.6 + flash * 0.4) + ')' : '#f8fafc', cam.b > 0.5 ? 2.5 : 3);
  // pitch and creases
  wpoly([[-1.5, D_STUMPS - 1.4, 0], [1.5, D_STUMPS - 1.4, 0], [1.5, D_FAR_STUMPS + 1.4, 0], [-1.5, D_FAR_STUMPS + 1.4, 0]], '#d9b77e');
  wpoly([[-1.5, D_STUMPS + 2, 0], [1.5, D_STUMPS + 2, 0], [1.5, D_STUMPS + 6, 0], [-1.5, D_STUMPS + 6, 0]], 'rgba(255,255,255,.06)');
  const lw = (d) => Math.max(1.2, P(0, d, 0)[2] * 0.05);
  [D_CREASE, D_FAR_STUMPS - 1.22].forEach((d) => wline([[-1.9, d, 0], [1.9, d, 0]], '#fff', lw(d)));
  [D_STUMPS, D_FAR_STUMPS].forEach((d) => { wline([[-1.32, d, 0], [1.32, d, 0]], '#fff', lw(d) * 0.8); [-1.32, 1.32].forEach((x) => wline([[x, d - 1.2, 0], [x, d + 1.2, 0]], '#fff', lw(d) * 0.8)); });

  // stands: sight screens at both ends, a crowd that jumps for fours and sixes, advertising boards
  const jumpOn = cheer > 0;
  STANDS.map((s) => ({ s, k: cs(...ring((s.a0 + s.a1) / 2, (R1 + R2) / 2, 5))[2] })).sort((a, b) => b.k - a.k).forEach(({ s }) => {
    wpoly([ring(s.a0, R1, Y1), ring(s.a1, R1, Y1), ring(s.a1, R2, Y2), ring(s.a0, R2, Y2)], s.screen ? '#f8fafc' : s.seats);
    wpoly([ring(s.a0, R1, 0), ring(s.a1, R1, 0), ring(s.a1, R1, Y1), ring(s.a0, R1, Y1)], '#334155');
    if (!s.screen) for (let r = 0; r < 3; r++) for (let j = 0; j < 3; j++) {
      const t = (r + 0.5) / 3, a = s.a0 + (s.a1 - s.a0) * (j + 0.5) / 3, jy = jumpOn ? Math.abs(Math.sin(now / 90 + s.i + j * 2 + r)) * 0.7 : 0;
      const p = P(...ring(a, R1 + (R2 - R1) * t, Y1 + (Y2 - Y1) * t + 0.45 + jy)); if (p[3] < 1) continue;
      ctx.fillStyle = CROWD[(s.i * 7 + r * 3 + j) % 6]; ctx.beginPath(); ctx.arc(p[0], p[1], Math.max(1.2, 0.55 * p[2]), 0, 7); ctx.fill();
    }
    wpoly([ring(s.a0, RB, 0), ring(s.a1, RB, 0), ring(s.a1, RB, 0.9), ring(s.a0, RB, 0.9)], s.board);
  });

  // everyone on the field, far to near
  const items = [], add = (x, d, fn) => { const k = cs(x, d, 0)[2]; if (k > NEAR + 0.2) items.push({ k, fn }); };
  const foe = { shirt: team.foe, pants: '#f8fafc', head: 'cap', cap: '#1e293b' };
  fielders.forEach((f) => {
    let arm = null, holding = false;
    if (f.mode === 'hold') { arm = -2.2; holding = true; }
    else if (f.mode === 'threw') arm = f.tt < 0.25 ? -2.2 + f.tt / 0.25 * 4.2 : 2;
    add(f.x, f.d, () => person(f.x, f.d, Object.assign({ run: f.mv ? f.t * 12 : 0, arm, holding }, foe)));
  });
  add(-1.2, D_FAR_STUMPS + 0.6, () => person(-1.2, D_FAR_STUMPS + 0.6, { shirt: '#f8fafc', pants: '#1e293b', head: 'hat' }));
  add(0, D_FAR_STUMPS, () => stumps3(D_FAR_STUMPS, 0));
  add(0, D_STUMPS, () => stumps3(D_STUMPS, bails ? bails.t : 0));
  // bowler: runs in from far away, then the delivery stride
  let bd, arm = null, runPh = 0, holdingB = false;
  if (phase === 'runup') { const p = clamp(pt / 1.05, 0, 1); bd = D_RELEASE + 9 * (1 - p); runPh = pt * 13; arm = pt > 0.95 ? Math.PI + Math.min(1, (pt - 0.95) / 0.3) * Math.PI : Math.PI * 0.85; holdingB = true; }
  else if (phase === 'flight') { bd = bowlerD; runPh = pt * 8; arm = Math.min(Math.PI * 2.6, Math.PI * 2 + pt * 4); }
  else { bd = bowlerD; arm = Math.PI * 0.9; }
  add(0.45, bd, () => person(0.45, bd, Object.assign({ run: runPh, arm, holding: holdingB }, foe)));
  // keeper: only in the TV view (in the batting view he is behind the camera)
  if (cam.b > 0.5) {
    const kd = phase === 'shot' && !shot.air ? KEEP.d : D_STUMPS - 1.4;
    add(0.05, kd, () => person(0.05, kd, Object.assign({}, foe, { gloves: true, crouch: phase === 'shot' ? 0.2 : 1, arm: keeperHas ? 2.8 : null, holding: keeperHas })));
  }
  for (let i = 0; i < 2; i++) { const m = manPose(i, now); add(m.x, m.d, () => body(m.J)); }
  if (phase === 'flight' && ball) add(ball.x, ball.d, () => drawBall(ball.x, ball.d, ball.h));
  if (phase === 'shot' && shot && shot.state !== 'keeper' && shot.state !== 'gone' && shot.state !== 'held') add(shot.x, shot.d, () => drawBall(shot.x, shot.d, shot.h, shot.trail));
  items.sort((a, b) => b.k - a.k).forEach((it) => it.fn());

  // timing ring where the bat meets the ball: it closes in exactly when the ball arrives
  if (phase === 'flight' && pt < 1.05) {
    const c = P(del.xe + del.turn, D_BAT, del.len.hb), k = c[2], rr = 0.09 * k, left = Math.max(0, 1 - pt);
    ctx.fillStyle = 'rgba(253,224,71,.28)'; ctx.beginPath(); ctx.arc(c[0], c[1], rr * 1.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c[0], c[1], rr * 1.3 + left * k * 0.9, 0, 7); ctx.stroke();
  }

  // messages
  if (msg) { ctx.globalAlpha = Math.min(1, msg.l * 2); ctx.font = '800 26px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(msg.t, w / 2, h * 0.36); ctx.fillStyle = msg.c; ctx.fillText(msg.t, w / 2, h * 0.36); ctx.globalAlpha = 1; }
  if (G.state === 'play' && phase === 'runup' && del && pt > 0) {
    ctx.font = '800 16px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4;
    const t1 = del.type.name + ' · ' + del.kmh + ' km/h'; ctx.strokeText(t1, w / 2, h * 0.3); ctx.fillText(t1, w / 2, h * 0.3);
    if (ballNo === 0 && !log.length) { const t2 = 'Tap when the ball reaches the yellow ring!'; ctx.strokeText(t2, w / 2, h * 0.3 + 22); ctx.fillText(t2, w / 2, h * 0.3 + 22); }
  }
  // score board + this over
  const bw = Math.min(w - 24, 330), bx = (w - bw) / 2, by = h - 66;
  // run button (tap anywhere works)
  const rp = G.state === 'play' ? runPrompt() : null;
  if (rp) {
    const pw = Math.min(w - 40, 260), ph = 48, pulse = rp.on ? 1 + Math.sin(now / 110) * 0.04 : 1;
    ctx.save(); ctx.translate(w / 2, by - 40); ctx.scale(pulse, pulse);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; KQ3D.roundRect(ctx, -pw / 2, -ph / 2 + 4, pw, ph, 24); ctx.fill();
    ctx.fillStyle = rp.c; KQ3D.roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 24); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 19px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(rp.t, 0, 1); ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(15,23,42,.82)'; KQ3D.roundRect(ctx, bx, by, bw, 54, 14); ctx.fill();
  KQ3D.drawPic(ctx, team.icon, bx + 22, by + 27, 26);
  ctx.fillStyle = '#fff'; ctx.font = '800 17px "Baloo 2",sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(team.name + ' ' + (runs || 0) + '/' + (wkts || 0), bx + 42, by + 17);
  ctx.font = '700 13px "Baloo 2",sans-serif'; ctx.fillStyle = '#cbd5e1'; ctx.fillText('Need ' + Math.max(0, target - runs) + ' off ' + (6 - ballNo), bx + 42, by + 38);
  for (let i = 0; i < 6; i++) {
    const v = log && log[i], cx = bx + bw - 22 - (5 - i) * 25, cy = by + 27;
    ctx.fillStyle = v == null ? 'rgba(255,255,255,.15)' : v === 'W' ? '#ef4444' : v === '6' ? '#a855f7' : v === '4' ? '#22c55e' : v === '•' ? '#64748b' : '#0ea5e9';
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
    if (v != null) { ctx.fillStyle = '#fff'; ctx.font = '800 12px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillText(v, cx, cy + 1); }
  }
  ctx.textBaseline = 'alphabetic';
}
reset(team);
requestAnimationFrame(frame);
</script>
