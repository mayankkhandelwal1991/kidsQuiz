<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Super Over Cricket</title>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Super Over Cricket — chase the target in 6 balls with 2 wickets.
   The camera sits behind the batter. The bowler runs in, the ball bounces
   and comes to the bat: tap when it reaches the ring.
     on time  -> lofted SIX / FOUR straight down the ground
     early    -> pulled to the leg side (left)
     late     -> cut to the off side (right)
     miss     -> bowled if the ball was on the stumps, else a dot ball
   Everything is drawn with a simple perspective camera (world in metres). */
const TEAMS = [
  { icon: '🇮🇳', name: 'India', shirt: '#2563eb', pants: '#1e3a8a', helmet: '#1e3a8a', foe: '#facc15', foeName: 'Australia' },
  { icon: '🇦🇺', name: 'Australia', shirt: '#facc15', pants: '#166534', helmet: '#166534', foe: '#2563eb', foeName: 'India' },
  { icon: '🇬🇧', name: 'England', shirt: '#1e40af', pants: '#f8fafc', helmet: '#1e3a8a', foe: '#16a34a', foeName: 'Pakistan' }
];
const G = KQ3D.init({
  id: 'cricket_superover', title: 'Super Over Cricket', bestKey: 'cricketBest', music: true,
  hero: ['🏏', '🇮🇳', '🏆'], colors: ['#16a34a', '#2563eb'],
  how: [['🏃', 'The bowler runs in — watch the ball bounce'], ['👆', 'Tap (or Space) when the ball reaches the yellow ring'], ['🎯', 'Perfect = SIX! Early hits go left, late hits go right'], ['🏆', 'Chase the target in 6 balls — you have 2 wickets']],
  hud: [{ id: 'need', icon: '🎯' }, { id: 'balls', icon: '⚾' }, { id: 'wk', icon: '🏏' }], scoreIcon: '🏏', stars: [150, 300, 450],
  pick: { label: 'Pick your team', options: TEAMS },
  onReset: (t) => reset(t)
});
const C = KQ3D.canvas(G.scene), ctx = C.ctx;

/* ---------- camera ---------- */
const CAM_H = 3.2;            // camera height (m)
const D_STUMPS = 8.8;         // batter's stumps, distance from the camera (m)
const D_CREASE = 10;          // batter's popping crease
const D_BAT = 10.35;          // where bat meets ball
const D_FAR_STUMPS = D_STUMPS + 20.12;
const D_RELEASE = D_FAR_STUMPS - 0.9;
const FIELD_C = 19, FIELD_R = 62;   // boundary rope: circle round the middle of the pitch
let HZ, FY, FX, CX;
function cam() { HZ = C.h * 0.2; FY = C.h * 1.75; FX = Math.min(C.w, C.h * 0.62) * 1.35; CX = C.w / 2; }
const P = (x, d, y) => [CX + FX * x / d, HZ + FY * (CAM_H - (y || 0)) / d];
const K = (d) => FY / d;      // pixels per metre at distance d

/* ---------- state ---------- */
let team = G.choice || TEAMS[0], runs, target, ballNo, wkts, log, played = 0;
let phase, pt, ball, del, shot, swing, bails, fielders, cheer = 0, msg = null, ring = 0, flash = 0;
const BALL_TYPES = [
  { name: '⚡ Fast', kmh: [128, 142], dur: [0.82, 0.92], spin: 0 },
  { name: '🎯 Medium', kmh: [112, 124], dur: [0.95, 1.05], spin: 0 },
  { name: '🌀 Spin', kmh: [78, 90], dur: [1.2, 1.35], spin: 1 }
];
const LENGTHS = [{ n: 'full', L: 2.4, hb: 0.35 }, { n: 'good', L: 5, hb: 0.75 }, { n: 'short', L: 8, hb: 1.2 }];
const rnd = (a, b) => a + Math.random() * (b - a);

function reset(tm) {
  team = tm || TEAMS[0]; runs = 0; ballNo = 0; wkts = 0; log = [];
  target = 14 + Math.floor(Math.random() * 9) + Math.min(played, 4) * 2;
  G.score(0); upd(); placeFielders(); nextBall();
}
function upd() { G.hudSet('need', Math.max(0, target - runs)); G.hudSet('balls', 6 - ballNo); G.hudSet('wk', 2 - wkts); }
function placeFielders() {
  // a ring of fielders in front of the batter (angle 0 = straight down the ground)
  fielders = [-1.25, -0.8, -0.35, 0.25, 0.7, 1.15, 0].map((a, i) => {
    const r = i === 6 ? 40 : 24 + (i % 2) * 12;
    const x = Math.sin(a) * r, d = D_BAT + Math.cos(a) * r;
    return { hx: x, hd: d, x, d, run: 0, t: Math.random() * 6 };
  });
}
function nextBall() {
  const bt = BALL_TYPES[Math.random() < 0.3 ? 2 : Math.random() < 0.5 ? 0 : 1], len = LENGTHS[Math.floor(Math.random() * 3)];
  const speedUp = 1 - ballNo * 0.02;
  const onStumps = Math.random() < 0.55;
  const xe = onStumps ? rnd(-0.07, 0.07) : rnd(0.24, 0.42) * (Math.random() < 0.8 ? 1 : -1);   // mostly outside off
  const turn = bt.spin ? (Math.random() < 0.5 ? -1 : 1) * rnd(0.1, 0.22) : 0;
  del = {
    type: bt, len, kmh: Math.round(rnd(bt.kmh[0], bt.kmh[1])), dur: rnd(bt.dur[0], bt.dur[1]) * speedUp,
    x0: 0.45, h0: 2.15, xe: xe - turn, turn, db: D_BAT + len.L, onStumps
  };
  ball = null; shot = null; swing = null; bails = null; msg = null; ring = 0;
  phase = 'runup'; pt = 0;
  fielders.forEach((f) => { f.x = f.hx; f.d = f.hd; f.run = 0; });
}
/* ball position at time u (0 = release, 1 = at the bat) */
function ballAt(u) {
  const d = D_RELEASE + (D_BAT - D_RELEASE) * u;
  const ub = (D_RELEASE - del.db) / (D_RELEASE - D_BAT);   // bounce time
  let x, h;
  const xb = del.x0 + (del.xe - del.x0) * ub;
  if (u < ub) { const v = u / ub; x = del.x0 + (xb - del.x0) * v; h = del.h0 * Math.pow(1 - v, 1.25) + 0.25 * v * (1 - v); }
  else { const v = (u - ub) / (1 - ub); x = xb + (del.xe - xb) * v + del.turn * v; h = del.len.hb * (1 - Math.pow(1 - Math.min(v, 1.4), 2)); if (v > 1) h = Math.max(0.05, del.len.hb - (v - 1) * 1.5); }
  return { x, d, h: Math.max(0, h), bounced: u >= ub };
}

/* ---------- batting ---------- */
function tap() {
  if (G.state !== 'play' || swing) return;
  if (phase === 'flight' && del.swung) return;       // one swing per ball
  if (phase !== 'flight' && phase !== 'runup') return;
  swing = { t: 0 }; KQ3D.sfx('whoosh');
  if (phase !== 'flight') return;
  del.swung = true;
  // the bat reaches the ball ~0.09 s after the tap
  const e = (pt + 0.09 / del.dur - 1) * del.dur, q = Math.abs(e);
  let r = null;
  if (q < 0.045) r = 6; else if (q < 0.085) r = 4; else if (q < 0.125) r = 2; else if (q < 0.17) r = 1;
  if (r == null) {
    // just too late on a ball outside off: an edge to the keeper
    if (e > 0 && e < 0.23 && del.xe > 0.18 && Math.random() < 0.45) { swing.edge = true; }
    return;
  }
  swing.hit = { r, e };
  msg = { t: q < 0.045 ? 'PERFECT! 🎯' : e < 0 ? 'Early ⏪' : 'Late ⏩', l: 1.1, c: q < 0.045 ? '#fde047' : '#fff' };
}
G.scene.addEventListener('pointerdown', tap);
document.addEventListener('keydown', (e) => { if (e.key === ' ' && G.state === 'play') { e.preventDefault(); tap(); } });

function playShot(r, e, from) {
  phase = 'shot'; pt = 0;
  // early -> leg side (left on screen), late -> off side (right), perfect -> straight-ish
  let a = Math.max(-1, Math.min(1, e / 0.15)) * 1.15 + rnd(-0.22, 0.22);
  if (r === 6) a *= 0.55;
  const sp = r === 6 ? 31 : r === 4 ? 30 : r === 2 ? 28 : 18;
  shot = { r, x: from.x, d: from.d, h: Math.max(0.6, from.h), vx: Math.sin(a) * sp, vd: Math.cos(a) * sp, vh: r === 6 ? 15 : r === 4 ? 2 : r === 2 ? 3.5 : 1.2, rolling: r !== 6, done: false, landed: false };
  KQ3D.sfx(r >= 4 ? 'hit' : 'tap');
  // the nearest fielder chases singles and twos
  if (r <= 2) { const end = stopPoint(shot), f = fielders.slice().sort((p, q) => Math.hypot(p.x - end.x, p.d - end.d) - Math.hypot(q.x - end.x, q.d - end.d))[0]; f.run = 1; f.tx = end.x; f.td = end.d; }
}
const DRAG = 2.2;   // singles and twos slow down on the grass (per second); fours keep rolling to the rope
function stopPoint(s) { return { x: s.x + s.vx / DRAG, d: s.d + s.vd / DRAG }; }
function scoreRuns(r) {
  runs += r; G.score(runs * 10); log.push(String(r)); upd();
  cheer = r >= 4 ? 2 : 0.6;
  G.pop(r === 6 ? 'SIX! 🎉' : r === 4 ? 'FOUR! 🔥' : r + (r === 1 ? ' run' : ' runs'), null, C.h * 0.42, r >= 4 ? '#fde047' : '#fff');
  KQ3D.sfx(r === 6 ? 'win' : r === 4 ? 'coin' : 'pop');
  if (r === 6) try { if (window.KQFX) KQFX.celebrate({ power: 0.6 }); } catch (e) {}
}
function out(how) {
  wkts++; log.push('W'); upd(); KQ3D.sfx('lose'); G.flash('#fecaca');
  G.pop(how, null, C.h * 0.42, '#fecaca');
}
function endBall(delay) {
  phase = 'over'; G.later(() => {
    ballNo++; upd();
    if (runs >= target) return finish(true);
    if (wkts >= 2 || ballNo >= 6) return finish(false);
    nextBall();
  }, delay);
}
function finish(won) {
  played++;
  const final = runs * 10 + (won ? 100 + (6 - ballNo) * 20 + (2 - wkts) * 30 : 0);
  G.over({ score: final, result: won ? 'win' : 'lose', title: won ? team.icon + ' ' + team.name + ' WIN! 🏆' : 'So close! Try again 🏏', lines: ['🏏 ' + runs + '/' + wkts + ' (' + ballNo + ' balls)', '🎯 Target ' + target, log.join(' · ')] });
}

/* ---------- update ---------- */
function update(dt) {
  if (swing) { swing.t += dt; if (swing.t > 0.7 && !(phase === 'flight' && (swing.hit || swing.edge))) swing = null; }
  fielders.forEach((f) => {
    f.t += dt;
    if (f.run === 1) { const dx = f.tx - f.x, dd = f.td - f.d, L = Math.hypot(dx, dd); if (L > 0.4) { f.x += dx / L * 7 * dt; f.d += dd / L * 7 * dt; } else f.run = 2; }
  });
  if (phase === 'runup') {
    pt += dt;
    if (pt > 1.25) { phase = 'flight'; pt = 0; ring = 1; KQ3D.sfx('tick'); }
  } else if (phase === 'flight') {
    pt += dt / del.dur;
    ball = ballAt(pt);
    if (swing && swing.hit && pt >= 0.985) { const h = swing.hit; playShot(h.r, h.e, ball); return; }
    if (swing && swing.edge && pt >= 1.0) { ball = null; phase = 'dead'; out('Edged… CAUGHT! 🧤'); msg = { t: 'Caught behind', l: 1.2, c: '#fecaca' }; endBall(1300); return; }
    const uSt = (D_RELEASE - D_STUMPS) / (D_RELEASE - D_BAT);
    if (pt >= uSt && !del.checked) {
      del.checked = true; const b = ballAt(uSt);
      if (Math.abs(b.x) < 0.15 && b.h < 0.75) { bails = { t: 0, x: b.x }; out('BOWLED! 😮'); msg = { t: 'Missed it!', l: 1.2, c: '#fecaca' }; endBall(1500); phase = 'dead'; return; }
    }
    if (pt > 1.35) { ball = null; phase = 'dead'; log.push('•'); KQ3D.sfx('tap'); G.pop('Dot ball', null, C.h * 0.42, '#fff'); endBall(900); }
  } else if (phase === 'shot') {
    const s = shot; pt += dt;
    s.x += s.vx * dt; s.d += s.vd * dt;
    if (!s.rolling) { s.vh -= 9.8 * dt; s.h += s.vh * dt; }
    else { s.h = Math.max(0, s.h + s.vh * dt); s.vh -= 9.8 * dt; if (s.h <= 0) { s.vh = Math.abs(s.vh) * 0.3; } if (s.r <= 2) { const fr = Math.exp(-DRAG * dt); s.vx *= fr; s.vd *= fr; } }
    const dist = Math.hypot(s.x, s.d - FIELD_C);
    if (!s.done) {
      if (s.r === 6 && dist > FIELD_R + 6) { s.done = true; scoreRuns(6); endBall(1600); }
      else if (s.r === 4 && dist > FIELD_R - 1) { s.done = true; s.vx = s.vd = 0; scoreRuns(4); endBall(1400); flash = 1; }
      else if (s.r <= 2 && Math.hypot(s.vx, s.vd) < 2) { s.done = true; s.vx = s.vd = 0; scoreRuns(s.r); endBall(1300); }
      else if (pt > 4) { s.done = true; scoreRuns(s.r); endBall(600); }   // safety net
    }
    if (s.r === 6 && s.h < 0) { s.h = 0; s.vh = 0; s.vx *= 0.5; s.vd *= 0.5; }
  }
  if (bails) bails.t += dt;
  if (ring > 0 && phase !== 'flight') ring = Math.max(0, ring - dt * 3);
  if (msg) { msg.l -= dt; if (msg.l <= 0) msg = null; }
  cheer = Math.max(0, cheer - dt); flash = Math.max(0, flash - dt * 1.5);
}

/* ---------- drawing helpers ---------- */
function poly(pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fill(); }
function line3(x1, d1, x2, d2, col, wpx) { const a = P(x1, d1), b = P(x2, d2); ctx.strokeStyle = col; ctx.lineWidth = wpx; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function stumps3(d, broken) {
  const k = K(d);
  [-0.11, 0, 0.11].forEach((x, i) => {
    const base = P(x, d, 0); let top = P(x, d, 0.71);
    ctx.save(); ctx.translate(base[0], base[1]);
    if (broken) ctx.rotate([-0.35, 0.12, 0.3][i] * Math.min(1, broken * 6));
    ctx.fillStyle = '#fef3c7'; ctx.fillRect(-0.019 * k, -(base[1] - top[1]), 0.038 * k, base[1] - top[1]);
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0.006 * k, -(base[1] - top[1]), 0.013 * k, base[1] - top[1]);
    ctx.restore();
  });
  if (!broken) { const a = P(-0.12, d, 0.73), b = P(0.12, d, 0.73); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = Math.max(2, 0.03 * k); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
}
/* A person standing at (x, d). o: shirt, pants, skin, head ('helmet'|'cap'|'hat'), back (bool), run phase, arm (bowling arm angle) */
function person(x, d, o) {
  const k = K(d), f = P(x, d, 0), s = o.scale || 1, m = k * s;
  ctx.save(); ctx.translate(f[0], f[1]);
  const run = o.run || 0, sw = Math.sin(run) * 0.35;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(0, 0, 0.35 * m, 0.08 * m, 0, 0, 7); ctx.fill();
  // legs
  ctx.lineCap = 'round';
  [[-1, sw], [1, -sw]].forEach(([side, a]) => {
    ctx.strokeStyle = o.pads ? '#f8fafc' : o.pants; ctx.lineWidth = (o.pads ? 0.17 : 0.13) * m;
    ctx.beginPath(); ctx.moveTo(side * 0.1 * m, -0.9 * m); ctx.lineTo(side * 0.11 * m + Math.sin(a) * 0.35 * m, -0.05 * m - Math.max(0, -Math.cos(run + (side > 0 ? Math.PI : 0))) * 0.12 * m * (o.run ? 1 : 0)); ctx.stroke();
    ctx.fillStyle = '#334155'; ctx.beginPath(); ctx.ellipse(side * 0.11 * m + Math.sin(a) * 0.35 * m, -0.04 * m, 0.09 * m, 0.05 * m, 0, 0, 7); ctx.fill();
  });
  // body
  ctx.fillStyle = o.pants; ctx.fillRect(-0.19 * m, -1.0 * m, 0.38 * m, 0.18 * m);
  ctx.fillStyle = o.shirt; KQ3D.roundRect(ctx, -0.22 * m, -1.52 * m, 0.44 * m, 0.56 * m, 0.1 * m); ctx.fill();
  if (o.num) { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '800 ' + Math.round(0.2 * m) + 'px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(o.num, 0, -1.25 * m); ctx.textBaseline = 'alphabetic'; }
  // arms
  ctx.strokeStyle = o.shirt; ctx.lineWidth = 0.1 * m;
  if (o.arm != null) { // bowling: one arm windmills
    const a = o.arm; ctx.beginPath(); ctx.moveTo(0.2 * m, -1.42 * m); ctx.lineTo(0.2 * m + Math.sin(a) * 0.62 * m, -1.42 * m - Math.cos(a) * 0.62 * m); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-0.2 * m, -1.42 * m); ctx.lineTo(-0.38 * m, -1.0 * m + sw * 0.3 * m); ctx.stroke();
    if (o.holding) { ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(0.2 * m + Math.sin(a) * 0.66 * m, -1.42 * m - Math.cos(a) * 0.66 * m, 0.06 * m, 0, 7); ctx.fill(); }
  } else if (!o.bat) {
    [-1, 1].forEach((side) => { ctx.beginPath(); ctx.moveTo(side * 0.2 * m, -1.42 * m); ctx.lineTo(side * 0.3 * m + side * sw * 0.2 * m, -0.95 * m); ctx.stroke(); });
  }
  // head
  ctx.fillStyle = o.skin || '#f1c27d'; ctx.beginPath(); ctx.arc(0, -1.68 * m, 0.15 * m, 0, 7); ctx.fill();
  if (o.head === 'helmet') { ctx.fillStyle = o.helmet; ctx.beginPath(); ctx.arc(0, -1.7 * m, 0.17 * m, Math.PI * 0.95, Math.PI * 2.05); ctx.fill(); if (o.back) { ctx.fillRect(-0.15 * m, -1.7 * m, 0.3 * m, 0.1 * m); } else { ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 0.02 * m; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-0.12 * m, (-1.66 + i * 0.05) * m); ctx.lineTo(0.12 * m, (-1.66 + i * 0.05) * m); ctx.stroke(); } } }
  else if (o.head === 'cap') { ctx.fillStyle = o.cap || o.shirt; ctx.beginPath(); ctx.arc(0, -1.72 * m, 0.155 * m, Math.PI, Math.PI * 2); ctx.fill(); ctx.fillRect(-0.02 * m, -1.74 * m, 0.22 * m, 0.04 * m); }
  else if (o.head === 'hat') { ctx.fillStyle = '#f8fafc'; ctx.fillRect(-0.22 * m, -1.8 * m, 0.44 * m, 0.04 * m); ctx.fillRect(-0.12 * m, -1.92 * m, 0.24 * m, 0.13 * m); }
  if (o.back && o.head !== 'helmet') { ctx.fillStyle = '#3f2a14'; ctx.beginPath(); ctx.arc(0, -1.7 * m, 0.15 * m, Math.PI * 0.9, Math.PI * 2.1); ctx.fill(); }
  else if (!o.back) { ctx.fillStyle = '#111'; [-0.05, 0.05].forEach((ex) => { ctx.beginPath(); ctx.arc(ex * m, -1.68 * m, 0.018 * m, 0, 7); ctx.fill(); }); }
  ctx.restore();
}
/* The batter seen from behind, with a bat that swings. */
function batter(now) {
  const d = D_CREASE + 0.15, x = -0.55, k = K(d), f = P(x, d, 0);
  // bat angle on screen: 0 = pointing right, PI/2 = down
  let th, hx, hy;
  const st = swing ? swing.t : -1;
  if (st >= 0 && st < 0.32) { const p = st / 0.32, e = p * p * (3 - 2 * p); th = -1.0 + e * 5.0; hx = 0.22 - 0.42 * e; hy = 1.12 - 0.25 * Math.sin(e * Math.PI); }
  else if (st >= 0.32) { th = 4.0; hx = -0.2; hy = 1.25; }
  else if (phase === 'runup' || phase === 'flight') { const p = phase === 'flight' ? 1 : Math.min(1, pt / 1.1); th = 1.35 - p * 2.35; hx = 0.24; hy = 0.95 + p * 0.17; }  // backlift as the bowler runs in
  else { th = 1.35; hx = 0.24; hy = 0.95; }
  person(x, d, { shirt: team.shirt, pants: team.pants, helmet: team.helmet, head: 'helmet', back: true, pads: true, num: '7', bat: true });
  ctx.save(); ctx.translate(f[0], f[1]);
  const m = k, hX = hx * m, hY = -hy * m;
  // arms to the hands
  ctx.strokeStyle = team.shirt; ctx.lineWidth = 0.1 * m; ctx.lineCap = 'round';
  [-0.2, 0.2].forEach((sx) => { ctx.beginPath(); ctx.moveTo(sx * m, -1.42 * m); ctx.lineTo(hX, hY); ctx.stroke(); });
  ctx.fillStyle = '#f8fafc'; ctx.beginPath(); ctx.arc(hX, hY, 0.07 * m, 0, 7); ctx.fill();   // gloves
  // bat
  ctx.translate(hX, hY); ctx.rotate(th);
  ctx.fillStyle = '#1f2937'; ctx.fillRect(0, -0.025 * m, 0.25 * m, 0.05 * m);                      // handle
  ctx.fillStyle = '#e9c77b'; KQ3D.roundRect(ctx, 0.23 * m, -0.055 * m, 0.62 * m, 0.11 * m, 0.03 * m); ctx.fill();   // blade
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0.25 * m, 0.02 * m, 0.58 * m, 0.03 * m);
  ctx.restore();
}

/* ---------- frame ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  cam();
  const w = C.w, h = C.h;
  if (G.state === 'play') update(dt);


  // sky + stands
  const sky = ctx.createLinearGradient(0, 0, 0, HZ); sky.addColorStop(0, '#38bdf8'); sky.addColorStop(1, '#bae6fd');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, HZ);
  ctx.fillStyle = '#475569'; ctx.fillRect(0, HZ - h * 0.08, w, h * 0.08);
  const jump = cheer > 0 ? Math.abs(Math.sin(now / 90)) * 5 : 0;
  for (let r = 0; r < 3; r++) for (let k = 0; k < 26; k++) {
    const cx = (k + 0.5 + (r % 2) * 0.5) * w / 26, cy = HZ - h * 0.07 + r * h * 0.022 - (k % 2 ? jump : jump * 0.5);
    ctx.fillStyle = ['#f97316', '#fff', '#22c55e', '#2563eb', '#ef4444', '#facc15'][(k + r * 2) % 6]; ctx.beginPath(); ctx.arc(cx, cy, Math.max(3, h * 0.008), 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#1e293b'; ctx.fillRect(0, HZ - 3, w, 4);
  // outfield with mowing stripes (they get thinner with distance)
  ctx.fillStyle = '#16a34a'; ctx.fillRect(0, HZ, w, h - HZ);
  for (let d = 4; d < 90; d += 6) { const a = P(0, d), b = P(0, d + 3); ctx.fillStyle = '#15803d'; ctx.fillRect(0, b[1], w, a[1] - b[1]); }
  // boundary rope
  ctx.strokeStyle = flash > 0 ? 'rgba(253,224,71,' + (0.6 + flash * 0.4) + ')' : '#f8fafc'; ctx.lineWidth = 3; ctx.beginPath(); let started = false;
  for (let a = -Math.PI; a <= Math.PI + 0.01; a += 0.04) { const x = Math.sin(a) * FIELD_R, d = FIELD_C + Math.cos(a) * FIELD_R; if (d < 4) { started = false; continue; } const p = P(x, d); if (!started) { ctx.moveTo(p[0], p[1]); started = true; } else ctx.lineTo(p[0], p[1]); }
  ctx.stroke();
  // pitch
  poly([P(-1.5, D_STUMPS - 1.4), P(1.5, D_STUMPS - 1.4), P(1.5, D_FAR_STUMPS + 1.4), P(-1.5, D_FAR_STUMPS + 1.4)], '#d9b77e');
  poly([P(-1.5, D_STUMPS + 2), P(1.5, D_STUMPS + 2), P(1.5, D_STUMPS + 6), P(-1.5, D_STUMPS + 6)], 'rgba(255,255,255,.06)');
  [D_CREASE, D_FAR_STUMPS - 1.22].forEach((d) => line3(-1.9, d, 1.9, d, '#fff', Math.max(1.5, K(d) * 0.05)));
  [D_STUMPS, D_FAR_STUMPS].forEach((d) => { line3(-1.32, d, 1.32, d, '#fff', Math.max(1, K(d) * 0.04)); [-1.32, 1.32].forEach((x) => line3(x, d - 1.2, x, d + 1.2, '#fff', Math.max(1, K(d) * 0.04))); });

  // far end: umpire, non-striker, bowler, far stumps, fielders behind the bowler
  const items = [];
  fielders.forEach((f) => items.push({ d: f.d, draw: () => person(f.x, f.d, { shirt: team.foe, pants: '#f8fafc', head: 'cap', cap: '#1e293b', run: f.run === 1 ? f.t * 12 : 0 }) }));
  items.push({ d: D_FAR_STUMPS + 0.6, draw: () => person(-1.2, D_FAR_STUMPS + 0.6, { shirt: '#f8fafc', pants: '#1e293b', head: 'hat' }) });
  items.push({ d: D_FAR_STUMPS - 0.8, draw: () => { person(1.3, D_FAR_STUMPS - 0.8, { shirt: team.shirt, pants: team.pants, helmet: team.helmet, head: 'helmet', pads: true }); const p = P(1.55, D_FAR_STUMPS - 0.8, 0.4), kk = K(D_FAR_STUMPS - 0.8); ctx.fillStyle = '#e9c77b'; ctx.fillRect(p[0] - 0.05 * kk, p[1] - 0.4 * kk, 0.1 * kk, 0.75 * kk); } });
  items.push({ d: D_FAR_STUMPS, draw: () => stumps3(D_FAR_STUMPS) });
  // bowler: runs in from far away, then the delivery stride
  let bd, arm = null, runPh = 0, holding = true;
  if (phase === 'runup') { const p = Math.min(1, pt / 1.05); bd = D_RELEASE + 9 * (1 - p); runPh = pt * 13; if (pt > 0.95) { arm = Math.PI + Math.min(1, (pt - 0.95) / 0.3) * Math.PI; } else arm = Math.PI * 0.85; }
  else { bd = D_RELEASE - Math.min(2.5, pt * del.dur * 4); runPh = phase === 'flight' ? pt * 8 : 0; arm = phase === 'flight' ? Math.min(Math.PI * 2.6, Math.PI * 2 + pt * 4) : Math.PI * 0.9; holding = false; }
  items.push({ d: bd, draw: () => person(0.45, bd, { shirt: team.foe, pants: '#f8fafc', head: 'cap', cap: '#1e293b', run: runPh, arm, holding: phase === 'runup' && holding }) });
  items.sort((a, b) => b.d - a.d).forEach((it) => { if (it.d > D_BAT + 0.5) it.draw(); });

  // the ball (before it reaches the bat) + its shadow
  const drawBall = (x, d, hh) => {
    if (d < 2) return;
    const k = K(d), g = P(x, d, 0), b = P(x, d, hh), r = Math.max(2.5, 0.06 * k);
    ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(g[0], g[1], r, r * 0.4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.arc(b[0], b[1], r, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = Math.max(1, r * 0.2); ctx.beginPath(); ctx.arc(b[0], b[1], r * 0.7, -0.9, 0.9); ctx.stroke();
  };
  if (phase === 'flight' && ball && ball.d > D_BAT) drawBall(ball.x, ball.d, ball.h);
  if (phase === 'shot' && shot.d > D_BAT + 0.5) drawBall(shot.x, shot.d, shot.h);
  // timing ring where the bat meets the ball: it closes in exactly when the ball arrives
  if (phase === 'flight' && pt < 1.05) {
    const c = P(del.xe + del.turn, D_BAT, del.len.hb), k = K(D_BAT), rr = 0.09 * k, left = Math.max(0, 1 - pt);
    ctx.fillStyle = 'rgba(253,224,71,.28)'; ctx.beginPath(); ctx.arc(c[0], c[1], rr * 1.6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#fde047'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(c[0], c[1], rr * 1.3 + left * k * 0.9, 0, 7); ctx.stroke();
  }
  batter(now);
  if (phase === 'flight' && ball && ball.d <= D_BAT) drawBall(ball.x, ball.d, ball.h);
  stumps3(D_STUMPS, bails ? bails.t : 0);
  if (bails) { // bails fly off
    const t = bails.t, k = K(D_STUMPS);
    [-1, 1].forEach((s) => { const p = P(bails.x + s * 0.06 + s * t * 1.2, D_STUMPS + t * 2, 0.73 + t * 3 - 4.9 * t * t * 1.3); ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(t * 12 * s); ctx.fillStyle = '#f59e0b'; ctx.fillRect(-0.06 * k, -0.015 * k, 0.12 * k, 0.03 * k); ctx.restore(); });
  }
  if (phase === 'shot' && shot.d <= D_BAT + 0.5) drawBall(shot.x, shot.d, shot.h);

  // messages
  if (msg) { ctx.globalAlpha = Math.min(1, msg.l * 2); ctx.font = '800 26px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeText(msg.t, w / 2, h * 0.36); ctx.fillStyle = msg.c; ctx.fillText(msg.t, w / 2, h * 0.36); ctx.globalAlpha = 1; }
  if (G.state === 'play' && phase === 'runup' && del) {
    ctx.font = '800 16px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 4;
    const t1 = del.type.name + ' · ' + del.kmh + ' km/h'; ctx.strokeText(t1, w / 2, h * 0.3); ctx.fillText(t1, w / 2, h * 0.3);
    if (ballNo === 0 && !log.length) { const t2 = 'Tap when the ball reaches the yellow ring!'; ctx.strokeText(t2, w / 2, h * 0.3 + 22); ctx.fillText(t2, w / 2, h * 0.3 + 22); }
  }
  // score board + this over
  const bw = Math.min(w - 24, 330), bx = (w - bw) / 2, by = h - 66;
  ctx.fillStyle = 'rgba(15,23,42,.82)'; KQ3D.roundRect(ctx, bx, by, bw, 54, 14); ctx.fill();
  KQ3D.drawPic(ctx, team.icon, bx + 22, by + 27, 26);
  ctx.fillStyle = '#fff'; ctx.font = '800 17px "Baloo 2",sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText(team.name + ' ' + (runs || 0) + '/' + (wkts || 0), bx + 42, by + 17);
  ctx.font = '700 13px "Baloo 2",sans-serif'; ctx.fillStyle = '#cbd5e1'; ctx.fillText('Need ' + Math.max(0, target - runs) + ' off ' + (6 - ballNo), bx + 42, by + 38);
  for (let i = 0; i < 6; i++) {
    const v = log && log[i], cx = bx + bw - 22 - (5 - i) * 25, cy = by + 27;
    ctx.fillStyle = v == null ? 'rgba(255,255,255,.15)' : v === 'W' ? '#ef4444' : v === '6' ? '#a855f7' : v === '4' ? '#22c55e' : v === '•' ? '#64748b' : '#0ea5e9';
    ctx.beginPath(); ctx.arc(cx, cy, 10, 0, 7); ctx.fill();
    if (v != null) { ctx.fillStyle = '#fff'; ctx.font = '800 12px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillText(v, cx, cy + 1); }
  }
  ctx.textBaseline = 'alphabetic';
}
reset(team);
requestAnimationFrame(frame);
</script>
