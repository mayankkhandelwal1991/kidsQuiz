<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Egg Jump</title>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Egg Jump — tap to jump (tap again in the air to double jump). Jump over
   cactus, rocks and hedgehogs; stay low under the birds; collect stars. */
const EGGS = [
  { icon: '🥚', name: 'Eggy', base: '#fffbeb', spot: null },
  { icon: '🦕', name: 'Dino', base: '#bbf7d0', spot: '#16a34a' },
  { icon: '🌈', name: 'Painted', base: '#fbcfe8', stripes: true },
  { icon: '🌟', name: 'Golden', base: '#fde047', shine: true }
];
const G = KQ3D.init({
  id: 'egg_jump', title: 'Egg Jump', bestKey: 'eggBest', music: true,
  hero: ['🥚', '🌵', '⭐'], colors: ['#f59e0b', '#22c55e'],
  how: [['👆', 'Tap (or Space) to jump — tap again in the air to double jump'], ['🌵', 'Jump over cactus, rocks and hedgehogs'], ['🐦', 'Stay low when birds fly by!'], ['⭐', 'Collect stars for +5']],
  scoreIcon: '🥚', stars: [150, 400, 800],
  pick: { label: 'Pick your egg', options: EGGS },
  onReset: (e) => reset(e)
});
const C = KQ3D.canvas(G.scene), ctx = C.ctx;
let egg = G.choice || EGGS[0], y, vy, jumps, obs, stars, dust, dist, starPts, speed, nextObs, squash, blinkT, scroll;
const GRAV = 2600, J1 = -880, J2 = -760, EX = () => Math.min(C.w * 0.25, 130), ER = 26;
const groundY = () => C.h * 0.74;

function reset(e) { egg = e || EGGS[0]; y = 0; vy = 0; jumps = 0; obs = []; stars = []; dust = []; dist = 0; starPts = 0; speed = 300; nextObs = 500; squash = 0; blinkT = 2; scroll = 0; }
function jump() {
  if (G.state !== 'play') return;
  if (jumps >= 2) return;
  vy = jumps ? J2 : J1; jumps++; squash = -0.2; KQ3D.sfx(jumps === 2 ? 'boing' : 'jump');
  if (jumps === 2) for (let k = 0; k < 6; k++) dust.push({ x: EX(), y: groundY() + y, vx: (Math.random() - 0.5) * 120, vy: Math.random() * 100, l: 0.4, c: '#fff' });
}
G.scene.addEventListener('pointerdown', jump);
document.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'ArrowUp') && G.state === 'play') { e.preventDefault(); jump(); } });

function spawnObs() {
  const lvl = Math.min(1, dist / 6000), r = Math.random();
  if (dist > 800 && r < 0.18 + lvl * 0.1) obs.push({ type: 'bird', e: '🐦', x: C.w + 40, h: 92, w: 40, s: 48, fly: true });
  else {
    const kind = Math.random(), e = kind < 0.45 ? '🌵' : kind < 0.75 ? '🪨' : '🦔';
    const s = e === '🌵' ? 58 + Math.random() * 14 : e === '🪨' ? 46 : 46;
    obs.push({ type: 'ground', e, x: C.w + 40, w: s * 0.6, h: s * 0.85, s, walk: e === '🦔' ? 60 : 0 });
    if (lvl > 0.3 && Math.random() < 0.3) obs.push({ type: 'ground', e: '🪨', x: C.w + 40 + s * 0.9, w: 28, h: 40, s: 46, walk: 0 });  // double obstacle
  }
  if (Math.random() < 0.55) { const sx = C.w + 40; for (let k = 0; k < 4; k++) stars.push({ x: sx + 30 + k * 34, y: -110 - Math.sin(k / 3 * Math.PI) * 60 }); }
}
function crash() {
  KQ3D.sfx('hit'); G.flash('#fecaca');
  for (let k = 0; k < 14; k++) dust.push({ x: EX(), y: groundY() + y - ER, vx: (Math.random() - 0.5) * 300, vy: -Math.random() * 300, l: 0.7, c: '#fef3c7' });
  G.over({ score: Math.floor(dist / 10) + starPts, title: 'Crack! 🥚', lines: ['🏃 ' + Math.floor(dist / 10) + ' m', '⭐ ' + starPts / 5 + ' stars'] });
}

function drawEgg(x, gy, t) {
  const sq = squash, w = ER * (1 - sq * 0.6), h = ER * 1.3 * (1 + sq);
  const cy = gy - h;
  ctx.fillStyle = 'rgba(0,0,0,' + Math.max(0.05, 0.22 + y / 800) + ')'; ctx.beginPath(); ctx.ellipse(x, groundY() + 2, ER * Math.max(0.5, 1 + y / 400), 6, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, cy); ctx.rotate(jumps === 2 ? (t / 80) % (Math.PI * 2) : vy * 0.0002);
  const grd = ctx.createRadialGradient(-w * 0.35, -h * 0.4, 2, 0, 0, h * 1.1); grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.3, egg.base); grd.addColorStop(1, egg.shine ? '#eab308' : '#e7d8b8');
  ctx.fillStyle = grd; ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.ellipse(0, 0, w, h, 0, 0, 7); ctx.clip();
  if (egg.spot) { ctx.fillStyle = egg.spot; [[-10, -18, 5], [12, -8, 4], [-6, 14, 6], [14, 18, 3]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(a, b, r, 0, 7); ctx.fill(); }); }
  if (egg.stripes) { ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6'].forEach((c, i) => { ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.beginPath(); for (let xx = -w; xx <= w; xx += 8) ctx.lineTo(xx, -h * 0.55 + i * 9 + ((xx / 8) % 2 ? 3 : -3)); ctx.stroke(); }); }
  ctx.restore();
  if (egg.shine) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-w * 0.4, -h * 0.45, 4, 8, -0.4, 0, 7); ctx.fill(); }
  // face
  const blink = blinkT < 0.12;
  [-1, 1].forEach((s) => {
    if (blink) { ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(s * 8 - 4, -2); ctx.lineTo(s * 8 + 4, -2); ctx.stroke(); }
    else { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(s * 8, -3, 6, 7, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.arc(s * 8 + 2, -2, 3.4, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s * 8 + 3, -4, 1.2, 0, 7); ctx.fill(); }
  });
  ctx.fillStyle = 'rgba(244,114,182,.6)'; [-1, 1].forEach((s) => { ctx.beginPath(); ctx.arc(s * 14, 6, 3.5, 0, 7); ctx.fill(); });
  ctx.strokeStyle = '#1f2937'; ctx.lineWidth = 2; ctx.beginPath(); if (y < -10) ctx.arc(2, 9, 4, 0, 7); else ctx.arc(2, 6, 5, 0.2, Math.PI - 0.2); ctx.stroke();
  // little feet
  if (y > -2) { ctx.fillStyle = '#f97316'; [-1, 1].forEach((s) => { ctx.beginPath(); ctx.ellipse(s * 9 + Math.sin(t / 60 + s) * 3, h - 1, 6, 3.5, 0, 0, 7); ctx.fill(); }); }
  ctx.restore();
}
function background(t) {
  const w = C.w, h = C.h, gY = groundY();
  const sky = ctx.createLinearGradient(0, 0, 0, gY); sky.addColorStop(0, '#7dd3fc'); sky.addColorStop(1, '#fef9c3');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
  KQ3D.drawPic(ctx, '🌞', w * 0.8, h * 0.14, 76);
  ctx.fillStyle = 'rgba(255,255,255,.9)'; for (let i = 0; i < 4; i++) { const cx = ((i * 260 - scroll * 0.08) % (w + 260) + w + 260) % (w + 260) - 130, cy = h * (0.12 + (i % 2) * 0.1); [[0, 0, 22], [24, -8, 18], [46, 0, 20]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(cx + a, cy + b, r, 0, 7); ctx.fill(); }); }
  [['#c4b5fd', 0.15, gY - 70, 70, 220], ['#86efac', 0.35, gY - 30, 40, 140]].forEach(([c, sp, base, amp, per]) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, gY); for (let x = 0; x <= w + 20; x += 16) ctx.lineTo(x, base - Math.abs(Math.sin((x + scroll * sp) / per)) * amp); ctx.lineTo(w, gY); ctx.fill(); });
  for (let i = 0; i < 6; i++) { const tx = ((i * 190 - scroll * 0.6) % (w + 190) + w + 190) % (w + 190) - 60; KQ3D.drawPic(ctx, i % 3 ? '🌳' : '🌲', tx, gY - 36, 70); }
  ctx.fillStyle = '#65a30d'; ctx.fillRect(0, gY, w, h - gY);
  ctx.fillStyle = '#84cc16'; ctx.fillRect(0, gY, w, 10);
  ctx.fillStyle = '#a16207'; for (let x = -(scroll % 60); x < w; x += 60) { ctx.beginPath(); ctx.ellipse(x + 20, gY + 34, 10, 4, 0, 0, 7); ctx.fill(); }
  ['🌼', '🌷', '🍄'].forEach((e, i) => { const fx = ((i * 230 - scroll) % (w + 230) + w + 230) % (w + 230) - 40; KQ3D.drawPic(ctx, e, fx, gY + 60, 26); });
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.025, (now - last) / 1000); last = now;
  const playing = G.state === 'play', v = playing ? speed : G.state === 'menu' ? 160 : 0;
  scroll += v * dt;
  blinkT -= dt; if (blinkT < 0) blinkT = 2 + Math.random() * 2;
  squash += (0 - squash) * Math.min(1, dt * 10);
  if (playing) {
    speed = Math.min(720, 300 + dist / 25); dist += v * dt;
    G.score(Math.floor(dist / 10) + starPts);
    vy += GRAV * dt; y += vy * dt;
    if (y >= 0) { if (vy > 300) { squash = 0.25; dust.push({ x: EX() - 10, y: groundY(), vx: -60, vy: -30, l: 0.3, c: '#d9f99d' }, { x: EX() + 10, y: groundY(), vx: 60, vy: -30, l: 0.3, c: '#d9f99d' }); } y = 0; vy = 0; jumps = 0; }
    nextObs -= v * dt; if (nextObs <= 0) { spawnObs(); nextObs = Math.max(300, 620 - dist / 40) + Math.random() * 260; }
    const ex = EX(), ey = groundY() + y - ER * 1.3;
    obs.forEach((o) => {
      o.x -= (v + (o.walk || 0)) * dt;
      const oy = o.fly ? groundY() - o.h : groundY() - o.h / 2;
      const hw = o.w / 2 + ER * 0.7, hh = (o.fly ? 16 : o.h / 2) + ER * 1.1;
      if (!o.passed && Math.abs(o.x - ex) < hw && Math.abs(oy - ey) < hh) crash();
      if (!o.passed && o.x < ex - 30) { o.passed = true; }
    });
    obs = obs.filter((o) => o.x > -80);
    stars.forEach((s) => { s.x -= v * dt; if (!s.got && Math.hypot(s.x - ex, groundY() + s.y - ey) < 34) { s.got = true; starPts += 5; KQ3D.sfx('coin'); const r = C.cv.getBoundingClientRect(); G.pop('+5', s.x + r.left, groundY() + s.y + r.top, '#fde047'); } });
    stars = stars.filter((s) => !s.got && s.x > -40);
  } else if (G.state === 'menu') { y = -Math.abs(Math.sin(now / 350)) * 60; }
  background(now);
  stars.forEach((s) => KQ3D.drawPic(ctx, '⭐', s.x, groundY() + s.y + Math.sin(now / 200 + s.x) * 4, 30));
  obs.forEach((o) => {
    if (o.fly) { ctx.save(); ctx.translate(o.x, groundY() - o.h + Math.sin(now / 120) * 6); KQ3D.drawPic(ctx, o.e, 0, 0, o.s); ctx.restore(); }
    else { ctx.save(); ctx.translate(o.x, groundY() - o.s / 2 + 6); if (o.walk) ctx.scale(-1, 1); KQ3D.drawPic(ctx, o.e, 0, 0, o.s, o.walk ? Math.sin(now / 80) * 0.1 : 0); ctx.restore(); }
  });
  dust = dust.filter((d) => (d.l -= dt) > 0); dust.forEach((d) => { d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 600 * dt; ctx.globalAlpha = d.l * 2; ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, 5, 0, 7); ctx.fill(); }); ctx.globalAlpha = 1;
  drawEgg(EX(), groundY() + y, now);
  if (playing && dist < 400) { ctx.font = '800 22px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 4; ctx.strokeText('Tap to jump! 👆', C.w / 2, C.h * 0.3); ctx.fillText('Tap to jump! 👆', C.w / 2, C.h * 0.3); }
}
reset(egg);
requestAnimationFrame(frame);
</script>
</body></html>
