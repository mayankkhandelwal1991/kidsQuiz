<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ping Pong</title>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js?v=20261127a"></script>
<script>
/* Ping Pong — you (bottom) vs an animal (top). First to 7. */
const FOES = [
  { icon: '🐢', name: 'Turtle', speed: 220, err: 60, mult: 1 },
  { icon: '🐼', name: 'Panda', speed: 320, err: 38, mult: 1.5 },
  { icon: '🦊', name: 'Fox', speed: 430, err: 22, mult: 2 },
  { icon: '🤖', name: 'Robo', speed: 560, err: 10, mult: 3 }
];
const WIN = 7;
const G = KQ3D.init({
  id: 'ping_pong', title: 'Ping Pong', bestKey: 'pongBest', music: true,
  hero: ['🏓', '🐼', '🏆'], colors: ['#0ea5e9', '#1d4ed8'],
  how: [['👆', 'Drag (or use ⬅️ ➡️) to move your paddle'], ['🏓', 'Hit the ball near the paddle edge to aim it'], ['🏆', 'First to ' + WIN + ' points wins!'], ['🦊', 'Tougher animals give more points']],
  hud: [{ id: 'cpu', icon: '🤖' }], scoreIcon: '🧒', stars: [100, 250, 450],
  pick: { label: 'Pick who to play', options: FOES },
  onReset: (f) => reset(f)
});
const C = KQ3D.canvas(G.scene), ctx = C.ctx;
let foe = G.choice || FOES[0], me, cpu, ball, ps, cs, serveT, keyDir = 0, trail = [], rally, cheer = 0;
const T = () => { const w = Math.min(C.w - 24, 460), h = Math.min(C.h - 250, w * 1.75); return { x: (C.w - w) / 2, y: 135 + (C.h - 250 - h) / 2, w, h }; };
const PW = () => T().w * 0.24, PH = 14, BR = 9;

function reset(f) {
  foe = f || FOES[0]; ps = 0; cs = 0; me = C.w / 2; cpu = C.w / 2; rally = 0;
  G.score(0); G.hudSet('cpu', 0); serve(1);
  const hi = document.querySelector('#k3h_cpu img'); if (hi) hi.src = KQ3D.emojiFile(foe.icon);
}
function serve(towards) {
  const t = T(); ball = { x: t.x + t.w / 2, y: t.y + t.h / 2, vx: 0, vy: 0, dir: towards }; serveT = 0.9; trail = []; rally = 0;
}
let dragging = false;
G.scene.addEventListener('pointerdown', (e) => { if (G.state === 'play') { dragging = true; me = e.clientX - C.cv.getBoundingClientRect().left; } });
window.addEventListener('pointermove', (e) => { if (dragging) me = e.clientX - C.cv.getBoundingClientRect().left; });
window.addEventListener('pointerup', () => { dragging = false; });
document.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') keyDir = -1; if (e.key === 'ArrowRight' || e.key === 'd') keyDir = 1; });
document.addEventListener('keyup', (e) => { if (['ArrowLeft', 'ArrowRight', 'a', 'd'].includes(e.key)) keyDir = 0; });

function point(mine) {
  const t = T();
  if (mine) { ps++; G.score(ps); KQ3D.sfx('success'); cheer = 1; G.pop('Point! 🎉', C.w / 2, t.y + t.h * 0.3, '#bbf7d0'); }
  else { cs++; G.hudSet('cpu', cs); KQ3D.sfx('wrong'); G.pop(foe.icon + ' scores', C.w / 2, t.y + t.h * 0.7, '#fecaca'); }
  if (ps >= WIN || cs >= WIN) {
    const won = ps >= WIN, final = Math.round((ps * 10 + (won ? 100 + (ps - cs) * 10 : 0)) * foe.mult);
    G.over({ score: final, result: won ? 'win' : 'lose', title: won ? 'You beat ' + foe.name + '! 🏆' : foe.name + ' wins this time', lines: ['🧒 ' + ps + ' – ' + cs + ' ' + foe.icon] });
    return;
  }
  serve(mine ? -1 : 1);
}
function paddleHit(px, py, up) {
  const pw = PW(), off = Math.max(-1, Math.min(1, (ball.x - px) / (pw / 2)));
  const sp = Math.min(900, Math.hypot(ball.vx, ball.vy) * 1.05 + 8);
  const a = (up ? -Math.PI / 2 : Math.PI / 2) + off * (up ? 0.9 : -0.9);
  ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp; rally++;
  KQ3D.sfx(up ? 'hit' : 'tap');
  if (rally === 8) G.pop('Super rally! 🔥', C.w / 2, C.h / 2, '#fde047');
}

function drawPaddle(x, y, col, up) {
  const pw = PW();
  ctx.fillStyle = 'rgba(0,0,0,.2)'; KQ3D.roundRect(ctx, x - pw / 2 + 3, y + 4, pw, PH, 7); ctx.fill();
  ctx.fillStyle = '#92400e'; ctx.fillRect(x - 6, up ? y + PH - 2 : y - 22, 12, 24);
  ctx.fillStyle = col; KQ3D.roundRect(ctx, x - pw / 2, y, pw, PH, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.4)'; KQ3D.roundRect(ctx, x - pw / 2 + 6, y + 3, pw * 0.5, 4, 2); ctx.fill();
}
function draw(now) {
  const t = T();
  const bg = ctx.createLinearGradient(0, 0, 0, C.h); bg.addColorStop(0, '#fde68a'); bg.addColorStop(1, '#fb923c');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, C.w, C.h);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; for (let i = 0; i < 12; i++) { ctx.beginPath(); ctx.arc((i * 173) % C.w, (i * 71) % C.h, 30 + (i % 4) * 10, 0, 7); ctx.fill(); }
  // table
  ctx.fillStyle = 'rgba(0,0,0,.2)'; KQ3D.roundRect(ctx, t.x + 6, t.y + 10, t.w, t.h, 16); ctx.fill();
  ctx.fillStyle = '#1d4ed8'; KQ3D.roundRect(ctx, t.x, t.y, t.w, t.h, 16); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; KQ3D.roundRect(ctx, t.x + 8, t.y + 8, t.w - 16, t.h - 16, 10); ctx.stroke();
  ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(t.x + t.w / 2, t.y + 8); ctx.lineTo(t.x + t.w / 2, t.y + t.h - 8); ctx.stroke();
  // net
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(t.x - 10, t.y + t.h / 2 - 3, t.w + 20, 6);
  ctx.fillStyle = '#334155'; ctx.fillRect(t.x - 14, t.y + t.h / 2 - 8, 8, 16); ctx.fillRect(t.x + t.w + 6, t.y + t.h / 2 - 8, 8, 16);
  // opponent + player faces
  const jump = Math.abs(Math.sin(now / 150)) * 8 * cheer;
  KQ3D.drawPic(ctx, foe.icon, cpu, t.y - 30, 50);
  KQ3D.drawPic(ctx, '🧒', me, t.y + t.h + 38 - jump, 50);
  drawPaddle(cpu, t.y + 26, '#ef4444', false);
  drawPaddle(me, t.y + t.h - 26 - PH, '#22c55e', true);
  // ball
  trail.forEach((p, i) => { ctx.globalAlpha = i / trail.length * 0.4; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, BR * (i / trail.length), 0, 7); ctx.fill(); });
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(ball.x + 6, ball.y + 8, BR, BR * 0.6, 0, 0, 7); ctx.fill();
  const bgr = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, BR); bgr.addColorStop(0, '#fff'); bgr.addColorStop(1, '#fdba74');
  ctx.fillStyle = bgr; ctx.beginPath(); ctx.arc(ball.x, ball.y, BR, 0, 7); ctx.fill();
  if (G.state === 'play' && serveT > 0) { ctx.font = '800 26px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(ps + ' – ' + cs, C.w / 2, t.y + t.h / 2 - 26); }
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.025, (now - last) / 1000); last = now;
  const t = T(), pw = PW();
  cheer = Math.max(0, cheer - dt);
  if (G.state === 'play') {
    if (keyDir) me += keyDir * 650 * dt;
    me = Math.max(t.x + pw / 2, Math.min(t.x + t.w - pw / 2, me));
    if (serveT > 0) { serveT -= dt; if (serveT <= 0) { const a = (ball.dir > 0 ? Math.PI / 2 : -Math.PI / 2) + (Math.random() - 0.5) * 0.7; const sp = 300 + t.h * 0.12; ball.vx = Math.cos(a) * sp; ball.vy = Math.sin(a) * sp; KQ3D.sfx('whoosh'); } }
    else {
      for (let s = 0; s < 2; s++) {
        const h = dt / 2; ball.x += ball.vx * h; ball.y += ball.vy * h;
        if (ball.x < t.x + BR) { ball.x = t.x + BR; ball.vx = Math.abs(ball.vx); }
        if (ball.x > t.x + t.w - BR) { ball.x = t.x + t.w - BR; ball.vx = -Math.abs(ball.vx); }
        const myY = t.y + t.h - 26 - PH, cpY = t.y + 26 + PH;
        if (ball.vy > 0 && ball.y + BR >= myY && ball.y < myY + PH && Math.abs(ball.x - me) < pw / 2 + BR) { ball.y = myY - BR; paddleHit(me, myY, true); }
        if (ball.vy < 0 && ball.y - BR <= cpY && ball.y > cpY - PH && Math.abs(ball.x - cpu) < pw / 2 + BR) { ball.y = cpY + BR; paddleHit(cpu, cpY, false); }
      }
      if (ball.y > t.y + t.h + 20) point(false); else if (ball.y < t.y - 20) point(true);
    }
    // opponent AI: follows the ball (with a little aim error) when it comes its way
    const aim = ball.vy < 0 ? ball.x + Math.sin(now / 400) * foe.err : t.x + t.w / 2;
    const d = aim - cpu; cpu += Math.sign(d) * Math.min(Math.abs(d), foe.speed * dt);
    cpu = Math.max(t.x + pw / 2, Math.min(t.x + t.w - pw / 2, cpu));
    trail.push({ x: ball.x, y: ball.y }); if (trail.length > 10) trail.shift();
  }
  if (ball) draw(now);
}
reset(foe);
requestAnimationFrame(frame);
</script>
</body></html>
