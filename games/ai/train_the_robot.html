<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Train the Robot</title>
<style>
.tr { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 72px 12px 18px; font-family: 'Baloo 2', sans-serif; background: radial-gradient(circle at 50% 18%, rgba(56,189,248,.35), transparent 40%), linear-gradient(180deg, #0f172a, #1e3a8a 60%, #312e81); }
.tr-top { width: 100%; max-width: 520px; display: flex; align-items: center; gap: 10px; }
.tr-bot { width: 120px; height: 120px; flex: 0 0 auto; }
.tr-bot.happy { animation: trJump .5s; } .tr-bot.sad { animation: trShake .4s; }
@keyframes trJump { 40% { transform: translateY(-14px); } } @keyframes trShake { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
.tr-say { flex: 1; background: #fff; color: #1e3a8a; border-radius: 20px 20px 20px 4px; padding: 10px 12px; font-weight: 800; font-size: 15px; line-height: 1.3; min-height: 62px; }
.tr-say small { display: block; color: #0369a1; font-weight: 700; margin-top: 4px; }
.tr-meter { width: 100%; max-width: 520px; margin: 10px 0 4px; display: flex; align-items: center; gap: 8px; color: #bae6fd; font-weight: 800; font-size: 13px; }
.tr-meter .bar { flex: 1; height: 14px; border-radius: 7px; background: rgba(255,255,255,.15); overflow: hidden; }
.tr-meter .bar i { display: block; height: 100%; background: linear-gradient(90deg, #22d3ee, #a3e635); border-radius: 7px; transition: width .4s; }
.tr-card { width: 100%; max-width: 520px; background: rgba(255,255,255,.96); border-radius: 26px; padding: 14px; margin-top: 8px; box-shadow: 0 8px 0 rgba(0,0,0,.25); }
.tr-q { font-size: 21px; font-weight: 800; color: #0f172a; line-height: 1.25; margin-bottom: 12px; text-align: center; }
.tr-opts { display: grid; gap: 8px; }
.tr-o { border: none; border-radius: 16px; padding: 12px 14px; font: 800 18px 'Baloo 2', sans-serif; color: #fff; text-align: left; display: flex; gap: 10px; align-items: center; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.tr-o b { width: 30px; height: 30px; flex: 0 0 auto; border-radius: 50%; background: rgba(255,255,255,.3); display: grid; place-items: center; }
.tr-o.ok { background: #16a34a !important; } .tr-o.no { background: #dc2626 !important; } .tr-o.dim { opacity: .45; }
.tr-next { margin-top: 12px; width: 100%; border: none; border-radius: 18px; padding: 10px; font: 800 20px 'Baloo 2', sans-serif; color: #fff; background: linear-gradient(135deg, #06b6d4, #6366f1); box-shadow: 0 5px 0 #3730a3; cursor: pointer; }
.tr-up { color: #fde047; font-weight: 800; text-align: center; min-height: 22px; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261123c"></script>
<script src="../ads.js"></script>
<script>
/* Train the Robot — answer questions to teach NOVA. Every right answer charges its
   brain; every 2 right answers it gets an upgrade. NOVA explains each answer. */
const BANK = {"Science":[{"d":1,"q":"Which animal is a mammal?","o":["Frog","Dolphin","Shark","Snake"],"a":1,"e":"Dolphins breathe air and feed their babies milk, so they're mammals, not fish."},{"d":1,"q":"What do plants take in from the air to make food?","o":["Oxygen","Carbon dioxide","Nitrogen","Helium"],"a":1,"e":"Plants breathe in carbon dioxide and use sunlight to make their food."},{"d":1,"q":"How many legs does an insect have?","o":["4","6","8","10"],"a":1,"e":"All insects have exactly 6 legs. Spiders have 8, so they're not insects!"},{"d":2,"q":"Which planet is known as the Red Planet?","o":["Venus","Mars","Jupiter","Saturn"],"a":1,"e":"Mars looks red because its soil is full of rusty iron."},{"d":2,"q":"Which part of the body pumps blood?","o":["Lungs","Brain","Heart","Liver"],"a":2,"e":"The heart is a muscle that pumps blood all around your body."},{"d":2,"q":"What gas do humans need to breathe?","o":["Carbon dioxide","Oxygen","Hydrogen","Neon"],"a":1,"e":"We breathe in oxygen and breathe out carbon dioxide."},{"d":3,"q":"Water turning into vapour is called…","o":["Freezing","Melting","Evaporation","Condensation"],"a":2,"e":"Evaporation is liquid water turning into gas when heated."},{"d":3,"q":"Which is the largest planet in our solar system?","o":["Earth","Saturn","Jupiter","Neptune"],"a":2,"e":"Jupiter is so big that all other planets could fit inside it."},{"d":3,"q":"A baby frog is called a…","o":["Cub","Tadpole","Kit","Calf"],"a":1,"e":"Frogs start life as tadpoles with tails, then grow legs."}],"English":[{"d":1,"q":"Which word is a noun?","o":["Run","Happy","Table","Quickly"],"a":2,"e":"A noun names a person, place or thing — a table is a thing."},{"d":1,"q":"Pick the correct spelling:","o":["Freind","Friend","Frend","Frind"],"a":1,"e":"Remember: 'i before e' — F-R-I-E-N-D."},{"d":1,"q":"What is the opposite of 'hot'?","o":["Warm","Cold","Boiling","Fire"],"a":1,"e":"The antonym (opposite) of hot is cold."},{"d":2,"q":"Choose the synonym of 'happy':","o":["Sad","Angry","Joyful","Tired"],"a":2,"e":"A synonym means the same thing — joyful means happy."},{"d":2,"q":"Which sentence is correct?","o":["She go to school.","She goes to school.","She going school.","She gone school."],"a":1,"e":"With 'she', the verb takes an 's': she goes."},{"d":2,"q":"The plural of 'child' is…","o":["Childs","Childes","Children","Childrens"],"a":2,"e":"'Child' is irregular — its plural is 'children'."},{"d":3,"q":"Antonym of 'ancient' is…","o":["Old","Modern","Huge","Broken"],"a":1,"e":"Ancient means very old; its opposite is modern (new)."},{"d":3,"q":"Which word is an adjective?","o":["Jump","Bright","Slowly","City"],"a":1,"e":"An adjective describes a noun — 'bright' describes something."},{"d":3,"q":"'They're going home.' — 'They're' means…","o":["Their","There is","They are","Them"],"a":2,"e":"'They're' is short for 'they are'."}],"Logic":[{"d":1,"q":"What comes next? 2, 4, 6, 8, …","o":["9","10","11","12"],"a":1,"e":"The pattern adds 2 each time, so 8 + 2 = 10."},{"d":1,"q":"Finish the pattern: 🔺🔵🔺🔵🔺 …","o":["🔺","🔵","🟥","🔶"],"a":1,"e":"Triangle, circle repeat — after 🔺 comes 🔵."},{"d":2,"q":"What comes next? 1, 2, 4, 8, …","o":["10","12","16","14"],"a":2,"e":"Each number doubles: 8 × 2 = 16."},{"d":2,"q":"In Scratch, which block repeats actions?","o":["say","repeat","move","hide"],"a":1,"e":"The 'repeat' loop block runs the same steps again and again."},{"d":2,"q":"Odd one out: 3, 5, 8, 9","o":["3","5","8","9"],"a":2,"e":"3, 5 and 9 are odd numbers; 8 is the only even one."},{"d":3,"q":"What comes next? 1, 4, 9, 16, …","o":["20","24","25","30"],"a":2,"e":"These are square numbers: 5 × 5 = 25."},{"d":3,"q":"A robot turns right 4 times. It now faces…","o":["Left","Backward","The start","Up"],"a":2,"e":"Four right turns is a full circle, so it faces the start again."},{"d":3,"q":"If A=1, B=2, C=3, what is B+C?","o":["4","5","6","23"],"a":1,"e":"B is 2 and C is 3, so 2 + 3 = 5."}],"GK":[{"d":1,"q":"How many colours are in a rainbow?","o":["5","6","7","8"],"a":2,"e":"A rainbow has 7 colours: red, orange, yellow, green, blue, indigo, violet."},{"d":1,"q":"Which is the fastest land animal?","o":["Lion","Cheetah","Horse","Tiger"],"a":1,"e":"The cheetah can sprint over 100 km/h — the fastest on land."},{"d":2,"q":"How many days are in a leap year?","o":["365","366","364","360"],"a":1,"e":"A leap year has one extra day in February, making 366."},{"d":2,"q":"Which is the largest ocean?","o":["Atlantic","Indian","Arctic","Pacific"],"a":3,"e":"The Pacific Ocean is the biggest and deepest ocean on Earth."},{"d":2,"q":"How many continents are there?","o":["5","6","7","8"],"a":2,"e":"There are 7 continents, including Asia, Africa and Antarctica."},{"d":3,"q":"Which shape has 8 sides?","o":["Hexagon","Pentagon","Octagon","Square"],"a":2,"e":"'Oct' means eight — an octagon has 8 sides, like a stop sign."},{"d":3,"q":"The Great Wall is in which country?","o":["Japan","India","China","Egypt"],"a":2,"e":"The Great Wall of China stretches thousands of kilometres."},{"d":2,"q":"Which planet is closest to the Sun?","o":["Venus","Mercury","Earth","Mars"],"a":1,"e":"Mercury is the first planet from the Sun and also the smallest."},{"d":2,"q":"How many sides does a hexagon have?","o":["5","6","7","8"],"a":1,"e":"'Hexa' means six, so a hexagon has 6 sides."},{"d":2,"q":"What is the largest mammal on Earth?","o":["Elephant","Blue whale","Giraffe","Hippo"],"a":1,"e":"The blue whale is the biggest animal ever — bigger than any dinosaur!"},{"d":2,"q":"Which gas do plants release that we breathe?","o":["Carbon dioxide","Oxygen","Nitrogen","Hydrogen"],"a":1,"e":"Plants make oxygen during photosynthesis — the gas we need to live."},{"d":2,"q":"How many continents are there on Earth?","o":["5","6","7","8"],"a":2,"e":"There are 7 continents, from Asia to Antarctica."},{"d":2,"q":"What is the boiling point of water in Celsius?","o":["50°C","90°C","100°C","120°C"],"a":2,"e":"Water boils at 100°C at sea level."},{"d":2,"q":"Which is the tallest animal in the world?","o":["Elephant","Giraffe","Camel","Horse"],"a":1,"e":"The giraffe's long neck makes it the tallest land animal."},{"d":2,"q":"Who painted the Mona Lisa?","o":["Van Gogh","Picasso","Leonardo da Vinci","Michelangelo"],"a":2,"e":"Leonardo da Vinci painted the famous Mona Lisa over 500 years ago."},{"d":2,"q":"Which ocean is the largest?","o":["Atlantic","Indian","Arctic","Pacific"],"a":3,"e":"The Pacific Ocean is the largest and deepest on the planet."},{"d":2,"q":"What do bees make?","o":["Milk","Honey","Silk","Wax only"],"a":1,"e":"Bees collect nectar from flowers and turn it into honey."},{"d":2,"q":"Which planet is famous for its rings?","o":["Mars","Saturn","Venus","Mercury"],"a":1,"e":"Saturn's bright rings are made of ice and rock."},{"d":2,"q":"What is H2O commonly known as?","o":["Salt","Water","Air","Oil"],"a":1,"e":"H2O is the chemical formula for water — 2 hydrogen and 1 oxygen."},{"d":2,"q":"How many legs does a spider have?","o":["6","8","10","12"],"a":1,"e":"Spiders have 8 legs, which is why they aren't insects (insects have 6)."},{"d":2,"q":"Which country is home to the kangaroo?","o":["Brazil","India","Australia","Canada"],"a":2,"e":"Kangaroos are native to Australia."},{"d":2,"q":"What is the fastest land animal?","o":["Lion","Cheetah","Leopard","Horse"],"a":1,"e":"The cheetah can run over 100 km/h in short bursts."},{"d":2,"q":"How many minutes are in one hour?","o":["30","45","60","100"],"a":2,"e":"There are 60 minutes in an hour."},{"d":2,"q":"Which shape has three sides?","o":["Square","Triangle","Circle","Pentagon"],"a":1,"e":"A triangle has 3 sides and 3 corners."},{"d":2,"q":"The Sun is a…","o":["Planet","Star","Moon","Comet"],"a":1,"e":"The Sun is a star — a giant ball of burning gas."},{"d":2,"q":"Which organ helps you think?","o":["Heart","Brain","Lungs","Stomach"],"a":1,"e":"The brain controls thinking, memory and your whole body."},{"d":2,"q":"What is frozen water called?","o":["Steam","Ice","Cloud","Rain"],"a":1,"e":"When water freezes below 0°C it becomes solid ice."},{"d":2,"q":"How many days are in a week?","o":["5","6","7","8"],"a":2,"e":"There are 7 days in a week."},{"d":2,"q":"Which bird cannot fly?","o":["Sparrow","Penguin","Eagle","Parrot"],"a":1,"e":"Penguins can't fly, but they're excellent swimmers."},{"d":2,"q":"What is the capital of France?","o":["Rome","Paris","Madrid","Berlin"],"a":1,"e":"Paris, home of the Eiffel Tower, is the capital of France."},{"d":2,"q":"Which metal is attracted to a magnet?","o":["Gold","Iron","Silver","Copper"],"a":1,"e":"Iron is magnetic — magnets stick to it."},{"d":2,"q":"A group of lions is called a…","o":["Herd","Pack","Pride","Flock"],"a":2,"e":"A group of lions is called a pride."},{"d":2,"q":"Which is the smallest prime number?","o":["0","1","2","3"],"a":2,"e":"2 is the smallest prime number — and the only even one."},{"d":2,"q":"What powers a solar panel?","o":["Wind","Sunlight","Water","Coal"],"a":1,"e":"Solar panels turn sunlight into electricity."},{"d":2,"q":"How many teeth does an adult human usually have?","o":["20","28","32","40"],"a":2,"e":"Most adults have 32 teeth, including wisdom teeth."},{"d":2,"q":"Which season comes after winter?","o":["Autumn","Summer","Spring","Monsoon"],"a":2,"e":"Spring follows winter, when plants start to bloom."}]};
const SUBJ = [{ icon: '🔬', name: 'Science', key: 'Science' }, { icon: '🔤', name: 'English', key: 'English' }, { icon: '🧩', name: 'Logic', key: 'Logic' }, { icon: '🌍', name: 'GK', key: 'GK' }, { icon: '🎲', name: 'Mixed', key: 'Mixed' }];
const UPG = ['', 'an antenna 📡', 'robot arms 🦾', 'laser eyes 👀', 'a jetpack 🚀', 'a golden crown 👑'];
const N = 10, COLS = ['#2563eb', '#7c3aed', '#db2777', '#ea580c'];
const G = KQ3D.init({
  id: 'train_the_robot', title: 'Train the Robot', bestKey: 'robotBest', music: true,
  hero: ['🤖', '🧠', '⚡'], colors: ['#0ea5e9', '#6366f1'],
  how: [['🤖', 'NOVA the robot wants to learn from YOU'], ['👆', 'Pick the right answer — NOVA explains why'], ['🧠', 'Right answers charge NOVA’s brain'], ['🦾', 'Every 2 right answers = a new robot upgrade!']],
  scoreIcon: '🧠', stars: [60, 110, 150],
  pick: { label: 'What will you teach?', options: SUBJ },
  onReset: (s) => reset(s)
});
const box = document.createElement('div'); box.className = 'tr'; G.scene.appendChild(box);
let subj, qs, i, score, right, streak, lock, t0;
const shuffle = (a) => a.slice().sort(() => Math.random() - 0.5);
function say(t) {
  try { if (localStorage.getItem('kq_muted') === '1') return; } catch (e) {}
  try { if (window.Android && Android.speak) { Android.speak(t, 'en'); return; } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(t); u.rate = 1; u.pitch = 1.3; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function robot(level, mood) {
  const eye = level >= 3 ? '#f43f5e' : '#22d3ee', mouth = mood === 'sad' ? 'M46 78 Q60 70 74 78' : 'M46 74 Q60 86 74 74';
  return '<svg class="tr-bot ' + (mood || '') + '" viewBox="0 0 120 120">' +
    (level >= 4 ? '<path d="M30 92 L22 118 L38 104Z" fill="#f97316"><animate attributeName="opacity" values="1;.4;1" dur=".3s" repeatCount="indefinite"/></path><path d="M90 92 L98 118 L82 104Z" fill="#f97316"><animate attributeName="opacity" values=".4;1;.4" dur=".3s" repeatCount="indefinite"/></path><rect x="24" y="70" width="14" height="26" rx="5" fill="#64748b"/><rect x="82" y="70" width="14" height="26" rx="5" fill="#64748b"/>' : '') +
    (level >= 1 ? '<line x1="60" y1="22" x2="60" y2="8" stroke="#94a3b8" stroke-width="4"/><circle cx="60" cy="7" r="6" fill="#facc15"><animate attributeName="r" values="5;7;5" dur="1s" repeatCount="indefinite"/></circle>' : '') +
    (level >= 5 ? '<path d="M38 26 L44 12 L52 22 L60 8 L68 22 L76 12 L82 26Z" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>' : '') +
    '<rect x="30" y="22" width="60" height="64" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>' +
    '<rect x="38" y="34" width="44" height="30" rx="10" fill="#0f172a"/>' +
    '<circle cx="50" cy="49" r="7" fill="' + eye + '"/><circle cx="70" cy="49" r="7" fill="' + eye + '"/>' +
    (level >= 3 ? '<circle cx="50" cy="49" r="11" fill="none" stroke="' + eye + '" stroke-width="2" opacity=".5"/><circle cx="70" cy="49" r="11" fill="none" stroke="' + eye + '" stroke-width="2" opacity=".5"/>' : '') +
    '<path d="' + mouth + '" stroke="#475569" stroke-width="4" fill="none" stroke-linecap="round"/>' +
    (level >= 2 ? '<path d="M30 60 Q14 56 12 40" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" values="0 30 60;-12 30 60;0 30 60" dur="1.2s" repeatCount="indefinite"/></path><path d="M90 60 Q106 64 108 80" stroke="#94a3b8" stroke-width="7" fill="none" stroke-linecap="round"/>' : '') +
    '<rect x="44" y="86" width="32" height="14" rx="4" fill="#94a3b8"/><rect x="40" y="98" width="40" height="10" rx="5" fill="#64748b"/></svg>';
}
const lvl = () => Math.min(5, Math.floor(right / 2));
function reset(s) {
  subj = s || SUBJ[0]; i = 0; score = 0; right = 0; streak = 0; G.score(0);
  const pool = subj.key === 'Mixed' ? [].concat(...Object.values(BANK)) : BANK[subj.key];
  qs = shuffle(pool.slice().sort((a, b) => (a.d || 1) - (b.d || 1)).slice(0, Math.max(N, pool.length))).slice(0, N)
    .sort((a, b) => (a.d || 1) - (b.d || 1))
    .map((x) => { const order = shuffle([0, 1, 2, 3].slice(0, x.o.length)); return { q: x.q, o: order.map((k) => x.o[k]), a: order.indexOf(x.a), e: x.e }; });
  show('Hi! I’m NOVA 🤖 Teach me about ' + subj.name + '!');
}
function show(msg, mood) {
  const q = qs[i]; lock = false; t0 = performance.now();
  box.innerHTML = '<div class="tr-top">' + robot(lvl(), mood) + '<div class="tr-say" id="trS">' + msg + '</div></div>' +
    '<div class="tr-meter">🧠 Brain<div class="bar"><i style="width:' + (right / qs.length * 100) + '%"></i></div>' + (i + 1) + '/' + qs.length + '</div>' +
    '<div class="tr-card"><div class="tr-q">' + q.q + '</div><div class="tr-opts">' + q.o.map((o, k) => '<button type="button" class="tr-o" data-k="' + k + '" style="background:' + COLS[k] + '"><b>' + 'ABCD'[k] + '</b>' + o + '</button>').join('') + '</div><div class="tr-up" id="trU"></div></div>';
  box.querySelectorAll('.tr-o').forEach((b) => b.onclick = () => answer(b, +b.dataset.k));
}
function answer(b, k) {
  if (G.state !== 'play' || lock) return; lock = true;
  const q = qs[i], ok = k === q.a, before = lvl();
  box.querySelectorAll('.tr-o').forEach((x) => { const kk = +x.dataset.k; if (kk === q.a) x.classList.add('ok'); else if (x === b) x.classList.add('no'); else x.classList.add('dim'); });
  if (ok) {
    right++; streak++; const secs = (performance.now() - t0) / 1000, pts = 10 + (secs < 6 ? 3 : 0) + (streak >= 3 ? 2 : 0); score += pts; G.score(score); KQ3D.sfx('success');
    const r = b.getBoundingClientRect(); G.pop('+' + pts, r.left + r.width / 2, r.top, '#a3e635');
  } else { streak = 0; KQ3D.sfx('wrong'); }
  const up = lvl() > before ? 'NOVA got ' + UPG[lvl()] + '!' : '';
  const sayTxt = (ok ? 'Yes! I learned it! ' : 'Hmm, not quite. ') + q.e;
  box.querySelector('.tr-top').innerHTML = robot(lvl(), ok ? 'happy' : 'sad') + '<div class="tr-say">' + (ok ? '✅ ' : '💡 ') + q.e + (up ? '<small>⚡ ' + up + '</small>' : '') + '</div>';
  box.querySelector('.tr-meter i').style.width = (right / qs.length * 100) + '%';
  if (up) { KQ3D.sfx('levelup'); document.getElementById('trU').textContent = '🎉 Upgrade: ' + UPG[lvl()]; }
  say(sayTxt);
  const nb = document.createElement('button'); nb.className = 'tr-next'; nb.textContent = i + 1 < qs.length ? 'Next question ➜' : 'Finish 🏁';
  nb.onclick = () => { if (G.state !== 'play') return; try { speechSynthesis.cancel(); } catch (e) {} i++; if (i >= qs.length) finish(); else show(['Teach me more!', 'What’s next?', 'I’m getting smarter!', 'Beep boop, ready!'][i % 4]); };
  box.querySelector('.tr-card').appendChild(nb);
}
function finish() {
  G.over({ score, title: right >= 9 ? 'NOVA is a genius! 🤖👑' : right >= 6 ? 'NOVA learned a lot!' : 'Keep training NOVA!', lines: ['✅ ' + right + ' / ' + qs.length + ' right', '🦾 Robot level ' + lvl()] });
}
reset(G.choice);
</script>
</body></html>
