<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Number Rush</title>
<style>
.nr { position: absolute; inset: 0; font-family: 'Baloo 2', sans-serif; background: linear-gradient(180deg, #0ea5e9, #67e8f9 60%, #a7f3d0); overflow: hidden; }
.nr-find { position: absolute; top: 70px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 4px 22px; font-weight: 800; font-size: 22px; color: #0369a1; box-shadow: 0 4px 0 rgba(0,0,0,.12); z-index: 2; white-space: nowrap; }
.nr-find b { color: #f97316; font-size: 28px; }
.nr-b { position: absolute; border: none; border-radius: 50%; font: 800 26px 'Baloo 2', sans-serif; color: #fff; cursor: pointer; display: grid; place-items: center; box-shadow: inset -6px -8px 0 rgba(0,0,0,.12), 0 5px 10px rgba(0,0,0,.12); text-shadow: 0 2px 0 rgba(0,0,0,.2); animation: nrFloat 3s ease-in-out infinite; padding: 0; }
.nr-b::after { content: ''; position: absolute; left: 22%; top: 16%; width: 22%; height: 16%; border-radius: 50%; background: rgba(255,255,255,.6); }
@keyframes nrFloat { 50% { transform: translateY(-8px); } }
.nr-b.pop { animation: nrPop .3s forwards; pointer-events: none; }
@keyframes nrPop { to { transform: scale(1.6); opacity: 0; } }
.nr-b.no { animation: nrShake .3s; }
@keyframes nrShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Number Rush — pop the bubbles in order (1, 2, 3… or A, B, C…) as fast as you can. */
const MODES = [{ icon: '🔟', name: '1 to 10', n: 10 }, { icon: '🔢', name: '1 to 25', n: 25 }, { icon: '🔤', name: 'A to Z', n: 26, abc: true }];
const COLS = ['#f43f5e', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];
const G = KQ3D.init({
  id: 'number_order', title: 'Number Rush', bestKey: 'rushPtsBest', music: true,
  hero: ['🫧', '🔢', '⚡'], colors: ['#0ea5e9', '#14b8a6'],
  how: [['🫧', 'Bubbles with numbers (or letters) float around'], ['👆', 'Pop them in order: 1, 2, 3… or A, B, C…'], ['⚡', 'The faster you finish, the more points'], ['❌', 'Wrong bubble = 1 second added']],
  scoreIcon: '⚡', stars: [50, 90, 130],
  hud: [{ id: 'time', icon: '⏱️' }],
  pick: { label: 'Pick a race', options: MODES },
  onReset: (m) => reset(m)
});
const box = document.createElement('div'); box.className = 'nr'; G.scene.appendChild(box);
let mode, nextI, t0, penalty, timer;
const lab = (i) => mode.abc ? String.fromCharCode(65 + i) : String(i + 1);
function reset(m) {
  mode = m || MODES[0]; nextI = 0; penalty = 0; t0 = 0; G.score(0); G.hudSet('time', '0.0');
  const W = innerWidth, H = innerHeight, top = 120, bottom = 20, s = Math.max(50, Math.min(76, Math.sqrt((W * (H - top - bottom)) / (mode.n * 2.2))));
  const pts = [];
  for (let i = 0; i < mode.n; i++) {
    let p, k = 0;
    do { p = { x: 8 + Math.random() * (W - s - 16), y: top + Math.random() * (H - top - bottom - s) }; k++; } while (k < 300 && pts.some((q) => Math.hypot(q.x - p.x, q.y - p.y) < s * 1.05));
    pts.push(p);
  }
  box.innerHTML = '<div class="nr-find" id="nrF">Pop <b>' + lab(0) + '</b> first!</div>' + pts.map((p, i) => '<button type="button" class="nr-b" data-i="' + i + '" style="left:' + p.x + 'px;top:' + p.y + 'px;width:' + s + 'px;height:' + s + 'px;background:' + COLS[i % COLS.length] + ';animation-delay:-' + (Math.random() * 3).toFixed(2) + 's">' + lab(i) + '</button>').join('');
  box.querySelectorAll('.nr-b').forEach((b) => b.onclick = () => tap(b, +b.dataset.i));
  clearInterval(timer); timer = setInterval(() => { if (G.state === 'play' && t0) G.hudSet('time', elapsed().toFixed(1)); }, 100);
}
const elapsed = () => (performance.now() - t0) / 1000 + penalty;
function tap(b, i) {
  if (G.state !== 'play') return;
  if (!t0) t0 = performance.now();
  if (i !== nextI) { b.classList.remove('no'); void b.offsetWidth; b.classList.add('no'); KQ3D.sfx('wrong'); penalty += 1; return; }
  b.classList.add('pop'); KQ3D.sfx('pop'); nextI++;
  document.getElementById('nrF').innerHTML = nextI < mode.n ? 'Next: <b>' + lab(nextI) + '</b>' : 'Done! 🎉';
  if (nextI >= mode.n) {
    clearInterval(timer);
    const t = elapsed(), pts = Math.max(10, Math.round(mode.n * 60 / t));
    G.score(pts); G.over({ score: pts, title: 'Super fast! ⚡', lines: ['⏱️ ' + t.toFixed(1) + ' s', mode.icon + ' ' + mode.name] });
  }
}
reset(G.choice);
</script>
</body></html>
