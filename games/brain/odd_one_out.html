<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Odd One Out</title>
<style>
.oo { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 12px 16px; font-family: 'Baloo 2', sans-serif; background: radial-gradient(circle at 50% 40%, #fef9c3, #fde68a 40%, #fb923c); }
.oo-info { font-weight: 800; color: #7c2d12; margin-bottom: 10px; font-size: 18px; }
.oo-time { width: 100%; max-width: 440px; height: 12px; border-radius: 6px; background: rgba(255,255,255,.6); overflow: hidden; margin-bottom: 14px; }
.oo-time i { display: block; height: 100%; background: linear-gradient(90deg, #22c55e, #f59e0b, #ef4444); border-radius: 6px; transition: width .1s linear; }
.oo-grid { display: grid; gap: 8px; background: rgba(255,255,255,.55); padding: 10px; border-radius: 24px; box-shadow: 0 8px 0 rgba(124,45,18,.18); }
.oo-c { border: none; background: #fff; border-radius: 16px; display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 3px 0 rgba(0,0,0,.08); animation: ooIn .25s both; }
.oo-c img { width: 78%; height: 78%; pointer-events: none; }
.oo-c.ok { background: #bbf7d0; animation: ooPop .35s; } .oo-c.no { background: #fecaca; animation: ooShake .3s; }
@keyframes ooIn { from { transform: scale(.4); opacity: 0; } } @keyframes ooPop { 50% { transform: scale(1.2); } } @keyframes ooShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Odd One Out — one picture is different. Find it fast! Grids grow every 3 finds. */
const PAIRS = [['🐱', '🐯'], ['🐻', '🐼'], ['🍋', '🍌'], ['🌞', '🌕'], ['⭐', '🌟'], ['🐸', '🐢'], ['🍊', '🍑'], ['🚗', '🚕'], ['🐥', '🐣'], ['🍇', '🫐'], ['🐰', '🐭'], ['🍓', '🍒'], ['🌳', '🌲'], ['🐟', '🐠'], ['⚽', '🏀'], ['🌸', '🌷'], ['🎈', '🎁'], ['🍎', '🍅'], ['🦁', '🐯'], ['🚌', '🚂']];
const TIME = 40;
const G = KQ3D.init({
  id: 'odd_one_out', title: 'Odd One Out', bestKey: 'oddBest', music: true,
  hero: ['🔎', '🐱', '🐯'], colors: ['#f59e0b', '#ea580c'],
  how: [['🔎', 'All pictures look the same — except ONE'], ['👆', 'Tap the odd one out as fast as you can'], ['⏱️', 'Each find adds 2 seconds to the clock'], ['🧠', 'The grid gets bigger and trickier!']],
  scoreIcon: '🔎', stars: [100, 220, 350],
  onReset: () => reset()
});
const box = document.createElement('div'); box.className = 'oo'; G.scene.appendChild(box);
let found, score, timeLeft, timer, lock, t0;
function reset() {
  found = 0; score = 0; timeLeft = TIME; G.score(0);
  box.innerHTML = '<div class="oo-info" id="ooI"></div><div class="oo-time"><i id="ooT" style="width:100%"></i></div><div class="oo-grid" id="ooG"></div>';
  clearInterval(timer); timer = setInterval(step, 100); next();
}
function next() {
  lock = false; t0 = performance.now();
  const n = Math.min(6, 2 + Math.floor(found / 3)), cells = n * n, odd = Math.floor(Math.random() * cells);
  let [a, b] = PAIRS[Math.floor(Math.random() * PAIRS.length)].slice().sort(() => Math.random() - 0.5);
  // later levels: same (lopsided) picture but flipped/turned
  const twist = found >= 12 && Math.random() < 0.4 ? (Math.random() < 0.5 ? 'scaleX(-1)' : 'rotate(180deg)') : null;
  if (twist) { const ASYM = ['🐱', '🐻', '🍌', '🐸', '🚗', '🐥', '🐰', '🐟', '🦁', '🚌', '🎈', '🐢', '🚕', '🐠']; a = ASYM[Math.floor(Math.random() * ASYM.length)]; }
  const size = Math.floor(Math.min(innerWidth - 60, innerHeight - 260, 440) / n) - 8;
  document.getElementById('ooI').textContent = 'Found: ' + found + ' · ' + n + '×' + n;
  const Gd = document.getElementById('ooG'); Gd.style.gridTemplateColumns = 'repeat(' + n + ',' + size + 'px)'; Gd.style.gridAutoRows = size + 'px';
  Gd.innerHTML = Array.from({ length: cells }, (_, k) => {
    const isOdd = k === odd, e = twist ? a : isOdd ? b : a, tf = twist && isOdd ? ' style="transform:' + twist + '"' : '';
    return '<button type="button" class="oo-c" data-k="' + k + '" style="animation-delay:' + (k * 12) + 'ms"><img src="' + KQ3D.emojiFile(e) + '" alt=""' + tf + '></button>';
  }).join('');
  Gd.querySelectorAll('.oo-c').forEach((el) => el.onclick = () => tap(el, +el.dataset.k === odd, odd));
}
function tap(el, ok, odd) {
  if (G.state !== 'play' || lock) return;
  if (ok) {
    lock = true; found++; const secs = (performance.now() - t0) / 1000, pts = 10 + Math.max(0, Math.round(8 - secs * 2)); score += pts; G.score(score);
    timeLeft = Math.min(TIME, timeLeft + 2); el.classList.add('ok'); KQ3D.sfx(secs < 1.5 ? 'coin' : 'success');
    const r = el.getBoundingClientRect(); G.pop('+' + pts + (secs < 1.5 ? ' ⚡' : ''), r.left + r.width / 2, r.top, '#fde047');
    if (found % 3 === 0 && found <= 12) KQ3D.sfx('levelup');
    G.later(() => { next(); }, 380);
  } else {
    el.classList.remove('no'); void el.offsetWidth; el.classList.add('no'); KQ3D.sfx('wrong'); timeLeft = Math.max(0, timeLeft - 2);
  }
}
function step() {
  if (G.state === 'pause' || G.state === 'count') return;
  if (G.state !== 'play') { clearInterval(timer); return; }
  timeLeft -= 0.1; const t = document.getElementById('ooT'); if (t) t.style.width = Math.max(0, timeLeft / TIME * 100) + '%';
  if (timeLeft <= 5 && Math.abs(timeLeft - Math.round(timeLeft)) < 0.05) KQ3D.sfx('tick');
  if (timeLeft <= 0) { clearInterval(timer); G.over({ score, title: 'Sharp eyes! 🔎', lines: ['🔎 ' + found + ' found'] }); }
}
reset();
</script>
</body></html>
