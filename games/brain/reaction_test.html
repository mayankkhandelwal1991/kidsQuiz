<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Reaction Test</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:linear-gradient(135deg,#0f0c29,#1a1a3d);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:26px;box-shadow:0 15px 40px rgba(0,0,0,.4);padding:14px;max-width:400px;width:100%;display:flex;flex-direction:column;height:100%;max-height:760px}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar button{background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:18px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{flex:1;min-height:0;border-radius:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;padding:20px;transition:background .1s;background:#1a1a3d;cursor:pointer;user-select:none}
.stage.wait{background:#3d1a1a}
.stage.go{background:#0e5c3a}
.stage.tooSoon{background:#5c0e0e}
.big{font-size:22px;font-weight:800}
.sub{font-size:13px;color:#ccc}
.stats{display:flex;justify-content:space-around;margin-top:10px}
.stat{text-align:center;font-size:11px;color:#aaa}
.stat b{display:block;font-size:20px;color:#00f5ff}
.history{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.1);border-radius:8px;padding:4px 8px;font-size:11px}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <h1>Reaction Test</h1>
    <div style="width:60px"></div>
  </div>
  <div class="stage" id="stage">
    <div class="big" id="bigTxt">Tap to Start</div>
    <div class="sub" id="subTxt">Wait for green, then tap as fast as you can!</div>
  </div>
  <div class="stats">
    <div class="stat">LAST<b id="last">–</b></div>
    <div class="stat">BEST<b id="best">–</b></div>
    <div class="stat">AVG (5)<b id="avg">–</b></div>
  </div>
  <div class="history" id="history"></div>
</div>
<script src="../ads.js"></script>
<script>
let state='idle', startTime, timeoutId, results=[], best=+(localStorage.getItem('reactBest')||0);
if(best) document.getElementById('best').textContent=best+'ms';
const stage=document.getElementById('stage'), bigTxt=document.getElementById('bigTxt'), subTxt=document.getElementById('subTxt');
function startRound(){
  state='waiting';
  stage.className='stage wait';
  bigTxt.textContent='Wait...';
  subTxt.textContent='Get ready';
  const delay=1000+Math.random()*3000;
  timeoutId=setTimeout(()=>{
    state='go';
    stage.className='stage go';
    bigTxt.textContent='TAP NOW!';
    subTxt.textContent='';
    startTime=performance.now();
  },delay);
}
function handleTap(){
  if(state==='idle'){ startRound(); return; }
  if(state==='waiting'){
    clearTimeout(timeoutId);
    state='tooSoon';
    stage.className='stage tooSoon';
    bigTxt.textContent='Too Soon!';
    subTxt.textContent='Tap to try again';
    state='idle';
    return;
  }
  if(state==='go'){
    const rt=Math.round(performance.now()-startTime);
    results.push(rt);
    if(results.length>10) results.shift();
    document.getElementById('last').textContent=rt+'ms';
    if(!best || rt<best){ best=rt; localStorage.setItem('reactBest',best); document.getElementById('best').textContent=best+'ms'; }
    const last5=results.slice(-5);
    const avg=Math.round(last5.reduce((a,b)=>a+b,0)/last5.length);
    document.getElementById('avg').textContent=avg+'ms';
    renderHistory();
    stage.className='stage';
    bigTxt.textContent=rt+' ms';
    subTxt.textContent='Tap to go again';
    state='idle';
    if(window.KQFX)KQFX.play(rt<300?'ding':'tap');
    onGameComplete();
  }
}
function renderHistory(){
  const h=document.getElementById('history');
  h.innerHTML='';
  results.slice(-8).forEach(r=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent=r+'ms';
    h.appendChild(c);
  });
}
stage.addEventListener('click',handleTap);
stage.addEventListener('touchstart',e=>{ e.preventDefault(); handleTap(); },{passive:false});
</script></body></html>
