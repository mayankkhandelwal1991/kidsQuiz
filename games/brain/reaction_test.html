<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Reaction Test</title>
<style>
.rt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; transition: background .2s; cursor: pointer; user-select: none; text-align: center; padding: 70px 16px 20px; }
.rt.wait { background: linear-gradient(180deg, #1e1b4b, #312e81); }
.rt.go { background: linear-gradient(180deg, #7dd3fc, #bbf7d0); }
.rt.early { background: linear-gradient(180deg, #fecaca, #fca5a5); }
.rt.res { background: linear-gradient(180deg, #fef3c7, #fde68a); }
.rt-pic { width: 150px; height: 150px; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.rt.go .rt-pic { transform: translateY(-20px) scale(1.15); }
.rt-msg { font-size: 34px; font-weight: 800; margin-top: 10px; line-height: 1.1; }
.rt.wait .rt-msg { color: #c7d2fe; } .rt.go .rt-msg { color: #065f46; } .rt.early .rt-msg { color: #991b1b; } .rt.res .rt-msg { color: #92400e; }
.rt-sub { font-size: 17px; font-weight: 800; margin-top: 6px; opacity: .85; }
.rt.wait .rt-sub { color: #a5b4fc; }
.rt-dots { display: flex; gap: 8px; margin-top: 18px; }
.rt-dots i { width: 46px; height: 30px; border-radius: 10px; background: rgba(255,255,255,.35); font-style: normal; font-size: 13px; font-weight: 800; display: grid; place-items: center; color: #1e1b4b; }
.rt-dots i.done { background: #fff; }
.rt-stars { position: absolute; inset: 0; pointer-events: none; }
.rt.wait .rt-stars { background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 70% 20%, #fff, transparent), radial-gradient(2px 2px at 40% 70%, #fff, transparent), radial-gradient(2px 2px at 85% 60%, #fff, transparent), radial-gradient(2px 2px at 10% 80%, #fff, transparent); }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Reaction Test — wait in the dark... when the sun comes up and the frog jumps, TAP!
   5 rounds. Faster = more points. Tapping too soon scores 0 for that round. */
const ROUNDS = 5;
const G = KQ3D.init({
  id: 'reaction_test', title: 'Reaction Test', bestKey: 'reactPtsBest', music: true,
  hero: ['🐸', '☀️', '⚡'], colors: ['#16a34a', '#0ea5e9'],
  how: [['🌙', 'Wait while it’s night time…'], ['☀️', 'When the sun comes up and the frog jumps — TAP!'], ['⚠️', 'Tap too soon and that round scores 0'], ['⚡', '5 rounds — faster taps = more points']],
  scoreIcon: '⚡', stars: [250, 350, 420],
  onReset: () => reset()
});
const box = document.createElement('div'); box.className = 'rt wait'; G.scene.appendChild(box);
let round, times, state, goAt, tmo, score;
function view(cls, pic, msg, sub) {
  box.className = 'rt ' + cls;
  box.innerHTML = '<div class="rt-stars"></div><img class="rt-pic" src="' + KQ3D.emojiFile(pic) + '" alt=""><div class="rt-msg">' + msg + '</div><div class="rt-sub">' + (sub || '') + '</div>' +
    '<div class="rt-dots">' + Array.from({ length: ROUNDS }, (_, k) => '<i class="' + (k < times.length ? 'done' : '') + '">' + (k < times.length ? (times[k] < 0 ? '—' : times[k] + 'ms') : k + 1) + '</i>').join('') + '</div>';
}
function reset() { round = 0; times = []; score = 0; G.score(0); clearTimeout(tmo); state = 'idle'; view('wait', '😴', 'Get ready…', 'Tap to start round 1'); }
function arm() {
  state = 'wait'; view('wait', '🐸', 'Wait for the sun…', 'Don’t tap yet! 🌙');
  clearTimeout(tmo); tmo = setTimeout(() => { if (state !== 'wait') return; if (G.state !== 'play') { state = 'idle'; view('wait', '😴', 'Get ready…', 'Tap to start round ' + (round + 1)); return; } state = 'go'; goAt = performance.now(); KQ3D.sfx('ding'); view('go', '🐸', 'TAP NOW! ☀️', ''); }, 1300 + Math.random() * 2800);
}
box.addEventListener('pointerdown', () => {
  if (G.state !== 'play') return;
  if (state === 'idle' || state === 'res') { if (round >= ROUNDS) return; arm(); return; }
  if (state === 'wait') { clearTimeout(tmo); times.push(-1); round++; state = 'res'; KQ3D.sfx('wrong'); view('early', '🙈', 'Too soon!', round < ROUNDS ? 'Tap to try round ' + (round + 1) : ''); if (round >= ROUNDS) finish(); return; }
  if (state === 'go') {
    const ms = Math.round(performance.now() - goAt); times.push(ms); round++; state = 'res';
    const pts = Math.max(0, Math.round((1000 - Math.min(ms, 1000)) / 10)); score += pts; G.score(score);
    const word = ms < 250 ? 'Lightning! ⚡' : ms < 350 ? 'Super quick! 🚀' : ms < 500 ? 'Nice! 👍' : 'Good try! 🐢';
    KQ3D.sfx(ms < 300 ? 'coin' : 'success');
    view('res', ms < 300 ? '🥳' : '🐸', ms + ' ms', word + (round < ROUNDS ? ' · tap for round ' + (round + 1) : ''));
    G.pop('+' + pts, innerWidth / 2, innerHeight * 0.3, '#16a34a');
    if (round >= ROUNDS) finish();
  }
});
function finish() {
  const ok = times.filter((t) => t >= 0), avg = ok.length ? Math.round(ok.reduce((a, b) => a + b, 0) / ok.length) : 0;
  setTimeout(() => G.over({ score, title: avg && avg < 300 ? 'Lightning fast! ⚡' : 'Well done! 🐸', lines: ['⏱️ avg ' + (avg ? avg + ' ms' : '—'), '🙈 ' + (times.length - ok.length) + ' too soon'] }), 900);
}
reset();
</script>
</body></html>
