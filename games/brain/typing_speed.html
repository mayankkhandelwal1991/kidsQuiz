<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Typing Speed</title>
<style>
.ty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 76px 14px 16px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(170deg, #ecfeff, #e0e7ff 60%, #fae8ff); overflow-y: auto; }
.ty-time { width: 100%; max-width: 520px; height: 12px; border-radius: 6px; background: #c7d2fe; overflow: hidden; }
.ty-time i { display: block; height: 100%; background: linear-gradient(90deg, #06b6d4, #6366f1); border-radius: 6px; }
.ty-card { width: 100%; max-width: 520px; background: #fff; border-radius: 28px; padding: 16px; margin-top: 14px; text-align: center; box-shadow: 0 8px 0 rgba(99,102,241,.2); }
.ty-pic { width: 96px; height: 96px; }
.ty-text { font-size: 34px; font-weight: 800; letter-spacing: .04em; line-height: 1.35; word-break: break-word; }
.ty-text.long { font-size: 24px; letter-spacing: .02em; }
.ty-text span { color: #94a3b8; } .ty-text span.ok { color: #16a34a; } .ty-text span.cur { color: #1e1b4b; border-bottom: 4px solid #f59e0b; } .ty-text span.bad { color: #fff; background: #ef4444; border-radius: 4px; }
.ty-in { margin-top: 12px; width: 100%; max-width: 520px; font: 800 24px 'Baloo 2', sans-serif; padding: 10px 14px; border-radius: 18px; border: 3px solid #a5b4fc; outline: none; text-align: center; background: #fff; color: #1e1b4b; }
.ty-in:focus { border-color: #6366f1; }
.ty-stats { display: flex; gap: 10px; margin-top: 12px; }
.ty-stats span { background: #fff; border-radius: 999px; padding: 4px 14px; font-weight: 800; color: #4338ca; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261123b"></script>
<script src="../ads.js"></script>
<script>
/* Typing Speed — type what you see. Words mode (with pictures) or Sentences mode. 60 s. */
const WORDS = [['cat', '🐱'], ['dog', '🐶'], ['sun', '☀️'], ['bus', '🚌'], ['cake', '🎂'], ['fish', '🐟'], ['frog', '🐸'], ['star', '⭐'], ['tree', '🌳'], ['moon', '🌙'], ['book', '📚'], ['duck', '🦆'], ['lion', '🦁'], ['bear', '🐻'], ['kite', '🪁'], ['apple', '🍎'], ['mango', '🥭'], ['zebra', '🦓'], ['tiger', '🐯'], ['panda', '🐼'], ['house', '🏠'], ['train', '🚂'], ['robot', '🤖'], ['snake', '🐍'], ['pizza', '🍕'], ['rocket', '🚀'], ['banana', '🍌'], ['rabbit', '🐰'], ['turtle', '🐢'], ['flower', '🌸']];
const SENT = ['The cat sat on the mat.', 'I like to play with my ball.', 'The sun is hot and yellow.', 'A big red bus goes to school.', 'Birds can fly up in the sky.', 'I can read a book with mom.', 'The frog jumps into the pond.', 'We eat mango in the summer.', 'My kite flies very high.', 'The moon shines at night.', 'Fish swim in the blue sea.', 'I brush my teeth every day.'];
const MODES = [{ icon: '🐱', name: 'Picture words', key: 'w' }, { icon: '📝', name: 'Sentences', key: 's' }];
const TIME = 60;
const G = KQ3D.init({
  id: 'typing_speed', title: 'Typing Speed', bestKey: 'typeBest', music: false,
  hero: ['⌨️', '🐱', '⚡'], colors: ['#6366f1', '#06b6d4'],
  how: [['⌨️', 'Type exactly what you see in the box'], ['🟩', 'Letters turn green when they are right'], ['🟥', 'A red letter means a mistake — fix it!'], ['⏱️', '60 seconds — every correct letter scores']],
  scoreIcon: '⌨️', stars: [60, 140, 220],
  hud: [{ id: 'time', icon: '⏱️' }],
  pick: { label: 'Pick a mode', options: MODES },
  onReset: (m) => reset(m)
});
const box = document.createElement('div'); box.className = 'ty'; G.scene.appendChild(box);
let mode, target, pic, typedOk, mistakes, done, timeLeft, tick, timer, list, li;
function reset(m) {
  mode = m || MODES[0]; typedOk = 0; mistakes = 0; done = 0; timeLeft = TIME; tick = TIME; G.score(0); G.hudSet('time', TIME);
  list = (mode.key === 'w' ? WORDS : SENT.map((s) => [s, null])).slice().sort(() => Math.random() - 0.5); li = 0;
  box.innerHTML = '<div class="ty-time"><i id="tyT" style="width:100%"></i></div><div class="ty-card"><div id="tyP"></div><div class="ty-text' + (mode.key === 's' ? ' long' : '') + '" id="tyX"></div></div>' +
    '<input class="ty-in" id="tyI" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type here…">' +
    '<div class="ty-stats"><span id="tyS1">✅ 0 done</span><span id="tyS2">❌ 0 oops</span></div>';
  const inp = document.getElementById('tyI');
  inp.oninput = () => check(inp);
  inp.onkeydown = (e) => { if (e.key === 'Enter') e.preventDefault(); };
  G.scene.onclick = () => inp.focus();
  clearInterval(timer); timer = setInterval(step, 100);
  next();
}
function next() { [target, pic] = list[li++ % list.length]; document.getElementById('tyP').innerHTML = pic ? '<img class="ty-pic" src="' + KQ3D.emojiFile(pic) + '" alt="">' : ''; const i = document.getElementById('tyI'); i.value = ''; render(''); }
function render(v) {
  let h = '';
  for (let k = 0; k < target.length; k++) {
    const c = target[k], t = v[k];
    const cls = t == null ? (k === v.length ? 'cur' : '') : t === c ? 'ok' : 'bad';
    h += '<span class="' + cls + '">' + (c === ' ' ? '&nbsp;' : c.replace(/[<>&]/g, '')) + '</span>';
  }
  document.getElementById('tyX').innerHTML = h;
}
let lastLen = 0;
function check(inp) {
  if (G.state !== 'play') { inp.value = ''; return; }
  const v = inp.value;
  if (v.length > lastLen) {
    const k = v.length - 1;
    if (v[k] === target[k] && v.slice(0, k) === target.slice(0, k)) { typedOk++; KQ3D.sfx('tap'); }
    else { mistakes++; KQ3D.sfx('wrong'); }
  }
  lastLen = v.length;
  render(v);
  if (v === target) {
    done++; const bonus = mode.key === 's' ? 10 : 3; typedOk += bonus; KQ3D.sfx('success');
    G.pop('+' + (target.length + bonus), innerWidth / 2, 200, '#16a34a');
    lastLen = 0; next();
  }
  G.score(typedOk);
  document.getElementById('tyS1').textContent = '✅ ' + done + ' done'; document.getElementById('tyS2').textContent = '❌ ' + mistakes + ' oops';
}
function step() {
  if (G.state === 'pause' || G.state === 'count') return;
  if (G.state !== 'play') { clearInterval(timer); return; }
  const inp = document.getElementById('tyI'); if (inp && document.activeElement !== inp && timeLeft === TIME) inp.focus();
  timeLeft -= 0.1; const s = Math.max(0, Math.ceil(timeLeft)); const t = document.getElementById('tyT'); if (t) t.style.width = Math.max(0, timeLeft / TIME * 100) + '%';
  if (s !== tick) { tick = s; G.hudSet('time', s); if (s <= 5 && s > 0) KQ3D.sfx('tick'); }
  if (timeLeft <= 0) {
    clearInterval(timer); if (inp) inp.blur();
    const acc = typedOk + mistakes ? Math.round(typedOk / (typedOk + mistakes) * 100) : 0;
    G.over({ score: typedOk, title: 'Typing star! ⌨️', lines: ['✅ ' + done + (mode.key === 'w' ? ' words' : ' sentences'), '🎯 ' + acc + '% right', '⚡ ' + Math.round(typedOk) + ' letters/min'] });
  }
}
reset(G.choice);
</script>
</body></html>
