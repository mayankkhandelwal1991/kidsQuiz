<body>
<p style="text-align:center;font-family:sans-serif;padding:40px">Loading games…</p>
<script src="../data/manifest.js?v=20261120j"></script>
<script src="../emoji-images.js?v=20261120i"></script>
<script src="../quiz/kids-sound.js?v=20261120i"></script>
<script src="hub.js?v=20261123a"></script>
<script>
/* Single-player Game Zone. Games come from the manifest (Firebase first,
   then the bundled data/games.json) — add a game = one JSON entry + its
   HTML file; this page needs no edits. Layout lives in hub.js. */
window.KQ_NO_WIDGET = true;
// hub has its own sounds + mute button: don't load the global click-sound module
window.KQFX = window.KQFX || { play: function () {}, celebrate: function () {}, isMuted: function () { try { return localStorage.getItem('kq_muted') === '1'; } catch (e) { return false; } } };
KQData.loadGames('../data/games.json').then(function (res) {
  var m = res.data || {};
  var cats = (m.categories || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  var games = (m.games || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
  KQHub.render({
    mode: 'single', base: '../', boardCat: 'single',
    title: 'Game Zone', subtitle: 'Pick a game and have fun!',
    tabs: cats.map(function (c) { return { id: c.id, label: c.title, icon: c.icon, color: [c.bg, c.shadow] }; }),
    games: games.map(function (g) {
      return { id: g.id || g.file, boardId: String(g.file).replace(/^.*\//, '').replace(/\.html?$/i, ''), file: g.file, icon: g.icon, title: g.title, how: g.how, tab: g.category, badge: g.badge || (g.featured ? '⭐ Top' : '') };
    })
  });
}).catch(function (e) {
  console.error('Games manifest load failed:', e);
  document.body.innerHTML = '<p style="text-align:center;font-family:sans-serif;padding:40px">Could not load games. Please check your connection.</p>';
});
</script>
<script src="kq-leaderboard.js?v=20261126h"></script>
<script src="../web-ads.js?v=20261123a"></script>
</body>
</html>
