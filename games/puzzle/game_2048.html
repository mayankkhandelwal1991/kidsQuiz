<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>2048</title>
<style>
.g2 { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 12px 16px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(160deg, #fef3c7, #fbcfe8 60%, #ddd6fe); touch-action: none; }
.g2-next { font-weight: 800; color: #7c2d12; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.g2-next img { width: 30px; height: 30px; }
.g2-board { position: relative; background: #d6c3a5; border-radius: 22px; box-shadow: 0 8px 0 #a8916e; }
.g2-cell { position: absolute; border-radius: 14px; background: rgba(255,255,255,.35); }
.g2-t { position: absolute; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .12s ease-out; box-shadow: 0 4px 0 rgba(0,0,0,.15); }
.g2-t img { width: 62%; height: 62%; }
.g2-t b { font-weight: 800; line-height: 1; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.2); }
.g2-t.new { animation: g2In .2s .1s both; } .g2-t.merge { animation: g2Pop .22s .1s; }
@keyframes g2In { from { scale: 0; } } @keyframes g2Pop { 50% { scale: 1.2; } }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124b"></script>
<script src="../ads.js"></script>
<script>
/* 2048 — swipe to slide; equal tiles merge into the next picture. */
const THEMES = [
  { icon: '🐣', name: 'Animals', pics: ['🐣', '🐥', '🐔', '🦆', '🦢', '🦉', '🦜', '🦚', '🦅', '🐉', '👑'] },
  { icon: '🍭', name: 'Sweets', pics: ['🍬', '🍭', '🍪', '🧁', '🍩', '🍦', '🍰', '🎂', '🍫', '🏆', '👑'] },
  { icon: '🔢', name: 'Numbers', pics: null }
];
const COL = ['#fca5a5', '#fdba74', '#fcd34d', '#bef264', '#86efac', '#5eead4', '#7dd3fc', '#a5b4fc', '#c4b5fd', '#f0abfc', '#f59e0b', '#ef4444'];
const G = KQ3D.init({
  id: 'game_2048', title: '2048', bestKey: 'g2048Best', music: true,
  hero: ['🐣', '🐔', '👑'], colors: ['#f59e0b', '#ec4899'],
  how: [['👆', 'Swipe (or use arrow keys) to slide all tiles'], ['🐣', 'Two same tiles crash together and grow up!'], ['👑', 'Reach the crown (2048) to win'], ['🧠', 'Plan ahead — don’t fill the board!']],
  scoreIcon: '⭐', stars: [500, 1500, 3000],
  hud: [{ id: 'topV', icon: '🏆' }],
  pick: { label: 'Pick tiles', options: THEMES },
  onReset: (t) => reset(t)
});
const box = document.createElement('div'); box.className = 'g2'; G.scene.appendChild(box);
let theme, tiles, nid, score, S, gap, cellS, topV, won, busy;
const lvl = (v) => Math.log2(v) - 1;
function reset(t) {
  theme = t || THEMES[0]; tiles = []; nid = 1; score = 0; topV = 2; won = false; busy = false; G.score(0); G.hudSet('topV', 2);
  S = Math.min(innerWidth - 28, innerHeight - 220, 460); gap = Math.round(S * 0.03); cellS = (S - gap * 5) / 4;
  box.innerHTML = '<div class="g2-next" id="g2N"></div><div class="g2-board" id="g2B" style="width:' + S + 'px;height:' + S + 'px">' +
    Array.from({ length: 16 }, (_, k) => '<div class="g2-cell" style="left:' + pos(k % 4) + 'px;top:' + pos(Math.floor(k / 4)) + 'px;width:' + cellS + 'px;height:' + cellS + 'px"></div>').join('') + '</div>';
  add(); add(); render(); goal();
}
const pos = (i) => gap + i * (cellS + gap);
function goal() {
  const n = document.getElementById('g2N'); if (!n) return;
  const nxt = Math.min(11, lvl(topV) + 1);
  n.innerHTML = theme.pics ? 'Next: <img src="' + KQ3D.emojiFile(theme.pics[nxt]) + '" alt=""> (' + Math.pow(2, nxt + 1) + ')' : 'Next goal: ' + Math.pow(2, nxt + 1);
}
function add() {
  const free = []; for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) if (!tiles.some((t) => t.r === r && t.c === c && !t.gone)) free.push([r, c]);
  if (!free.length) return;
  const [r, c] = free[Math.floor(Math.random() * free.length)];
  tiles.push({ id: nid++, v: Math.random() < 0.9 ? 2 : 4, r, c, isNew: true });
}
function face(t) {
  const L = lvl(t.v);
  if (!theme.pics) return '<b style="font-size:' + (t.v < 100 ? cellS * 0.42 : t.v < 1000 ? cellS * 0.34 : cellS * 0.26) + 'px">' + t.v + '</b>';
  return '<img src="' + KQ3D.emojiFile(theme.pics[Math.min(L, theme.pics.length - 1)]) + '" alt=""><b style="font-size:' + cellS * 0.17 + 'px">' + t.v + '</b>';
}
function render() {
  const B = document.getElementById('g2B'); if (!B) return;
  tiles.forEach((t) => {
    let el = document.getElementById('g2t' + t.id);
    if (!el) { el = document.createElement('div'); el.id = 'g2t' + t.id; el.className = 'g2-t'; el.style.width = el.style.height = cellS + 'px'; el.style.left = el.style.top = '0'; B.appendChild(el); if (t.isNew) el.classList.add('new'); }
    el.style.transform = 'translate(' + pos(t.c) + 'px,' + pos(t.r) + 'px)';
    el.style.background = COL[Math.min(COL.length - 1, lvl(t.v))];
    if (el.dataset.v !== String(t.v)) { el.innerHTML = face(t); if (el.dataset.v) { el.classList.remove('merge'); void el.offsetWidth; el.classList.add('merge'); } el.dataset.v = t.v; }
    el.style.zIndex = t.gone ? 1 : 2;
    t.isNew = false;
  });
}
function move(dir) {
  if (G.state !== 'play' || busy) return;
  const vec = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] }[dir];
  const order = [0, 1, 2, 3]; const rev = vec[0] === 1 || vec[1] === 1 ? order.slice().reverse() : order;
  const at = (r, c) => tiles.find((t) => !t.gone && t.r === r && t.c === c);
  let moved = false, gained = 0;
  tiles.forEach((t) => { t.merged = false; });
  rev.forEach((a) => rev.forEach((b) => {
    const r = vec[0] ? a : b, c = vec[0] ? b : a, t = at(r, c); if (!t) return;
    let nr = r, nc = c;
    while (true) {
      const tr = nr + vec[0], tc = nc + vec[1]; if (tr < 0 || tr > 3 || tc < 0 || tc > 3) break;
      const o = at(tr, tc);
      if (!o) { nr = tr; nc = tc; continue; }
      if (o.v === t.v && !o.merged && !t.merged) { t.gone = true; t.r = tr; t.c = tc; o.v *= 2; o.merged = true; gained += o.v; moved = true; if (o.v > topV) topV = o.v; return; }
      break;
    }
    if (nr !== r || nc !== c) { t.r = nr; t.c = nc; moved = true; }
  }));
  if (!moved) return;
  busy = true; render();
  if (gained) { score += gained; G.score(score); KQ3D.sfx(gained >= 64 ? 'coin' : 'pop'); G.hudSet('topV', topV); goal(); } else KQ3D.sfx('whoosh');
  setTimeout(() => {
    tiles.filter((t) => t.gone).forEach((t) => { const e = document.getElementById('g2t' + t.id); if (e) e.remove(); });
    tiles = tiles.filter((t) => !t.gone); add(); render(); busy = false;
    if (topV >= 2048 && !won) { won = true; KQ3D.sfx('win'); G.pop('👑 You made 2048!', null, innerHeight * 0.3, '#fde047'); try { if (window.KQFX) KQFX.celebrate({ power: 1 }); } catch (e) {} }
    if (!canMove()) G.over({ score, title: 'Board full!', lines: ['🏆 Best tile ' + topV] });
  }, 130);
}
function canMove() {
  if (tiles.length < 16) return true;
  return tiles.some((t) => tiles.some((o) => o !== t && o.v === t.v && Math.abs(o.r - t.r) + Math.abs(o.c - t.c) === 1));
}
document.addEventListener('keydown', (e) => { const d = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' }[e.key]; if (d) { e.preventDefault(); move(d); } });
KQ3D.swipe(G.scene, (d) => { if (d !== 'tap') move(d); });
reset(G.choice);
</script>
</body></html>
