<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hidden Objects</title>
<style>
.ho-bar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 4; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.92); box-shadow: 0 -4px 14px rgba(0,0,0,.12); font-family: 'Baloo 2', sans-serif; }
.ho-t { display: flex; align-items: center; gap: 4px; background: #f1f5f9; border-radius: 999px; padding: 2px 10px 2px 4px; font-weight: 800; font-size: 13px; color: #334155; }
.ho-t img { width: 30px; height: 30px; }
.ho-t.got { background: #22c55e; color: #fff; text-decoration: line-through; }
.ho-h { border: none; border-radius: 999px; background: #fde68a; color: #92400e; font: 800 14px 'Baloo 2', sans-serif; padding: 2px 12px; box-shadow: 0 3px 0 #d97706; cursor: pointer; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261120m"></script>
<script src="../ads.js"></script>
<script>
/* Hidden Objects — a new messy scene every round. Find the 6 pictures in the list. */
const THEMES = [
  { icon: '🌻', name: 'Garden', bg: ['#bbf7d0', '#86efac'], items: ['🌻', '🌷', '🌸', '🍄', '🐞', '🐝', '🦋', '🐌', '🐛', '🌳', '🪴', '🥕', '🍓', '🐸', '🐦', '🐇', '🪨', '🌼', '🍃', '🌱'] },
  { icon: '🧸', name: 'Bedroom', bg: ['#fde68a', '#fbcfe8'], items: ['🧸', '📚', '⏰', '🧦', '👟', '🎒', '✏️', '🎨', '🪀', '🪁', '🎈', '🧩', '🎲', '🚗', '🤖', '🎁', '🕯️', '🖍️', '🧢', '🥛'] },
  { icon: '🏖️', name: 'Beach', bg: ['#bae6fd', '#fde68a'], items: ['🐚', '🦀', '⛱️', '🏐', '🐠', '🐙', '🦞', '🌴', '🍉', '🍦', '🕶️', '🩴', '🪣', '⭐', '🐬', '🐢', '⛵', '🥥', '🦭', '🐟'] },
  { icon: '🚀', name: 'Space', bg: ['#1e1b4b', '#6d28d9'], items: ['🚀', '🛸', '🪐', '🌙', '⭐', '☄️', '🌍', '👨‍🚀', '🛰️', '👽', '🔭', '🌟', '💫', '🌑', '🤖', '🔋', '📡', '🌠', '🌞', '✨'] }
];
const ROUNDS = 3, FIND = 6;
const G = KQ3D.init({
  id: 'hidden_objects', title: 'Hidden Objects', bestKey: 'hiddenBest', music: true,
  hero: ['🔍', '🧸', '🐞'], colors: ['#8b5cf6', '#ec4899'],
  how: [['🔍', 'Look carefully at the busy picture'], ['👆', 'Tap the things shown in the list at the bottom'], ['💡', 'Stuck? A hint circles one for you (3 per scene)'], ['⏱️', 'Find them fast for bonus points · 3 scenes']],
  scoreIcon: '🔍', stars: [250, 450, 600],
  pick: { label: 'Pick a place', options: THEMES },
  onReset: (t) => reset(t)
});
const C = KQ3D.canvas(G.scene, () => { if (items) layout(); }), ctx = C.ctx;
const bar = document.createElement('div'); bar.className = 'ho-bar'; G.root.appendChild(bar);
let theme = G.choice || THEMES[0], items, targets, round, score, hints, t0, rings = [], misses = [], hintRing = null;
function reset(t) { theme = t || THEMES[0]; round = 0; score = 0; G.score(0); scene(); }
function scene() {
  hints = 3; t0 = performance.now(); rings = []; hintRing = null;
  const pool = theme.items.slice().sort(() => Math.random() - 0.5);
  targets = pool.slice(0, FIND).map((e) => ({ e, got: false }));
  items = [];
  // clutter: lots of decoys (never the same picture as a target) + the targets once each
  const decoys = pool.slice(FIND);
  for (let k = 0; k < 34 + round * 6; k++) items.push({ e: decoys[k % decoys.length] });
  items.sort(() => Math.random() - 0.5);
  targets.forEach((t) => items.push({ e: t.e, target: t }));   // targets drawn on top so they can always be tapped
  layout(); drawBar();
}
function layout() {
  const top = 70, bottom = 96, W = C.w, H = C.h - top - bottom;
  items.forEach((it) => {
    it.s = (it.target ? 0.75 + Math.random() * 0.4 : 0.6 + Math.random() * 0.9) * Math.min(W, H) * 0.11;
    it.x = 20 + Math.random() * (W - 40); it.y = top + 20 + Math.random() * (H - 40); it.rot = (Math.random() - 0.5) * 1.2;
  });
}
function drawBar() {
  bar.innerHTML = targets.map((t) => '<span class="ho-t' + (t.got ? ' got' : '') + '"><img src="' + KQ3D.emojiFile(t.e) + '" alt=""></span>').join('') + '<button type="button" class="ho-h" id="hoH">💡 ' + hints + '</button>';
  document.getElementById('hoH').onclick = hint;
}
function hint() {
  if (G.state !== 'play' || !hints) return;
  const it = items.find((i) => i.target && !i.target.got); if (!it) return;
  hints--; hintRing = { it, l: 2.2 }; KQ3D.sfx('chime'); drawBar();
}
G.scene.addEventListener('pointerdown', (e) => {
  if (G.state !== 'play') return;
  const r = C.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  // topmost item under the finger
  for (let k = items.length - 1; k >= 0; k--) {
    const it = items[k]; if (Math.hypot(x - it.x, y - it.y) > it.s * 0.55) continue;
    if (it.target && !it.target.got) { found(it); return; }
    break;
  }
  misses.push({ x, y, l: 0.5 }); KQ3D.sfx('tick');
});
function found(it) {
  it.target.got = true; rings.push(it);
  const secs = (performance.now() - t0) / 1000, pts = 20 + Math.max(0, Math.round(10 - secs / 6));
  score += pts; G.score(score); KQ3D.sfx('success');
  const r = C.cv.getBoundingClientRect(); G.pop('+' + pts, it.x + r.left, it.y + r.top - 20, '#fde047');
  if (hintRing && hintRing.it === it) hintRing = null;
  drawBar();
  if (targets.every((t) => t.got)) {
    const bonus = hints * 15 + Math.max(0, Math.round(60 - (performance.now() - t0) / 1000));
    score += bonus; G.score(score); KQ3D.sfx('levelup'); G.pop('Scene done! +' + bonus, null, C.h * 0.35, '#bbf7d0');
    try { if (window.KQFX) KQFX.celebrate({ power: 0.5 }); } catch (e) {}
    round++;
    if (round >= ROUNDS) setTimeout(() => G.over({ score, title: 'Super spotter! 🔍', lines: [theme.icon + ' ' + theme.name, '🔍 ' + ROUNDS * FIND + ' found'] }), 1200);
    else setTimeout(() => { if (G.state === 'play') scene(); }, 1500);
  }
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const g = ctx.createLinearGradient(0, 0, 0, C.h); g.addColorStop(0, theme.bg[0]); g.addColorStop(1, theme.bg[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, C.w, C.h);
  if (theme.name === 'Space') for (let k = 0; k < 60; k++) { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect((k * 137) % C.w, (k * 91) % C.h, 2, 2); }
  if (!items) return;
  items.forEach((it) => KQ3D.drawPic(ctx, it.e, it.x, it.y, it.s, it.rot));
  rings.forEach((it) => { ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(it.x, it.y, it.s * 0.62, 0, 7); ctx.stroke(); KQ3D.drawPic(ctx, '✅', it.x + it.s * 0.45, it.y - it.s * 0.45, 22); });
  if (hintRing) { hintRing.l -= dt; const p = 1 + Math.sin(now / 120) * 0.12; ctx.strokeStyle = 'rgba(250,204,21,.95)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(hintRing.it.x, hintRing.it.y, hintRing.it.s * 0.8 * p, 0, 7); ctx.stroke(); if (hintRing.l <= 0) hintRing = null; }
  misses = misses.filter((m) => (m.l -= dt) > 0); misses.forEach((m) => { ctx.globalAlpha = m.l * 2; KQ3D.drawPic(ctx, '❌', m.x, m.y, 26); ctx.globalAlpha = 1; });
}
reset(theme);
requestAnimationFrame(frame);
</script>
</body></html>
