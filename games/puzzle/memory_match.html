<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Memory Match</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Baloo 2',system-ui,sans-serif;background:linear-gradient(135deg,#c5e1a5,#06b6d4);height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:8px;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
.wrap{background:#fff;border:6px solid #fff;border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.2);padding:16px;max-width:440px;width:100%}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bar button{background:linear-gradient(135deg,#60a5fa,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 14px;font-family:inherit;font-weight:800;cursor:pointer;font-size:13px}
.bar .sc{font-weight:800;color:#ff5a8a;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{position:relative;height:0;padding-bottom:100%;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#ff7ac6);font-size:34px;cursor:pointer;transition:transform .2s;user-select:none;color:transparent}
.tile span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.tile.open{background:#fff8cc;border:3px dashed #ffb703;color:#000;transform:scale(1.04)}
.tile.done{background:#d1fae5;border:3px solid #34d399;color:#000;cursor:default}
.msg{text-align:center;color:#ff5a8a;font-weight:800;font-size:18px;min-height:26px;margin-top:10px}

/* mobile fit */
.wrap{display:flex;flex-direction:column;max-height:100%;overflow-y:auto}

</style></head><body>
<div class="wrap">
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <div class="sc">Moves: <span id="moves">0</span> &nbsp; Pairs: <span id="pairs">0</span>/8</div>
    <button onclick="reset()">↻</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
</div>
<script src="../ads.js"></script>
<script>
const EMO=['🐶','🐱','🐼','🦁','🐸','🐵','🦊','🐷'];
let first=null,lock=false,moves=0,pairs=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function reset(){
  first=null;lock=false;moves=0;pairs=0;
  document.getElementById('moves').textContent=0;
  document.getElementById('pairs').textContent=0;
  document.getElementById('msg').textContent='';
  const grid=document.getElementById('grid');grid.innerHTML='';
  shuffle([...EMO,...EMO]).forEach(e=>{
    const t=document.createElement('div');t.className='tile';t.innerHTML='<span>'+e+'</span>';
    t.onclick=()=>flip(t);grid.appendChild(t);
  });
}
function flip(t){
  if(lock||t.classList.contains('open')||t.classList.contains('done'))return;
  t.classList.add('open');
  if(window.KQFX){KQFX.play('flip');KQFX.flipEl(t);}
  if(!first){first=t;return;}
  moves++;document.getElementById('moves').textContent=moves;
  if(first.textContent===t.textContent){
    first.classList.add('done');t.classList.add('done');
    first.classList.remove('open');t.classList.remove('open');
    if(window.KQFX)KQFX.play('ding');
    first=null;pairs++;document.getElementById('pairs').textContent=pairs;
    if(pairs===8){document.getElementById('msg').textContent='🎉 You won in '+moves+' moves!';if(window.KQFX)KQFX.win();onGameComplete();}
  }else{
    lock=true;const a=first;first=null;
    setTimeout(()=>{a.classList.remove('open');t.classList.remove('open');lock=false;},700);
  }
}
reset();
</script></body></html>
