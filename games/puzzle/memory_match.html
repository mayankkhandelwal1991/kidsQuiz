<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Memory Match</title>
<style>
.mm { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 76px 12px 20px; background: radial-gradient(circle at 20% 15%, rgba(255,255,255,.35) 0 60px, transparent 61px), radial-gradient(circle at 85% 80%, rgba(255,255,255,.25) 0 90px, transparent 91px), linear-gradient(160deg, #c4b5fd, #f9a8d4); }
.mm-lvl { font: 800 18px 'Baloo 2', sans-serif; color: #4c1d95; background: rgba(255,255,255,.85); border-radius: 999px; padding: 2px 16px; margin-bottom: 10px; }
.mm-grid { display: grid; gap: 10px; width: 100%; perspective: 900px; }
.mm-card { position: relative; aspect-ratio: 3 / 4; border: none; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.34,1.4,.64,1); }
.mm-card.up, .mm-card.done { transform: rotateY(180deg); }
.mm-card.done { animation: mmPop .5s .3s both; cursor: default; }
@keyframes mmPop { 50% { transform: rotateY(180deg) scale(1.12); } }
.mm-card.no { animation: mmShake .4s; }
@keyframes mmShake { 25% { transform: rotateY(180deg) translateX(-6px); } 75% { transform: rotateY(180deg) translateX(6px); } }
.mm-f { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
.mm-back { background: repeating-linear-gradient(45deg, #8b5cf6 0 12px, #7c3aed 12px 24px); border: 4px solid #fff; }
.mm-back img { width: 46%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
.mm-front { background: #fff; transform: rotateY(180deg); border: 4px solid #fde68a; }
.mm-card.done .mm-front { border-color: #86efac; background: #f0fdf4; }
.mm-front img { width: 70%; }
.mm-front b { font: 800 clamp(14px, 4.6vw, 26px) 'Baloo 2', sans-serif; color: #4c1d95; letter-spacing: .04em; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124a"></script>
<script src="../ads.js"></script>
<script>
/* Memory Match — flip two cards, find the pairs. 3 levels per game.
   "Words" theme matches a written word with its picture. */
const THEMES = [
  { icon: '🐶', name: 'Animals', items: ['🐶', '🐱', '🐰', '🐼', '🦁', '🐸', '🐵', '🐧', '🐯', '🐨'] },
  { icon: '🍎', name: 'Fruits', items: ['🍎', '🍌', '🍇', '🍓', '🍉', '🍍', '🍒', '🍊', '🥝', '🍑'] },
  { icon: '🚗', name: 'Vehicles', items: ['🚗', '🚌', '🚂', '✈️', '🚢', '🚲', '🚁', '🚒', '🚜', '🚀'] },
  { icon: '🔤', name: 'Words', words: [['CAT', '🐱'], ['DOG', '🐶'], ['SUN', '☀️'], ['BUS', '🚌'], ['CAKE', '🎂'], ['BALL', '⚽'], ['FISH', '🐟'], ['TREE', '🌳'], ['STAR', '⭐'], ['BOOK', '📚']] }
];
const LEVELS = [{ pairs: 6, cols: 3 }, { pairs: 8, cols: 4 }, { pairs: 10, cols: 4 }];
const NAMES = { '🐶': 'dog', '🐱': 'cat', '🐰': 'bunny', '🐼': 'panda', '🦁': 'lion', '🐸': 'frog', '🐵': 'monkey', '🐧': 'penguin', '🐯': 'tiger', '🐨': 'koala', '🍎': 'apple', '🍌': 'banana', '🍇': 'grapes', '🍓': 'strawberry', '🍉': 'watermelon', '🍍': 'pineapple', '🍒': 'cherries', '🍊': 'orange', '🥝': 'kiwi', '🍑': 'peach', '🚗': 'car', '🚌': 'bus', '🚂': 'train', '✈️': 'aeroplane', '🚢': 'ship', '🚲': 'bicycle', '🚁': 'helicopter', '🚒': 'fire engine', '🚜': 'tractor', '🚀': 'rocket' };
const G = KQ3D.init({
  id: 'memory_match', title: 'Memory Match', bestKey: 'memoryPtsBest', music: true,
  hero: ['🧠', '🃏', '⭐'], colors: ['#8b5cf6', '#ec4899'],
  how: [['👆', 'Tap two cards to flip them'], ['🃏', 'Find the matching pairs — remember where they are!'], ['🔤', 'Words theme: match the word with its picture'], ['⭐', 'Fewer flips and quick matches = more points']],
  hud: [{ id: 'moves', icon: '👆' }, { id: 'lvl', icon: '🗺️' }], scoreIcon: '⭐', stars: [300, 550, 750],
  pick: { label: 'Pick a theme', options: THEMES },
  onReset: (t) => reset(t)
});
const box = document.createElement('div'); box.className = 'mm'; G.scene.appendChild(box);
let theme, level, score, moves, open = [], matched, lock, combo, lvlMoves, lvlStart;

function say(t) {
  try { if (localStorage.getItem('kq_muted') === '1') return; } catch (e) {}
  try { if (window.Android && Android.speak) { Android.speak(t, 'en'); return; } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(t); u.rate = 0.9; u.pitch = 1.2; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function reset(t) { theme = t || THEMES[0]; level = 1; score = 0; moves = 0; G.score(0); deal(); }
function deal() {
  const L = LEVELS[level - 1]; matched = 0; lock = false; open = []; combo = 0; lvlMoves = 0; lvlStart = performance.now();
  moves = moves || 0; G.hudSet('lvl', level + '/3'); G.hudSet('moves', lvlMoves);
  let cards = [];
  if (theme.words) {
    theme.words.slice().sort(() => Math.random() - 0.5).slice(0, L.pairs).forEach(([w, e], i) => { cards.push({ k: i, word: w, say: w }); cards.push({ k: i, pic: e, say: w }); });
  } else {
    theme.items.slice().sort(() => Math.random() - 0.5).slice(0, L.pairs).forEach((e, i) => { cards.push({ k: i, pic: e, say: NAMES[e] || '' }); cards.push({ k: i, pic: e, say: NAMES[e] || '' }); });
  }
  cards.sort(() => Math.random() - 0.5);
  const rows = Math.ceil(cards.length / L.cols);
  const maxW = Math.min(innerWidth - 24, ((innerHeight - 140) / rows) * 0.75 * L.cols + (L.cols - 1) * 10, 560);
  box.innerHTML = '<div class="mm-lvl">Level ' + level + ' · ' + L.pairs + ' pairs</div><div class="mm-grid" style="grid-template-columns:repeat(' + L.cols + ',1fr);max-width:' + maxW + 'px"></div>';
  const grid = box.querySelector('.mm-grid');
  cards.forEach((c) => {
    const b = document.createElement('button'); b.className = 'mm-card'; b.type = 'button';
    b.innerHTML = '<span class="mm-f mm-back"><img src="' + KQ3D.emojiFile('❓') + '" alt=""></span><span class="mm-f mm-front">' + (c.word ? '<b>' + c.word + '</b>' : '<img src="' + KQ3D.emojiFile(c.pic) + '" alt="">') + '</span>';
    b.onclick = () => flip(b, c); grid.appendChild(b);
  });
}
function flip(b, c) {
  if (G.state !== 'play' || lock || b.classList.contains('up') || b.classList.contains('done')) return;
  b.classList.add('up'); KQ3D.sfx('flip'); open.push({ b, c });
  if (open.length < 2) return;
  lvlMoves++; G.hudSet('moves', lvlMoves);
  const [a, d] = open; open = [];
  if (a.c.k === d.c.k) {
    matched++; combo++;
    const pts = 20 + (combo > 1 ? combo * 5 : 0); score += pts; G.score(score);
    setTimeout(() => { a.b.classList.add('done'); d.b.classList.add('done'); KQ3D.sfx(combo > 1 ? 'coin' : 'success'); say(a.c.say); }, 250);
    const r = d.b.getBoundingClientRect(); G.pop('+' + pts + (combo > 1 ? ' combo!' : ''), r.left + r.width / 2, r.top, '#fde047');
    if (matched === LEVELS[level - 1].pairs) G.later(levelDone, 900);
  } else {
    combo = 0; lock = true;
    setTimeout(() => { a.b.classList.add('no'); d.b.classList.add('no'); KQ3D.sfx('wrong'); }, 350);
    setTimeout(() => { [a, d].forEach((x) => x.b.classList.remove('up', 'no')); lock = false; }, 950);
  }
}
function levelDone() {
  if (G.state !== 'play') return;
  const L = LEVELS[level - 1], extra = Math.max(0, lvlMoves - L.pairs), secs = (performance.now() - lvlStart) / 1000;
  const bonus = Math.max(0, 100 - extra * 8) + Math.max(0, Math.round(60 - secs));
  score += bonus; G.score(score); moves += lvlMoves;
  KQ3D.sfx('levelup'); G.pop('Level ' + level + ' done! +' + bonus, null, innerHeight * 0.4, '#bbf7d0');
  try { if (window.KQFX) KQFX.celebrate({ power: 0.5 }); } catch (e) {}
  if (level >= LEVELS.length) setTimeout(() => G.over({ score, title: 'Super memory! 🧠', lines: ['👆 ' + moves + ' moves', '🃏 ' + theme.name] }), 900);
  else { level++; G.later(() => { deal(); }, 1300); }
}
reset(G.choice);
</script>
</body></html>
