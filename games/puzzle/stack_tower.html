<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Stack Tower</title>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Stack Tower — tap to drop the sliding block. Only the part that lands on the
   tower stays. Perfect drops sparkle and grow the block back a little. */
const THEMES = [
  { icon: '🎂', name: 'Cake', cols: ['#fbcfe8', '#fde68a', '#bbf7d0', '#bfdbfe', '#ddd6fe', '#fecaca'], top: '🍓', base: '🍽️' },
  { icon: '🏢', name: 'Skyscraper', cols: ['#94a3b8', '#60a5fa', '#a5b4fc', '#7dd3fc', '#cbd5e1', '#93c5fd'], top: '🚁', base: '🌳', windows: true },
  { icon: '🧸', name: 'Toy blocks', cols: ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#ec4899'], top: '⭐', base: '🧸', letters: true }
];
const G = KQ3D.init({
  id: 'stack_tower', title: 'Stack Tower', bestKey: 'stackBest', music: true,
  hero: ['🎂', '🏢', '🧸'], colors: ['#ec4899', '#3b82f6'],
  how: [['👆', 'Tap anywhere to drop the sliding block'], ['✂️', 'Bits hanging over the edge fall off'], ['✨', 'Perfect drops sparkle and grow the block back'], ['🏆', 'How tall can you build?']],
  scoreIcon: '🏗️', stars: [10, 25, 45],
  pick: { label: 'What will you build?', options: THEMES },
  onReset: (t) => reset(t)
});
const C = KQ3D.canvas(G.scene), ctx = C.ctx;
let theme = G.choice || THEMES[0], stack, cur, dir, speed, cam, falling, perfect, sparks, BH;
function reset(t) {
  theme = t || THEMES[0]; BH = Math.max(28, Math.min(40, C.h / 22));
  const w = Math.min(C.w * 0.6, 260);
  stack = [{ x: (C.w - w) / 2, w, c: 0 }]; falling = []; sparks = []; perfect = 0; cam = 0; speed = 150; dir = 1;
  spawn(); G.score(0);
}
function spawn() { const top = stack[stack.length - 1]; cur = { x: dir > 0 ? -top.w : C.w, w: top.w, c: stack.length }; }
function drop() {
  if (G.state !== 'play' || !cur) return;
  const top = stack[stack.length - 1];
  const l = Math.max(cur.x, top.x), r = Math.min(cur.x + cur.w, top.x + top.w);
  if (r - l <= 2) { falling.push({ x: cur.x, w: cur.w, y: yOf(stack.length), c: cur.c, vy: 0 }); cur = null; KQ3D.sfx('lose'); G.over({ score: stack.length - 1, title: 'Missed! 🏗️', lines: ['🏢 ' + (stack.length - 1) + ' blocks high'] }); return; }
  const off = Math.abs(cur.x - top.x);
  let piece;
  if (off < 6) {
    perfect++; piece = { x: top.x, w: Math.min(top.w + (perfect >= 3 ? 8 : 0), Math.min(C.w * 0.6, 260)), c: cur.c };
    piece.x = top.x - (piece.w - top.w) / 2;
    KQ3D.sfx(perfect >= 3 ? 'coin' : 'ding');
    for (let k = 0; k < 14; k++) sparks.push({ x: piece.x + Math.random() * piece.w, y: yOf(stack.length), vx: (Math.random() - 0.5) * 160, vy: -Math.random() * 200, l: 0.6 });
    G.pop(perfect >= 3 ? 'PERFECT x' + perfect + '!' : 'Perfect!', null, C.h * 0.3, '#fde047');
  } else {
    perfect = 0; piece = { x: l, w: r - l, c: cur.c }; KQ3D.sfx('drop');
    const cut = cur.x < top.x ? { x: cur.x, w: top.x - cur.x } : { x: r, w: cur.x + cur.w - r };
    falling.push({ x: cut.x, w: cut.w, y: yOf(stack.length), c: cur.c, vy: 0, rot: 0, vr: (cut.x < l ? -1 : 1) * 2 });
  }
  stack.push(piece); G.score(stack.length - 1);
  if ((stack.length - 1) % 10 === 0) { KQ3D.sfx('levelup'); G.pop((stack.length - 1) + ' high! 🎉', null, C.h * 0.25, '#a5f3fc'); }
  speed = Math.min(420, 150 + stack.length * 7); dir = -dir; spawn();
}
const yOf = (i) => C.h - 110 - (i + 1) * BH;
G.scene.addEventListener('pointerdown', drop);
document.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'ArrowDown') { if (G.state === 'play') { e.preventDefault(); drop(); } } });

function blockDraw(b, y, rot) {
  const col = theme.cols[b.c % theme.cols.length];
  ctx.save(); ctx.translate(b.x + b.w / 2, y + BH / 2); if (rot) ctx.rotate(rot);
  const x = -b.w / 2, yy = -BH / 2;
  ctx.fillStyle = 'rgba(0,0,0,.18)'; KQ3D.roundRect(ctx, x, yy + 4, b.w, BH, 8); ctx.fill();
  ctx.fillStyle = col; KQ3D.roundRect(ctx, x, yy, b.w, BH, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x + 6, yy + 4, Math.max(0, b.w - 12), 4);
  if (theme.name === 'Cake') { ctx.fillStyle = '#fff'; for (let k = x + 6; k < x + b.w - 6; k += 14) { ctx.beginPath(); ctx.arc(k + 4, yy + 2, 5, 0, Math.PI); ctx.fill(); } }
  if (theme.windows && b.w > 30) { ctx.fillStyle = 'rgba(254,249,195,.9)'; for (let k = x + 8; k < x + b.w - 16; k += 18) ctx.fillRect(k, yy + 10, 10, BH - 16); }
  if (theme.letters && b.w > 26) { ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.font = '800 ' + (BH * 0.6) + 'px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ABCDEFGHIJKLMNOPQRSTUVWXYZ'[b.c % 26], 0, 1); }
  ctx.restore();
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (G.state === 'play' && cur) {
    cur.x += dir * speed * dt;
    if (cur.x > C.w - cur.w * 0.2 && dir > 0) dir = -1; if (cur.x < -cur.w * 0.8 && dir < 0) dir = 1;
  } else if (G.state === 'menu' && cur) { cur.x += dir * 120 * dt; if (cur.x > C.w - cur.w || cur.x < 0) dir = -dir; }
  // camera rises with the tower
  const want = Math.max(0, (stack.length - 8) * BH); cam += (want - cam) * Math.min(1, dt * 4);
  const h = Math.min(1, stack.length / 40);
  const sky = ctx.createLinearGradient(0, 0, 0, C.h);
  sky.addColorStop(0, h < 0.5 ? '#7dd3fc' : h < 0.8 ? '#fb923c' : '#1e1b4b'); sky.addColorStop(1, h < 0.5 ? '#e0f2fe' : h < 0.8 ? '#fde68a' : '#6d28d9');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, C.w, C.h);
  if (h >= 0.8) for (let k = 0; k < 40; k++) { ctx.fillStyle = '#fff'; ctx.fillRect((k * 131) % C.w, (k * 89) % (C.h * 0.6), 2, 2); }
  ctx.fillStyle = 'rgba(255,255,255,.85)'; for (let k = 0; k < 4; k++) { const cx = ((k * 220 + now / 60) % (C.w + 200)) - 100, cy = 120 + k * 90 + cam * 0.3; ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 7); ctx.arc(cx + 26, cy - 8, 18, 0, 7); ctx.arc(cx + 48, cy, 20, 0, 7); ctx.fill(); }
  ctx.save(); ctx.translate(0, cam);
  ctx.fillStyle = '#4ade80'; ctx.fillRect(0, C.h - 110, C.w, 400);
  KQ3D.drawPic(ctx, theme.base, C.w / 2, C.h - 70, 60); KQ3D.drawPic(ctx, '🌳', 40, C.h - 130, 60); KQ3D.drawPic(ctx, '🌳', C.w - 40, C.h - 130, 60);
  stack.forEach((b, i) => { if (i) blockDraw(b, yOf(i)); else { ctx.fillStyle = '#a16207'; KQ3D.roundRect(ctx, b.x, yOf(0), b.w, BH, 8); ctx.fill(); } });
  if (cur && G.state !== 'over') blockDraw(cur, yOf(stack.length));
  if (stack.length > 1 && G.state === 'over') KQ3D.drawPic(ctx, theme.top, stack[stack.length - 1].x + stack[stack.length - 1].w / 2, yOf(stack.length - 1) - 20, 40);
  falling = falling.filter((f) => f.y < C.h + 400); falling.forEach((f) => { f.vy += 900 * dt; f.y += f.vy * dt; f.rot = (f.rot || 0) + (f.vr || 0) * dt; blockDraw(f, f.y, f.rot); });
  sparks = sparks.filter((s) => (s.l -= dt) > 0); sparks.forEach((s) => { s.vy += 400 * dt; s.x += s.vx * dt; s.y += s.vy * dt; KQ3D.drawPic(ctx, '✨', s.x, s.y, 18); });
  ctx.restore();
}
reset(theme);
requestAnimationFrame(frame);
</script>
</body></html>
