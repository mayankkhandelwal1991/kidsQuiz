<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Juice Sort</title>
<style>
.js { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 10px 16px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(170deg, #fef9c3, #fed7aa 50%, #fbcfe8); }
.js-info { font-weight: 800; color: #9a3412; margin-bottom: 10px; }
.js-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px 12px; max-width: 520px; }
.js-tube { position: relative; width: 52px; height: 190px; border: 4px solid rgba(255,255,255,.95); border-top: none; border-radius: 0 0 26px 26px; background: rgba(255,255,255,.35); display: flex; flex-direction: column-reverse; overflow: hidden; cursor: pointer; transition: transform .2s; box-shadow: 0 8px 14px rgba(0,0,0,.08), inset 0 0 0 2px rgba(255,255,255,.4); }
.js-tube::before { content: ''; position: absolute; left: 8px; top: 8px; bottom: 16px; width: 6px; border-radius: 3px; background: rgba(255,255,255,.55); z-index: 2; }
.js-tube.sel { transform: translateY(-22px); }
.js-tube.done { border-color: #86efac; }
.js-tube.no { animation: jsShake .35s; }
@keyframes jsShake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.js-l { height: 25%; flex: 0 0 auto; transition: height .25s; position: relative; }
.js-l + .js-l { box-shadow: inset 0 -2px 0 rgba(255,255,255,.25); }
.js-cork { position: absolute; top: -6px; left: 50%; width: 44px; margin-left: -22px; height: 14px; border-radius: 6px; background: #a16207; z-index: 3; }
.js-fruit { position: absolute; top: -40px; left: 50%; width: 32px; margin-left: -16px; z-index: 3; animation: jsPop .4s cubic-bezier(.34,1.56,.64,1); }
@keyframes jsPop { from { transform: scale(0); } }
.js-wrap { position: relative; padding-top: 40px; }
.js-btns { display: flex; gap: 8px; margin-top: 16px; }
.js-b { border: none; border-radius: 16px; padding: 8px 14px; font: 800 15px 'Baloo 2', sans-serif; background: #fff; color: #9a3412; box-shadow: 0 4px 0 rgba(0,0,0,.12); cursor: pointer; }
.js-b:disabled { opacity: .45; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261123d"></script>
<script src="../ads.js"></script>
<script>
/* Juice Sort — tap a tube, then tap another to pour. You can pour onto the same
   colour or into an empty tube. Fill each tube with one juice. 5 levels. */
const JUICE = [['#ef4444', '🍓'], ['#f97316', '🍊'], ['#facc15', '🍋'], ['#22c55e', '🥝'], ['#a855f7', '🍇'], ['#ec4899', '🍑'], ['#3b82f6', '🫐'], ['#a16207', '🥥']];
const CAP = 4, LEVELS = 5;
const G = KQ3D.init({
  id: 'water_sort', title: 'Juice Sort', bestKey: 'juiceBest', music: true,
  hero: ['🧃', '🍓', '🍋'], colors: ['#f97316', '#ec4899'],
  how: [['👆', 'Tap a tube, then tap where to pour'], ['🧃', 'Pour onto the same juice or into an empty tube'], ['🍓', 'Fill every tube with just one juice'], ['↩️', 'Undo a pour, or add a bonus tube if stuck']],
  scoreIcon: '🧃', stars: [300, 600, 800],
  hud: [{ id: 'lvl', icon: '🗺️' }],
  onReset: () => reset()
});
const box = document.createElement('div'); box.className = 'js'; G.scene.appendChild(box);
let level, tubes, sel, hist, moves, score, extraUsed;
function reset() { level = 1; score = 0; G.score(0); gen(); }
function gen() {
  const n = Math.min(JUICE.length, 2 + level);
  let pool = []; for (let i = 0; i < n; i++) for (let j = 0; j < CAP; j++) pool.push(i);
  do { pool.sort(() => Math.random() - 0.5); tubes = []; for (let i = 0; i < n; i++) tubes.push(pool.slice(i * CAP, i * CAP + CAP)); } while (tubes.some(full1));
  tubes.push([], []); sel = -1; hist = []; moves = 0; extraUsed = false; G.hudSet('lvl', level + '/' + LEVELS); draw();
}
const full1 = (t) => t.length === CAP && t.every((v) => v === t[0]);
function draw() {
  box.innerHTML = '<div class="js-info">Level ' + level + ' · ' + moves + ' pours</div><div class="js-row">' + tubes.map((t, i) =>
    '<div class="js-wrap">' + (full1(t) ? '<img class="js-fruit" src="' + KQ3D.emojiFile(JUICE[t[0]][1]) + '" alt="">' : '') +
    '<div class="js-tube' + (i === sel ? ' sel' : '') + (full1(t) ? ' done' : '') + '" data-i="' + i + '">' + (full1(t) ? '<span class="js-cork"></span>' : '') +
    t.map((v) => '<div class="js-l" style="background:linear-gradient(90deg,' + JUICE[v][0] + ',' + JUICE[v][0] + 'cc)"></div>').join('') + '</div></div>').join('') + '</div>' +
    '<div class="js-btns"><button type="button" class="js-b" id="jsU"' + (hist.length ? '' : ' disabled') + '>↩️ Undo</button><button type="button" class="js-b" id="jsR">🔄 Restart</button><button type="button" class="js-b" id="jsX"' + (extraUsed ? ' disabled' : '') + '>➕ Tube</button></div>';
  box.querySelectorAll('.js-tube').forEach((el) => el.onclick = () => tap(+el.dataset.i, el));
  document.getElementById('jsU').onclick = () => { if (!hist.length || G.state !== 'play') return; tubes = hist.pop(); moves++; sel = -1; KQ3D.sfx('tap'); draw(); };
  document.getElementById('jsR').onclick = () => { if (G.state !== 'play') return; if (hist.length) { tubes = hist[0]; hist = []; } sel = -1; moves += 2; KQ3D.sfx('whoosh'); draw(); };
  document.getElementById('jsX').onclick = () => { if (G.state !== 'play' || extraUsed) return; extraUsed = true; tubes.push([]); hist = hist.map((h) => h.concat([[]])); KQ3D.sfx('chime'); draw(); };
}
function tap(i, el) {
  if (G.state !== 'play') return;
  if (sel < 0) { if (!tubes[i].length || full1(tubes[i])) { KQ3D.sfx('tick'); return; } sel = i; KQ3D.sfx('tap'); draw(); return; }
  if (sel === i) { sel = -1; draw(); return; }
  const a = tubes[sel], b = tubes[i], top = a[a.length - 1];
  if (b.length >= CAP || (b.length && b[b.length - 1] !== top)) { el.classList.add('no'); KQ3D.sfx('wrong'); setTimeout(() => el.classList.remove('no'), 350); return; }
  hist.push(tubes.map((t) => t.slice()));
  while (a.length && a[a.length - 1] === top && b.length < CAP) b.push(a.pop());
  moves++; sel = -1; KQ3D.sfx(full1(b) ? 'ding' : 'splash'); draw();
  if (tubes.every((t) => !t.length || full1(t))) win();
}
function win() {
  const par = (2 + level) * 2 + 2, pts = 100 + Math.max(0, 60 - Math.max(0, moves - par) * 4) - (extraUsed ? 20 : 0);
  score += pts; G.score(score); KQ3D.sfx('levelup'); G.pop('All sorted! +' + pts, null, innerHeight * 0.3, '#bbf7d0');
  try { if (window.KQFX) KQFX.celebrate({ power: 0.5 }); } catch (e) {}
  if (level >= LEVELS) setTimeout(() => G.over({ score, title: 'Juice master! 🧃', lines: ['🗺️ ' + LEVELS + ' levels'] }), 1200);
  else { level++; G.later(() => { gen(); }, 1500); }
}
reset();
</script>
</body></html>
