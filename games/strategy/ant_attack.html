<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ant Attack</title>
<style>
.aa-shop { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; gap: 8px; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); background: rgba(255,255,255,.92); box-shadow: 0 -4px 14px rgba(0,0,0,.12); font-family: 'Baloo 2', sans-serif; }
.aa-b { border: 3px solid transparent; background: #f1f5f9; border-radius: 16px; padding: 4px 10px; display: flex; flex-direction: column; align-items: center; font-weight: 800; font-size: 12px; color: #334155; cursor: pointer; min-width: 74px; }
.aa-b img { width: 34px; height: 34px; } .aa-b.on { border-color: #16a34a; background: #dcfce7; } .aa-b.poor { opacity: .45; }
.aa-go { border: none; border-radius: 16px; padding: 4px 14px; font: 800 15px 'Baloo 2', sans-serif; color: #fff; background: linear-gradient(135deg, #f97316, #dc2626); box-shadow: 0 4px 0 #9a3412; cursor: pointer; }
.aa-go:disabled { background: #94a3b8; box-shadow: none; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261123b"></script>
<script src="../ads.js"></script>
<script>
/* Ant Attack — tower defence. Place animal guards beside the path to stop the
   bugs reaching the cookie jar. 8 waves. */
const GUARDS = {
  frog: { e: '🐸', name: 'Frog', cost: 30, range: 95, rate: 0.6, dmg: 1, col: '#ec4899' },
  hedgehog: { e: '🦔', name: 'Hedgehog', cost: 50, range: 70, rate: 1.4, dmg: 2, splash: 45, col: '#a16207' },
  bee: { e: '🐝', name: 'Bee', cost: 70, range: 150, rate: 1.0, dmg: 2, col: '#eab308' }
};
const BUGS = { ant: { e: '🐜', hp: 3, sp: 46, seeds: 4 }, fly: { e: '🪰', hp: 2, sp: 85, seeds: 5 }, beetle: { e: '🪲', hp: 12, sp: 30, seeds: 12 } };
const WAVES = 8;
const G = KQ3D.init({
  id: 'ant_attack', title: 'Ant Attack', bestKey: 'antBest', music: true,
  hero: ['🐜', '🍪', '🐸'], colors: ['#16a34a', '#a16207'],
  how: [['🐜', 'Bugs march along the path to steal your cookies!'], ['👆', 'Pick a guard below, then tap the grass to place it'], ['🌱', 'Stopping bugs earns seeds to buy more guards'], ['🍪', 'Protect your 5 cookies for 8 waves']],
  hud: [{ id: 'seeds', icon: '🌱' }, { id: 'jar', icon: '🍪' }, { id: 'wave', icon: '🚩' }], scoreIcon: '⭐', stars: [300, 600, 900],
  onReset: () => reset()
});
const C = KQ3D.canvas(G.scene, () => { if (path) buildPath(); }), ctx = C.ctx;
const shop = document.createElement('div'); shop.className = 'aa-shop'; G.root.appendChild(shop);
let path, guards, bugs, shots, pops, seeds, cookies, wave, spawnQ, spawnT, waveOn, sel, score, killed;
function buildPath() {
  const w = C.w, top = 90, bot = C.h - 110, h = bot - top;
  path = [[-30, top + h * 0.12], [w * 0.75, top + h * 0.12], [w * 0.75, top + h * 0.38], [w * 0.22, top + h * 0.38], [w * 0.22, top + h * 0.64], [w * 0.78, top + h * 0.64], [w * 0.78, top + h * 0.86], [w * 0.5, top + h * 0.86]];
  path.len = 0; path.seg = [];
  for (let k = 1; k < path.length; k++) { const l = Math.hypot(path[k][0] - path[k - 1][0], path[k][1] - path[k - 1][1]); path.seg.push(l); path.len += l; }
}
function at(d) {
  for (let k = 0; k < path.seg.length; k++) { if (d <= path.seg[k]) { const t = d / path.seg[k], a = path[k], b = path[k + 1]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]; } d -= path.seg[k]; }
  return path[path.length - 1];
}
function nearPath(x, y, m) { for (let d = 0; d < path.len; d += 8) { const p = at(d); if (Math.hypot(p[0] - x, p[1] - y) < m) return true; } return false; }
function reset() { buildPath(); guards = []; bugs = []; shots = []; pops = []; seeds = 90; cookies = 5; wave = 0; waveOn = false; spawnQ = []; sel = 'frog'; score = 0; killed = 0; G.score(0); hud(); drawShop(); }
function hud() { G.hudSet('seeds', seeds); G.hudSet('jar', cookies); G.hudSet('wave', wave + '/' + WAVES); }
function drawShop() {
  shop.innerHTML = Object.keys(GUARDS).map((k) => { const g = GUARDS[k]; return '<button type="button" class="aa-b' + (sel === k ? ' on' : '') + (seeds < g.cost ? ' poor' : '') + '" data-k="' + k + '"><img src="' + KQ3D.emojiFile(g.e) + '" alt="">' + g.name + ' · 🌱' + g.cost + '</button>'; }).join('') +
    '<button type="button" class="aa-go" id="aaGo"' + (waveOn || wave >= WAVES ? ' disabled' : '') + '>' + (waveOn ? 'Wave ' + wave + '…' : '▶ Wave ' + (wave + 1)) + '</button>';
  shop.querySelectorAll('.aa-b').forEach((b) => b.onclick = () => { sel = b.dataset.k; KQ3D.sfx('tap'); drawShop(); });
  document.getElementById('aaGo').onclick = startWave;
}
function startWave() {
  if (G.state !== 'play' || waveOn || wave >= WAVES) return;
  wave++; waveOn = true; spawnQ = [];
  const n = 6 + wave * 2;
  for (let k = 0; k < n; k++) spawnQ.push(wave >= 3 && k % 5 === 4 ? 'fly' : wave >= 4 && k % 7 === 6 ? 'beetle' : 'ant');
  if (wave === WAVES) spawnQ.push('beetle', 'beetle');
  spawnT = 0.5; KQ3D.sfx('countdown'); G.pop('Wave ' + wave + '! 🐜', null, C.h * 0.3, '#fde047'); hud(); drawShop();
}
G.scene.addEventListener('pointerdown', (e) => {
  if (G.state !== 'play') return;
  const r = C.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, g = GUARDS[sel];
  if (y < 80 || y > C.h - 100) return;
  if (nearPath(x, y, 34)) { KQ3D.sfx('tick'); G.pop('Not on the path!', e.clientX, e.clientY - 30, '#fecaca'); return; }
  if (guards.some((q) => Math.hypot(q.x - x, q.y - y) < 46)) { KQ3D.sfx('tick'); return; }
  if (seeds < g.cost) { KQ3D.sfx('wrong'); G.pop('Need 🌱' + g.cost, e.clientX, e.clientY - 30, '#fecaca'); return; }
  seeds -= g.cost; guards.push({ k: sel, x, y, cd: 0, bob: Math.random() * 6 }); KQ3D.sfx('pop'); hud(); drawShop();
});
function hit(b, dmg) {
  b.hp -= dmg; b.flash = 0.1;
  if (b.hp <= 0 && !b.dead) { b.dead = true; killed++; seeds += BUGS[b.t].seeds; score += BUGS[b.t].seeds * 5; G.score(score); KQ3D.sfx('pop'); pops.push({ x: b.x, y: b.y, l: 0.4 }); hud(); drawShop(); }
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  const playing = G.state === 'play';
  // garden
  ctx.fillStyle = '#86efac'; ctx.fillRect(0, 0, C.w, C.h);
  ctx.fillStyle = '#4ade80'; for (let k = 0; k < 50; k++) { const gx = (k * 97) % C.w, gy = 90 + (k * 61) % (C.h - 200); ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + 4, gy - 9); ctx.lineTo(gx + 8, gy); ctx.fill(); }
  if (!path) return;
  ctx.strokeStyle = '#d6a76c'; ctx.lineWidth = 46; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); path.forEach((p, k) => k ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
  ctx.strokeStyle = '#e8c28f'; ctx.lineWidth = 34; ctx.stroke();
  const end = path[path.length - 1];
  ctx.fillStyle = '#fef3c7'; ctx.beginPath(); ctx.ellipse(end[0], end[1] + 10, 42, 14, 0, 0, 7); ctx.fill();
  KQ3D.drawPic(ctx, '🫙', end[0], end[1] - 14, 66); for (let k = 0; k < cookies; k++) KQ3D.drawPic(ctx, '🍪', end[0] - 32 + k * 16, end[1] - 50, 22);
  if (playing) {
    if (waveOn) {
      spawnT -= dt; if (spawnQ.length && spawnT <= 0) { const t = spawnQ.shift(); bugs.push({ t, d: 0, hp: BUGS[t].hp * (1 + wave * 0.12), x: path[0][0], y: path[0][1] }); spawnT = Math.max(0.35, 0.9 - wave * 0.06); }
      if (!spawnQ.length && !bugs.length) {
        waveOn = false; const bonus = 20 + wave * 5; seeds += bonus; score += 50; G.score(score); KQ3D.sfx('levelup'); G.pop('Wave cleared! +🌱' + bonus, null, C.h * 0.3, '#bbf7d0'); hud(); drawShop();
        if (wave >= WAVES) { score += cookies * 60; G.score(score); G.over({ score, result: 'win', title: 'Cookies saved! 🍪', lines: ['🐜 ' + killed + ' bugs stopped', '🍪 ' + cookies + ' cookies left'] }); }
      }
    }
    bugs.forEach((b) => {
      b.d += BUGS[b.t].sp * (1 + wave * 0.04) * dt; const p = at(b.d); b.x = p[0]; b.y = p[1];
      if (b.d >= path.len && !b.dead) { b.dead = true; cookies--; KQ3D.sfx('wrong'); G.flash('#fecaca'); hud(); if (cookies <= 0) G.over({ score, result: 'lose', title: 'The bugs got the cookies! 🐜', lines: ['🚩 Wave ' + wave, '🐜 ' + killed + ' bugs stopped'] }); }
    });
    guards.forEach((q) => {
      const g = GUARDS[q.k]; q.cd -= dt; if (q.cd > 0) return;
      const tgt = bugs.filter((b) => !b.dead && Math.hypot(b.x - q.x, b.y - q.y) < g.range).sort((a, b) => b.d - a.d)[0];
      if (!tgt) return; q.cd = g.rate;
      shots.push({ x: q.x, y: q.y, tx: tgt.x, ty: tgt.y, col: g.col, l: 0.15, k: q.k });
      if (g.splash) bugs.forEach((b) => { if (!b.dead && Math.hypot(b.x - tgt.x, b.y - tgt.y) < g.splash) hit(b, g.dmg); }); else hit(tgt, g.dmg);
    });
    bugs = bugs.filter((b) => !b.dead);
  }
  guards.forEach((q) => { const g = GUARDS[q.k]; q.bob += dt * 3; if (sel && G.state === 'play' && !waveOn) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(q.x, q.y, g.range, 0, 7); ctx.stroke(); } ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(q.x, q.y + 18, 18, 6, 0, 0, 7); ctx.fill(); KQ3D.drawPic(ctx, g.e, q.x, q.y + Math.sin(q.bob) * 2, 42); });
  bugs.forEach((b) => { const nx = at(b.d + 4); const ang = Math.atan2(nx[1] - b.y, nx[0] - b.x); ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(ang + Math.PI / 2); if (b.flash > 0) { b.flash -= dt; ctx.globalAlpha = 0.5; } KQ3D.drawPic(ctx, BUGS[b.t].e, 0, 0, b.t === 'beetle' ? 36 : 28); ctx.restore(); ctx.globalAlpha = 1; });
  shots = shots.filter((s) => (s.l -= dt) > 0); shots.forEach((s) => { ctx.strokeStyle = s.col; ctx.lineWidth = s.k === 'frog' ? 5 : 3; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.tx, s.ty); ctx.stroke(); if (s.k === 'hedgehog') { ctx.strokeStyle = 'rgba(161,98,7,.5)'; ctx.beginPath(); ctx.arc(s.tx, s.ty, GUARDS.hedgehog.splash * (1 - s.l / 0.15), 0, 7); ctx.stroke(); } });
  pops = pops.filter((p) => (p.l -= dt) > 0); pops.forEach((p) => KQ3D.drawPic(ctx, '💥', p.x, p.y, 34 * (1.4 - p.l)));
  if (playing && wave === 0 && !guards.length) { ctx.font = '800 18px "Baloo 2",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#14532d'; ctx.fillText('Tap the grass to place a guard, then press ▶ Wave', C.w / 2, 80 + (C.h - 200) * 0.5); }
}
reset();
requestAnimationFrame(frame);
</script>
</body></html>
