<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rock Paper Scissors</title>
<style>
.rp { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 14px 16px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(170deg, #fef3c7, #fdba74 60%, #f472b6); }
.rp-arena { width: 100%; max-width: 440px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,.55); border-radius: 30px; padding: 14px; }
.rp-side { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; color: #7c2d12; }
.rp-side .who { width: 50px; height: 50px; }
.rp-hand { width: 110px; height: 110px; display: grid; place-items: center; border-radius: 50%; background: #fff; box-shadow: 0 6px 0 rgba(0,0,0,.1); }
.rp-hand img { width: 76px; height: 76px; }
.rp-hand.shake img { animation: rpShake .35s ease-in-out infinite; }
.rp-side.cpu .rp-hand img { transform: scaleX(-1); }
@keyframes rpShake { 50% { transform: translateY(-14px) rotate(-10deg); } }
.rp-side.cpu .rp-hand.shake img { animation-name: rpShake2; } @keyframes rpShake2 { 0%, 100% { transform: scaleX(-1); } 50% { transform: scaleX(-1) translateY(-14px) rotate(-10deg); } }
.rp-hand.win { box-shadow: 0 0 0 6px #22c55e; } .rp-hand.lose { opacity: .55; }
.rp-vs { font-size: 26px; font-weight: 800; color: #db2777; }
.rp-call { min-height: 46px; font-size: 32px; font-weight: 800; color: #9d174d; margin: 10px 0; text-align: center; }
.rp-btns { display: flex; gap: 12px; }
.rp-b { width: 96px; height: 104px; border: none; border-radius: 26px; background: #fff; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 800 15px 'Baloo 2', sans-serif; color: #7c2d12; box-shadow: 0 6px 0 #fb923c; }
.rp-b img { width: 56px; height: 56px; } .rp-b:active { transform: translateY(4px); box-shadow: 0 2px 0 #fb923c; } .rp-b:disabled { opacity: .5; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Rock Paper Scissors — first to 5 wins. Turtle is random, Monkey has favourites,
   Fox learns what you like to pick! */
const H = [['rock', '✊'], ['paper', '✋'], ['scissors', '✌️']];
const BEATS = { rock: 'scissors', paper: 'rock', scissors: 'paper' };
const FOES = [{ icon: '🐢', name: 'Turtle', ai: 'rand', mult: 1 }, { icon: '🐵', name: 'Monkey', ai: 'fav', mult: 1.3 }, { icon: '🦊', name: 'Fox', ai: 'learn', mult: 1.8 }];
const WIN = 5;
const G = KQ3D.init({
  id: 'rock_paper', title: 'Rock Paper Scissors', bestKey: 'rpsBest', music: true,
  hero: ['✊', '✋', '✌️'], colors: ['#f97316', '#db2777'],
  how: [['✊', 'Rock beats scissors'], ['✋', 'Paper beats rock'], ['✌️', 'Scissors beat paper'], ['🏆', 'First to ' + WIN + ' wins! The Fox learns your favourite moves…']],
  scoreIcon: '🏆', stars: [100, 180, 260],
  hud: [{ id: 'cpu', icon: '🤖' }],
  pick: { label: 'Pick who to play', options: FOES },
  onReset: (f) => reset(f)
});
const box = document.createElement('div'); box.className = 'rp'; G.scene.appendChild(box);
let foe, me, cp, ties, busy, hist, fav;
function reset(f) {
  foe = f || FOES[0]; me = 0; cp = 0; ties = 0; busy = false; hist = []; fav = H[Math.floor(Math.random() * 3)][0];
  G.score(0); G.hudSet('cpu', 0); const hi = document.querySelector('#k3h_cpu img'); if (hi) hi.src = KQ3D.emojiFile(foe.icon);
  box.innerHTML = '<div class="rp-arena"><div class="rp-side"><img class="who" src="' + KQ3D.emojiFile('🧒') + '" alt="">You<div class="rp-hand" id="rpMe"><img src="' + KQ3D.emojiFile('✊') + '" alt=""></div></div><div class="rp-vs">VS</div>' +
    '<div class="rp-side cpu"><img class="who" src="' + KQ3D.emojiFile(foe.icon) + '" alt="">' + foe.name + '<div class="rp-hand" id="rpCp"><img src="' + KQ3D.emojiFile('✊') + '" alt=""></div></div></div>' +
    '<div class="rp-call" id="rpC">Pick one! 👇</div><div class="rp-btns">' + H.map((h) => '<button type="button" class="rp-b" data-h="' + h[0] + '"><img src="' + KQ3D.emojiFile(h[1]) + '" alt="">' + h[0] + '</button>').join('') + '</div>';
  box.querySelectorAll('.rp-b').forEach((b) => b.onclick = () => go(b.dataset.h));
}
function cpuPick() {
  const r = Math.random();
  if (foe.ai === 'fav' && r < 0.5) return fav;
  if (foe.ai === 'learn' && hist.length >= 3 && r < 0.75) {
    const c = { rock: 0, paper: 0, scissors: 0 }; hist.slice(-8).forEach((h, k) => { c[h] += 1 + k * 0.2; });
    const likely = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
    return Object.keys(BEATS).find((k) => BEATS[k] === likely);     // the move that beats your favourite
  }
  return H[Math.floor(Math.random() * 3)][0];
}
const pic = (n) => H.find((h) => h[0] === n)[1];
function go(mine) {
  if (G.state !== 'play' || busy) return; busy = true;
  box.querySelectorAll('.rp-b').forEach((b) => { b.disabled = true; });
  const meH = document.getElementById('rpMe'), cpH = document.getElementById('rpCp'), call = document.getElementById('rpC');
  [meH, cpH].forEach((h) => { h.className = 'rp-hand shake'; h.firstChild.src = KQ3D.emojiFile('✊'); });
  const words = ['Rock…', 'Paper…', 'Scissors…'];
  words.forEach((w, k) => setTimeout(() => { call.textContent = w; KQ3D.sfx('tick'); }, k * 380));
  G.later(() => {
        const theirs = cpuPick(); hist.push(mine);
    [meH, cpH].forEach((h) => h.classList.remove('shake'));
    meH.firstChild.src = KQ3D.emojiFile(pic(mine)); cpH.firstChild.src = KQ3D.emojiFile(pic(theirs));
    let res;
    if (mine === theirs) { ties++; res = 'Same! 🤝'; KQ3D.sfx('draw'); }
    else if (BEATS[mine] === theirs) { me++; res = 'You win! 🎉'; meH.classList.add('win'); cpH.classList.add('lose'); KQ3D.sfx('success'); G.score(me); }
    else { cp++; res = foe.name + ' wins! 😮'; cpH.classList.add('win'); meH.classList.add('lose'); KQ3D.sfx('wrong'); G.hudSet('cpu', cp); }
    call.textContent = 'SHOOT! · ' + res;
    G.later(() => {
            if (me >= WIN || cp >= WIN) {
        const won = me > cp, final = Math.round((me * 15 + (won ? 100 : 0)) * foe.mult);
        G.over({ score: final, result: won ? 'win' : 'lose', title: won ? 'You beat ' + foe.name + '! 🏆' : foe.name + ' won this time', lines: ['🧒 ' + me + ' – ' + cp + ' ' + foe.icon, '🤝 ' + ties + ' ties'] });
        return;
      }
      busy = false; call.textContent = 'Pick one! 👇'; box.querySelectorAll('.rp-b').forEach((b) => { b.disabled = false; });
    }, 1300);
  }, 1200);
}
document.addEventListener('keydown', (e) => { const k = { '1': 'rock', '2': 'paper', '3': 'scissors' }[e.key]; if (k) go(k); });
reset(G.choice);
</script>
</body></html>
