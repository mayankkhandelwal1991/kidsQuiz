<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Tic Tac Toe</title>
<style>
.tt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 14px 16px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(160deg, #e0e7ff, #fbcfe8 60%, #fef3c7); }
.tt-vs { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
.tt-p { display: flex; flex-direction: column; align-items: center; background: #fff; border-radius: 20px; padding: 6px 14px; box-shadow: 0 4px 0 rgba(0,0,0,.08); border: 3px solid transparent; font-weight: 800; color: #4c1d95; }
.tt-p.on { border-color: #f59e0b; animation: ttGlow 1s ease-in-out infinite; }
@keyframes ttGlow { 50% { transform: scale(1.06); } }
.tt-p img { width: 44px; height: 44px; } .tt-p b { font-size: 22px; }
.tt-msg { font-weight: 800; color: #6b21a8; min-height: 26px; margin-bottom: 8px; }
.tt-board { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; background: #a78bfa; border-radius: 26px; box-shadow: 0 8px 0 #7c3aed; }
.tt-c { border: none; background: #fff; border-radius: 18px; display: grid; place-items: center; cursor: pointer; padding: 0; }
.tt-c img { width: 72%; height: 72%; animation: ttIn .3s cubic-bezier(.34,1.56,.64,1); }
.tt-c.win { background: #fef08a; animation: ttGlow .6s ease-in-out infinite; }
@keyframes ttIn { from { transform: scale(0) rotate(-40deg); } }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261123d"></script>
<script src="../ads.js"></script>
<script>
/* Tic Tac Toe — get 3 in a row. Best of 5 against an animal (Owl never loses!). */
const MINE = ['🐱', '🐶', '🐸', '🦄'];
const FOES = [{ icon: '🐢', name: 'Turtle', smart: 0.2, mult: 1 }, { icon: '🐼', name: 'Panda', smart: 0.7, mult: 1.6 }, { icon: '🦉', name: 'Owl', smart: 1, mult: 2.5 }];
const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const G = KQ3D.init({
  id: 'tic_tac_toe', title: 'Tic Tac Toe', bestKey: 'tttBest', music: true,
  hero: ['🐱', '🦉', '🏆'], colors: ['#8b5cf6', '#ec4899'],
  how: [['👆', 'Tap a square to place your animal'], ['➡️', 'Get 3 in a row — across, down or slanting'], ['🛡️', 'Block your opponent’s rows too!'], ['🏆', 'First to 3 round wins (best of 5)']],
  scoreIcon: '🏆', stars: [100, 200, 300],
  pick: { label: 'Pick who to play', options: FOES },
  onReset: (f) => reset(f)
});
const box = document.createElement('div'); box.className = 'tt'; G.scene.appendChild(box);
let foe, me, b, turn, my, cp, draws, round, busy;
function reset(f) {
  foe = f || FOES[0]; let pick = 0; try { pick = +(localStorage.getItem('ttt_piece') || 0) % MINE.length; } catch (e) {}
  me = MINE[pick]; my = 0; cp = 0; draws = 0; round = 0; G.score(0); newRound();
}
function newRound() { b = Array(9).fill(null); busy = false; turn = round % 2 ? 'cpu' : 'me'; round++; draw(); if (turn === 'cpu') G.later(cpuMove, 650); }
function draw(win) {
  const S = Math.min(innerWidth - 40, innerHeight - 290, 380), cs = (S - 40) / 3;
  box.innerHTML = '<div class="tt-vs"><div class="tt-p' + (turn === 'me' && !busy ? ' on' : '') + '" id="ttMe"><img src="' + KQ3D.emojiFile(me) + '" alt=""><b>' + my + '</b>You</div><div style="font-weight:800;color:#7c3aed;font-size:20px">VS</div>' +
    '<div class="tt-p' + (turn === 'cpu' && !busy ? ' on' : '') + '"><img src="' + KQ3D.emojiFile(foe.icon) + '" alt=""><b>' + cp + '</b>' + foe.name + '</div></div>' +
    '<div class="tt-msg" id="ttM">' + (busy ? '' : turn === 'me' ? (b.some(Boolean) ? 'Your turn!' : 'Your turn! (tap your animal above to change it)') : foe.name + ' is thinking…') + '</div>' +
    '<div class="tt-board" style="grid-template-columns:repeat(3,' + cs + 'px);grid-auto-rows:' + cs + 'px">' + b.map((v, i) => '<button type="button" class="tt-c' + (win && win.includes(i) ? ' win' : '') + '" data-i="' + i + '">' + (v ? '<img src="' + KQ3D.emojiFile(v === 'me' ? me : foe.icon) + '" alt="">' : '') + '</button>').join('') + '</div>';
  box.querySelectorAll('.tt-c').forEach((el) => el.onclick = () => tap(+el.dataset.i));
  document.getElementById('ttMe').onclick = () => { if (b.some(Boolean)) return; me = MINE[(MINE.indexOf(me) + 1) % MINE.length]; try { localStorage.setItem('ttt_piece', MINE.indexOf(me)); } catch (e) {} KQ3D.sfx('pop'); draw(); };
}
const winner = (bb) => { for (const l of LINES) if (bb[l[0]] && bb[l[0]] === bb[l[1]] && bb[l[1]] === bb[l[2]]) return l; return null; };
function tap(i) { if (G.state !== 'play' || busy || turn !== 'me' || b[i]) return; place(i, 'me'); }
function place(i, who) {
  b[i] = who; KQ3D.sfx(who === 'me' ? 'pop' : 'tap');
  const w = winner(b);
  if (w || b.every(Boolean)) return end(w ? who : null, w);
  turn = who === 'me' ? 'cpu' : 'me'; draw(); if (turn === 'cpu') G.later(cpuMove, 550);
}
function minimax(bb, who) {
  const w = winner(bb); if (w) return { s: bb[w[0]] === 'cpu' ? 10 : -10 };
  if (bb.every(Boolean)) return { s: 0 };
  let best = { s: who === 'cpu' ? -99 : 99 };
  bb.forEach((v, i) => { if (v) return; bb[i] = who; const r = minimax(bb, who === 'cpu' ? 'me' : 'cpu'); bb[i] = null; const s = r.s - Math.sign(r.s) * 0.1; if (who === 'cpu' ? s > best.s : s < best.s) best = { s, i }; });
  return best;
}
function cpuMove() {
  if (G.state !== 'play' || busy || turn !== 'cpu') return;
  const free = b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
  const i = Math.random() < foe.smart ? minimax(b.slice(), 'cpu').i : free[Math.floor(Math.random() * free.length)];
  place(i == null ? free[0] : i, 'cpu');
}
function end(who, line) {
  busy = true;
  if (who === 'me') { my++; KQ3D.sfx('win'); G.pop('You win the round! 🎉', null, innerHeight * 0.3, '#bbf7d0'); }
  else if (who === 'cpu') { cp++; KQ3D.sfx('lose'); G.pop(foe.name + ' wins the round', null, innerHeight * 0.3, '#fecaca'); }
  else { draws++; KQ3D.sfx('draw'); G.pop('Draw!', null, innerHeight * 0.3, '#fff'); }
  G.score(my); draw(line);
  G.later(() => {
        if (my >= 3 || cp >= 3 || round >= 5) {
      const won = my > cp, final = Math.round((my * 30 + draws * 10 + (won ? 100 : 0)) * foe.mult);
      G.over({ score: final, result: won ? 'win' : my === cp ? 'over' : 'lose', title: won ? 'You beat ' + foe.name + '! 🏆' : my === cp ? 'It’s a tie!' : foe.name + ' won this time', lines: [me + ' ' + my + ' – ' + cp + ' ' + foe.icon, '🤝 ' + draws + ' draws'] });
    } else newRound();
  }, 1600);
}
reset(G.choice);
</script>
</body></html>
