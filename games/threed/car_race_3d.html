<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Car Race 3D</title>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kq3d.js?v=20261120k"></script>
<script src="../ads.js"></script>
<script>
/* Car Race 3D — 3 lanes, dodge traffic & cones, grab coins and shields. */
const CARS = [
  { icon: '🏎️', name: 'Racer', color: '#ef4444', hex: 0xef4444 },
  { icon: '🚙', name: 'Jeep', color: '#3b82f6', hex: 0x3b82f6 },
  { icon: '🚕', name: 'Taxi', color: '#facc15', hex: 0xfacc15 },
  { icon: '🚗', name: 'Zoomy', color: '#22c55e', hex: 0x22c55e }
];
const G = KQ3D.init({
  id: 'car_race_3d', title: 'Car Race 3D', bestKey: 'race3dBest',
  hero: ['🏎️', '🪙', '🚧'], colors: ['#38bdf8', '#7c3aed'],
  how: [['👆', 'Swipe, tap a side, or use ⬅️ ➡️ to change lanes'], ['🪙', 'Grab coins for +10 points'], ['🛡️', 'A shield saves you from one crash'], ['🚧', 'Dodge cars, trucks and cones!']],
  hud: [{ id: 'coins', icon: '🪙' }], scoreIcon: '🏁', stars: [100, 300, 600],
  hint: 'Swipe ⬅️ ➡️ to change lanes',
  pick: { label: 'Pick your car', options: CARS },
  buttons: [{ icon: '⬅️', label: 'Left', down: () => steer(-1) }, { icon: '➡️', label: 'Right', down: () => steer(1) }],
  onPick: (c) => paintPlayer(c.hex),
  onReset: (c) => reset(c)
});

const R = KQ3D.renderer(G.scene, { fov: 62, far: 220, shadows: true });
const { scene, camera, renderer } = R || {};
const LANES = [-2.6, 0, 2.6];
const L = (c) => new THREE.MeshLambertMaterial({ color: c });

/* ---------------- world ---------------- */
scene.background = new THREE.Color(0x8fd8ff);
scene.fog = new THREE.Fog(0x8fd8ff, 60, 150);
scene.add(new THREE.HemisphereLight(0xffffff, 0x77aa55, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(8, 18, 6); sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, near: 1, far: 50 });
scene.add(sun, sun.target);

const grass = new THREE.Mesh(new THREE.PlaneGeometry(200, 400), L(0x7ccf5a));
grass.rotation.x = -Math.PI / 2; grass.position.set(0, -0.02, -140); grass.receiveShadow = true; scene.add(grass);
const road = new THREE.Mesh(new THREE.PlaneGeometry(8.6, 400), L(0x4b5563));
road.rotation.x = -Math.PI / 2; road.position.set(0, 0, -140); road.receiveShadow = true; scene.add(road);

// things that scroll toward the camera and wrap around
const scrollers = [];
function addScroller(mesh, span) { mesh.userData.span = span; scrollers.push(mesh); scene.add(mesh); }
for (let i = 0; i < 30; i++) {
  [-1.3, 1.3].forEach((x) => { const d = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.02, 1.6), L(0xffffff)); d.position.set(x, 0.01, 10 - i * 5); addScroller(d, 150); });
}
for (let i = 0; i < 38; i++) {
  [-4.5, 4.5].forEach((x) => { const k = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.25, 2), L(i % 2 ? 0xffffff : 0xef4444)); k.position.set(x, 0.12, 10 - i * 4); addScroller(k, 152); });
}
function tree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.4, 6), L(0x92400e)); trunk.position.y = 0.7; g.add(trunk);
  const c = [0x22c55e, 0x16a34a, 0x4ade80][Math.floor(Math.random() * 3)];
  const top = new THREE.Mesh(Math.random() < 0.5 ? new THREE.ConeGeometry(1.2, 2.6, 7) : new THREE.IcosahedronGeometry(1.25, 0), L(c));
  top.position.y = 2.4; top.castShadow = true; g.add(top);
  g.position.set(x, 0, z); g.scale.setScalar(0.8 + Math.random() * 0.6); return g;
}
function house(x, z) {
  const g = new THREE.Group();
  const col = [0xfde68a, 0xfbcfe8, 0xbfdbfe, 0xfed7aa, 0xddd6fe][Math.floor(Math.random() * 5)];
  const b = new THREE.Mesh(new THREE.BoxGeometry(3, 2.4, 3), L(col)); b.position.y = 1.2; b.castShadow = true; g.add(b);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(2.5, 1.6, 4), L([0xdc2626, 0x7c3aed, 0x2563eb][Math.floor(Math.random() * 3)])); roof.position.y = 3.2; roof.rotation.y = Math.PI / 4; g.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(0.7, 1.1, 0.05), L(0x7c2d12)); door.position.set(0, 0.55, 1.52); g.add(door);
  [-0.85, 0.85].forEach((wx) => { const w = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.05), L(0x7dd3fc)); w.position.set(wx, 1.5, 1.52); g.add(w); });
  g.position.set(x, 0, z); g.rotation.y = x < 0 ? Math.PI / 2 : -Math.PI / 2; return g;
}
for (let i = 0; i < 26; i++) {
  const z = 10 - i * 6;
  [-1, 1].forEach((s) => addScroller(Math.random() < 0.3 ? house(s * (10 + Math.random() * 4), z) : tree(s * (6.5 + Math.random() * 8), z + Math.random() * 3), 156));
}
const clouds = [];
for (let i = 0; i < 7; i++) {
  const c = new THREE.Group();
  for (let k = 0; k < 4; k++) { const p = new THREE.Mesh(new THREE.SphereGeometry(1.4 + Math.random(), 8, 6), new THREE.MeshLambertMaterial({ color: 0xffffff, emissive: 0x888888 })); p.position.set(k * 1.5, Math.random() * 0.6, Math.random()); c.add(p); }
  c.position.set(-40 + Math.random() * 80, 16 + Math.random() * 8, -60 - Math.random() * 60); scene.add(c); clouds.push(c);
}

/* ---------------- cars ---------------- */
function wheel() { const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.3, 14), L(0x1f2937)); w.rotation.z = Math.PI / 2; const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.32, 10), L(0xe5e7eb)); hub.rotation.z = Math.PI / 2; const g = new THREE.Group(); g.add(w, hub); return g; }
function makeCar(color, opts = {}) {
  const g = new THREE.Group(); const body = new THREE.Group(); g.add(body);
  const len = opts.truck ? 3.6 : 2.4;
  const base = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.55, len), L(color)); base.position.y = 0.6; base.castShadow = true; body.add(base);
  if (opts.truck) {
    const box = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.5, 2.3), L(0xf8fafc)); box.position.set(0, 1.55, 0.55); box.castShadow = true; body.add(box);
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.9, 1.0), L(color)); cab.position.set(0, 1.3, -1.25); body.add(cab);
    const ws = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.45, 0.05), L(0x93c5fd)); ws.position.set(0, 1.45, -1.76); body.add(ws);
  } else if (opts.eyes) { // player: open-top racer with a kid driver
    const ws = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.35, 0.06), new THREE.MeshLambertMaterial({ color: 0xbfdbfe, transparent: true, opacity: 0.7 })); ws.position.set(0, 1.05, -0.45); ws.rotation.x = -0.4; body.add(ws);
    const seat = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.25), L(0x1f2937)); seat.position.set(0, 1.05, 0.55); body.add(seat);
    const skin = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), L(0xf5c39b)); skin.position.set(0, 1.45, 0.25); body.add(skin);
    const helm = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), L(0xffffff)); helm.position.set(0, 1.5, 0.27); body.add(helm);
    const stripe = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.05, 6, 20, Math.PI), L(color)); stripe.position.set(0, 1.5, 0.27); stripe.rotation.y = Math.PI / 2; body.add(stripe);
    const spoiler = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.08, 0.35), L(0x111827)); spoiler.position.set(0, 1.05, 1.1); body.add(spoiler);
    [-0.6, 0.6].forEach((x) => { const p = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.1), L(0x111827)); p.position.set(x, 0.9, 1.1); body.add(p); });
    const num = KQ3D.emojiSprite('⭐', 0.5); num.position.set(0, 0.62, 1.22); body.add(num);
  } else {
    const cab = new THREE.Mesh(new THREE.BoxGeometry(1.25, 0.55, 1.25), L(color)); cab.position.set(0, 1.12, 0.1); cab.castShadow = true; body.add(cab);
    const glassF = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.42, 0.05), L(0x93c5fd)); glassF.position.set(0, 1.12, -0.53); body.add(glassF);
    const glassB = glassF.clone(); glassB.position.z = 0.73; body.add(glassB);
  }
  const front = opts.truck ? -1.8 : -1.2;
  [-0.45, 0.45].forEach((x) => {
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), new THREE.MeshBasicMaterial({ color: 0xfef9c3 })); lamp.position.set(x, 0.65, front - 0.01); body.add(lamp);
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.14, 0.05), new THREE.MeshBasicMaterial({ color: 0xdc2626 })); tail.position.set(x, 0.7, -front + 0.01); body.add(tail);
  });
  if (opts.police) { const s = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.18, 0.25), new THREE.MeshBasicMaterial({ color: 0x3b82f6 })); s.position.set(0, 1.48, 0.1); body.add(s); g.userData.siren = s; }
  g.userData.wheels = [];
  const wz = opts.truck ? [-1.2, 1.2] : [-0.8, 0.8];
  [-0.72, 0.72].forEach((x) => wz.forEach((z) => { const w = wheel(); w.position.set(x, 0.34, z); g.add(w); g.userData.wheels.push(w); }));
  g.userData.body = body; g.userData.len = len;
  return g;
}
let player = makeCar(CARS[0].hex, { eyes: true });
scene.add(player);
function paintPlayer(hex) {
  const x = player.position.x; scene.remove(player);
  player = makeCar(hex, { eyes: true }); player.position.set(x, 0, 3); scene.add(player);
}
paintPlayer((G.choice || CARS[0]).hex);
const shieldBall = new THREE.Mesh(new THREE.SphereGeometry(1.9, 20, 14), new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.28 }));
shieldBall.visible = false; scene.add(shieldBall);

/* ---------------- items ---------------- */
const coinGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.14, 20);
const coinMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, metalness: 0.6, roughness: 0.3, emissive: 0x7a5a00 });
function makeCoin() { const c = new THREE.Mesh(coinGeo, coinMat); c.rotation.x = Math.PI / 2; const g = new THREE.Group(); g.add(c); const star = KQ3D.emojiSprite('⭐', 0.55); star.position.z = 0.09; g.add(star); return g; }
function makeCone() {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.1, 12), L(0xf97316)); c.position.y = 0.6; c.castShadow = true; g.add(c);
  const s = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.34, 0.2, 12), L(0xffffff)); s.position.y = 0.6; g.add(s);
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.9), L(0xf97316)); b.position.y = 0.04; g.add(b);
  return g;
}
function makeShield() { const g = new THREE.Group(); const s = KQ3D.emojiSprite('🛡️', 1.3); s.position.y = 1.1; g.add(s); const ring = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.08, 8, 24), new THREE.MeshBasicMaterial({ color: 0x38bdf8 })); ring.position.y = 1.1; g.add(ring); return g; }

let items = [], debris = [];
let dist, coins, speed, lane, nextRow, shield, shake, crashed, tilt, lastMilestone;

function reset(choice) {
  items.forEach((it) => scene.remove(it.mesh)); items = [];
  debris.forEach((d) => scene.remove(d)); debris = [];
  paintPlayer((choice || CARS[0]).hex);
  dist = 0; coins = 0; speed = 16; lane = 1; nextRow = 40; shield = false; shake = 0; crashed = false; tilt = 0; lastMilestone = 0;
  player.position.set(LANES[1], 0, 3); player.rotation.set(0, 0, 0); player.position.y = 0;
  shieldBall.visible = false;
  for (let z = -30; z > -130; z -= 16) spawnRow(z, true);
}

function spawnRow(z, easy) {
  const free = Math.floor(Math.random() * 3);
  const blockers = easy ? 1 : (Math.random() < Math.min(0.65, 0.25 + dist / 2500) ? 2 : 1);
  const lanes = [0, 1, 2].filter((l) => l !== free).sort(() => Math.random() - 0.5).slice(0, blockers);
  lanes.forEach((l) => {
    const r = Math.random();
    let mesh, type = 'car';
    if (r < 0.22) { mesh = makeCone(); type = 'cone'; }
    else if (r < 0.38) { mesh = makeCar([0xf97316, 0x0ea5e9, 0x8b5cf6][Math.floor(Math.random() * 3)], { truck: true }); type = 'truck'; }
    else mesh = makeCar([0x3b82f6, 0xf59e0b, 0x10b981, 0xec4899, 0xf8fafc, 0x6366f1][Math.floor(Math.random() * 6)], { police: Math.random() < 0.12 });
    mesh.position.set(LANES[l], 0, z);
    scene.add(mesh); items.push({ mesh, type, lane: l, own: type === 'cone' ? 0 : 4 + Math.random() * 3, len: type === 'truck' ? 3.6 : type === 'cone' ? 0.9 : 2.4 });
  });
  // coins trail in the free lane, sometimes a shield
  if (Math.random() < 0.06 && !shield) { const s = makeShield(); s.position.set(LANES[free], 0, z); scene.add(s); items.push({ mesh: s, type: 'shield', lane: free, own: 0, len: 1 }); }
  else if (Math.random() < 0.75) for (let k = 0; k < 4; k++) { const c = makeCoin(); c.position.set(LANES[free], 0.9, z + k * 2.2); scene.add(c); items.push({ mesh: c, type: 'coin', lane: free, own: 0, len: 1 }); }
}

function steer(d) {
  if (G.state !== 'play') return;
  const nl = Math.max(0, Math.min(2, lane + d));
  if (nl !== lane) { lane = nl; tilt = d; KQ3D.sfx('whoosh'); }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') steer(-1);
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') steer(1);
});
KQ3D.swipe(G.scene, (dir, e) => {
  if (dir === 'left') steer(-1); else if (dir === 'right') steer(1);
  else if (dir === 'tap') steer(e.clientX < innerWidth / 2 ? -1 : 1);
});

function burst(pos, colors, n) {
  for (let i = 0; i < n; i++) {
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), L(colors[i % colors.length]));
    d.position.copy(pos); d.position.y += 0.8;
    d.userData.v = new THREE.Vector3((Math.random() - 0.5) * 10, 4 + Math.random() * 6, (Math.random() - 0.5) * 10);
    d.userData.life = 1.2; scene.add(d); debris.push(d);
  }
}

function crash(it) {
  if (shield) {
    shield = false; shieldBall.visible = false; G.flash('#7dd3fc'); KQ3D.sfx('hit');
    burst(it.mesh.position, [0xffffff, 0x38bdf8], 10); scene.remove(it.mesh); it.dead = true;
    const p = KQ3D.toScreen(player.position, camera, G.scene); G.pop('Shield saved you!', p.x, p.y - 60, '#7dd3fc');
    return;
  }
  crashed = true; shake = 0.6; G.flash('#ef4444'); KQ3D.sfx('blast');
  burst(player.position, [0xfacc15, 0xef4444, 0x111827, 0xffffff], 18);
  G.over({ score: Math.floor(dist) + coins * 10, title: 'Crash!', lines: ['🏁 ' + Math.floor(dist) + ' m', '🪙 ' + coins + ' coins'] });
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const playing = G.state === 'play';
  const v = playing ? speed : (G.state === 'menu' ? 8 : 0);

  if (playing) {
    speed = Math.min(42, 16 + dist / 45);
    dist += v * dt;
    G.score(Math.floor(dist) + coins * 10);
    const m = Math.floor(dist / 250);
    if (m > lastMilestone) { lastMilestone = m; KQ3D.sfx('levelup'); G.pop('Speed up! 🚀', null, innerHeight * 0.3, '#a5f3fc'); }
    nextRow -= v * dt;
    if (nextRow <= 0) { spawnRow(-130); nextRow = Math.max(11, 20 - dist / 120); }
  }
  // scroll scenery
  scrollers.forEach((s) => { s.position.z += v * dt; if (s.position.z > 14) s.position.z -= s.userData.span; });
  clouds.forEach((c) => { c.position.x += dt * 0.6; if (c.position.x > 50) c.position.x = -50; });

  // items
  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    if (it.dead) { items.splice(i, 1); continue; }
    it.mesh.position.z += (v - (playing ? it.own : 0)) * dt;
    if (it.type === 'coin') it.mesh.rotation.y += dt * 4;
    if (it.type === 'shield') it.mesh.rotation.y += dt * 2;
    if (it.mesh.userData.siren) it.mesh.userData.siren.material.color.setHex(Math.floor(now / 200) % 2 ? 0x3b82f6 : 0xef4444);
    (it.mesh.userData.wheels || []).forEach((w) => { w.rotation.x -= dt * 8; });
    if (it.mesh.position.z > 14) { scene.remove(it.mesh); items.splice(i, 1); continue; }
    if (!playing || crashed) continue;
    const dz = Math.abs(it.mesh.position.z - player.position.z), dx = Math.abs(it.mesh.position.x - player.position.x);
    if (it.type === 'coin') {
      if (dx < 1.2 && dz < 1.3) {
        coins++; G.hudSet('coins', coins); KQ3D.sfx('coin');
        const p = KQ3D.toScreen(it.mesh.position, camera, G.scene); G.pop('+10', p.x, p.y);
        scene.remove(it.mesh); items.splice(i, 1);
      }
    } else if (it.type === 'shield') {
      if (dx < 1.3 && dz < 1.5) { shield = true; shieldBall.visible = true; KQ3D.sfx('chime'); G.pop('🛡️ Shield!', null, innerHeight * 0.35, '#7dd3fc'); scene.remove(it.mesh); items.splice(i, 1); }
    } else if (dx < 1.25 && dz < (it.len + 2.4) / 2 - 0.15) {
      crash(it);
    }
  }
  // player
  if (!crashed) {
    player.position.x += (LANES[lane] - player.position.x) * Math.min(1, dt * 12);
    tilt *= Math.pow(0.02, dt);
    player.rotation.y = -tilt * 0.35; player.userData.body.rotation.z = tilt * 0.08;
    player.userData.body.position.y = Math.sin(now / 90) * 0.03 * (v > 0 ? 1 : 0);
    player.userData.wheels.forEach((w) => { w.rotation.x -= v * dt * 2.5; });
  } else {
    player.rotation.y += dt * 6; player.position.y = Math.max(0, player.position.y + dt * 2);
  }
  shieldBall.position.set(player.position.x, 0.9, player.position.z);
  shieldBall.scale.setScalar(1 + Math.sin(now / 150) * 0.05);
  // debris
  for (let i = debris.length - 1; i >= 0; i--) {
    const d = debris[i]; d.userData.life -= dt;
    d.userData.v.y -= 20 * dt; d.position.addScaledVector(d.userData.v, dt); d.rotation.x += dt * 8; d.rotation.y += dt * 6;
    if (d.position.y < 0.15) { d.position.y = 0.15; d.userData.v.multiplyScalar(0.5); d.userData.v.y *= -0.4; }
    if (d.userData.life <= 0) { scene.remove(d); debris.splice(i, 1); }
  }
  // camera
  shake = Math.max(0, shake - dt);
  const sx = (Math.random() - 0.5) * shake, sy = (Math.random() - 0.5) * shake;
  const back = innerWidth > innerHeight ? 7.5 : 9;
  camera.position.set(player.position.x * 0.55 + sx, 4.6 + sy, player.position.z + back);
  camera.lookAt(player.position.x * 0.4, 0.8, player.position.z - 9);
  camera.fov = 62 + (speed - 16) * 0.25 * (playing ? 1 : 0); camera.updateProjectionMatrix();
  sun.position.set(player.position.x + 8, 18, player.position.z + 6); sun.target.position.set(player.position.x, 0, player.position.z);
  renderer.render(scene, camera);
}
if (R) { reset(G.choice); requestAnimationFrame(frame); }
</script>
</body></html>
