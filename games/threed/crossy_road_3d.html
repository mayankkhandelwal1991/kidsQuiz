<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lane Hopper 3D</title>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kq3d.js?v=20261120j"></script>
<script src="../ads.js"></script>
<script>
/* Lane Hopper 3D — hop a farm animal across roads, rivers (ride the logs)
   and train tracks. Trees block the grass; corn is a bonus. */
const PETS = [
  { icon: '🐥', name: 'Chick', kind: 'chick' },
  { icon: '🐸', name: 'Frog', kind: 'frog' },
  { icon: '🐰', name: 'Bunny', kind: 'bunny' },
  { icon: '🐷', name: 'Piggy', kind: 'pig' }
];
const G = KQ3D.init({
  id: 'crossy_road_3d', title: 'Lane Hopper 3D', bestKey: 'hopperBest3d', music: true,
  hero: ['🐥', '🌽', '🚗'], colors: ['#84cc16', '#0ea5e9'],
  how: [['👆', 'Tap or swipe ⬆️ to hop forward'], ['🚗', 'Watch out for cars and trains 🚂'], ['🪵', 'Ride the logs across rivers — don’t fall in!'], ['🌽', 'Grab corn for +3 — and don’t wait too long!']],
  hud: [{ id: 'corn', icon: '🌽' }], scoreIcon: '🐾', stars: [20, 50, 100],
  hint: 'Tap to hop forward • swipe to turn',
  pick: { label: 'Pick your animal', options: PETS },
  buttons: [{ icon: '⬅️', label: 'Left', down: () => hop(-1, 0) }, { icon: '⬆️', label: 'Forward', down: () => hop(0, 1) }, { icon: '⬇️', label: 'Back', down: () => hop(0, -1) }, { icon: '➡️', label: 'Right', down: () => hop(1, 0) }],
  onPick: (p) => buildPet(p),
  onReset: (p) => reset(p)
});

const R = KQ3D.renderer(G.scene, { fov: 50, far: 120, shadows: true });
const { scene, camera, renderer } = R || {};
const L = (c) => new THREE.MeshLambertMaterial({ color: c });
const B = (w, h, d, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), L(c)); m.castShadow = true; m.receiveShadow = true; return m; };
const COLS = 4;           // playable columns: -4..4
const WIDTH = 22;         // drawn row width

scene.background = new THREE.Color(0x7dd3fc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x88aa66, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.7);
sun.position.set(-6, 14, 6); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
scene.add(sun, sun.target);

/* ---------------- pet ---------------- */
let pet, petBody;
function buildPet(p) {
  p = p || PETS[0];
  const old = pet; const g = new THREE.Group(); const b = new THREE.Group(); g.add(b);
  const eye = (x, y, z, s) => { const w = B(0.14 * s, 0.14 * s, 0.06, 0xffffff); w.position.set(x, y, z); b.add(w); const k = B(0.07 * s, 0.07 * s, 0.03, 0x111827); k.position.set(x, y, z - 0.04); b.add(k); };
  if (p.kind === 'chick') {
    const body = B(0.7, 0.7, 0.7, 0xfde047); body.position.y = 0.45; b.add(body);
    const comb = B(0.12, 0.2, 0.3, 0xef4444); comb.position.set(0, 0.9, -0.05); b.add(comb);
    const beak = B(0.2, 0.12, 0.2, 0xf97316); beak.position.set(0, 0.55, -0.44); b.add(beak);
    [-0.38, 0.38].forEach((x) => { const w = B(0.08, 0.3, 0.4, 0xfacc15); w.position.set(x, 0.45, 0.05); b.add(w); });
    [-0.15, 0.15].forEach((x) => { const lg = B(0.08, 0.15, 0.08, 0xf97316); lg.position.set(x, 0.05, 0); b.add(lg); });
    eye(-0.2, 0.68, -0.36, 1); eye(0.2, 0.68, -0.36, 1);
  } else if (p.kind === 'frog') {
    const body = B(0.8, 0.45, 0.75, 0x22c55e); body.position.y = 0.3; b.add(body);
    const belly = B(0.6, 0.12, 0.2, 0xbbf7d0); belly.position.set(0, 0.2, -0.36); b.add(belly);
    [-0.22, 0.22].forEach((x) => { const e = B(0.24, 0.22, 0.24, 0x22c55e); e.position.set(x, 0.62, -0.2); b.add(e); eye(x, 0.64, -0.33, 1.2); });
    [-0.42, 0.42].forEach((x) => { const lg = B(0.18, 0.15, 0.4, 0x16a34a); lg.position.set(x, 0.1, 0.15); b.add(lg); });
    const mouth = B(0.5, 0.04, 0.04, 0xbe123c); mouth.position.set(0, 0.36, -0.39); b.add(mouth);
  } else if (p.kind === 'bunny') {
    const body = B(0.65, 0.65, 0.7, 0xf8fafc); body.position.y = 0.4; b.add(body);
    [-0.16, 0.16].forEach((x) => { const ear = B(0.13, 0.5, 0.1, 0xf8fafc); ear.position.set(x, 0.95, 0); b.add(ear); const inner = B(0.07, 0.38, 0.02, 0xf9a8d4); inner.position.set(x, 0.95, -0.06); b.add(inner); });
    const nose = B(0.1, 0.08, 0.06, 0xec4899); nose.position.set(0, 0.45, -0.37); b.add(nose);
    const tail = B(0.2, 0.2, 0.15, 0xffffff); tail.position.set(0, 0.35, 0.42); b.add(tail);
    eye(-0.17, 0.6, -0.36, 1); eye(0.17, 0.6, -0.36, 1);
  } else {
    const body = B(0.8, 0.6, 0.85, 0xf9a8d4); body.position.y = 0.38; b.add(body);
    const snout = B(0.32, 0.22, 0.12, 0xf472b6); snout.position.set(0, 0.38, -0.48); b.add(snout);
    [-0.07, 0.07].forEach((x) => { const n = B(0.05, 0.07, 0.02, 0x9d174d); n.position.set(x, 0.38, -0.55); b.add(n); });
    [-0.25, 0.25].forEach((x) => { const ear = B(0.18, 0.16, 0.08, 0xf472b6); ear.position.set(x, 0.75, -0.3); ear.rotation.x = -0.4; b.add(ear); });
    const tail = B(0.08, 0.08, 0.15, 0xf472b6); tail.position.set(0, 0.5, 0.48); b.add(tail);
    eye(-0.2, 0.56, -0.43, 1); eye(0.2, 0.56, -0.43, 1);
  }
  if (old) { g.position.copy(old.position); g.rotation.copy(old.rotation); scene.remove(old); }
  pet = g; petBody = b; scene.add(g);
}
buildPet(G.choice);

/* ---------------- rows ---------------- */
let rows = {};      // z-index -> row
let movers = [];    // cars / logs / trains
function rowZ(r) { return -r; }
function makeCar(dir) {
  const g = new THREE.Group(); const truck = Math.random() < 0.25;
  const col = [0xef4444, 0x3b82f6, 0xf59e0b, 0x8b5cf6, 0x10b981, 0xec4899][Math.floor(Math.random() * 6)];
  const len = truck ? 2.6 : 1.5;
  const base = B(len, 0.45, 0.8, col); base.position.y = 0.38; g.add(base);
  if (truck) { const box = B(1.6, 0.8, 0.82, 0xf1f5f9); box.position.set(-0.45, 1.0, 0); g.add(box); const cab = B(0.7, 0.5, 0.78, col); cab.position.set(0.85, 0.85, 0); g.add(cab); }
  else { const cab = B(0.8, 0.38, 0.7, 0xe0f2fe); cab.position.set(-0.05, 0.78, 0); g.add(cab); const roof = B(0.8, 0.08, 0.72, col); roof.position.set(-0.05, 1.0, 0); g.add(roof); }
  [-len / 2 + 0.35, len / 2 - 0.35].forEach((x) => [-0.42, 0.42].forEach((z) => { const w = B(0.3, 0.3, 0.1, 0x1f2937); w.position.set(x, 0.18, z); g.add(w); }));
  const lamp = B(0.05, 0.12, 0.6, 0xfef08a); lamp.position.set(len / 2, 0.42, 0); g.add(lamp);
  g.rotation.y = dir > 0 ? 0 : Math.PI;
  return { mesh: g, len };
}
function makeLog() {
  const len = 2 + Math.floor(Math.random() * 3);
  const g = new THREE.Group();
  const lg = B(len, 0.32, 0.8, 0x92400e); lg.position.y = 0.05; g.add(lg);
  const top = B(len - 0.1, 0.04, 0.6, 0xb45309); top.position.y = 0.23; g.add(top);
  [-len / 2, len / 2].forEach((x) => { const e = B(0.04, 0.3, 0.72, 0xfcd34d); e.position.set(x, 0.05, 0); g.add(e); });
  return { mesh: g, len };
}
function makeTrain() {
  const g = new THREE.Group(); const cars = 4, len = cars * 3.2;
  for (let i = 0; i < cars; i++) {
    const c = B(3, 1.2, 0.9, i === 0 ? 0xdc2626 : 0x2563eb); c.position.set(-i * 3.2, 0.8, 0); g.add(c);
    const w = B(2.4, 0.3, 0.92, 0xbae6fd); w.position.set(-i * 3.2, 1.05, 0); g.add(w);
  }
  const front = B(0.4, 0.6, 0.7, 0xfde047); front.position.set(1.6, 0.6, 0); g.add(front);
  return { mesh: g, len, off: -len / 2 + 1.5 };
}
function tree() {
  const g = new THREE.Group(); const h = 0.7 + Math.floor(Math.random() * 2) * 0.35;
  const t = B(0.3, 0.35, 0.3, 0x92400e); t.position.y = 0.17; g.add(t);
  const l = B(0.8, h, 0.8, [0x16a34a, 0x22c55e, 0x15803d][Math.floor(Math.random() * 3)]); l.position.y = 0.35 + h / 2; g.add(l);
  return g;
}
function rock() { const r = B(0.7, 0.45, 0.7, 0x9ca3af); r.position.y = 0.22; return r; }

let band = { type: 'grass', left: 0 };
function nextType(r) {
  if (r <= 3) return 'grass';
  if (band.left <= 0) {
    const hard = Math.min(1, r / 100);
    if (band.type !== 'grass') band = { type: 'grass', left: 1 + (Math.random() < 0.5 - hard * 0.3 ? 1 : 0) };
    else {
      const x = Math.random();
      if (x < 0.5) band = { type: 'road', left: 1 + Math.floor(Math.random() * (2 + hard * 2)) };
      else if (x < 0.8) band = { type: 'river', left: 1 + Math.floor(Math.random() * (2 + hard)) };
      else band = { type: 'rail', left: 1 + (Math.random() < hard * 0.5 ? 1 : 0) };
    }
  }
  band.left--;
  return band.type;
}
function genRow(r) {
  const type = nextType(r);
  const row = { r, type, objs: [], blocked: {}, dir: Math.random() < 0.5 ? 1 : -1 };
  const z = rowZ(r);
  const tileColor = type === 'grass' ? (r % 2 ? 0x6fd36a : 0x63c75e) : type === 'road' ? 0x4b5563 : type === 'river' ? 0x38bdf8 : 0x8b7355;
  const ground = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, 0.3, 1), L(tileColor));
  ground.position.set(0, type === 'river' ? -0.28 : -0.15, z); ground.receiveShadow = true; scene.add(ground); row.objs.push(ground);
  if (type === 'grass') {
    // side scenery outside the playable area + a few blockers inside
    for (let c = -10; c <= 10; c++) {
      const inside = Math.abs(c) <= COLS;
      if (!inside && Math.random() < 0.5) { const t = tree(); t.position.set(c, 0, z); scene.add(t); row.objs.push(t); }
      if (inside && r > 1 && c !== 0 && Math.random() < 0.18) { const o = Math.random() < 0.7 ? tree() : rock(); o.position.set(c, o.position.y, z); scene.add(o); row.objs.push(o); row.blocked[c] = true; }
    }
    if (r > 2 && Math.random() < 0.35) {
      let c; do { c = Math.floor(Math.random() * 9) - 4; } while (row.blocked[c]);
      const s = KQ3D.emojiSprite('🌽', 0.7); s.position.set(c, 0.5, z); scene.add(s); row.objs.push(s); row.corn = { c, s };
    }
    if (Math.random() < 0.25) { const f = KQ3D.emojiSprite(['🌸', '🌻', '🍄'][Math.floor(Math.random() * 3)], 0.5); f.position.set((Math.random() < 0.5 ? -1 : 1) * (5 + Math.random() * 3), 0.3, z); scene.add(f); row.objs.push(f); }
  } else if (type === 'road') {
    const line = new THREE.Mesh(new THREE.BoxGeometry(WIDTH, 0.02, 0.06), L(0xffffff)); line.position.set(0, 0.01, z + 0.5); scene.add(line); row.objs.push(line);
    row.speed = (1.5 + Math.random() * 1.8 + Math.min(2.5, r / 40)) * row.dir;
    const n = 2 + Math.floor(Math.random() * 2), gap = 22 / n;
    for (let i = 0; i < n; i++) { const c = makeCar(row.dir); c.mesh.position.set(-11 + i * gap + Math.random() * 2, 0, z); scene.add(c.mesh); movers.push({ row, kind: 'car', ...c }); }
  } else if (type === 'river') {
    row.speed = (1 + Math.random() * 1.2 + Math.min(1.5, r / 60)) * row.dir;
    let x = -11;
    while (x < 11) { const lg = makeLog(); lg.mesh.position.set(x + lg.len / 2, 0, z); scene.add(lg.mesh); movers.push({ row, kind: 'log', ...lg }); x += lg.len + 1.2 + Math.random() * 1.6; }
  } else {
    for (let c = -11; c <= 11; c++) { const s = B(0.2, 0.08, 0.95, 0x5b3a1e); s.position.set(c, 0.02, z); scene.add(s); row.objs.push(s); }
    [-0.3, 0.3].forEach((dz) => { const rail = B(WIDTH, 0.08, 0.08, 0x9ca3af); rail.position.set(0, 0.1, z + dz); scene.add(rail); row.objs.push(rail); });
    const pole = B(0.12, 1.4, 0.12, 0x374151); pole.position.set(-COLS - 1.2, 0.7, z + 0.45); scene.add(pole); row.objs.push(pole);
    const light = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), new THREE.MeshBasicMaterial({ color: 0x4b5563 })); light.position.set(-COLS - 1.2, 1.45, z + 0.45); scene.add(light); row.objs.push(light);
    row.light = light; row.timer = 2 + Math.random() * 4; row.train = null;
  }
  rows[r] = row;
}
function dropRow(r) { const row = rows[r]; if (!row) return; row.objs.forEach((o) => scene.remove(o)); movers = movers.filter((m) => { if (m.row === row) { scene.remove(m.mesh); return false; } return true; }); if (row.train) scene.remove(row.train.mesh); delete rows[r]; }

/* ---------------- state ---------------- */
let px, pr, best, corn, hopT, from, to, alive, ride, camR, started, idle, deathAnim, maxR;
function reset(p) {
  Object.keys(rows).forEach((r) => dropRow(+r)); movers.forEach((m) => scene.remove(m.mesh)); movers = []; rows = {};
  buildPet(p);
  px = 0; pr = 0; maxR = 0; corn = 0; hopT = 1; alive = true; ride = null; camR = 0; started = false; idle = 0; deathAnim = null;
  from = new THREE.Vector3(0, 0, 0); to = from.clone(); band = { type: 'grass', left: 0 };
  pet.position.set(0, 0, 0); pet.rotation.set(0, 0, 0); pet.scale.set(1, 1, 1); petBody.scale.set(1, 1, 1); petBody.position.set(0, 0, 0);
  for (let r = -6; r < 26; r++) genRow(r);
}
function hop(dx, dz) {
  if (G.state !== 'play' || !alive || hopT < 1) return;
  const nx = Math.round(pet.position.x) + dx, nr = pr + dz;
  if (Math.abs(nx) > COLS || nr < maxR - 6) { KQ3D.sfx('tick'); return; }
  const row = rows[nr];
  if (row && row.blocked[nx]) { pet.rotation.y = dirAngle(dx, dz); KQ3D.sfx('tick'); petBody.scale.set(1.15, 0.8, 1.15); return; }
  started = true; idle = 0;
  from.copy(pet.position); to.set(nx, 0, rowZ(nr)); pr = nr; px = nx; hopT = 0; ride = null;
  pet.rotation.y = dirAngle(dx, dz);
  KQ3D.sfx('jump');
  if (pr > maxR) { maxR = pr; G.score(maxR + corn * 3); }
  for (let r = maxR + 1; r < maxR + 26; r++) if (!rows[r]) genRow(r);
  Object.keys(rows).forEach((r) => { if (+r < maxR - 12) dropRow(+r); });
}
function dirAngle(dx, dz) { return dz > 0 ? 0 : dz < 0 ? Math.PI : dx > 0 ? -Math.PI / 2 : Math.PI / 2; }
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W' || (k === ' ' && G.state === 'play')) { e.preventDefault(); hop(0, 1); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') hop(0, -1);
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') hop(-1, 0);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') hop(1, 0);
});
KQ3D.swipe(G.scene, (d) => { if (d === 'up' || d === 'tap') hop(0, 1); else if (d === 'down') hop(0, -1); else if (d === 'left') hop(-1, 0); else if (d === 'right') hop(1, 0); });

const bits = [];
function splash(pos, color, n) {
  for (let i = 0; i < n; i++) { const p = B(0.15, 0.15, 0.15, color); p.position.copy(pos); p.position.y += 0.3; p.userData.v = new THREE.Vector3((Math.random() - 0.5) * 4, 3 + Math.random() * 3, (Math.random() - 0.5) * 4); p.userData.l = 1; scene.add(p); bits.push(p); }
}
function die(kind) {
  if (!alive) return; alive = false;
  const titles = { car: 'Beep beep! 🚗', train: 'Choo choo! 🚂', water: 'Splash! 💦', slow: 'Too slow! ⏰', edge: 'Swept away! 🌊' };
  if (kind === 'car' || kind === 'train') { KQ3D.sfx('hit'); deathAnim = kind; G.flash('#fca5a5'); splash(pet.position, 0xfde68a, 10); }
  else if (kind === 'water' || kind === 'edge') { KQ3D.sfx('splash'); deathAnim = 'water'; splash(pet.position, 0x7dd3fc, 16); }
  else { KQ3D.sfx('lose'); deathAnim = 'slow'; }
  G.over({ score: maxR + corn * 3, title: titles[kind], lines: ['🐾 ' + maxR + ' rows', '🌽 ' + corn + ' corn'] });
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const run = G.state === 'play' || G.state === 'menu' || G.state === 'over' || G.state === 'count';
  if (G.state === 'pause') { renderer.render(scene, camera); return; }

  // movers
  movers.forEach((m) => {
    if (m.kind === 'train') return;
    m.mesh.position.x += m.row.speed * dt;
    const lim = WIDTH / 2 + m.len / 2;
    if (m.row.speed > 0 && m.mesh.position.x > lim) m.mesh.position.x -= lim * 2;
    if (m.row.speed < 0 && m.mesh.position.x < -lim) m.mesh.position.x += lim * 2;
    if (m.kind === 'log') m.mesh.position.y = Math.sin(now / 400 + m.mesh.position.x) * 0.04;
  });
  // trains
  Object.values(rows).forEach((row) => {
    if (row.type !== 'rail') return;
    row.timer -= dt;
    if (!row.train && row.timer < 1.4 && row.timer > 0) {
      row.light.material.color.setHex(Math.floor(now / 160) % 2 ? 0xef4444 : 0x4b5563);
      if (!row.warned && Math.abs(row.r - pr) < 6) { row.warned = true; KQ3D.sfx('ding'); }
    }
    if (!row.train && row.timer <= 0) {
      const t = makeTrain(); t.dir = row.dir; t.mesh.rotation.y = row.dir > 0 ? 0 : Math.PI;
      t.mesh.position.set(row.dir > 0 ? -WIDTH / 2 - 2 : WIDTH / 2 + 2, 0, rowZ(row.r)); scene.add(t.mesh); row.train = t;
      if (Math.abs(row.r - pr) < 6) KQ3D.sfx('whoosh');
    }
    if (row.train) {
      row.train.mesh.position.x += row.dir * 26 * dt;
      if (Math.abs(row.train.mesh.position.x) > WIDTH / 2 + row.train.len + 4) { scene.remove(row.train.mesh); row.train = null; row.timer = 3 + Math.random() * 4; row.warned = false; row.light.material.color.setHex(0x4b5563); }
    }
  });

  // hop animation
  if (alive && hopT < 1) {
    hopT = Math.min(1, hopT + dt / 0.14);
    pet.position.lerpVectors(from, to, hopT);
    pet.position.y = Math.sin(hopT * Math.PI) * 0.55;
    petBody.scale.set(1, 1, 1);
    if (hopT >= 1) land();
  }
  petBody.scale.x += (1 - petBody.scale.x) * Math.min(1, dt * 10); petBody.scale.y += (1 - petBody.scale.y) * Math.min(1, dt * 10); petBody.scale.z = petBody.scale.x;

  const row = rows[pr];
  if (alive && G.state === 'play') {
    // riding a log
    if (ride && hopT >= 1) { pet.position.x = ride.mesh.position.x + ride.off; if (Math.abs(pet.position.x) > COLS + 0.6) die('edge'); }
    // cars & trains
    if (row && row.type === 'road') movers.forEach((m) => { if (m.row === row && m.kind === 'car' && Math.abs(m.mesh.position.x - pet.position.x) < m.len / 2 + 0.3) die('car'); });
    if (row && row.type === 'rail' && row.train) { const t = row.train, cx = t.mesh.position.x + (t.dir > 0 ? -1 : 1) * (t.len / 2 - 1.5); if (Math.abs(cx - pet.position.x) < t.len / 2 + 0.3) die('train'); }
    // slowly advancing camera
    if (started) { camR += dt * Math.min(1.1, 0.3 + maxR / 140); idle += dt; }
    camR = Math.max(camR, pr - 1);
    if (started && pr < camR - 3.2) die('slow');
  }
  // death animations
  if (deathAnim === 'car' || deathAnim === 'train') { petBody.scale.y = Math.max(0.12, petBody.scale.y - dt * 8); petBody.scale.x = petBody.scale.z = 1.4; }
  if (deathAnim === 'water') pet.position.y = Math.max(-1.2, pet.position.y - dt * 2.5);
  if (deathAnim === 'slow') pet.rotation.y += dt * 10;
  // corn bob
  Object.values(rows).forEach((r) => { if (r.corn) r.corn.s.position.y = 0.5 + Math.sin(now / 250 + r.r) * 0.1; });
  for (let i = bits.length - 1; i >= 0; i--) { const b = bits[i]; b.userData.l -= dt; b.userData.v.y -= 12 * dt; b.position.addScaledVector(b.userData.v, dt); if (b.userData.l <= 0) { scene.remove(b); bits.splice(i, 1); } }

  // camera (isometric-ish, follows forward progress)
  const wide = innerWidth > innerHeight;
  const cz = rowZ(Math.max(camR, pr - 0.5));
  const cx = THREE.MathUtils.clamp(pet.position.x * 0.5, -2, 2);
  camera.position.lerp(new THREE.Vector3(cx + 2.2, wide ? 9 : 12, cz + (wide ? 5.5 : 6.5)), Math.min(1, dt * 4));
  camera.lookAt(camera.position.x - 2.2, 0, camera.position.z - (wide ? 5.5 : 6.5) - 1.6);
  sun.position.set(camera.position.x - 6, 14, camera.position.z - 2); sun.target.position.set(camera.position.x, 0, camera.position.z - 9);
  renderer.render(scene, camera);
}
function land() {
  const row = rows[pr];
  petBody.scale.set(1.2, 0.75, 1.2);
  if (!row) return;
  if (row.type === 'river') {
    const log = movers.find((m) => m.row === row && m.kind === 'log' && Math.abs(m.mesh.position.x - pet.position.x) < m.len / 2 + 0.15);
    if (log) { ride = log; ride.off = THREE.MathUtils.clamp(pet.position.x - log.mesh.position.x, -log.len / 2 + 0.4, log.len / 2 - 0.4); pet.position.y = 0.2; KQ3D.sfx('drop'); }
    else die('water');
  } else if (row.corn && row.corn.c === px) {
    corn++; G.hudSet('corn', corn); G.score(maxR + corn * 3); KQ3D.sfx('coin');
    const s = KQ3D.toScreen(row.corn.s.position, camera, G.scene); G.pop('+3', s.x, s.y);
    scene.remove(row.corn.s); row.corn = null;
  }
}
if (R) { reset(G.choice); requestAnimationFrame(frame); }
</script>
