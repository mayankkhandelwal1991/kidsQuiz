<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Neon Runner 3D</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins',system-ui,sans-serif;background:#05050f;height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;overscroll-behavior:none;touch-action:none;color:#fff}
.wrap{width:100%;height:100%;max-width:480px;max-height:900px;position:relative;background:#05050f;border-radius:0;overflow:hidden;margin:auto}
.bar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:12px;z-index:5;pointer-events:none}
.bar button{pointer-events:auto;background:linear-gradient(135deg,#00d4ff,#7c3aed);color:#fff;border:none;border-radius:12px;padding:7px 13px;font-family:inherit;font-weight:700;cursor:pointer;font-size:12px}
h1{font-size:16px;font-weight:800;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 12px rgba(0,245,255,.3)}
.sc{font-size:14px;font-weight:800;color:#00f5ff;display:flex;align-items:center;gap:4px}
.sc .coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#ffcf33 60%,#b8860b);display:inline-block;box-shadow:0 0 6px rgba(255,215,0,.7)}
#scene{position:absolute;inset:0}
.overlay{position:absolute;inset:0;background:rgba(5,5,20,.92);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:10}
.overlay.show{display:flex}
.newbtn{background:linear-gradient(135deg,#ff7a59,#ff4fa3);color:#fff;border:none;border-radius:16px;padding:11px 28px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer}
.hint{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:rgba(255,255,255,.5);z-index:5}
.startCard{position:absolute;inset:0;background:rgba(5,5,20,.7);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:8;text-align:center;padding:20px}
.flash{position:absolute;inset:0;background:#ff3355;opacity:0;pointer-events:none;z-index:9;transition:opacity .08s}
.flash.on{opacity:.45}
</style><link rel="stylesheet" href="../game-theme.css"></head><body>
<div class="wrap">
  <div id="scene"></div>
  <div class="flash" id="flash"></div>
  <div class="bar">
    <button onclick="location.href='../index.html'">← Games</button>
    <h1>Neon Runner 3D</h1>
    <div class="sc"><span class="coin"></span><span id="score">0</span></div>
  </div>
  <div class="hint">Swipe left/right to change lane • swipe up to jump • grab the coins!</div>
  <div class="startCard" id="startCard">
    <h2 style="font-size:22px;background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">Neon Runner 3D</h2>
    <p style="font-size:13px;color:#ccc;max-width:260px">Swipe left/right to switch lanes, swipe up to jump over barriers, and scoop up shiny coins along the way!</p>
    <button class="newbtn" onclick="startGame()">▶ Start Run</button>
  </div>
  <div class="overlay" id="overlay"><h2 style="background:linear-gradient(135deg,#00f5ff,#ff00e5);-webkit-background-clip:text;background-clip:text;color:transparent">Oops!</h2><p id="finalScore" style="font-size:13px;color:#ccc"></p><button class="newbtn" onclick="startGame()">Run Again</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../ads.js"></script>
<script>
const container=document.getElementById('scene');
let scene,camera,renderer,camBase;
let lanes=[-2.2,0,2.2],curLane=1;
let player,rig={};
let obstacles=[],coins=[],scenery=[],ticks=[];
let score=0,bonus=0,best=+(localStorage.getItem('runner3dBest')||0);
let over=false,speed=0.16,jumpVel=0,jumping=false,started=false;
let runPhase=0,shakeT=0,scaleTarget=1;

/* ---------------- audio ---------------- */
let audioCtx=null;
function ensureAudio(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
function tone(freq,dur,type,vol,delay){
  if(!audioCtx) return;
  type=type||'sine'; vol=vol||0.2; delay=delay||0;
  const t0=audioCtx.currentTime+delay;
  const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
  osc.type=type; osc.frequency.setValueAtTime(freq,t0);
  gain.gain.setValueAtTime(0,t0);
  gain.gain.linearRampToValueAtTime(vol,t0+0.02);
  gain.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0+dur+0.03);
}
function sndJump(){ ensureAudio(); tone(520,0.16,'sine',0.22); tone(760,0.14,'sine',0.14,0.05); }
function sndSwitch(){ ensureAudio(); tone(340,0.07,'square',0.1); }
function sndCoin(){ ensureAudio(); tone(880,0.1,'sine',0.2); tone(1320,0.12,'sine',0.16,0.05); }
function sndCrash(){
  ensureAudio();
  tone(90,0.35,'sawtooth',0.28);
  if(!audioCtx) return;
  const n=audioCtx.sampleRate*0.3;
  const buf=audioCtx.createBuffer(1,n,audioCtx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=audioCtx.createBufferSource(); src.buffer=buf;
  const g=audioCtx.createGain(); g.gain.setValueAtTime(0.22,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
  src.connect(g); g.connect(audioCtx.destination); src.start();
}

/* ---------------- scenery builders ---------------- */
function makeSkyTexture(){
  const c=document.createElement('canvas'); c.width=2; c.height=256;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#170c34'); g.addColorStop(0.45,'#3a1f66'); g.addColorStop(0.75,'#9b3ea3'); g.addColorStop(1,'#ff9fbd');
  ctx.fillStyle=g; ctx.fillRect(0,0,2,256);
  const tex=new THREE.CanvasTexture(c); tex.needsUpdate=true; return tex;
}
function makeGlowTexture(){
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const ctx=c.getContext('2d');
  const g=ctx.createRadialGradient(64,64,6,64,64,64);
  g.addColorStop(0,'rgba(255,248,225,1)'); g.addColorStop(0.5,'rgba(255,248,225,.45)'); g.addColorStop(1,'rgba(255,248,225,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
function addStars(){
  const cnt=150,pos=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){ pos[i*3]=(Math.random()-0.5)*90; pos[i*3+1]=Math.random()*35+8; pos[i*3+2]=-Math.random()*90-10; }
  const geo=new THREE.BufferGeometry(); geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:0.3,transparent:true,opacity:0.85})));
}
function addMoon(){
  const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlowTexture(),transparent:true}));
  sprite.scale.set(15,15,1); sprite.position.set(-13,20,-72); scene.add(sprite);
}
function addMountains(){
  const mat=new THREE.MeshBasicMaterial({color:0x2b1750});
  for(let i=0;i<6;i++){
    const w=14+Math.random()*10,h=8+Math.random()*10;
    const m=new THREE.Mesh(new THREE.ConeGeometry(w/2,h,4),mat);
    m.position.set((i-2.5)*16+(Math.random()-0.5)*6,h/2-1,-70-Math.random()*15);
    m.rotation.y=Math.random()*Math.PI; scene.add(m);
  }
}
function makeTree(){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.2,1.4,6),new THREE.MeshStandardMaterial({color:0x6b4226}));
  trunk.position.y=0.7; g.add(trunk);
  const leaves=new THREE.Mesh(new THREE.ConeGeometry(1,2,7),new THREE.MeshStandardMaterial({color:0x22c55e,emissive:0x0a3d1f,emissiveIntensity:0.3}));
  leaves.position.y=2.1; g.add(leaves);
  return g;
}
function makeBuilding(){
  const g=new THREE.Group(); const h=3+Math.random()*4;
  const box=new THREE.Mesh(new THREE.BoxGeometry(2.2,h,2.2),new THREE.MeshStandardMaterial({color:0x1c1c3d}));
  box.position.y=h/2; g.add(box);
  for(let i=0;i<4;i++){
    const win=new THREE.Mesh(new THREE.PlaneGeometry(0.3,0.3),new THREE.MeshBasicMaterial({color:0x00f5ff}));
    win.position.set((Math.random()-0.5)*1.6,0.6+i*(h/5),1.11); g.add(win);
  }
  return g;
}
function addScenery(){
  for(let i=0;i<10;i++){
    const side=i%2===0?-1:1;
    const item=Math.random()<0.5?makeTree():makeBuilding();
    item.position.set(side*(5.5+Math.random()*2.5),0,-10-i*9);
    scene.add(item); scenery.push(item);
  }
}
function addRoadTicks(){
  for(let i=0;i<14;i++){
    const m=new THREE.Mesh(new THREE.PlaneGeometry(6.6,0.35),new THREE.MeshBasicMaterial({color:0x30306a}));
    m.rotation.x=-Math.PI/2; m.position.set(0,0.012,-i*7);
    scene.add(m); ticks.push(m);
  }
}

/* ---------------- player ---------------- */
function buildPlayer(){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.CylinderGeometry(0.38,0.46,0.95,12),new THREE.MeshStandardMaterial({color:0xff5a8a}));
  g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.34,16,16),new THREE.MeshStandardMaterial({color:0xffd8b0}));
  head.position.y=0.78; g.add(head);
  const eyeGeo=new THREE.SphereGeometry(0.055,8,8), eyeMat=new THREE.MeshBasicMaterial({color:0x111111});
  [-0.13,0.13].forEach(x=>{ const e=new THREE.Mesh(eyeGeo,eyeMat); e.position.set(x,0.8,0.29); g.add(e); });
  const cap=new THREE.Mesh(new THREE.SphereGeometry(0.36,16,16,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0x00d4ff}));
  cap.position.y=0.9; g.add(cap);
  const pack=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.42,0.2),new THREE.MeshStandardMaterial({color:0x7c3aed}));
  pack.position.set(0,0.05,-0.34); g.add(pack);
  const legMat=new THREE.MeshStandardMaterial({color:0x2b2f6b});
  const legL=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,0.62,8),legMat); legL.position.set(-0.19,-0.75,0); g.add(legL);
  const legR=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.14,0.62,8),legMat); legR.position.set(0.19,-0.75,0); g.add(legR);
  const armMat=new THREE.MeshStandardMaterial({color:0xffd8b0});
  const armL=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.58,8),armMat); armL.position.set(-0.5,0.05,0); g.add(armL);
  const armR=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.1,0.58,8),armMat); armR.position.set(0.5,0.05,0); g.add(armR);
  rig={legL,legR,armL,armR};
  g.position.set(lanes[1],0.8,2);
  return g;
}

/* ---------------- scene init ---------------- */
function initScene(){
  scene=new THREE.Scene();
  scene.background=makeSkyTexture();
  scene.fog=new THREE.Fog(0x2b1750,14,60);
  camera=new THREE.PerspectiveCamera(65,container.clientWidth/container.clientHeight,0.1,100);
  camera.position.set(0,4.2,8); camBase=camera.position.clone();
  camera.lookAt(0,1,-6);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(container.clientWidth,container.clientHeight);
  container.innerHTML=''; container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x8080ff,0.65));
  const dir=new THREE.DirectionalLight(0x00f5ff,0.75); dir.position.set(2,6,3); scene.add(dir);

  const road=new THREE.Mesh(new THREE.PlaneGeometry(8,200),new THREE.MeshStandardMaterial({color:0x1b1440}));
  road.rotation.x=-Math.PI/2; road.position.z=-80; scene.add(road);
  for(let i=-1;i<=1;i+=2){
    const line=new THREE.Mesh(new THREE.PlaneGeometry(0.08,200),new THREE.MeshBasicMaterial({color:0x00f5ff}));
    line.rotation.x=-Math.PI/2; line.position.set(i*1.1,0.011,-80); scene.add(line);
  }
  addStars(); addMoon(); addMountains(); addScenery(); addRoadTicks();
  player=buildPlayer(); scene.add(player);
}

/* ---------------- obstacles & coins ---------------- */
function spawnObstacleRow(z){
  const lane=Math.floor(Math.random()*3);
  const type=Math.random()<0.35?'jump':'block';
  const group=new THREE.Group();
  if(type==='jump'){
    const log=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,1.8,12),new THREE.MeshStandardMaterial({color:0xffe066,emissive:0x554400,emissiveIntensity:0.3}));
    log.rotation.z=Math.PI/2; log.position.y=0.32; group.add(log); group.userData.spin=log;
    [-1,1].forEach(i=>{
      const stripe=new THREE.Mesh(new THREE.CylinderGeometry(0.285,0.285,0.22,12),new THREE.MeshStandardMaterial({color:0x222222}));
      stripe.rotation.z=Math.PI/2; stripe.position.set(i*0.55,0.32,0); group.add(stripe);
    });
  } else {
    const crate=new THREE.Mesh(new THREE.BoxGeometry(1.5,1.3,0.6),new THREE.MeshStandardMaterial({color:0xff5a8a,emissive:0x551122,emissiveIntensity:0.25}));
    crate.position.y=0.65; group.add(crate);
    const eyeGeo=new THREE.SphereGeometry(0.08,8,8), eyeMat=new THREE.MeshBasicMaterial({color:0x111111});
    [-0.28,0.28].forEach(x=>{ const e=new THREE.Mesh(eyeGeo,eyeMat); e.position.set(x,0.85,0.32); group.add(e); });
    [-0.28,0.28].forEach((x,i)=>{
      const brow=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.04,0.04),new THREE.MeshBasicMaterial({color:0x111111}));
      brow.position.set(x,0.97,0.34); brow.rotation.z=i===0?0.3:-0.3; group.add(brow);
    });
  }
  group.position.set(lanes[lane],0,z);
  scene.add(group);
  obstacles.push({mesh:group,lane,type,passed:false});
  return lane;
}
function spawnCoin(z,lane){
  const coin=new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.08,16),new THREE.MeshStandardMaterial({color:0xffd700,emissive:0x554400,emissiveIntensity:0.4}));
  coin.rotation.x=Math.PI/2; coin.position.set(lanes[lane],1.1,z);
  scene.add(coin); coins.push({mesh:coin,collected:false});
}
function maybeSpawn(){
  let minZ=-14;
  obstacles.forEach(o=>{ if(o.mesh.position.z<minZ) minZ=o.mesh.position.z; });
  if(minZ<-70) return;
  const gap=speed*95+Math.random()*8; // keeps the *time* between obstacles roughly constant as speed rises
  const newZ=minZ-gap;
  const usedLane=spawnObstacleRow(newZ);
  if(Math.random()<0.55){
    let coinLane=Math.floor(Math.random()*3);
    if(coinLane===usedLane) coinLane=(coinLane+1)%3;
    spawnCoin(newZ-gap/2,coinLane);
  }
}

/* ---------------- game flow ---------------- */
function resetGame(){
  obstacles.forEach(o=>scene.remove(o.mesh)); obstacles=[];
  coins.forEach(c=>scene.remove(c.mesh)); coins=[];
  score=0; bonus=0; over=false; speed=0.16; curLane=1; jumping=false; jumpVel=0; runPhase=0;
  document.getElementById('score').textContent='0';
  document.getElementById('overlay').classList.remove('show');
  player.position.set(lanes[1],0.8,2); player.scale.set(1,1,1);
  for(let i=0;i<8;i++) maybeSpawn();
}
function startGame(){
  ensureAudio();
  document.getElementById('startCard').style.display='none';
  if(!scene) initScene();
  resetGame();
  if(!started){ started=true; requestAnimationFrame(loop); }
}
let touchStartX=0,touchStartY=0;
container.addEventListener('touchstart',e=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; },{passive:true});
container.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchStartX, dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>30){ changeLane(dx>0?1:-1); }
  else if(dy<-30){ doJump(); }
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')changeLane(-1);
  if(e.key==='ArrowRight')changeLane(1);
  if(e.key==='ArrowUp'||e.key===' ')doJump();
});
function changeLane(d){
  if(over)return;
  const nl=Math.max(0,Math.min(2,curLane+d));
  if(nl!==curLane){ curLane=nl; sndSwitch(); }
}
function doJump(){
  if(over||jumping)return;
  jumping=true; jumpVel=0.2; sndJump();
}

function loop(){
  if(!over) update();
  if(shakeT>0){
    camera.position.x=camBase.x+(Math.random()-0.5)*0.3;
    camera.position.y=camBase.y+(Math.random()-0.5)*0.2;
    shakeT--;
    if(shakeT===0) camera.position.copy(camBase);
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
function update(){
  speed=Math.min(0.4,speed+0.00007);
  score++;
  document.getElementById('score').textContent=Math.floor(score/6)+bonus;

  const targetX=lanes[curLane];
  player.position.x += (targetX-player.position.x)*0.25;

  if(jumping){
    player.position.y += jumpVel;
    jumpVel -= 0.012;
    scaleTarget=1.12;
    if(player.position.y<=0.8){ player.position.y=0.8; jumping=false; scaleTarget=0.9; }
  } else {
    scaleTarget += (1-scaleTarget)*0.2;
  }
  player.scale.y += (scaleTarget-player.scale.y)*0.3;
  player.scale.x += ((2-player.scale.y*0.9)-player.scale.x)*0.15;
  player.scale.z=player.scale.x;
  player.rotation.y=Math.sin(Date.now()*0.01)*0.05;

  runPhase += 0.35+speed*1.4;
  if(jumping){
    rig.legL.rotation.x=0.6; rig.legR.rotation.x=-0.3;
    rig.armL.rotation.x=-0.5; rig.armR.rotation.x=0.5;
  } else {
    rig.legL.rotation.x=Math.sin(runPhase)*0.9;
    rig.legR.rotation.x=-Math.sin(runPhase)*0.9;
    rig.armL.rotation.x=-Math.sin(runPhase)*0.7;
    rig.armR.rotation.x=Math.sin(runPhase)*0.7;
  }

  ticks.forEach(t=>{ t.position.z+=speed; if(t.position.z>10) t.position.z-=14*7; });
  scenery.forEach(s=>{ s.position.z+=speed*0.6; if(s.position.z>14) s.position.z-=10*9; });

  obstacles.forEach(o=>{
    o.mesh.position.z += speed;
    if(o.mesh.userData.spin) o.mesh.userData.spin.rotation.x += 0.2;
    if(!o.passed && o.mesh.position.z>2 && o.mesh.position.z<3){
      o.passed=true;
      const sameLane=Math.abs(o.mesh.position.x-player.position.x)<0.9;
      if(sameLane){
        const clearedByJump=o.type==='jump' && player.position.y>0.95;
        if(!clearedByJump) endGame();
      }
    }
  });
  obstacles=obstacles.filter(o=>{ if(o.mesh.position.z>10){ scene.remove(o.mesh); return false; } return true; });

  coins.forEach(c=>{
    if(c.collected)return;
    c.mesh.position.z+=speed; c.mesh.rotation.z+=0.15;
    if(c.mesh.position.z>1.4 && c.mesh.position.z<3.4){
      const sameLane=Math.abs(c.mesh.position.x-player.position.x)<0.85;
      if(sameLane){ c.collected=true; scene.remove(c.mesh); bonus+=5; sndCoin(); }
    }
  });
  coins=coins.filter(c=>{ if(c.collected) return false; if(c.mesh.position.z>10){ scene.remove(c.mesh); return false; } return true; });

  maybeSpawn();
}
function endGame(){
  over=true;
  shakeT=18;
  sndCrash();
  if(window.KQFX)KQFX.play('blast');
  const flash=document.getElementById('flash');
  flash.classList.add('on'); setTimeout(()=>flash.classList.remove('on'),150);
  const finalScore=Math.floor(score/6)+bonus;
  if(finalScore>best){ best=finalScore; localStorage.setItem('runner3dBest',best); }
  document.getElementById('finalScore').textContent='Score: '+finalScore+'  •  Best: '+best;
  document.getElementById('overlay').classList.add('show');
  onGameComplete();
}
window.addEventListener('resize',()=>{
  if(!camera||!renderer)return;
  camera.aspect=container.clientWidth/container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth,container.clientHeight);
});
</script></body></html>
