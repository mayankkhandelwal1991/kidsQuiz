<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jungle Runner 3D</title>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kq3d.js?v=20261124c"></script>
<script src="../ads.js?v=20261127a"></script>
<script>
/* Jungle Runner 3D — run through the jungle: jump logs, slide under branches,
   dodge crates, collect fruit, grab a magnet. */
const HEROES = [
  { icon: '👧', name: 'Mia', shirt: 0xec4899, pants: 0x1e3a8a, skin: 0xf5c39b, hat: 0xfacc15, hair: 0x5b3716, kind: 'kid' },
  { icon: '🧒', name: 'Leo', shirt: 0x3b82f6, pants: 0x374151, skin: 0xd9a066, hat: 0xef4444, hair: 0x1f1308, kind: 'kid' },
  { icon: '🤖', name: 'Robo', shirt: 0x94a3b8, pants: 0x64748b, skin: 0xcbd5e1, hat: 0x22d3ee, kind: 'robot' },
  { icon: '🐼', name: 'Panda', shirt: 0xffffff, pants: 0x111827, skin: 0xffffff, hat: 0x111827, kind: 'panda' }
];
const FRUITS = ['🍎', '🍌', '🍓', '🍉', '🍇', '🍍'];
const G = KQ3D.init({
  id: 'endless_runner_3d', title: 'Jungle Runner 3D', bestKey: 'runner3dBest', music: true,
  hero: ['🏃', '🍌', '🪵'], colors: ['#22c55e', '#0d9488'],
  how: [['👆', 'Swipe ⬅️ ➡️ to change lanes'], ['⬆️', 'Swipe up to JUMP over logs'], ['⬇️', 'Swipe down to SLIDE under branches'], ['🍓', 'Collect fruit — the 🧲 magnet pulls them in!']],
  hud: [{ id: 'fruit', icon: '🍎' }], scoreIcon: '🏃', stars: [150, 400, 800],
  hint: 'Swipe ⬆️ jump  •  ⬇️ slide',
  pick: { label: 'Pick your runner', options: HEROES },
  buttons: [{ icon: '⬅️', label: 'Left', down: () => lane(-1) }, { icon: '⬆️', label: 'Jump', down: () => jump() }, { icon: '⬇️', label: 'Slide', down: () => slide() }, { icon: '➡️', label: 'Right', down: () => lane(1) }],
  onPick: (h) => buildHero(h),
  onReset: (h) => reset(h)
});

const R = KQ3D.renderer(G.scene, { fov: 60, far: 200, shadows: true });
const { scene, camera, renderer } = R || {};
const LANES = [-2.2, 0, 2.2];
const L = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
const texL = new THREE.TextureLoader();
const T = {
  crate: texL.load('endless_runner_3d_assets/textures/crate_wood.png'),
  bark: texL.load('endless_runner_3d_assets/textures/bark.png'),
  leaves: texL.load('endless_runner_3d_assets/textures/leaves.png')
};

/* ---------------- world ---------------- */
scene.background = new THREE.Color(0x9be7ff);
scene.fog = new THREE.Fog(0x9be7ff, 45, 110);
scene.add(new THREE.HemisphereLight(0xffffff, 0x5a8f3c, 0.8));
const sun = new THREE.DirectionalLight(0xfff4d6, 0.7);
sun.position.set(6, 16, 8); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 300), L(0x6cc04a)); ground.rotation.x = -Math.PI / 2; ground.position.z = -100; ground.receiveShadow = true; scene.add(ground);
const path = new THREE.Mesh(new THREE.PlaneGeometry(7.2, 300), L(0xd9a65e)); path.rotation.x = -Math.PI / 2; path.position.set(0, 0.01, -100); path.receiveShadow = true; scene.add(path);

const scrollers = [];
function addS(m, span) { m.userData.span = span; scrollers.push(m); scene.add(m); }
// path stones and edges
for (let i = 0; i < 40; i++) {
  const st = new THREE.Mesh(new THREE.CylinderGeometry(0.25 + Math.random() * 0.2, 0.3, 0.06, 7), L(0xb7843f)); st.position.set((Math.random() - 0.5) * 6, 0.02, 10 - i * 3); addS(st, 120);
  [-3.75, 3.75].forEach((x) => { const e = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.35, 3), L(i % 2 ? 0x8b5a2b : 0xa16207)); e.position.set(x, 0.17, 10 - i * 3); addS(e, 120); });
}
function jungleTree(x, z) {
  const g = new THREE.Group(); const palm = Math.random() < 0.45;
  if (palm) {
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.32, 4, 7), new THREE.MeshLambertMaterial({ map: T.bark })); tr.position.y = 2; tr.rotation.z = (Math.random() - 0.5) * 0.25; tr.castShadow = true; g.add(tr);
    for (let k = 0; k < 6; k++) { const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 2.6), L(0x16a34a)); leaf.position.set(0, 4, 0); leaf.rotation.set(-0.5, k * Math.PI / 3, 0); leaf.translateZ(1.1); g.add(leaf); }
  } else {
    const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.45, 2.4, 7), new THREE.MeshLambertMaterial({ map: T.bark })); tr.position.y = 1.2; g.add(tr);
    [[0, 3, 0, 1.8], [0.9, 2.6, 0.2, 1.2], [-0.8, 2.8, -0.2, 1.3]].forEach(([a, b, c, r]) => { const s = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 0), new THREE.MeshLambertMaterial({ map: T.leaves, color: 0x7ee08a })); s.position.set(a, b, c); s.castShadow = true; g.add(s); });
  }
  g.position.set(x, 0, z); g.scale.setScalar(0.9 + Math.random() * 0.5); return g;
}
function bush(x, z) {
  const g = new THREE.Group();
  for (let k = 0; k < 3; k++) { const b = new THREE.Mesh(new THREE.SphereGeometry(0.6 + Math.random() * 0.3, 8, 6), L(0x22a33a)); b.position.set(k * 0.6 - 0.6, 0.4, Math.random() * 0.3); g.add(b); }
  const fl = KQ3D.emojiSprite(['🌸', '🌻', '🍄'][Math.floor(Math.random() * 3)], 0.7); fl.position.set(0.2, 1.1, 0.4); g.add(fl);
  g.position.set(x, 0, z); return g;
}
for (let i = 0; i < 22; i++) {
  const z = 10 - i * 5.5;
  [-1, 1].forEach((s) => { addS(jungleTree(s * (6 + Math.random() * 7), z + Math.random() * 2), 121); if (Math.random() < 0.6) addS(bush(s * (4.6 + Math.random() * 1.2), z + 2.5), 121); });
}
// sky: sun + clouds
const sunBall = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfde047, fog: false })); sunBall.position.set(28, 34, -110); scene.add(sunBall);
const clouds = [];
for (let i = 0; i < 8; i++) {
  const c = new THREE.Group();
  for (let k = 0; k < 4; k++) { const p = new THREE.Mesh(new THREE.SphereGeometry(1.6 + Math.random(), 8, 6), new THREE.MeshBasicMaterial({ color: 0xffffff, fog: false })); p.position.set(k * 1.7, Math.random() * 0.7, Math.random()); c.add(p); }
  c.position.set(-45 + Math.random() * 90, 18 + Math.random() * 10, -70 - Math.random() * 40); scene.add(c); clouds.push(c);
}
// distant hills + butterflies
for (let i = 0; i < 6; i++) { const h = new THREE.Mesh(new THREE.SphereGeometry(18 + Math.random() * 10, 12, 8), L(0x4ade80)); h.position.set(-70 + i * 28, -8, -120 - Math.random() * 20); scene.add(h); }
const flies = [];
for (let i = 0; i < 5; i++) { const b = KQ3D.emojiSprite('🦋', 0.8); b.position.set((Math.random() - 0.5) * 14, 2 + Math.random() * 2, -10 - Math.random() * 40); b.userData.ph = Math.random() * 6; addS(b, 60); flies.push(b); }

/* ---------------- hero ---------------- */
let hero, rig = {};
function limb(r1, r2, h, mat) { const pivot = new THREE.Group(); const m = new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, 8), mat); m.position.y = -h / 2; m.castShadow = true; pivot.add(m); return pivot; }
function buildHero(h) {
  h = h || HEROES[0];
  const old = hero; const g = new THREE.Group();
  const shirt = L(h.shirt), pants = L(h.pants), skin = L(h.skin);
  const torso = new THREE.Mesh(h.kind === 'robot' ? new THREE.BoxGeometry(0.75, 0.8, 0.5) : new THREE.CylinderGeometry(0.33, 0.4, 0.8, 12), shirt); torso.position.y = 1.15; torso.castShadow = true; g.add(torso);
  const head = new THREE.Mesh(h.kind === 'robot' ? new THREE.BoxGeometry(0.62, 0.55, 0.55) : new THREE.SphereGeometry(0.36, 16, 12), skin); head.position.y = 1.85; head.castShadow = true; g.add(head);
  if (h.kind === 'kid') {
    const hat = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), L(h.hat)); hat.position.y = 1.9; g.add(hat);
    const brim = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.05, 0.35), L(h.hat)); brim.position.set(0, 1.92, -0.4); g.add(brim);
    if (h.name === 'Mia') { const pony = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), L(h.hair)); pony.position.set(0, 1.8, 0.42); pony.scale.set(1, 1.6, 1); g.add(pony); rig.pony = pony; }
    const pack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.25), L(0xf97316)); pack.position.set(0, 1.2, 0.42); g.add(pack);
  } else if (h.kind === 'robot') {
    const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35), L(0x475569)); ant.position.y = 2.25; g.add(ant);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.09, 10, 8), new THREE.MeshBasicMaterial({ color: h.hat })); bulb.position.y = 2.45; g.add(bulb); rig.bulb = bulb;
    const panel = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.3, 0.05), new THREE.MeshBasicMaterial({ color: 0x22d3ee })); panel.position.set(0, 1.2, 0.27); g.add(panel);
  } else {
    [-0.27, 0.27].forEach((x) => { const ear = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), L(0x111827)); ear.position.set(x, 2.17, 0); g.add(ear); });
    const belly = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.41, 0.4, 12), L(0x111827)); belly.position.y = 1.35; g.add(belly);
  }
  const armM = h.kind === 'panda' ? L(0x111827) : (h.kind === 'robot' ? L(0x64748b) : skin);
  rig.armL = limb(0.09, 0.08, 0.6, armM); rig.armL.position.set(-0.45, 1.45, 0); g.add(rig.armL);
  rig.armR = limb(0.09, 0.08, 0.6, armM); rig.armR.position.set(0.45, 1.45, 0); g.add(rig.armR);
  rig.legL = limb(0.12, 0.1, 0.75, pants); rig.legL.position.set(-0.17, 0.78, 0); g.add(rig.legL);
  rig.legR = limb(0.12, 0.1, 0.75, pants); rig.legR.position.set(0.17, 0.78, 0); g.add(rig.legR);
  [rig.legL, rig.legR].forEach((lg) => { const shoe = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.12, 0.34), L(0xffffff)); shoe.position.set(0, -0.78, -0.06); lg.add(shoe); });
  g.position.copy(old ? old.position : new THREE.Vector3(0, 0, 2));
  if (old) scene.remove(old);
  hero = g; scene.add(g);
}
buildHero(G.choice);
const magnetRing = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.06, 6, 30), new THREE.MeshBasicMaterial({ color: 0xf43f5e, transparent: true, opacity: 0.6 }));
magnetRing.rotation.x = Math.PI / 2; magnetRing.visible = false; scene.add(magnetRing);

/* ---------------- obstacles & pickups ---------------- */
function makeLog() {
  const g = new THREE.Group();
  const lg = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.9, 12), new THREE.MeshLambertMaterial({ map: T.bark, color: 0xc08a5a })); lg.rotation.z = Math.PI / 2; lg.position.y = 0.35; lg.castShadow = true; g.add(lg);
  [-1, 1].forEach((s) => { const ring = new THREE.Mesh(new THREE.CircleGeometry(0.34, 12), L(0xf5d0a0)); ring.position.set(s * 0.951, 0.35, 0); ring.rotation.y = s * Math.PI / 2; g.add(ring); });
  return g;
}
function makeCrate() {
  const g = new THREE.Group();
  const c = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.2), new THREE.MeshLambertMaterial({ map: T.crate })); c.position.y = 0.75; c.castShadow = true; g.add(c);
  if (Math.random() < 0.5) { const c2 = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), new THREE.MeshLambertMaterial({ map: T.crate })); c2.position.set(0.1, 1.95, 0); c2.rotation.y = 0.4; c2.castShadow = true; g.add(c2); }
  const m = KQ3D.emojiSprite(Math.random() < 0.5 ? '🐒' : '🦜', 0.9); m.position.set(-0.2, Math.random() < 0.5 ? 2.0 : 2.8, 0); g.add(m);
  return g;
}
function makeBranch() {
  const g = new THREE.Group();
  [-0.95, 0.95].forEach((x) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 2.4, 6), new THREE.MeshLambertMaterial({ map: T.bark })); p.position.set(x, 1.2, 0); g.add(p); });
  const b = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2.2, 8), new THREE.MeshLambertMaterial({ map: T.bark, color: 0xb07a4a })); b.rotation.z = Math.PI / 2; b.position.y = 1.85; b.castShadow = true; g.add(b);
  for (let k = 0; k < 5; k++) { const lf = new THREE.Mesh(new THREE.SphereGeometry(0.28, 6, 5), L(0x22c55e)); lf.position.set(-0.9 + k * 0.45, 1.6 + Math.random() * 0.15, 0.05); lf.scale.y = 1.4; g.add(lf); }
  const v = KQ3D.emojiSprite('🐍', 0.7); v.position.set(0.4, 1.5, 0.2); g.add(v);
  return g;
}
function makeFruit(e) { const s = KQ3D.emojiSprite(e, 0.95); s.position.y = 1.1; const g = new THREE.Group(); g.add(s); return g; }
function makeMagnet() { const g = new THREE.Group(); const s = KQ3D.emojiSprite('🧲', 1.2); s.position.y = 1.3; g.add(s); const r = new THREE.Mesh(new THREE.TorusGeometry(0.75, 0.06, 6, 22), new THREE.MeshBasicMaterial({ color: 0xf43f5e })); r.position.y = 1.3; g.add(r); return g; }

let things = [], dust = [];
let dist, fruit, speed, ln, y, vy, sliding, nextRow, magnet, dead, runPh, lastMile, combo;

function reset(h) {
  things.forEach((t) => scene.remove(t.mesh)); things = [];
  buildHero(h);
  dist = 0; fruit = 0; speed = 11; ln = 1; y = 0; vy = 0; sliding = 0; nextRow = 22; magnet = 0; dead = false; runPh = 0; lastMile = 0; combo = 0;
  hero.position.set(0, 0, 2); hero.rotation.set(0, 0, 0); hero.scale.set(1, 1, 1);
  for (let z = -22; z > -90; z -= 17) row(z, true);
}
function row(z, easy) {
  const free = Math.floor(Math.random() * 3);
  const n = easy ? 1 : (Math.random() < Math.min(0.6, 0.2 + dist / 2500) ? 2 : 1);
  const lanes = [0, 1, 2].filter((l) => l !== free).sort(() => Math.random() - 0.5).slice(0, n);
  const allJump = !easy && Math.random() < 0.15; // full-width log: everyone must jump
  if (allJump) { [0, 1, 2].forEach((l) => add('log', makeLog(), l, z)); }
  else lanes.forEach((l) => { const r = Math.random(); if (r < 0.35) add('log', makeLog(), l, z); else if (r < 0.65) add('branch', makeBranch(), l, z); else add('crate', makeCrate(), l, z); });
  if (Math.random() < 0.05 && !magnet) add('magnet', makeMagnet(), free, z - 4);
  else if (Math.random() < 0.8) { const e = FRUITS[Math.floor(Math.random() * FRUITS.length)]; for (let k = 0; k < 5; k++) add('fruit', makeFruit(e), allJump ? 1 : free, z - 3 - k * 1.8, allJump ? 1.5 : 0); }
}
function add(type, mesh, l, z, lift) { mesh.position.set(LANES[l], lift || 0, z); scene.add(mesh); things.push({ type, mesh, lane: l }); }

function lane(d) { if (G.state !== 'play' || dead) return; const n = Math.max(0, Math.min(2, ln + d)); if (n !== ln) { ln = n; KQ3D.sfx('whoosh'); } }
function jump() { if (G.state !== 'play' || dead) return; if (y <= 0.001) { vy = 9.5; sliding = 0; KQ3D.sfx('jump'); } }
function slide() { if (G.state !== 'play' || dead) return; if (y > 0.001) vy = -14; sliding = 0.75; KQ3D.sfx('boing'); }
document.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') lane(-1);
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') lane(1);
  else if (k === 'ArrowUp' || k === 'w' || k === 'W' || (k === ' ' && G.state === 'play')) { e.preventDefault(); jump(); }
  else if (k === 'ArrowDown' || k === 's' || k === 'S') slide();
});
KQ3D.swipe(G.scene, (dir) => { if (dir === 'left') lane(-1); else if (dir === 'right') lane(1); else if (dir === 'up' || dir === 'tap') jump(); else if (dir === 'down') slide(); });

function puff(pos, color, n, up) {
  for (let i = 0; i < n; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.12, 6, 5), new THREE.MeshBasicMaterial({ color, transparent: true }));
    p.position.copy(pos); p.userData.v = new THREE.Vector3((Math.random() - 0.5) * 4, (up || 2) * Math.random() + 1, (Math.random() - 0.5) * 3); p.userData.life = 0.7;
    scene.add(p); dust.push(p);
  }
}
function hit(t) {
  dead = true; KQ3D.sfx('hit'); G.flash('#f97316');
  puff(hero.position.clone().setY(1), 0xfde68a, 16, 5);
  G.over({ score: Math.floor(dist) + fruit * 5, title: t.type === 'branch' ? 'Bonk! 🌿' : t.type === 'log' ? 'Tripped!' : 'Oops!', lines: ['🏃 ' + Math.floor(dist) + ' m', '🍎 ' + fruit + ' fruit'] });
}

/* ---------------- loop ---------------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const playing = G.state === 'play' && !dead;
  const v = playing ? speed : (G.state === 'menu' ? 5 : 0);
  if (playing) {
    speed = Math.min(26, 11 + dist / 60);
    dist += v * dt; G.score(Math.floor(dist) + fruit * 5);
    const m = Math.floor(dist / 200); if (m > lastMile) { lastMile = m; KQ3D.sfx('levelup'); G.pop(m * 200 + ' m! 🎉', null, innerHeight * 0.3, '#bbf7d0'); }
    nextRow -= v * dt; if (nextRow <= 0) { row(-95); nextRow = Math.max(12, 19 - dist / 150); }
    // jump physics
    vy -= 28 * dt; y = Math.max(0, y + vy * dt); if (y === 0) vy = 0;
    sliding = Math.max(0, sliding - dt);
    magnet = Math.max(0, magnet - dt);
  }
  scrollers.forEach((s) => { s.position.z += v * dt; if (s.position.z > 14) s.position.z -= s.userData.span; });
  clouds.forEach((c) => { c.position.x += dt * 0.8; if (c.position.x > 55) c.position.x = -55; });
  flies.forEach((b) => { b.userData.ph += dt * 3; b.position.y += Math.sin(b.userData.ph) * 0.02; b.position.x += Math.cos(b.userData.ph * 0.5) * 0.02; });

  // hero pose
  if (!dead) {
    hero.position.x += (LANES[ln] - hero.position.x) * Math.min(1, dt * 14);
    hero.position.y = y;
    runPh += dt * (v * 0.9 + 3);
    const sw = Math.sin(runPh) * (y > 0 ? 0.2 : 0.9);
    rig.legL.rotation.x = y > 0 ? -0.8 : sw; rig.legR.rotation.x = y > 0 ? 0.5 : -sw;
    rig.armL.rotation.x = y > 0 ? 2.6 : -sw * 0.8; rig.armR.rotation.x = y > 0 ? 2.6 : sw * 0.8;
    if (rig.pony) rig.pony.rotation.x = Math.sin(runPh * 2) * 0.3;
    if (rig.bulb) rig.bulb.material.color.setHSL((now / 1000) % 1, 0.9, 0.6);
    const sl = sliding > 0;
    const sy = sl ? 0.55 : 1;                          // crouch for the slide
    hero.scale.y += (sy - hero.scale.y) * Math.min(1, dt * 20); hero.scale.x = hero.scale.z = 1 + (1 - hero.scale.y) * 0.4;
    hero.rotation.x = sl ? -0.25 : 0;
    hero.position.y = y + Math.abs(Math.sin(runPh)) * 0.08 * (v > 0 && y === 0 && !sl ? 1 : 0);
    if (playing && y === 0 && Math.random() < dt * 8) puff(new THREE.Vector3(hero.position.x, 0.1, 2.4), 0xe8c07a, 1, 0.5);
  } else {
    hero.rotation.x = Math.min(1.5, hero.rotation.x + dt * 5); hero.position.y = Math.max(0.25, hero.position.y);
  }
  magnetRing.visible = magnet > 0; magnetRing.position.set(hero.position.x, 1.2, 2); magnetRing.scale.setScalar(1 + Math.sin(now / 120) * 0.1);

  for (let i = things.length - 1; i >= 0; i--) {
    const t = things[i], p = t.mesh.position;
    p.z += v * dt;
    if (t.type === 'fruit' || t.type === 'magnet') { t.mesh.rotation.y += dt * 3; t.mesh.children[0].position.y = 1.1 + Math.sin(now / 200 + p.z) * 0.12; }
    if (p.z > 12) { scene.remove(t.mesh); things.splice(i, 1); continue; }
    if (!playing) continue;
    const dz = Math.abs(p.z - 2), dx = Math.abs(p.x - hero.position.x);
    if (t.type === 'fruit') {
      if (magnet > 0 && dz < 12 && p.z < 2.5) { p.x += (hero.position.x - p.x) * Math.min(1, dt * 8); p.y += (y - p.y) * Math.min(1, dt * 8); }
      if (dx < 1 && dz < 0.9 && Math.abs(p.y - y) < 1.6) {
        fruit++; combo++; G.hudSet('fruit', fruit); KQ3D.sfx(combo % 5 ? 'pop' : 'coin');
        const s = KQ3D.toScreen(new THREE.Vector3(p.x, 1.5, p.z), camera, G.scene); G.pop(combo % 5 ? '+5' : '+5 🔥', s.x, s.y);
        scene.remove(t.mesh); things.splice(i, 1);
      }
    } else if (t.type === 'magnet') {
      if (dx < 1.1 && dz < 1) { magnet = 8; KQ3D.sfx('chime'); G.pop('🧲 Magnet!', null, innerHeight * 0.35, '#fecdd3'); scene.remove(t.mesh); things.splice(i, 1); }
    } else if (dx < 1.05 && dz < (t.type === 'crate' ? 0.95 : 0.6)) {
      if (t.type === 'log' && y > 0.55) continue;        // jumped over
      if (t.type === 'branch' && sliding > 0) continue;  // slid under
      if (t.type === 'log' || t.type === 'branch' || t.type === 'crate') { combo = 0; hit(t); }
    }
  }
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i]; d.userData.life -= dt; d.userData.v.y -= 6 * dt; d.position.addScaledVector(d.userData.v, dt); d.position.z += v * dt;
    d.material.opacity = Math.max(0, d.userData.life / 0.7);
    if (d.userData.life <= 0) { scene.remove(d); dust.splice(i, 1); }
  }
  const wide = innerWidth > innerHeight;
  camera.position.set(hero.position.x * 0.5, (wide ? 4.2 : 5) + y * 0.25, 2 + (wide ? 6.5 : 7.8));
  camera.lookAt(hero.position.x * 0.35, 1.2, -6);
  sun.position.set(hero.position.x + 6, 16, 10); sun.target.position.set(hero.position.x, 0, 0);
  renderer.render(scene, camera);
}
if (R) { reset(G.choice); requestAnimationFrame(frame); }
</script>
