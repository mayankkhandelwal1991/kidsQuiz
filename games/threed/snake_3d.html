<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake 3D</title>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="kq3d.js?v=20261124b"></script>
<script src="../ads.js"></script>
<script>
/* Snake 3D — the classic snake on a floating garden island.
   Eat fruit to grow, golden apples = +5 (before they vanish), rocks appear
   as you grow. Swipe / arrow keys / buttons turn the snake. The snake glides
   smoothly between grid cells; the camera looks down from behind. */
const SKINS = [
  { icon: '🐍', name: 'Sunny', cols: [0x22c55e, 0x16a34a], head: 0x15803d },
  { icon: '🌈', name: 'Rainbow', rainbow: true, head: 0x7c3aed },
  { icon: '🐛', name: 'Wiggly', cols: [0xa3e635, 0xfacc15], head: 0x65a30d },
  { icon: '🤖', name: 'Robo', cols: [0x94a3b8, 0x64748b], head: 0x475569, metal: true }
];
const FRUIT = ['🍎', '🍌', '🍓', '🍇', '🍊', '🍉', '🍒'];
const COLS = 11, ROWS = 15;
const G = KQ3D.init({
  id: 'snake_3d', title: 'Snake 3D', bestKey: 'snake3dBest', music: true,
  hero: ['🐍', '🍎', '🏝️'], colors: ['#22c55e', '#0ea5e9'],
  how: [['👆', 'Swipe, use arrow keys, or tap the buttons to turn'], ['🍓', 'Eat fruit to grow longer — you get faster!'], ['🍎', 'Golden apples = +5 — be quick!'], ['🪨', 'Don’t bump the fence, rocks or your own tail']],
  scoreIcon: '🍎', stars: [10, 25, 45],
  pick: { label: 'Pick your snake', options: SKINS },
  buttons: [{ icon: '⬅️', label: 'Left', down: () => turn(-1, 0) }, { icon: '⬆️', label: 'Up', down: () => turn(0, -1) }, { icon: '⬇️', label: 'Down', down: () => turn(0, 1) }, { icon: '➡️', label: 'Right', down: () => turn(1, 0) }],
  onPick: (s) => { skin = s || SKINS[0]; },
  onReset: (s) => reset(s)
});

var camReady = false;   // the renderer calls onResize once while it is being created
const R = KQ3D.renderer(G.scene, { fov: 45, far: 200, shadows: true, onResize: () => { if (camReady) fitCamera(); } });
const { scene, camera } = R || {};
const MAT = {};
const L = (c, o) => { const k = c + (o ? JSON.stringify(o) : ''); return MAT[k] || (MAT[k] = new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}))); };
const box = (w, h, d, c) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), L(c)); m.castShadow = m.receiveShadow = true; return m; };
const cellPos = (x, y) => new THREE.Vector3(x - (COLS - 1) / 2, 0, y - (ROWS - 1) / 2);

/* ---------- world ---------- */
scene.background = new THREE.Color(0x7dd3fc);
scene.fog = new THREE.Fog(0x7dd3fc, 40, 90);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b8e4e, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(-8, 18, 10); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 60 });
scene.add(sun);

// sea
const sea = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), new THREE.MeshLambertMaterial({ color: 0x38bdf8 }));
sea.rotation.x = -Math.PI / 2; sea.position.y = -2.2; scene.add(sea);
// island: dirt block + checkered grass top (one texture)
const island = box(COLS + 2.4, 2, ROWS + 2.4, 0x92400e); island.position.y = -1.05; scene.add(island);
const sand = box(COLS + 3.4, 0.6, ROWS + 3.4, 0xfde68a); sand.position.y = -1.9; scene.add(sand);
const tex = (() => {
  const c = document.createElement('canvas'), s = 32; c.width = COLS * s; c.height = ROWS * s; const x = c.getContext('2d');
  for (let i = 0; i < COLS; i++) for (let j = 0; j < ROWS; j++) { x.fillStyle = (i + j) % 2 ? '#a3e635' : '#bef264'; x.fillRect(i * s, j * s, s, s); }
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; return t;
})();
const grass = new THREE.Mesh(new THREE.PlaneGeometry(COLS, ROWS), new THREE.MeshLambertMaterial({ map: tex }));
grass.rotation.x = -Math.PI / 2; grass.position.y = 0.001; grass.receiveShadow = true; scene.add(grass);
const rim = new THREE.Mesh(new THREE.PlaneGeometry(COLS + 2.4, ROWS + 2.4), L(0x65a30d)); rim.rotation.x = -Math.PI / 2; rim.position.y = -0.002; rim.receiveShadow = true; scene.add(rim);
// wooden fence round the board
(function fence() {
  const g = new THREE.Group(), hx = COLS / 2 + 0.45, hz = ROWS / 2 + 0.45;
  for (let x = -hx; x <= hx + 0.01; x += 1) [-hz, hz].forEach((z) => { const p = box(0.16, 0.6, 0.16, 0xa16207); p.position.set(x, 0.3, z); g.add(p); });
  for (let z = -hz; z <= hz + 0.01; z += 1) [-hx, hx].forEach((x) => { const p = box(0.16, 0.6, 0.16, 0xa16207); p.position.set(x, 0.3, z); g.add(p); });
  [[0, -hz, COLS + 1, 0.1], [0, hz, COLS + 1, 0.1], [-hx, 0, 0.1, ROWS + 1], [hx, 0, 0.1, ROWS + 1]].forEach(([x, z, w, d]) => [0.25, 0.45].forEach((y) => { const r = box(w, 0.08, d, 0xca8a04); r.position.set(x, y, z); g.add(r); }));
  scene.add(g);
})();
// a few trees and flowers outside the fence
function tree(x, z, s) { const t = new THREE.Group(); const tr = box(0.3 * s, 1.2 * s, 0.3 * s, 0x92400e); tr.position.y = 0.6 * s; t.add(tr); const lf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.85 * s, 0), L(0x16a34a)); lf.position.y = 1.6 * s; lf.castShadow = true; t.add(lf); t.position.set(x, 0, z); scene.add(t); }
[[-COLS / 2 - 0.8, -ROWS / 2 - 0.4, 1], [COLS / 2 + 0.8, -ROWS / 2 + 2, 0.9], [-COLS / 2 - 0.9, ROWS / 2 - 3, 0.8], [COLS / 2 + 0.9, ROWS / 2 - 0.6, 1.1]].forEach((t) => tree(...t));
// clouds
const clouds = [];
for (let i = 0; i < 6; i++) { const c = new THREE.Group(); for (let k = 0; k < 3; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(1 + k * 0.3, 8, 6), L(0xffffff)); s.position.set(k * 1.4, k === 1 ? 0.5 : 0, 0); c.add(s); } c.position.set(-30 + i * 12, 9 + (i % 3) * 2, -25 - (i % 2) * 10); scene.add(c); clouds.push(c); }

function fitCamera() {
  if (!camera) return;
  // look down from behind so the whole board fits, portrait or landscape
  const a = camera.aspect || 0.6, vh = ROWS + 3, vw = (COLS + 3) / a;
  const need = Math.max(vh, vw) * 0.5 / Math.tan(camera.fov * Math.PI / 360);
  const dist = need * 1.0, tilt = 0.58;   // angle away from straight down
  camera.position.set(0, Math.cos(tilt) * dist, Math.sin(tilt) * dist + 0.6);
  camera.lookAt(0, 0, 0.4);
}
camReady = true; fitCamera();

/* ---------- snake meshes ---------- */
let skin = G.choice || SKINS[0];
const segGeo = new THREE.SphereGeometry(0.46, 16, 12);
const snakeGroup = new THREE.Group(); scene.add(snakeGroup);
let segMeshes = [];
function segMat(i) {
  if (skin.rainbow) return L(new THREE.Color().setHSL(((i * 28) % 360) / 360, 0.8, 0.55).getHex());
  return L(skin.cols[i % 2]);
}
const head = new THREE.Group();
function buildHead() {
  while (head.children.length) head.remove(head.children[0]);
  const hm = new THREE.Mesh(new THREE.SphereGeometry(0.54, 18, 14), L(skin.head)); hm.scale.set(1, 0.85, 1.15); hm.castShadow = true; head.add(hm);
  [-1, 1].forEach((s) => {
    const e = new THREE.Mesh(new THREE.SphereGeometry(0.17, 10, 8), L(0xffffff)); e.position.set(s * 0.24, 0.28, -0.25); head.add(e);
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 6), L(0x111827)); p.position.set(s * 0.25, 0.32, -0.39); head.add(p);
  });
  const tongue = box(0.06, 0.03, 0.4, 0xef4444); tongue.position.set(0, -0.05, -0.65); tongue.castShadow = false; head.add(tongue); head.userData.tongue = tongue;
  if (skin.metal) { const ant = box(0.05, 0.4, 0.05, 0x334155); ant.position.set(0, 0.6, 0); head.add(ant); const tip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), L(0xef4444)); tip.position.set(0, 0.82, 0); head.add(tip); }
}
snakeGroup.add(head);
function syncSegments(n) {
  while (segMeshes.length < n) { const m = new THREE.Mesh(segGeo, segMat(segMeshes.length + 1)); m.castShadow = true; snakeGroup.add(m); segMeshes.push(m); }
  while (segMeshes.length > n) snakeGroup.remove(segMeshes.pop());
  segMeshes.forEach((m, i) => { m.material = segMat(i + 1); });
}

/* ---------- food, golden apple, rocks, effects ---------- */
const foodSp = KQ3D.emojiSprite('🍎', 1.25); scene.add(foodSp);
const goldGroup = new THREE.Group(); scene.add(goldGroup);
const goldSp = KQ3D.emojiSprite('🍎', 1.4); goldGroup.add(goldSp);
const goldStar = KQ3D.emojiSprite('⭐', 0.6); goldStar.position.set(0.45, 0.45, 0); goldGroup.add(goldStar);
const goldRing = new THREE.Mesh(new THREE.RingGeometry(0.5, 0.65, 24), new THREE.MeshBasicMaterial({ color: 0xfacc15, transparent: true, opacity: 0.8, side: THREE.DoubleSide }));
goldRing.rotation.x = -Math.PI / 2; goldRing.position.y = 0.03; scene.add(goldRing);
const rockGeo = new THREE.DodecahedronGeometry(0.45, 0);
let rockMeshes = [];
const parts = [];
const partGeo = new THREE.BoxGeometry(0.14, 0.14, 0.14);
function burst(p, color, n) { for (let i = 0; i < n; i++) { const m = new THREE.Mesh(partGeo, L(color)); m.position.copy(p).add(new THREE.Vector3(0, 0.4, 0)); m.userData = { v: new THREE.Vector3((Math.random() - 0.5) * 5, 3 + Math.random() * 3, (Math.random() - 0.5) * 5), l: 0.7 }; scene.add(m); parts.push(m); } }

/* ---------- game logic (same rules as the 2D Snake) ---------- */
let snake, prev, dir, queue, food, gold, rocks, score, stepT, stepLen, grow, pulse = 0, shake = 0, deadT = 0;
function reset(s) {
  skin = s || skin || SKINS[0]; buildHead();
  const cy = Math.floor(ROWS / 2) + 2;
  snake = [{ x: 5, y: cy }, { x: 5, y: cy + 1 }, { x: 5, y: cy + 2 }]; prev = snake.map((p) => ({ ...p }));
  dir = { x: 0, y: -1 }; queue = []; gold = null; score = 0; stepT = 0; stepLen = 0.24; grow = 0; deadT = 0;
  rockMeshes.forEach((m) => scene.remove(m)); rockMeshes = []; rocks = [];
  syncSegments(snake.length - 1); placeFood(); G.score(0);
}
const occupied = (x, y) => snake.some((p) => p.x === x && p.y === y) || rocks.some((r) => r.x === x && r.y === y) || (food && food.x === x && food.y === y) || (gold && gold.x === x && gold.y === y);
function freeCell() { let x, y, n = 0; do { x = Math.floor(Math.random() * COLS); y = Math.floor(Math.random() * ROWS); n++; } while (occupied(x, y) && n < 500); return { x, y }; }
function placeFood() {
  food = null; food = freeCell(); food.e = FRUIT[Math.floor(Math.random() * FRUIT.length)];
  foodSp.material.map = KQ3D.emojiTexture(food.e); foodSp.material.needsUpdate = true;
}
function turn(dx, dy) {
  if (G.state !== 'play') return;
  const lastDir = queue.length ? queue[queue.length - 1] : dir;
  if ((dx === -lastDir.x && dy === -lastDir.y) || (dx === lastDir.x && dy === lastDir.y)) return;
  if (queue.length < 3) queue.push({ x: dx, y: dy });
}
document.addEventListener('keydown', (e) => {
  const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] }[e.key];
  if (m) { e.preventDefault(); turn(m[0], m[1]); }
});
KQ3D.swipe(G.scene, (d) => { if (d === 'left') turn(-1, 0); else if (d === 'right') turn(1, 0); else if (d === 'up') turn(0, -1); else if (d === 'down') turn(0, 1); });

function popAt(c, t, col) { const v = cellPos(c.x, c.y).add(new THREE.Vector3(0, 0.6, 0)), s = KQ3D.toScreen ? KQ3D.toScreen(v, camera, R.renderer.domElement) : null; G.pop(t, s ? s.x : null, s ? s.y - 20 : null, col); }
function step() {
  if (queue.length) dir = queue.shift();
  prev = snake.map((p) => ({ ...p }));
  const h = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const wall = h.x < 0 || h.y < 0 || h.x >= COLS || h.y >= ROWS;
  const self = snake.slice(0, snake.length - (grow ? 0 : 1)).some((p) => p.x === h.x && p.y === h.y);
  const rock = rocks.some((r) => r.x === h.x && r.y === h.y);
  if (wall || self || rock) {
    deadT = 0.001; shake = 0.5; KQ3D.sfx('hit'); G.flash('#fecaca');
    burst(cellPos(snake[0].x, snake[0].y), skin.head, 14);
    G.over({ score, title: wall ? 'Bumped the fence!' : self ? 'Tied in a knot!' : 'Ouch, a rock!', lines: ['🐍 ' + snake.length + ' long'] });
    return;
  }
  snake.unshift(h);
  if (grow) { grow--; prev.push(prev[prev.length - 1]); } else snake.pop();
  if (h.x === food.x && h.y === food.y) {
    score++; grow += 1; G.score(score); KQ3D.sfx('pop'); pulse = 1; popAt(food, '+1', '#fff');
    burst(cellPos(food.x, food.y), 0xef4444, 8);
    placeFood();
    if (score % 5 === 0 && !gold) { gold = freeCell(); gold.t = 7; }
    if (score >= 8 && score % 4 === 0 && rocks.length < 9) {
      const r = freeCell();
      if (Math.abs(r.x - h.x) + Math.abs(r.y - h.y) > 3) { rocks.push(r); const m = new THREE.Mesh(rockGeo, L(0x94a3b8)); m.castShadow = true; m.position.copy(cellPos(r.x, r.y)).setY(0.3); m.rotation.set(Math.random(), Math.random(), 0); m.scale.setScalar(0.01); m.userData.grow = 0; scene.add(m); rockMeshes.push(m); }
    }
    stepLen = Math.max(0.095, 0.24 - score * 0.0045);
  } else if (gold && h.x === gold.x && h.y === gold.y) {
    score += 5; grow += 2; G.score(score); KQ3D.sfx('coin'); pulse = 1.4; popAt(gold, '+5', '#fde047');
    burst(cellPos(gold.x, gold.y), 0xfacc15, 14); gold = null;
  }
  syncSegments(snake.length - 1);
}

/* ---------- render loop ---------- */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000), t = now / 1000; last = now;
  if (G.state === 'play' && !deadT) {
    stepT += dt;
    while (stepT >= stepLen && !deadT && G.state === 'play') { stepT -= stepLen; step(); }
    if (gold) { gold.t -= dt; if (gold.t <= 0) gold = null; }
  }
  const k = deadT ? 1 : Math.min(1, stepT / stepLen);
  // snake: glide each part from its previous cell to its current one
  const pos = snake.map((p, i) => { const q = prev[i] || p; return cellPos(q.x + (p.x - q.x) * k, q.y + (p.y - q.y) * k); });
  const wig = (i) => Math.sin(t * 9 - i * 0.7) * 0.05;
  pulse = Math.max(0, pulse - dt * 2.5);
  head.position.copy(pos[0]).setY(0.48 + Math.abs(Math.sin(t * 8)) * 0.03);
  const look = pos.length > 1 ? Math.atan2(pos[0].x - pos[1].x, pos[0].z - pos[1].z) : 0;
  head.rotation.y = look + Math.PI;
  if (head.userData.tongue) head.userData.tongue.visible = Math.sin(t * 6) > 0.3;
  segMeshes.forEach((m, i) => {
    const p = pos[i + 1]; if (!p) return;
    const taper = 1 - Math.min(0.4, (i + 1) / Math.max(8, snake.length) * 0.4);
    const bump = Math.max(0, 1 - Math.abs(i - pulse * snake.length * 0.6) / 2) * pulse * 0.25;   // a gulp travels down the body
    m.position.set(p.x + wig(i), 0.42 * taper + bump * 0.3, p.z);
    m.scale.setScalar(taper + bump);
  });
  if (deadT) { deadT += dt; snakeGroup.children.forEach((m) => { m.visible = Math.floor(deadT * 8) % 2 === 0; }); } else snakeGroup.children.forEach((m) => { m.visible = true; });
  // fruit bobs and spins
  if (food) { foodSp.position.copy(cellPos(food.x, food.y)).setY(0.6 + Math.sin(t * 3) * 0.12); foodSp.visible = true; }
  goldGroup.visible = goldRing.visible = !!gold;
  if (gold) {
    goldGroup.position.copy(cellPos(gold.x, gold.y)).setY(0.7 + Math.sin(t * 4) * 0.15);
    goldRing.position.set(goldGroup.position.x, 0.03, goldGroup.position.z); goldRing.scale.setScalar(1 + Math.sin(t * 6) * 0.15);
    goldGroup.visible = !(gold.t < 2 && Math.floor(t * 7) % 2);
  }
  rockMeshes.forEach((m) => { if (m.userData.grow < 1) { m.userData.grow = Math.min(1, m.userData.grow + dt * 3); m.scale.setScalar(m.userData.grow); } });
  for (let i = parts.length - 1; i >= 0; i--) { const m = parts[i], u = m.userData; u.l -= dt; u.v.y -= 12 * dt; m.position.addScaledVector(u.v, dt); m.rotation.x += dt * 8; if (u.l <= 0) { scene.remove(m); parts.splice(i, 1); } }
  clouds.forEach((c, i) => { c.position.x += dt * (0.4 + i * 0.05); if (c.position.x > 40) c.position.x = -40; });
  sea.position.y = -2.2 + Math.sin(t) * 0.05;
  // camera shake on a crash
  if (shake > 0) { shake = Math.max(0, shake - dt); fitCamera(); camera.position.x += (Math.random() - 0.5) * shake; camera.position.y += (Math.random() - 0.5) * shake; }
  R.renderer.render(scene, camera);
}
if (R) { reset(skin); requestAnimationFrame(loop); }
</script>
</body></html>
