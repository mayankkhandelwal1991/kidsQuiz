<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Balloon Rescue</title>
<style>
.br { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 70px 10px 16px; font-family: 'Baloo 2', sans-serif;
  background: linear-gradient(180deg, #7dd3fc, #e0f2fe 70%, #bbf7d0 70.2%, #86efac); }
.br-sky { position: relative; width: 100%; max-width: 420px; height: 230px; }
.br-grp { position: absolute; left: 0; right: 0; height: 220px; transition: bottom .6s cubic-bezier(.34,1.4,.64,1); }
.br-pup { position: absolute; left: 50%; bottom: 0; width: 70px; margin-left: -35px; }
.br-pup img { width: 70px; height: 70px; display: block; }
.br-b { position: absolute; width: 46px; height: 56px; border-radius: 50% 50% 46% 46%; bottom: 120px; transition: transform .3s, opacity .3s; }
.br-b::before { content: ''; position: absolute; left: 50%; top: 100%; width: 2px; height: var(--len); background: rgba(60,60,60,.5); transform-origin: top; transform: rotate(var(--rot)); }
.br-b::after { content: ''; position: absolute; left: 22%; top: 16%; width: 9px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.6); }
.br-b.pop { transform: scale(1.6); opacity: 0; }
.br-b { animation: brSway 3s ease-in-out infinite; } .br-b:nth-child(even) { animation-delay: -1.5s; }
@keyframes brSway { 50% { margin-top: -6px; } }
.br-card { width: 100%; max-width: 480px; background: #fff; border-radius: 26px; padding: 12px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.12); }
.br-top { display: flex; justify-content: space-between; align-items: center; font-weight: 800; color: #0369a1; font-size: 14px; }
.br-hint { display: inline-flex; align-items: center; gap: 6px; background: #f0f9ff; border-radius: 999px; padding: 2px 12px; }
.br-hint img { width: 28px; height: 28px; }
.br-word { display: flex; justify-content: center; gap: 6px; margin: 10px 0 12px; flex-wrap: wrap; }
.br-word span { width: 38px; height: 46px; border-bottom: 4px solid #0ea5e9; font-size: 30px; font-weight: 800; color: #0c4a6e; display: grid; place-items: center; }
.br-word span.got { animation: brPop .3s; color: #16a34a; }
@keyframes brPop { 50% { transform: scale(1.3); } }
.br-keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.br-k { border: none; border-radius: 12px; height: 44px; font: 800 20px 'Baloo 2', sans-serif; color: #fff; background: linear-gradient(180deg, #a78bfa, #7c3aed); box-shadow: 0 4px 0 #5b21b6; cursor: pointer; }
.br-k:active { transform: translateY(3px); box-shadow: 0 1px 0 #5b21b6; }
.br-k.ok { background: #22c55e; box-shadow: 0 4px 0 #15803d; } .br-k.no { background: #cbd5e1; box-shadow: none; color: #64748b; }
.br-k:disabled { cursor: default; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124a"></script>
<script src="../ads.js"></script>
<script>
/* Balloon Rescue — guess the word letter by letter. Each wrong letter pops a balloon;
   if all 6 pop the puppy lands softly (no word). 5 words per game. */
const TOPICS = [
  { icon: '🐾', name: 'Animals', words: [['TIGER', '🐯'], ['RABBIT', '🐰'], ['MONKEY', '🐒'], ['ZEBRA', '🦓'], ['PANDA', '🐼'], ['TURTLE', '🐢'], ['PARROT', '🦜'], ['CAMEL', '🐫'], ['WHALE', '🐳'], ['SNAKE', '🐍'], ['HORSE', '🐴'], ['GIRAFFE', '🦒']] },
  { icon: '🍎', name: 'Food', words: [['APPLE', '🍎'], ['BANANA', '🍌'], ['MANGO', '🥭'], ['PIZZA', '🍕'], ['CARROT', '🥕'], ['GRAPES', '🍇'], ['CHERRY', '🍒'], ['BREAD', '🍞'], ['CHEESE', '🧀'], ['COOKIE', '🍪'], ['LEMON', '🍋'], ['POTATO', '🥔']] },
  { icon: '🏫', name: 'School', words: [['PENCIL', '✏️'], ['BOOK', '📚'], ['TEACHER', '🧑‍🏫'], ['CLOCK', '⏰'], ['RULER', '📏'], ['CRAYON', '🖍️'], ['SCHOOL', '🏫'], ['GLOBE', '🌍'], ['PAINT', '🎨'], ['BELL', '🔔'], ['MUSIC', '🎵'], ['ROBOT', '🤖']] },
  { icon: '🚀', name: 'Things that go', words: [['ROCKET', '🚀'], ['TRAIN', '🚂'], ['TRUCK', '🚚'], ['PLANE', '✈️'], ['BICYCLE', '🚲'], ['TRACTOR', '🚜'], ['HELICOPTER', '🚁'], ['BOAT', '⛵'], ['SCOOTER', '🛵'], ['BUS', '🚌'], ['TAXI', '🚕'], ['SHIP', '🚢']] }
];
const BAL = ['#ef4444', '#f97316', '#facc15', '#22c55e', '#3b82f6', '#a855f7'];
const ROUNDS = 5;
const G = KQ3D.init({
  id: 'hangman', title: 'Balloon Rescue', bestKey: 'hangBest', music: true,
  hero: ['🎈', '🐶', '🔤'], colors: ['#0ea5e9', '#a855f7'],
  how: [['🔤', 'Guess the hidden word one letter at a time'], ['🎈', 'Each wrong letter pops a balloon — keep the puppy flying!'], ['💡', 'After 2 wrong letters you get a picture hint'], ['⭐', 'Fewer pops = more points. 5 words!']],
  scoreIcon: '🎈', stars: [100, 200, 270],
  pick: { label: 'Pick a topic', options: TOPICS },
  onReset: (t) => reset(t)
});
const box = document.createElement('div'); box.className = 'br'; G.scene.appendChild(box);
let topic, words, r, score, word, pic, got, wrong, saved, done;
function reset(t) { topic = t || TOPICS[0]; words = topic.words.slice().sort(() => Math.random() - 0.5).slice(0, ROUNDS); r = 0; score = 0; saved = 0; G.score(0); round(); }
function round() {
  [word, pic] = words[r]; got = new Set(); wrong = 0; done = false;
  const bals = BAL.map((c, k) => {
    const dx = (k - 2.5) * 40, h = 110 + (k % 2) * 28, len = h - 64;            // string from balloon down to the puppy's head
    const ang = Math.atan2(dx, len) * 180 / Math.PI, sl = Math.hypot(dx, len);
    return '<div class="br-b" id="brB' + k + '" style="left:calc(50% + ' + (dx - 23) + 'px);background:' + c + ';bottom:' + h + 'px;--len:' + sl + 'px;--rot:' + ang + 'deg"></div>';
  }).join('');
  box.innerHTML = '<div class="br-sky" id="brSky"><div class="br-grp" id="brPup" style="bottom:10px">' + bals + '<div class="br-pup"><img src="' + KQ3D.emojiFile('🐶') + '" alt=""></div></div></div>' +
    '<div class="br-card"><div class="br-top"><span>Word ' + (r + 1) + ' of ' + ROUNDS + ' · ' + topic.name + '</span><span class="br-hint" id="brHint">💡 hint after 2 misses</span></div>' +
    '<div class="br-word" id="brW">' + [...word].map(() => '<span></span>').join('') + '</div>' +
    '<div class="br-keys">' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((c) => '<button type="button" class="br-k" data-c="' + c + '">' + c + '</button>').join('') + '</div></div>';
  box.querySelectorAll('.br-k').forEach((b) => b.onclick = () => guess(b.dataset.c, b));
}
function guess(c, b) {
  if (G.state !== 'play' || done || got.has(c)) return;
  got.add(c); b.disabled = true;
  if (word.includes(c)) {
    b.classList.add('ok'); KQ3D.sfx('pop');
    [...word].forEach((ch, k) => { if (ch === c) { const s = document.getElementById('brW').children[k]; s.textContent = c; s.classList.add('got'); } });
    if ([...word].every((ch) => got.has(ch))) win();
  } else {
    b.classList.add('no'); wrong++; KQ3D.sfx('blast');
    const bal = document.getElementById('brB' + (BAL.length - wrong)); if (bal) bal.classList.add('pop');
    document.getElementById('brPup').style.bottom = (10 - wrong * 6) + 'px';
    if (wrong === 2) { document.getElementById('brHint').innerHTML = '<img src="' + KQ3D.emojiFile(pic) + '" alt=""> Hint!'; KQ3D.sfx('chime'); }
    if (wrong >= BAL.length) lose();
  }
}
function win() {
  done = true; saved++;
  const pts = 20 + (BAL.length - wrong) * 5 + (wrong < 2 ? 10 : 0); score += pts; G.score(score);
  KQ3D.sfx('success'); document.getElementById('brPup').style.bottom = '40px';
  document.getElementById('brHint').innerHTML = '<img src="' + KQ3D.emojiFile(pic) + '" alt=""> Saved!';
  G.pop('Saved! +' + pts, innerWidth / 2, 200, '#fde047');
  G.later(nextRound, 1600);
}
function lose() {
  done = true; KQ3D.sfx('lose');
  [...word].forEach((ch, k) => { const s = document.getElementById('brW').children[k]; if (!s.textContent) { s.textContent = ch; s.style.color = '#ef4444'; } });
  document.getElementById('brPup').style.bottom = '-40px';
  document.getElementById('brHint').innerHTML = '<img src="' + KQ3D.emojiFile(pic) + '" alt=""> It was ' + word;
  G.pop('Soft landing! 🐶', innerWidth / 2, 220, '#fff');
  G.later(nextRound, 2400);
}
function nextRound() {
  if (G.state !== 'play') return;
  r++;
  if (r >= ROUNDS) G.over({ score, title: saved >= 4 ? 'Hero rescuer! 🎈' : 'Nice try!', lines: ['🐶 ' + saved + ' / ' + ROUNDS + ' saved', topic.icon + ' ' + topic.name] });
  else round();
}
document.addEventListener('keydown', (e) => { const c = (e.key || '').toUpperCase(); if (/^[A-Z]$/.test(c)) { const b = box.querySelector('.br-k[data-c="' + c + '"]'); if (b) guess(c, b); } });
reset(G.choice);
</script>
</body></html>
