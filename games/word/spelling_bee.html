<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spelling Bee</title>
<style>
.sb { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 74px 14px 24px; font-family: 'Baloo 2', sans-serif;
  background: radial-gradient(circle at 15% 85%, rgba(255,255,255,.35) 0 70px, transparent 71px), repeating-linear-gradient(60deg, rgba(255,255,255,.08) 0 20px, transparent 20px 40px), linear-gradient(170deg, #fde68a, #fdba74); }
.sb-card { position: relative; width: 100%; max-width: 460px; background: #fff; border-radius: 30px; padding: 16px 14px 18px; text-align: center; box-shadow: 0 8px 0 rgba(180,83,9,.25), 0 16px 30px rgba(0,0,0,.12); }
.sb-n { font-size: 14px; font-weight: 800; color: #b45309; }
.sb-pic { width: 130px; height: 130px; margin: 2px auto 0; display: grid; place-items: center; border-radius: 50%; background: radial-gradient(circle, #fef9c3 60%, #fde68a); animation: sbIn .45s cubic-bezier(.34,1.56,.64,1); }
.sb-pic img { width: 92px; height: 92px; }
@keyframes sbIn { from { transform: scale(.3) rotate(-30deg); opacity: 0; } }
.sb-tools { display: flex; justify-content: center; gap: 10px; margin: 8px 0 12px; }
.sb-tool { border: none; border-radius: 14px; padding: 6px 14px; font: 800 15px 'Baloo 2', sans-serif; background: #e0f2fe; color: #0369a1; box-shadow: 0 3px 0 #bae6fd; cursor: pointer; }
.sb-tool:active { transform: translateY(2px); box-shadow: none; }
.sb-slots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.sb-slot { width: 46px; height: 54px; border-radius: 14px; border: 3px dashed #fcd34d; display: grid; place-items: center; font-size: 30px; font-weight: 800; color: #92400e; background: #fffbeb; }
.sb-slot.hint { color: rgba(146,64,14,.22); }
.sb-slot.ok { border-style: solid; border-color: #22c55e; background: #dcfce7; color: #15803d; animation: sbPop .3s; }
@keyframes sbPop { 50% { transform: scale(1.18); } }
.sb-pool { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.sb-l { width: 54px; height: 58px; border: none; border-radius: 16px; font: 800 30px 'Baloo 2', sans-serif; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.sb-l:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
.sb-l.used { visibility: hidden; }
.sb-l.bad { animation: sbShake .35s; background: #ef4444 !important; }
@keyframes sbShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.sb-bee { position: absolute; width: 54px; top: -26px; left: 12px; animation: sbFly 2.4s ease-in-out infinite; }
@keyframes sbFly { 50% { transform: translate(-12px, -8px) rotate(-8deg); } }
.sb-time { height: 10px; border-radius: 5px; background: #fef3c7; overflow: hidden; margin: 8px 0 2px; }
.sb-time i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #ef4444); border-radius: 5px; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124a"></script>
<script src="../ads.js"></script>
<script>
/* Spelling Bee — look at the picture and spell the word.
   Easy: faint hints + 2 extra letters · Jumbled: just the word's letters · Speed: 60 s, decoys. */
const MODES = [
  { icon: '🐣', name: 'Easy', hints: true, extra: 2, count: 10 },
  { icon: '🔀', name: 'Jumbled', hints: false, extra: 0, count: 10 },
  { icon: '⏱️', name: 'Speed', hints: false, extra: 2, count: 99, time: 60 }
];
const WORDS = [
  ['CAT', '🐱'], ['DOG', '🐶'], ['SUN', '☀️'], ['BUS', '🚌'], ['BEE', '🐝'], ['COW', '🐄'], ['PIG', '🐷'], ['HEN', '🐔'], ['EGG', '🥚'], ['CAR', '🚗'], ['HAT', '🎩'], ['KEY', '🔑'], ['BED', '🛏️'],
  ['BALL', '⚽'], ['CAKE', '🎂'], ['FISH', '🐟'], ['FROG', '🐸'], ['STAR', '⭐'], ['TREE', '🌳'], ['MOON', '🌙'], ['BOOK', '📚'], ['DUCK', '🦆'], ['LION', '🦁'], ['BEAR', '🐻'], ['KITE', '🪁'], ['BIKE', '🚲'], ['SHIP', '🚢'], ['CORN', '🌽'], ['MILK', '🥛'], ['GIFT', '🎁'], ['BELL', '🔔'], ['DRUM', '🥁'], ['SHOE', '👟'],
  ['APPLE', '🍎'], ['MANGO', '🥭'], ['LEMON', '🍋'], ['HORSE', '🐴'], ['ZEBRA', '🦓'], ['TIGER', '🐯'], ['PANDA', '🐼'], ['HOUSE', '🏠'], ['TRAIN', '🚂'], ['CLOCK', '⏰'], ['PIZZA', '🍕'], ['ROBOT', '🤖'], ['SNAKE', '🐍'], ['GRAPES', '🍇'],
  ['RABBIT', '🐰'], ['ROCKET', '🚀'], ['CARROT', '🥕'], ['BANANA', '🍌'], ['TURTLE', '🐢'], ['FLOWER', '🌸'], ['PENCIL', '✏️'], ['ORANGE', '🍊'], ['MONKEY', '🐒'], ['PENGUIN', '🐧'], ['GIRAFFE', '🦒'], ['ELEPHANT', '🐘']
];
const COLORS = ['#f43f5e', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899'];
const G = KQ3D.init({
  id: 'spelling_bee', title: 'Spelling Bee', bestKey: 'spellBest', music: true,
  hero: ['🐝', '🔤', '🍎'], colors: ['#f59e0b', '#ea580c'],
  how: [['🖼️', 'Look at the picture — tap 🔊 to hear the word'], ['👆', 'Tap the letters in the right order'], ['💡', 'Stuck? Use a hint (costs 5 points)'], ['⏱️', 'Speed mode: spell as many as you can in 60 s!']],
  scoreIcon: '🐝', stars: [60, 120, 180],
  pick: { label: 'Pick a mode', options: MODES },
  onReset: (m) => reset(m)
});
const box = document.createElement('div'); box.className = 'sb'; G.scene.appendChild(box);
let mode, list, idx, score, pos, slips, solved, timeLeft, timer;

function say(t) {
  try { if (localStorage.getItem('kq_muted') === '1') return; } catch (e) {}
  try { if (window.Android && Android.speak) { Android.speak(t, 'en'); return; } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(t.toLowerCase()); u.rate = 0.85; u.pitch = 1.2; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function reset(m) {
  mode = m || MODES[0]; score = 0; idx = 0; solved = 0; G.score(0);
  // easier words first, a few longer ones later
  const by = (a, b) => WORDS.filter((w) => w[0].length >= a && w[0].length <= b).sort(() => Math.random() - 0.5);
  list = mode.time ? by(3, 6).concat(by(3, 8)) : by(3, 3).slice(0, 3).concat(by(4, 4).slice(0, 3), by(5, 5).slice(0, 2), by(6, 8).slice(0, 2));
  clearInterval(timer); timer = null; timeLeft = mode.time || 0;
  next();
}
function next() {
  if (idx >= Math.min(mode.count, list.length)) { finish(); return; }
  const [word, pic] = list[idx]; pos = 0; slips = 0;
  let letters = word.split('');
  for (let i = 0; i < mode.extra; i++) letters.push(String.fromCharCode(65 + Math.floor(Math.random() * 26)));
  letters.sort(() => Math.random() - 0.5);
  if (!mode.extra && letters.join('') === word && word.length > 1) letters.reverse();
  box.innerHTML = '<div class="sb-card"><img class="sb-bee" src="' + KQ3D.emojiFile('🐝') + '" alt="">' +
    '<div class="sb-n">' + (mode.time ? 'Words: ' + solved : 'Word ' + (idx + 1) + ' of ' + Math.min(mode.count, list.length)) + '</div>' +
    (mode.time ? '<div class="sb-time"><i id="sbT" style="width:' + (timeLeft / mode.time * 100) + '%"></i></div>' : '') +
    '<div class="sb-pic"><img src="' + KQ3D.emojiFile(pic) + '" alt=""></div>' +
    '<div class="sb-tools"><button type="button" class="sb-tool" id="sbSay">🔊 Hear it</button><button type="button" class="sb-tool" id="sbHint">💡 Hint</button></div>' +
    '<div class="sb-slots">' + word.split('').map((ch) => '<div class="sb-slot' + (mode.hints ? ' hint' : '') + '">' + (mode.hints ? ch : '') + '</div>').join('') + '</div>' +
    '<div class="sb-pool">' + letters.map((ch, i) => '<button type="button" class="sb-l" data-c="' + ch + '" style="background:' + COLORS[i % COLORS.length] + '">' + ch + '</button>').join('') + '</div></div>';
  box.querySelectorAll('.sb-l').forEach((b) => b.onclick = () => tap(b, word));
  document.getElementById('sbSay').onclick = () => say(word);
  document.getElementById('sbHint').onclick = () => { const b = [...box.querySelectorAll('.sb-l:not(.used)')].find((x) => x.dataset.c === word[pos]); if (b) { score = Math.max(0, score - 5); G.score(score); slips++; tap(b, word); } };
  if (idx === 0 || !mode.time) setTimeout(() => say(word), 300);
  if (mode.time && !timer) timer = setInterval(tick, 100);
}
function tick() {
  if (G.state === 'pause') return;
  if (G.state !== 'play') { clearInterval(timer); timer = null; return; }
  timeLeft -= 0.1; const t = document.getElementById('sbT'); if (t) t.style.width = Math.max(0, timeLeft / mode.time * 100) + '%';
  if (timeLeft <= 0) { clearInterval(timer); timer = null; finish(); }
}
function tap(b, word) {
  if (G.state !== 'play' || b.classList.contains('used')) return;
  if (b.dataset.c !== word[pos]) { slips++; b.classList.remove('bad'); void b.offsetWidth; b.classList.add('bad'); KQ3D.sfx('wrong'); return; }
  b.classList.add('used');
  const slot = box.querySelectorAll('.sb-slot')[pos]; slot.textContent = word[pos]; slot.classList.remove('hint'); slot.classList.add('ok');
  KQ3D.sfx('pop'); pos++;
  if (pos === word.length) {
    solved++;
    const pts = 10 + (slips ? 0 : 5) + (mode.time ? 0 : word.length > 4 ? 5 : 0);
    score += pts; G.score(score); KQ3D.sfx('success'); say(word);
    const r = box.querySelector('.sb-pic').getBoundingClientRect(); G.pop((slips ? 'Good! +' : 'Perfect! +') + pts, r.left + r.width / 2, r.top, '#fde047');
    idx++; G.later(() => { next(); }, mode.time ? 350 : 1100);
  }
}
function finish() {
  clearInterval(timer); timer = null;
  G.over({ score, title: mode.time ? 'Time’s up! ⏱️' : 'Spelling star! 🐝', lines: ['🔤 ' + solved + ' words', '🐣 ' + mode.name + ' mode'] });
}
reset(G.choice);
</script>
</body></html>
