<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Word Builder</title>
<style>
.wb { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 72px 12px 18px; font-family: 'Baloo 2', sans-serif;
  background: radial-gradient(circle at 50% 75%, rgba(255,255,255,.25) 0 150px, transparent 151px), linear-gradient(170deg, #0f766e, #14b8a6 50%, #67e8f9); }
.wb-lvl { color: #fff; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.wb-lvl img { width: 34px; height: 34px; }
.wb-slots { width: 100%; max-width: 480px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; margin: 8px 0; }
.wb-w { display: flex; gap: 3px; }
.wb-w i { width: 30px; height: 34px; border-radius: 8px; background: rgba(255,255,255,.3); display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 20px; color: #0f766e; }
.wb-w.found i { background: #fff; animation: wbPop .35s both; }
.wb-w.found i:nth-child(2) { animation-delay: .05s; } .wb-w.found i:nth-child(3) { animation-delay: .1s; } .wb-w.found i:nth-child(4) { animation-delay: .15s; } .wb-w.found i:nth-child(5) { animation-delay: .2s; } .wb-w.found i:nth-child(6) { animation-delay: .25s; }
.wb-w i.hint { background: #fef3c7; color: #b45309; }
@keyframes wbPop { 50% { transform: scale(1.25); } }
.wb-cur { min-height: 54px; margin: 6px 0; display: flex; gap: 4px; }
.wb-cur span { width: 42px; height: 50px; border-radius: 12px; background: #fff; display: grid; place-items: center; font-size: 28px; font-weight: 800; color: #0f766e; box-shadow: 0 4px 0 rgba(0,0,0,.15); animation: wbIn .2s; }
.wb-cur.bad span { background: #fecaca; color: #b91c1c; animation: wbShake .35s; } .wb-cur.dup span { background: #fef3c7; }
@keyframes wbIn { from { transform: scale(.4); } } @keyframes wbShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.wb-wheel { position: relative; width: 250px; height: 250px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 10px 0 rgba(0,0,0,.12); margin: 6px 0 12px; flex: 0 0 auto; }
.wb-l { position: absolute; width: 62px; height: 62px; margin: -31px 0 0 -31px; border: none; border-radius: 50%; font: 800 30px 'Baloo 2', sans-serif; color: #fff; background: linear-gradient(180deg, #2dd4bf, #0d9488); box-shadow: 0 5px 0 #115e59; cursor: pointer; transition: transform .1s; }
.wb-l.on { background: linear-gradient(180deg, #fbbf24, #f59e0b); box-shadow: 0 5px 0 #b45309; transform: scale(1.1); }
.wb-mid { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; display: grid; place-items: center; }
.wb-mid img { width: 64px; height: 64px; }
.wb-btns { display: flex; gap: 8px; }
.wb-b { border: none; border-radius: 16px; padding: 8px 14px; font: 800 16px 'Baloo 2', sans-serif; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
.wb-b.go { background: #22c55e; color: #fff; padding: 8px 22px; font-size: 18px; } .wb-b.cl { background: #fff; color: #0f766e; } .wb-b.sh { background: #fff; color: #0f766e; } .wb-b.hi { background: #fde68a; color: #92400e; }
.wb-b:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.2); }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261120m"></script>
<script src="../ads.js"></script>
<script>
/* Word Builder — tap letters on the wheel to build words. Fill every slot to clear
   the level; extra real words score bonus points. 6 levels. */
const LEVELS = [
  { letters: 'CATS', icon: '🐱', words: ['CAT', 'ACT', 'SAT', 'CATS', 'CAST'], bonus: ['AT', 'AS'] },
  { letters: 'STAR', icon: '⭐', words: ['RAT', 'ART', 'TAR', 'STAR', 'RATS', 'ARTS'], bonus: ['SAT', 'AT', 'AS'] },
  { letters: 'PLAY', icon: '🎮', words: ['LAP', 'PAL', 'PAY', 'LAY', 'PLAY'], bonus: ['YAP'] },
  { letters: 'HOUSE', icon: '🏠', words: ['USE', 'SHE', 'HOE', 'HUE', 'HOSE', 'SHOE', 'HOUSE'], bonus: ['HUES', 'OH', 'SO', 'US', 'HE', 'HUSH'] },
  { letters: 'TRAIN', icon: '🚂', words: ['RAN', 'ANT', 'RAT', 'TIN', 'AIR', 'RAIN', 'TRAIN'], bonus: ['ART', 'TAR', 'TAN', 'IN', 'AN', 'AT', 'IT', 'RANT', 'NIT'] },
  { letters: 'PLANET', icon: '🪐', words: ['PEN', 'TEN', 'NET', 'PLAN', 'LANE', 'LATE', 'PLATE', 'PLANE', 'PLANET'], bonus: ['PET', 'PAN', 'TAP', 'PAT', 'APE', 'ATE', 'EAT', 'TEA', 'LAP', 'LEAP', 'PANT', 'TALE', 'PALE', 'ANT', 'LET', 'NEAT', 'PEAL', 'PELT', 'LENT'] }
];
const G = KQ3D.init({
  id: 'word_builder', title: 'Word Builder', bestKey: 'builderBest', music: true,
  hero: ['🔤', '🏗️', '⭐'], colors: ['#0d9488', '#0891b2'],
  how: [['👆', 'Tap letters on the wheel to make a word'], ['✅', 'Tap ✓ to check it — it fills a slot'], ['⭐', 'Extra real words = bonus points'], ['💡', 'Stuck? A hint shows one letter']],
  scoreIcon: '🔤', stars: [250, 500, 700],
  onReset: () => reset()
});
const box = document.createElement('div'); box.className = 'wb'; G.scene.appendChild(box);
let lvl, L, found, bonusFound, pick, letters, score, hints;
function reset() { lvl = 0; score = 0; G.score(0); load(); }
function load() {
  L = LEVELS[lvl]; found = new Set(); bonusFound = new Set(); pick = []; hints = {}; letters = L.letters.split('');
  shuffle(); draw();
}
function shuffle() { for (let k = letters.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [letters[k], letters[j]] = [letters[j], letters[k]]; } }
function draw() {
  const sorted = L.words.slice().sort((a, b) => a.length - b.length || a.localeCompare(b));
  const R = 88;
  box.innerHTML = '<div class="wb-lvl"><img src="' + KQ3D.emojiFile(L.icon) + '" alt="">Level ' + (lvl + 1) + ' of ' + LEVELS.length + ' · ' + found.size + '/' + L.words.length + ' words' + (bonusFound.size ? ' · ⭐ ' + bonusFound.size + ' bonus' : '') + '</div>' +
    '<div class="wb-slots">' + sorted.map((w) => '<div class="wb-w' + (found.has(w) ? ' found' : '') + '">' + [...w].map((c, k) => '<i class="' + (!found.has(w) && hints[w] > k ? 'hint' : '') + '">' + (found.has(w) || hints[w] > k ? c : '') + '</i>').join('') + '</div>').join('') + '</div>' +
    '<div class="wb-cur" id="wbCur">' + pick.map((k) => '<span>' + letters[k] + '</span>').join('') + '</div>' +
    '<div class="wb-wheel"><div class="wb-mid"><img src="' + KQ3D.emojiFile(L.icon) + '" alt=""></div>' + letters.map((c, k) => {
      const a = -Math.PI / 2 + k * 2 * Math.PI / letters.length;
      return '<button type="button" class="wb-l' + (pick.includes(k) ? ' on' : '') + '" data-k="' + k + '" style="left:' + (125 + Math.cos(a) * R) + 'px;top:' + (125 + Math.sin(a) * R) + 'px">' + c + '</button>';
    }).join('') + '</div>' +
    '<div class="wb-btns"><button type="button" class="wb-b sh" id="wbSh">🔀</button><button type="button" class="wb-b cl" id="wbCl">⌫</button><button type="button" class="wb-b go" id="wbGo">✓ Check</button><button type="button" class="wb-b hi" id="wbHi">💡</button><button type="button" class="wb-b cl" id="wbSk" title="Skip level">⏭</button></div>';
  box.querySelectorAll('.wb-l').forEach((b) => b.onclick = () => tapL(+b.dataset.k));
  document.getElementById('wbSh').onclick = () => { if (G.state === 'play') { shuffle(); pick = []; KQ3D.sfx('whoosh'); draw(); } };
  document.getElementById('wbCl').onclick = () => { if (G.state === 'play') { pick.pop(); KQ3D.sfx('tap'); draw(); } };
  document.getElementById('wbGo').onclick = check;
  document.getElementById('wbHi').onclick = hint;
  document.getElementById('wbSk').onclick = () => { if (G.state !== 'play') return; L.words.forEach((w) => found.add(w)); KQ3D.sfx('whoosh'); pick = []; draw(); setTimeout(() => levelDone(true), 1200); };
}
function tapL(k) {
  if (G.state !== 'play') return;
  if (pick.includes(k)) { pick = pick.slice(0, pick.indexOf(k)); } else pick.push(k);
  KQ3D.sfx('pop'); draw();
}
function check() {
  if (G.state !== 'play' || !pick.length) return;
  const w = pick.map((k) => letters[k]).join(''), cur = document.getElementById('wbCur');
  if (L.words.includes(w) && !found.has(w)) {
    found.add(w); const pts = w.length * 10; score += pts; G.score(score); KQ3D.sfx(w.length >= 5 ? 'coin' : 'success');
    G.pop('+' + pts + ' ' + w, innerWidth / 2, 200, '#fde047'); pick = []; draw();
    if (found.size === L.words.length) setTimeout(levelDone, 700);
  } else if (L.bonus.includes(w) && !bonusFound.has(w)) {
    bonusFound.add(w); score += 5; G.score(score); KQ3D.sfx('chime'); G.pop('Bonus ⭐ +5', innerWidth / 2, 200, '#a5f3fc'); pick = []; draw();
  } else {
    cur.classList.add(found.has(w) || bonusFound.has(w) ? 'dup' : 'bad'); KQ3D.sfx(found.has(w) || bonusFound.has(w) ? 'tick' : 'wrong');
    setTimeout(() => { pick = []; draw(); }, 450);
  }
}
function hint() {
  if (G.state !== 'play') return;
  const w = L.words.slice().sort((a, b) => a.length - b.length).find((x) => !found.has(x) && (hints[x] || 0) < x.length - 1);
  if (!w) return;
  hints[w] = (hints[w] || 0) + 1; score = Math.max(0, score - 5); G.score(score); KQ3D.sfx('tap'); draw();
}
function levelDone(skipped) {
  if (G.state !== 'play') return;
  if (!skipped) { score += 50; G.score(score); KQ3D.sfx('levelup'); G.pop('Level clear! +50', null, innerHeight * 0.35, '#bbf7d0'); try { if (window.KQFX) KQFX.celebrate({ power: 0.5 }); } catch (e) {} }
  lvl++;
  if (lvl >= LEVELS.length) setTimeout(() => G.over({ score, title: 'Word master! 🏗️', lines: ['🔤 All ' + LEVELS.length + ' levels'] }), 900);
  else setTimeout(() => { if (G.state === 'play') load(); }, 1200);
}
reset();
</script>
</body></html>
