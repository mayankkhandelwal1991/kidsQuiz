<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="icon" href="../../images/favicon/favicon.ico" sizes="any"><link rel="icon" href="../../images/favicon/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="../../images/favicon/apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Word Ladder</title>
<style>
.wl { position: absolute; inset: 0; display: flex; padding: 72px 10px 16px; gap: 10px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(180deg, #a5f3fc, #e0f2fe 60%, #bbf7d0 60.2%, #86efac); overflow: hidden; }
.wl-lad { position: relative; width: 96px; flex: 0 0 auto; }
.wl-rail { position: absolute; top: 0; bottom: 0; width: 10px; border-radius: 5px; background: #b45309; } .wl-rail.l { left: 14px; } .wl-rail.r { right: 14px; }
.wl-rung { position: absolute; left: 14px; right: 14px; height: 8px; border-radius: 4px; background: #d97706; }
.wl-rung.done { background: #22c55e; }
.wl-rung span { position: absolute; left: 50%; top: -24px; transform: translateX(-50%); font-weight: 800; font-size: 13px; color: #065f46; white-space: nowrap; background: rgba(255,255,255,.85); border-radius: 6px; padding: 0 4px; }
.wl-mon { position: absolute; left: 50%; width: 54px; margin-left: -27px; transition: bottom .6s cubic-bezier(.34,1.4,.64,1); }
.wl-ban { position: absolute; left: 50%; top: -6px; width: 40px; margin-left: -20px; animation: wlBob 1.6s ease-in-out infinite; }
@keyframes wlBob { 50% { transform: translateY(-6px) rotate(10deg); } }
.wl-main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px; min-width: 0; }
.wl-card { background: #fff; border-radius: 26px; padding: 12px; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.12); }
.wl-cur { font-size: 13px; font-weight: 800; color: #64748b; }
.wl-word { font-size: 40px; font-weight: 800; letter-spacing: .14em; color: #0f766e; line-height: 1.1; }
.wl-word b { color: #f59e0b; }
.wl-arrow { font-size: 14px; font-weight: 800; color: #7c3aed; margin: 4px 0; }
.wl-goal { display: inline-flex; align-items: center; gap: 8px; background: #f5f3ff; border-radius: 20px; padding: 6px 14px; animation: wlIn .4s cubic-bezier(.34,1.56,.64,1); }
.wl-goal img { width: 64px; height: 64px; }
@keyframes wlIn { from { transform: scale(.4); opacity: 0; } }
.wl-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wl-o { border: none; border-radius: 18px; padding: 14px 4px; font: 800 26px 'Baloo 2', sans-serif; letter-spacing: .1em; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
.wl-o:active { transform: translateY(3px); }
.wl-o.ok { background: #22c55e !important; } .wl-o.no { background: #ef4444 !important; animation: wlShake .4s; }
@keyframes wlShake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261124c"></script>
<script src="../ads.js"></script>
<script>
/* Word Ladder — change ONE letter to make the pictured word. Each answer is the
   start of the next step, so you really climb a ladder of words. */
const CHAINS = [
  ['CAT', '🐱', [['BAT', '🦇', ['CAP', 'COT', 'CUT']], ['BAG', '🎒', ['BAD', 'BIT', 'HAT']], ['BUG', '🐛', ['BIG', 'BOG', 'RAG']], ['MUG', '☕', ['HUG', 'BUN', 'BUS']]]],
  ['DOG', '🐶', [['LOG', '🪵', ['DIG', 'DOT', 'HOG']], ['FOG', '🌫️', ['LOT', 'LEG', 'BOG']], ['FOX', '🦊', ['FIG', 'FOR', 'FOE']], ['BOX', '📦', ['FIX', 'FAX', 'FOR']]]],
  ['PIG', '🐷', [['PIN', '📌', ['BIG', 'PIT', 'DIG']], ['PAN', '🍳', ['PEN', 'TIN', 'PIT']], ['FAN', '🪭', ['PAT', 'PAD', 'MAN']], ['VAN', '🚐', ['FUN', 'FIN', 'FAT']]]],
  ['HAT', '🎩', [['HUT', '🛖', ['HIT', 'HOT', 'CAT']], ['NUT', '🥜', ['HUG', 'CUT', 'HUM']], ['NET', '🥅', ['NOT', 'CUT', 'NUN']], ['JET', '✈️', ['NEW', 'PET', 'WET']]]],
  ['BEE', '🐝', [['SEE', '👀', ['BET', 'BED', 'FEE']], ['SEA', '🌊', ['SET', 'SEW', 'TEE']], ['TEA', '🍵', ['PEA', 'SET', 'SEW']]]],
  ['CAKE', '🎂', [['LAKE', '🏞️', ['CAVE', 'CAME', 'BAKE']], ['LIKE', '👍', ['LANE', 'LATE', 'MAKE']], ['BIKE', '🚲', ['LIME', 'LINE', 'LIFE']], ['HIKE', '🥾', ['BAKE', 'BITE', 'LIKE']]]],
  ['RING', '💍', [['KING', '👑', ['RANG', 'RUNG', 'SING']], ['WING', '🪽', ['KIND', 'SING', 'RING']], ['WINK', '😉', ['WIND', 'SING', 'WINE']]]]
];
const COLS = ['#f43f5e', '#f59e0b', '#06b6d4', '#8b5cf6'];
const G = KQ3D.init({
  id: 'word_ladder', title: 'Word Ladder', bestKey: 'ladderBest', music: true,
  hero: ['🪜', '🐒', '🍌'], colors: ['#0891b2', '#16a34a'],
  how: [['🖼️', 'Look at the picture — that’s the word to make'], ['🔤', 'Change just ONE letter of your word'], ['🪜', 'Each right word climbs a rung — reach the banana!'], ['⭐', 'Right first time = more points']],
  scoreIcon: '🪜', stars: [80, 140, 180],
  onReset: () => reset()
});
const box = document.createElement('div'); box.className = 'wl'; G.scene.appendChild(box);
let steps, si, score, tries, rights;
function say(t) {
  try { if (localStorage.getItem('kq_muted') === '1') return; } catch (e) {}
  try { if (window.Android && Android.speak) { Android.speak(t, 'en'); return; } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(t.toLowerCase()); u.rate = 0.85; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function reset() {
  const picks = CHAINS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  steps = []; picks.forEach((c) => { let from = c[0]; c[2].forEach((s) => { steps.push({ from, to: s[0], pic: s[1], decoys: s[2], first: s === c[2][0], startPic: c[1] }); from = s[0]; }); });
  si = 0; score = 0; rights = 0; G.score(0); draw();
}
function diffIdx(a, b) { for (let k = 0; k < a.length; k++) if (a[k] !== b[k]) return k; return -1; }
function draw(justWon) {
  const s = steps[si], H = innerHeight - 110, n = steps.length, gap = H / (n + 1);
  tries = 0;
  const lad = '<div class="wl-lad"><div class="wl-rail l"></div><div class="wl-rail r"></div>' +
    steps.map((st, k) => '<div class="wl-rung' + (k < si ? ' done' : '') + '" style="bottom:' + (gap * (k + 1)) + 'px">' + (k < si ? '<span>' + st.to + '</span>' : '') + '</div>').join('') +
    '<img class="wl-ban" src="' + KQ3D.emojiFile('🍌') + '" alt=""><img class="wl-mon" id="wlM" src="' + KQ3D.emojiFile('🐒') + '" alt="" style="bottom:' + (gap * si - 6) + 'px"></div>';
  if (!s) { box.innerHTML = lad; return; }
  const opts = [s.to].concat(s.decoys).sort(() => Math.random() - 0.5);
  box.innerHTML = lad + '<div class="wl-main"><div class="wl-card"><div class="wl-cur">' + (s.first ? 'New ladder! Start word' : 'Your word') + '</div>' +
    '<div class="wl-word">' + s.from + '</div><div class="wl-arrow">⬇ change ONE letter to make…</div>' +
    '<div class="wl-goal"><img src="' + KQ3D.emojiFile(s.pic) + '" alt=""></div></div>' +
    '<div class="wl-opts">' + opts.map((o, k) => '<button type="button" class="wl-o" data-w="' + o + '" style="background:' + COLS[k] + '">' + o + '</button>').join('') + '</div></div>';
  box.querySelectorAll('.wl-o').forEach((b) => b.onclick = () => pickW(b));
}
function pickW(b) {
  if (G.state !== 'play') return;
  const s = steps[si], w = b.dataset.w;
  if (w === s.to) {
    const pts = tries ? 5 : 15; score += pts; G.score(score); if (!tries) rights++;
    b.classList.add('ok'); KQ3D.sfx('success'); say(w);
    const k = diffIdx(s.from, s.to), wd = box.querySelector('.wl-word');
    wd.innerHTML = [...s.to].map((c, j) => j === k ? '<b>' + c + '</b>' : c).join('');
    const r = b.getBoundingClientRect(); G.pop('+' + pts, r.left + r.width / 2, r.top, '#fde047');
    box.querySelectorAll('.wl-o').forEach((x) => { x.disabled = true; });
    si++;
    G.later(() => {
            if (si >= steps.length) { draw(); KQ3D.sfx('win'); setTimeout(() => G.over({ score, title: 'Top of the ladder! 🍌', lines: ['🪜 ' + steps.length + ' rungs', '⭐ ' + rights + ' first-try'] }), 700); }
      else { if (steps[si].first) { KQ3D.sfx('levelup'); G.pop('New ladder! 🪜', null, innerHeight * 0.3, '#bbf7d0'); } draw(); }
    }, 1100);
  } else { tries++; b.classList.add('no'); b.disabled = true; KQ3D.sfx('wrong'); }
}
reset();
</script>
</body></html>
