<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Word Search</title>
<style>
.ws { position: absolute; inset: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 72px 10px 16px; font-family: 'Baloo 2', sans-serif; background: linear-gradient(170deg, #1d4ed8, #3b82f6 55%, #93c5fd); }
.ws-info { color: #fff; font-weight: 800; font-size: 15px; margin-bottom: 6px; }
.ws-board { position: relative; background: #fff; border-radius: 22px; padding: 8px; box-shadow: 0 8px 0 rgba(0,0,0,.15); touch-action: none; }
.ws-grid { display: grid; position: relative; z-index: 1; }
.ws-c { display: grid; place-items: center; font-weight: 800; color: #1e3a8a; user-select: none; }
.ws-svg { position: absolute; inset: 8px; z-index: 0; pointer-events: none; }
.ws-list { width: 100%; max-width: 520px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 10px; }
.ws-w { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,.92); border-radius: 999px; padding: 2px 10px 2px 4px; font-weight: 800; font-size: 14px; color: #1e3a8a; }
.ws-w img { width: 26px; height: 26px; }
.ws-w.got { background: #22c55e; color: #fff; text-decoration: line-through; }
</style>
</head><body>
<script src="../threed/kq3d.js?v=20261123c"></script>
<script src="../ads.js"></script>
<script>
/* Word Search — drag across letters to find the hidden words. 3 levels. */
const THEMES = [
  { icon: '🐾', name: 'Animals', words: [['CAT', '🐱'], ['DOG', '🐶'], ['LION', '🦁'], ['FROG', '🐸'], ['BEAR', '🐻'], ['TIGER', '🐯'], ['ZEBRA', '🦓'], ['PANDA', '🐼'], ['HORSE', '🐴'], ['MONKEY', '🐒'], ['RABBIT', '🐰'], ['TURTLE', '🐢']] },
  { icon: '🍎', name: 'Fruits', words: [['FIG', '🍈'], ['PEAR', '🍐'], ['KIWI', '🥝'], ['LIME', '🍋'], ['MANGO', '🥭'], ['APPLE', '🍎'], ['GRAPE', '🍇'], ['PEACH', '🍑'], ['MELON', '🍉'], ['BANANA', '🍌'], ['CHERRY', '🍒'], ['ORANGE', '🍊']] },
  { icon: '🌈', name: 'Colours', words: [['RED', '🔴'], ['BLUE', '🔵'], ['PINK', '🌸'], ['GOLD', '🥇'], ['GREEN', '🟢'], ['BROWN', '🟤'], ['BLACK', '⚫'], ['WHITE', '⚪'], ['PURPLE', '🟣'], ['ORANGE', '🟠'], ['YELLOW', '🟡'], ['SILVER', '🥈']] },
  { icon: '🏫', name: 'School', words: [['PEN', '🖊️'], ['BAG', '🎒'], ['BOOK', '📚'], ['DESK', '🪑'], ['BELL', '🔔'], ['CHALK', '🧑‍🏫'], ['RULER', '📏'], ['PAINT', '🎨'], ['CLOCK', '⏰'], ['PENCIL', '✏️'], ['CRAYON', '🖍️'], ['ERASER', '🧽']] }
];
const LEVELS = [{ n: 8, words: 5, diag: false }, { n: 9, words: 6, diag: true }, { n: 10, words: 7, diag: true }];
const HL = ['#fca5a5', '#fdba74', '#fde047', '#86efac', '#67e8f9', '#a5b4fc', '#f0abfc'];
const G = KQ3D.init({
  id: 'word_search', title: 'Word Search', bestKey: 'searchBest', music: true,
  hero: ['🔎', '🔤', '⭐'], colors: ['#2563eb', '#7c3aed'],
  how: [['👆', 'Drag across letters in a straight line'], ['🔎', 'Find every word in the list below the grid'], ['↘️', 'From level 2, words can go diagonally too!'], ['⏱️', 'Be quick for a time bonus']],
  scoreIcon: '🔎', stars: [200, 330, 420],
  pick: { label: 'Pick a theme', options: THEMES },
  onReset: (t) => reset(t)
});
const box = document.createElement('div'); box.className = 'ws'; G.scene.appendChild(box);
let theme, lvl, score, grid, place, found, cell, sel, t0;
function say(t) {
  try { if (localStorage.getItem('kq_muted') === '1') return; } catch (e) {}
  try { if (window.Android && Android.speak) { Android.speak(t, 'en'); return; } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(t.toLowerCase()); u.rate = 0.9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) {}
}
function reset(t) { theme = t || THEMES[0]; lvl = 0; score = 0; G.score(0); build(); }
function build() {
  const L = LEVELS[lvl], N = L.n;
  const dirs = [[1, 0], [0, 1]].concat(L.diag ? [[1, 1], [1, -1]] : []);
  let tries = 0;
  do {
    grid = Array.from({ length: N }, () => Array(N).fill('')); place = [];
    const pool = theme.words.filter((w) => w[0].length <= N).sort(() => Math.random() - 0.5);
    for (const [w, e] of pool) {
      if (place.length >= L.words) break;
      for (let k = 0; k < 80; k++) {
        const [dx, dy] = dirs[Math.floor(Math.random() * dirs.length)];
        const x0 = Math.floor(Math.random() * N), y0 = Math.floor(Math.random() * N), x1 = x0 + dx * (w.length - 1), y1 = y0 + dy * (w.length - 1);
        if (x1 < 0 || x1 >= N || y1 < 0 || y1 >= N) continue;
        let ok = true; for (let i = 0; i < w.length; i++) { const c = grid[y0 + dy * i][x0 + dx * i]; if (c && c !== w[i]) { ok = false; break; } }
        if (!ok) continue;
        for (let i = 0; i < w.length; i++) grid[y0 + dy * i][x0 + dx * i] = w[i];
        place.push({ w, e, x0, y0, x1, y1 }); break;
      }
    }
  } while (place.length < L.words && ++tries < 20);
  const AB = 'ABCDEFGHIKLMNOPRSTUWY';
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (!grid[y][x]) grid[y][x] = AB[Math.floor(Math.random() * AB.length)];
  found = new Set(); t0 = performance.now();
  draw();
}
function draw() {
  const N = LEVELS[lvl].n;
  cell = Math.floor(Math.min(innerWidth - 36, 460, innerHeight - 330) / N);
  box.innerHTML = '<div class="ws-info">' + theme.name + ' · Level ' + (lvl + 1) + ' of 3 · ' + found.size + '/' + place.length + ' found</div>' +
    '<div class="ws-board" id="wsB"><svg class="ws-svg" id="wsS" width="' + cell * N + '" height="' + cell * N + '"></svg><div class="ws-grid" style="grid-template-columns:repeat(' + N + ',' + cell + 'px);grid-auto-rows:' + cell + 'px;font-size:' + Math.round(cell * 0.55) + 'px">' +
    grid.map((row) => row.map((c) => '<div class="ws-c">' + c + '</div>').join('')).join('') + '</div></div>' +
    '<div class="ws-list">' + place.map((p) => '<span class="ws-w' + (found.has(p.w) ? ' got' : '') + '"><img src="' + KQ3D.emojiFile(p.e) + '" alt="">' + p.w + '</span>').join('') + '</div>';
  redrawMarks();
  const B = document.getElementById('wsB');
  const at = (e) => { const r = B.getBoundingClientRect(); return { x: Math.floor((e.clientX - r.left - 8) / cell), y: Math.floor((e.clientY - r.top - 8) / cell) }; };
  B.onpointerdown = (e) => { if (G.state !== 'play') return; const p = at(e); if (p.x < 0 || p.y < 0 || p.x >= N || p.y >= N) return; sel = { a: p, b: p }; B.setPointerCapture(e.pointerId); redrawMarks(); KQ3D.sfx('tap'); };
  B.onpointermove = (e) => { if (!sel) return; const p = at(e); p.x = Math.max(0, Math.min(N - 1, p.x)); p.y = Math.max(0, Math.min(N - 1, p.y)); const s = snap(sel.a, p); if (s.x !== sel.b.x || s.y !== sel.b.y) { sel.b = s; redrawMarks(); } };
  B.onpointerup = () => { if (!sel) return; const s = sel; sel = null; check(s); redrawMarks(); };
}
// keep the selection on a straight line (row, column or diagonal)
function snap(a, p) {
  const dx = p.x - a.x, dy = p.y - a.y, adx = Math.abs(dx), ady = Math.abs(dy);
  if (adx > ady * 2) return { x: p.x, y: a.y };
  if (ady > adx * 2) return { x: a.x, y: p.y };
  const m = Math.max(adx, ady); return { x: a.x + Math.sign(dx) * m, y: a.y + Math.sign(dy) * m };
}
function line(p, col, w) {
  const c = (v) => v * cell + cell / 2;
  return '<line x1="' + c(p.x0) + '" y1="' + c(p.y0) + '" x2="' + c(p.x1) + '" y2="' + c(p.y1) + '" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/>';
}
function redrawMarks() {
  const s = document.getElementById('wsS'); if (!s) return;
  let h = place.filter((p) => found.has(p.w)).map((p) => line(p, HL[place.indexOf(p) % HL.length], cell * 0.8)).join('');
  if (sel) h += line({ x0: sel.a.x, y0: sel.a.y, x1: sel.b.x, y1: sel.b.y }, 'rgba(59,130,246,.45)', cell * 0.8);
  s.innerHTML = h;
}
function check(s) {
  const p = place.find((q) => !found.has(q.w) && ((q.x0 === s.a.x && q.y0 === s.a.y && q.x1 === s.b.x && q.y1 === s.b.y) || (q.x1 === s.a.x && q.y1 === s.a.y && q.x0 === s.b.x && q.y0 === s.b.y)));
  if (!p) { if (s.a.x !== s.b.x || s.a.y !== s.b.y) KQ3D.sfx('wrong'); return; }
  found.add(p.w); const pts = p.w.length * 5; score += pts; G.score(score); KQ3D.sfx('success'); say(p.w);
  G.pop('+' + pts + ' ' + p.w, innerWidth / 2, 160, '#fde047');
  draw();
  if (found.size === place.length) {
    const secs = (performance.now() - t0) / 1000, bonus = Math.max(0, Math.round(90 - secs));
    score += 30 + bonus; G.score(score); KQ3D.sfx('levelup'); G.pop('All found! +' + (30 + bonus), null, innerHeight * 0.35, '#bbf7d0');
    try { if (window.KQFX) KQFX.celebrate({ power: 0.5 }); } catch (e) {}
    lvl++;
    if (lvl >= LEVELS.length) setTimeout(() => G.over({ score, title: 'Super searcher! 🔎', lines: [theme.icon + ' ' + theme.name, '🔤 ' + place.length + ' words in the last grid'] }), 1000);
    else G.later(() => { build(); }, 1300);
  }
}
window.addEventListener('resize', () => { if (grid) draw(); });
reset(G.choice);
</script>
</body></html>
