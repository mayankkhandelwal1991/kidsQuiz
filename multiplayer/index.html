<script>
/* Multiplayer Game Zone — online games with friends. Layout lives in games/hub.js.
   Add a game: one entry below + its folder. */
window.KQ_NO_WIDGET = true;
// hub has its own sounds + mute button: don't load the global click-sound module
window.KQFX = window.KQFX || { play: function () {}, celebrate: function () {}, isMuted: function () { try { return localStorage.getItem('kq_muted') === '1'; } catch (e) { return false; } } };
const GAMES=[
 {f:'tic-tack-toe/index.html',id:'tic-tac-toe',ic:'❌⭕',nm:'Tic Tac Toe',how:'Enter your name and tap Play. You\'ll be matched with whoever\'s waiting, or the Computer after 10 seconds. First to get 3 in a row wins!'},
 {f:'connect-four/index.html',id:'connect-four',ic:'🔴',nm:'Four in a Row',how:'Enter your name and tap Play to get matched instantly. Drop discs into columns — first to connect 4 in a row (any direction) wins!'},
 {f:'rock-paper-scissors/index.html',id:'rps',ic:'✊',nm:'Rock Paper Scissors',how:'Enter your name and tap Play. Pick rock, paper, or scissors each round — first to win 3 rounds takes the duel!'},
 {f:'word-duel/index.html',id:'word-duel',ic:'🔤',nm:'Word Duel',how:'Enter your name and tap Play. A scrambled word appears — type the answer before your opponent does. First to 4 points wins!'},
 {f:'typing-race/index.html',id:'typing-race',ic:'⌨️',nm:'Typing Speed Race',how:'Enter your name and tap Play. Both racers type the same passage — fastest, most accurate typer to the finish wins!'},
 {f:'memory-match/index.html',id:'memory-match',ic:'🧠',nm:'Memory Match',how:'Enter your name and tap Play. Take turns flipping two cards — match a pair and go again. Most pairs when the board clears wins!'},
 {f:'reaction-duel/index.html',id:'reaction-duel',ic:'⚡',nm:'Reaction Duel',how:'Enter your name and tap Play. Wait for the panel to flash green, then tap as fast as you can — first to win 3 rounds wins!'},
 {f:'trivia-battle/index.html',id:'trivia-battle',ic:'❓',nm:'Trivia Battle',how:'Enter your name and tap Play. Answer multiple-choice questions — fastest correct answer scores. First to 5 points wins!'},
 {f:'dots-and-boxes/index.html',id:'dots-and-boxes',ic:'🔲',nm:'Dots & Boxes',how:'Enter your name and tap Play. Take turns drawing lines between dots — complete a box to score and go again. Most boxes wins!'},
 {f:'battleship/index.html',id:'battleship',ic:'🚢',nm:'Battleship',how:'Enter your name and tap Play. Your fleet is placed automatically — take turns firing at the enemy grid. Sink all their ships to win!'},
 {f:'pong-duel/index.html',id:'pong-duel',ic:'🏓',nm:'Ping Pong Duel',how:'Enter your name and tap Play. Drag your paddle at the bottom (or use ← →) to hit the ball back — first to 7 points wins!'},
 {f:'space-blaster/index.html',id:'space-blaster',ic:'🚀',nm:'Space Shooter Duel',how:'Enter your name and tap Play. Asteroids fall down the same field for both of you — tap the fastest to blast them first. First to 15 wins!',isNew:true},
 {f:'blaster-arena/index.html',id:'blaster-arena',ic:'🔫',nm:'Blaster Arena',how:'Enter your name and tap Play. Move with WASD/arrows or the on-screen pad, then tap the arena to fire foam bolts. First to 5 hits wins!',isNew:true},
 {f:'basketball-shootout/index.html',id:'basketball-shootout',ic:'🏀',nm:'Hoops Shootout',how:'Enter your name and tap Play. Tap when the marker hits the glowing zone to sink a basket. Most baskets in 45 seconds wins!',isNew:true},
 {f:'bubble-shooter/index.html',id:'bubble-shooter',ic:'🫧',nm:'Bubble Shooter Duel',how:'Enter your name and tap Play. Tap to aim and pop 3+ matching bubbles on your own board. First to 120 points wins!',isNew:true},
 {f:'archery-duel/index.html',id:'archery-duel',ic:'🏹',nm:'Archery Duel',how:'Enter your name and tap Play. A crosshair drifts across the target — tap the instant it\'s on the bullseye. Best of 5 rounds wins!',isNew:true},
 {f:'snake-duel/index.html',id:'snake-duel',ic:'🐍',nm:'Snake Duel',how:'Enter your name and tap Play. Steer your snake with arrows, swipes, or the on-screen pad — crash into a wall, yourself, or your rival and they score. First to 5 round wins takes the duel!',isNew:true},
 {f:'wordle-duel/index.html',id:'wordle-duel',ic:'🟩',nm:'Wordle Duel',how:'Enter your name and tap Play. You and your rival guess the same secret 5-letter word — green means right spot, yellow means wrong spot. First to solve 2 words wins!',isNew:true},
 {f:'whack-a-mole/index.html',id:'whack-a-mole',ic:'🔨',nm:'Whack-a-Mole',how:'Enter your name and tap Play. The same mole pops up for both of you — tap it first to score. Most whacks when the 30-second clock runs out wins!',isNew:true},
 {f:'doodle-guess/index.html',id:'doodle-guess',ic:'✏️',nm:'Doodle Guess',how:'Enter your name and tap Play. Take turns drawing a secret word while the other player races to guess it. Roles swap each round — most correct guesses after 6 rounds wins!',isNew:true},
 {f:'math-blitz/index.html',id:'math-blitz',ic:'➕',nm:'Math Blitz',how:'Enter your name, pick a difficulty, and tap Play. Same math question for both of you — fastest correct answer scores. First to 7 points wins!',isNew:true},
 {f:'ludo-royale/index.html',id:'ludo-royale',ic:'🎲',nm:'Ludo Royale',how:'Enter your name and tap Play to join a room of 2-4 players. Once at least 2 have joined, anyone can tap Start. Roll the dice, race all 4 tokens home, and capture opponents along the way!',isNew:true,multi:true},
 {f:'trivia-party/index.html',id:'trivia-party',ic:'🎉',nm:'Trivia Party',how:'Enter your name and tap Play to join a room of 2-8 players. Once at least 2 have joined, anyone can tap Start. Same question for everyone — fastest correct answer scores the most across 8 rounds!',isNew:true,multi:true,playerRange:'2-8'},
 {f:'red-light-green-light/index.html',id:'red-light-green-light',ic:'🚦',nm:'Red Light, Green Light',how:'Enter your name and tap Play to join a room of 2-8 players. Tap fast to race forward on green — freeze the instant it turns red or you\'re out. First to the finish (or last one standing) wins!',isNew:true,multi:true,playerRange:'2-8'},
];
KQHub.render({
  mode: 'multi', base: '../', boardCat: 'multi', colorByTab: false,
  title: 'Play with Friends', subtitle: 'Online games for 2 or more players!',
  tabs: [{ id: 'two', label: '2 Players', icon: '👥' }, { id: 'party', label: 'Party (2–8)', icon: '🎉' }],
  games: GAMES.map(function (g) {
    return { id: g.id, file: g.f, icon: g.ic, title: g.nm, how: g.how, tab: g.multi ? 'party' : 'two',
             badge: g.isNew ? '⭐ NEW' : '', players: g.playerRange || (g.multi ? '2-4' : '2') };
  })
});

/* Play Families: a grown-up can switch online play off (For parents), and children see a
   short "be safe online" reminder before playing with others (once per child). */
(function () {
  var off = false, seen = false;
  try { off = localStorage.getItem('kq_friends_off') === '1'; seen = localStorage.getItem('kq_safety_seen') === '1'; } catch (e) {}
  if (!off && seen) return;
  var e = function (cp) { return '<img src="../images/emoji/' + cp + '.svg" alt="" style="width:36px;height:36px;flex:0 0 auto">'; };
  var o = document.createElement('div');
  o.style.cssText = 'position:fixed;inset:0;z-index:2147483600;background:rgba(30,16,70,.8);display:flex;align-items:center;justify-content:center;padding:16px;font-family:"Baloo 2",system-ui,sans-serif';
  var tip = function (cp, t) { return '<div style="display:flex;gap:10px;align-items:center;text-align:left;background:#f5f3ff;border-radius:16px;padding:8px 10px;margin-top:8px;font-weight:800;font-size:15px;line-height:1.25">' + e(cp) + '<span>' + t + '</span></div>'; };
  o.innerHTML = '<div style="background:#fff;border-radius:26px;max-width:420px;width:100%;padding:18px 16px;text-align:center;color:#1e1b4b;box-shadow:0 20px 50px rgba(0,0,0,.35)">' +
    (off
      ? e('1f6ab') + '<h2 style="margin:6px 0 4px;font-size:22px">Play with friends is off</h2><p style="margin:0;color:#6b7280;font-weight:700">A grown-up turned it off. Ask them, or play the other games!</p>' +
        '<button id="kqSafeGo" style="margin-top:14px;width:100%;border:none;border-radius:18px;padding:12px;font:800 18px \'Baloo 2\',sans-serif;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);cursor:pointer">🏠 Back home</button>'
      : '<h2 style="margin:0 0 2px;font-size:22px">Be safe online! 🛡️</h2><p style="margin:0;color:#6b7280;font-weight:700">Before you play with others:</p>' +
        tip('1f9d2', 'Use only your first name or a nickname.') +
        tip('1f6ab', 'Never tell your address, school, phone number or send photos.') +
        tip('1f46a', 'If something feels wrong, stop and tell a grown-up.') +
        '<button id="kqSafeGo" style="margin-top:14px;width:100%;border:none;border-radius:18px;padding:12px;font:800 18px \'Baloo 2\',sans-serif;color:#fff;background:linear-gradient(135deg,#22c55e,#16a34a);cursor:pointer">I will be safe! 👍</button>') + '</div>';
  document.body.appendChild(o);
  try { if (!off && typeof Android !== 'undefined' && Android.speak && localStorage.getItem('kq_muted') !== '1') Android.speak('Be safe online! Use only your first name. Never tell your address, school or phone number. If something feels wrong, tell a grown-up.', 'en'); } catch (er) {}
  document.getElementById('kqSafeGo').onclick = function () {
    if (off) { location.href = '../quiz-home.html'; return; }
    try { localStorage.setItem('kq_safety_seen', '1'); } catch (er) {}
    o.remove();
  };
})();
</script>
