<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Visiting Places in India</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:#eef3f8;color:#172033}
.app{max-width:1500px;margin:auto;padding:18px}
header{background:#0b3b73;color:#fff;border-radius:16px;padding:18px 22px;margin-bottom:14px;box-shadow:0 8px 25px #0002}
header h1{margin:0 0 5px;font-size:28px} header p{margin:0;opacity:.85}
.layout{display:grid;grid-template-columns:350px 1fr;gap:16px}
.panel,.map-card{background:#fff;border-radius:16px;box-shadow:0 5px 20px #0001;border:1px solid #dfe6ef}
.panel{padding:18px;height:max-content;position:sticky;top:12px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 6px}
input,button,textarea{font:inherit} input,textarea{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700}
.primary{background:#1264d6;color:#fff}.add-btn{width:100%;margin-top:10px;min-height:44px} .green{background:#16834a;color:#fff} .gray{background:#e8edf3;color:#172033}
.row{display:flex;gap:8px} .row>*{flex:1}
.small{font-size:12px;color:#667085;line-height:1.4}
.autocomplete{position:relative}.suggestions{position:absolute;left:0;right:0;top:100%;z-index:30;background:#fff;border:1px solid #cbd5e1;border-radius:0 0 10px 10px;box-shadow:0 8px 18px #0002;max-height:260px;overflow:auto}.suggestion{padding:9px 11px;border-bottom:1px solid #edf0f4;cursor:pointer;font-size:13px}.suggestion:hover{background:#f1f6ff}.suggestion b{display:block;color:#172033}.suggestion small{color:#667085}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
#placeList{margin-top:14px;max-height:430px;overflow:auto;border-top:1px solid #e5e7eb}
.place{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:1px solid #edf0f4;font-size:13px}
.place span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{padding:4px 7px;background:#fee2e2;color:#991b1b}
.map-card{padding:10px;overflow:hidden}
.map-wrap{position:relative;width:100%;overflow:hidden;border-radius:12px;background:#d9edf8}
#mapSvg{display:block;width:100%;height:auto}
#statesG path{transition:fill .6s}
#markers{position:absolute;inset:0;pointer-events:none}
.marker{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;z-index:5}
.pin{width:24px;height:24px;background:#e53935;border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px #0005}
.pin::after{content:"";position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;left:5px;top:5px}
.marker-label{position:absolute;left:18px;top:-4px;background:#fff;border:2px solid #e53935;border-radius:8px;padding:3px 7px;white-space:nowrap;font-weight:800;font-size:12px;box-shadow:0 2px 6px #0003;transform:rotate(0deg)}
.badge{display:inline-block;background:#e8f0ff;color:#1550a5;padding:3px 7px;border-radius:99px;font-size:11px;font-weight:800;margin-top:6px}
.notice{padding:10px;background:#fff8e6;border:1px solid #f3d58a;border-radius:10px;font-size:12px;line-height:1.45;margin-top:10px}
.ai{margin-top:16px;padding-top:14px;border-top:1px solid #e5e7eb}
.status{font-size:12px;margin-top:8px;color:#52606d;min-height:18px}
@media(max-width:900px){
  .app{padding:10px}
  header{padding:15px;border-radius:13px}
  header h1{font-size:22px}
  .layout{grid-template-columns:1fr;gap:10px}
  .panel{position:static;padding:14px}
  .map-card{padding:6px;border-radius:13px}
  .map-wrap{border-radius:9px}
  .actions{grid-template-columns:1fr 1fr}
  #placeList{max-height:260px}
  .marker-label{font-size:9px;padding:2px 4px;left:13px;top:-2px;border-width:1px}
  .pin{width:18px;height:18px;border-width:2px}
  .pin::after{width:5px;height:5px;left:4px;top:4px}
  .add-btn{min-height:46px;font-size:16px}
  input{min-height:44px;font-size:16px}
}
@media(max-width:480px){
  .app{padding:6px}
  header h1{font-size:19px}
  header p{font-size:12px}
  .panel{padding:11px}
  .actions{grid-template-columns:1fr}
  .map-card{padding:3px}
  .marker-label{display:none}
  .pin{width:15px;height:15px}
}
.share-title{font-size:12px;font-weight:800;color:#52606d;margin:12px 0 0}
button.wa{background:#25d366;color:#fff}
button.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7);color:#fff}
.marker-photo{position:absolute;right:11px;bottom:2px;width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px #0005;overflow:hidden;background:linear-gradient(135deg,#ffd86b,#ff8a5c);display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1}
.marker-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kid-overlay{position:fixed;inset:0;z-index:9999;background:rgba(40,20,90,.45);display:flex;align-items:center;justify-content:center;padding:18px}
.kid-box{font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Baloo 2",cursive,sans-serif;background:#fffbe8;border:5px dashed #ff7eb6;border-radius:28px;padding:20px 20px 18px;max-width:330px;width:100%;text-align:center;box-shadow:0 10px 0 #ffcf5c,0 18px 30px #0004;animation:kidPop .45s cubic-bezier(.3,1.7,.5,1)}
.kid-emoji{font-size:54px;line-height:1;display:inline-block;animation:kidWiggle 1s ease-in-out infinite}
.kid-msg{font-size:18px;font-weight:800;color:#4a2a8a;margin:10px 0 16px;line-height:1.35;word-break:break-word}
.kid-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.kid-btns button{font-family:inherit;font-size:16px;font-weight:800;border:0;border-radius:999px;padding:11px 20px;cursor:pointer;color:#fff;width:auto;flex:1 1 110px}
.kid-yes{background:#33c26b;box-shadow:0 5px 0 #1f8f4a}
.kid-no{background:#ff5d6c;box-shadow:0 5px 0 #c93645}
.kid-btns button:active{transform:translateY(4px);box-shadow:none}
@keyframes kidPop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes kidWiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@media (max-width:700px){.marker-photo{width:26px;height:26px;right:8px;font-size:13px;border-width:1px}}
@media (prefers-reduced-motion:reduce){.kid-box,.kid-emoji{animation:none}}
select{font:inherit;width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff;margin-top:8px}
.seg{display:flex;gap:6px;margin-top:8px}
.seg button{flex:1;background:#eef2f7;color:#475467;padding:9px 6px;font-size:13px}
.seg button.on[data-v="visited"]{background:#1faa59;color:#fff}
.seg button.on[data-v="wish"]{background:#f5b301;color:#3b2a00}
.marker.visited .pin{background:#1faa59}.marker.wish .pin{background:#f5b301}
.marker.visited .marker-label{border-color:#1faa59}.marker.wish .marker-label{border-color:#f5b301}
.marker-label small{font-weight:700;color:#667085;margin-left:3px}
.marker-cat{position:absolute;right:36px;bottom:0;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0005;font-size:11px;line-height:18px;text-align:center}
.box{margin-top:14px;padding:11px;border:1px solid #e3e9f1;border-radius:12px;background:#f8fafc}
.box h4{margin:0 0 6px;font-size:13px}
.bar{height:9px;background:#e3e9f1;border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#1faa59,#8fd14f);border-radius:99px;transition:width .6s}
.stat{font-size:13px;font-weight:700;margin-top:3px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bdg{font-size:11px;font-weight:800;padding:5px 8px;border-radius:99px;background:#fff3c4;border:2px solid #ffcf5c;color:#6a4a00;cursor:pointer;white-space:nowrap}
.bdg.locked{background:#eef1f5;border-color:#dde3ea;color:#98a2b3;filter:grayscale(1)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:#eef2f7;color:#344054;padding:6px 9px;border-radius:99px;font-size:12px}
.chip.on{background:#0b3b73;color:#fff}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;margin:10px 0 0;cursor:pointer}
.toggle input{width:auto;min-height:0}
.next-btn{width:100%;margin-top:8px;background:linear-gradient(90deg,#7b5cff,#ff7eb6);color:#fff;min-height:42px}
.place{cursor:pointer;gap:6px}.place:hover{background:#f5f8fc}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.visited{background:#1faa59}.dot.wish{background:#f5b301}
.place small{color:#98a2b3;margin-left:4px}
.kid-card{max-width:390px;max-height:92vh;overflow:auto;position:relative;text-align:center}
.kid-card h3{margin:6px 0 0;color:#4a2a8a;font-size:21px}
.kid-card .sub{font-size:13px;color:#7a5cc0;font-weight:700;margin-bottom:8px}
.kid-card label{text-align:left;color:#4a2a8a;margin:10px 0 4px}
.kid-card input,.kid-card textarea,.kid-card select{font-family:inherit;border:2px solid #e3c8ff;border-radius:14px;background:#fff}
.kid-card textarea{resize:vertical;min-height:58px}
.kid-x{position:absolute;right:8px;top:8px;width:32px;height:32px;padding:0;border-radius:50%;background:#ffe0ea;color:#c2185b;font-size:16px}
.kid-photo{width:96px;height:96px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 #ffcf5c,0 6px 14px #0003;margin:4px auto 0;overflow:hidden;background:linear-gradient(135deg,#ffd86b,#ff8a5c);display:flex;align-items:center;justify-content:center;font-size:44px;position:relative}
.kid-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.kid-mini{font-family:inherit;font-size:13px;font-weight:800;border-radius:99px;padding:8px 12px;background:#e9e0ff;color:#4a2a8a;margin:4px 3px 0}
.kid-fact{margin-top:10px;padding:10px 12px;background:#e8fff1;border:2px dashed #33c26b;border-radius:16px;font-size:14px;font-weight:700;color:#14532d;text-align:left;line-height:1.4}
.kid-row{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;border-radius:16px;background:#fff;border:2px solid #e3c8ff;margin-top:8px}
.kid-row .em{font-size:28px}.kid-row b{color:#4a2a8a}.kid-row small{display:block;color:#6b7280;font-weight:700;line-height:1.3}
.kid-row>div{flex:1;min-width:0}
@media (max-width:700px){.marker-cat{right:22px;width:13px;height:13px;font-size:8px;line-height:13px}}
#mapInner{position:relative;transform-origin:0 0;will-change:transform}
.marker{transform:translate(-50%,-100%) scale(var(--inv,1));transform-origin:50% 100%}
.map-wrap{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.map-wrap.zoomed{cursor:grab}.map-wrap.dragging{cursor:grabbing}
.map-wrap.zoomed .marker-label{display:block}
.zoom{position:absolute;right:10px;bottom:10px;z-index:20;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;padding:0;border-radius:50%;background:#fff;color:#0b3b73;font-size:22px;line-height:1;box-shadow:0 2px 8px #0004}
.zoom button:disabled{opacity:.45;cursor:default}
.zoom-hint{position:absolute;left:10px;bottom:10px;z-index:20;background:#ffffffd9;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;color:#475467;pointer-events:none}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🇮🇳 My Visiting Places in India</h1>
  <p>Mark places you visited or dream of, colour in states, win badges, and share your travel map.</p>
</header>

<div class="layout">
<aside class="panel">
  <h3 style="margin:0">Add a place</h3>
  <label>Place / City / State</label>
  <div class="autocomplete">
    <input id="placeName" autocomplete="off" placeholder="e.g. Puri, Varanasi, Somnath">
    <div id="suggestions" class="suggestions" hidden></div>
  </div>
  <div class="seg" id="statusSeg">
    <button type="button" class="on" data-v="visited">✅ Visited</button>
    <button type="button" data-v="wish">⭐ Wishlist</button>
  </div>
  <select id="catSel" aria-label="Category"></select>
  <button class="primary add-btn" onclick="addPlace()">＋ Add Place</button>
  <div class="status" id="aiStatus"></div>

  <div class="box">
    <h4>🗺️ My progress</h4>
    <div class="stat" id="stateStat">0 of 28 states visited</div>
    <div class="bar"><i id="stateBar"></i></div>
    <div class="stat" id="kmStat">🛣️ 0 km travelled</div>
    <label class="toggle"><input type="checkbox" id="journeyToggle" checked> Show journey line on map</label>
    <div class="badges" id="badges"></div>
    <button class="next-btn" onclick="whereNext()">🧭 Where should I go next?</button>
  </div>

  <label for="travellerName">Your name (shown on the picture)</label>
  <input id="travellerName" maxlength="24" autocomplete="off" placeholder="e.g. Mayank">

  <div class="actions">
    <button class="green" onclick="downloadPNG()">⬇ Download PNG</button>
    <button class="gray" onclick="resetPlaces()">↺ Reset</button>
  </div>
  <div class="share-title">Share my map</div>
  <div class="actions" style="margin-top:6px">
    <button class="wa" onclick="shareMap('whatsapp')">🟢 WhatsApp</button>
    <button class="ig" onclick="shareMap('instagram')">📸 Instagram</button>
  </div>

  <div class="share-title">Show on map</div>
  <div class="chips" id="filters"></div>

  <div class="badge" id="count">0 places</div>
  <div id="placeList"></div>
</aside>

<main class="map-card">
  <div class="map-wrap" id="mapWrap">

const GROQ_API_KEY = "PASTE_YOUR_GROQ_API_KEY_HERE";
const GROQ_MODEL = "qwen/qwen3.8-27b";
const DEFAULT_PLACES = [];   // the map starts empty
let places = JSON.parse(localStorage.getItem("myIndiaPlacesV2") || "null") || JSON.parse(JSON.stringify(DEFAULT_PLACES));
const MAP_W=1300, MAP_H=1425;
const mapSvg=document.getElementById("mapSvg");
const statePaths=[...document.querySelectorAll("#statesG path")];
const UTS=["Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry"];

// Categories (icon + label) and words that help guess the category of a place.
const CATS={temple:["🛕","Temple"],beach:["🏖️","Beach"],hill:["⛰️","Hill station"],fort:["🏰","Fort & monument"],wildlife:["🐯","Wildlife"],city:["🏙️","City & other"]};
const CAT_HINTS={
  wildlife:"kaziranga ranthambore sawaimadhopur bharatpur corbett sasangir girforest sundarban bandhavgarh kanha periyar nationalpark sanctuary tigerreserve safari wildlife",
  beach:"goa puri kovalam gokarna pondicherry puducherry portblair daman mahabalipuram kanyakumari alappuzha alleppey lakshadweep andaman beach island varkala digha",
  hill:"shimla manali darjeeling ooty munnar nainital mussoorie gulmarg pahalgam srinagar kodaikanal mountabu gangtok shillong dalhousie dharamshala kullu auli almora kasauli coorg lonavala mahabaleshwar tawang cherrapunji wayanad kargil sikkim himachal uttarakhand ladakh hillstation valley",
  temple:"varanasi tirupati somnath dwarka kedarnath badrinath amarnath vaishnodevi rameswaram madurai ujjain omkareshwar shirdi mathura vrindavan govardhan ayodhya haridwar rishikesh bodhgaya goldentemple konark kanchipuram thanjavur pushkar prayagraj khajuraho amritsar temple mandir dham jyotirlinga gurudwara dargah",
  fort:"jaipur jodhpur jaisalmer chittorgarh udaipur gwalior agra tajmahal bikaner hampi ajanta ellora jhansi alwar statueofunity fort palace mahal qila caves tomb minar"
};
function guessCat(name){
  const n=norm(name);
  if(n==="leh" || n==="diu" || n==="gaya") return n==="leh"?"hill":n==="diu"?"beach":"temple";
  for(const c in CAT_HINTS){ if(CAT_HINTS[c].split(" ").some(w=>n.includes(w))) return c; }
  return "city";
}
function catOf(p){return CATS[p.cat]?p.cat:"city";}
function catIcon(p){return CATS[catOf(p)][0];}
places.forEach(p=>{ if(p.status!=="wish") p.status="visited"; if(!CATS[p.cat]) p.cat=guessCat(p.name); });

let fStatus="all", fCat="all";             // what is shown on the map
function shownPlaces(){return places.filter(p=>(fStatus==="all"||p.status===fStatus)&&(fCat==="all"||catOf(p)===fCat));}

// Map picture bounds (Mercator) — pins are placed from real latitude/longitude.
const GEO = {minLon:66.5, maxLon:98.5, maxLat:37.8, minLat:5.8};
function mercY(lat){return Math.log(Math.tan(Math.PI/4 + lat*Math.PI/360));}
function project(lat, lon) {
  const x = (lon-GEO.minLon)/(GEO.maxLon-GEO.minLon)*100;
  const y = (mercY(GEO.maxLat)-mercY(lat))/(mercY(GEO.maxLat)-mercY(GEO.minLat))*100;
  return {x:Math.min(99,Math.max(1,x)), y:Math.min(99,Math.max(1,y))};
}

function isOnPicture(p){return false;}
function norm(t){return String(t).toLowerCase().replace(/[^a-z0-9]/g,"");}
function findDuplicate(name,lat,lon){
  return places.find(p=>norm(p.name)===norm(name) || (Math.abs(p.lat-lat)<0.03 && Math.abs(p.lon-lon)<0.03));
}

function photoOf(p){return p.photo || p.img || "";}

// Which state / union territory a place is in (found from the map shapes).
function stateOf(p){
  if(typeof p.state==="string") return p.state;
  let found="";
  try{
    const q=project(p.lat,p.lon), x=q.x*MAP_W/100, y=q.y*MAP_H/100, pt=mapSvg.createSVGPoint();
    const tries=[[0,0]];
    for(const r of [6,12,20]) for(let a=0;a<8;a++) tries.push([r*Math.cos(a*Math.PI/4),r*Math.sin(a*Math.PI/4)]);
    for(const t of tries){
      pt.x=x+t[0]; pt.y=y+t[1];
      const hit=statePaths.find(el=>el.isPointInFill(pt));
      if(hit){ found=hit.dataset.n; break; }
    }
  }catch(e){ return ""; }
  p.state=found;
  return found;
}

function haversine(a,b){
  const R=6371, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLon=(b.lon-a.lon)*r;
  const h=Math.sin(dLat/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
// Visited places in travel order: by year when given, otherwise in the order they were added.
function journeyPlaces(){
  return places.filter(p=>p.status==="visited").map((p,i)=>({p,i}))
    .sort((a,b)=>((a.p.year||9999)-(b.p.year||9999)) || (a.i-b.i)).map(x=>x.p);
}
function getStats(){
  const visited=places.filter(p=>p.status==="visited");
  const regions=new Set(visited.map(stateOf).filter(Boolean));
  const j=journeyPlaces(); let km=0;
  for(let i=1;i<j.length;i++) km+=haversine(j[i-1],j[i]);
  const cat={}; visited.forEach(p=>{cat[catOf(p)]=(cat[catOf(p)]||0)+1;});
  return {v:visited.length, w:places.length-visited.length, regions,
    states:[...regions].filter(n=>!UTS.includes(n)).length, uts:[...regions].filter(n=>UTS.includes(n)).length,
    km:Math.round(km), cat, mem:visited.filter(p=>p.note||p.photo).length, journey:j};
}

const BADGES=[
  {id:"first",e:"🎒",n:"First Step",need:"Add your first visited place",t:s=>s.v>=1},
  {id:"five",e:"🖐️",n:"High Five",need:"Visit 5 places",t:s=>s.v>=5},
  {id:"ten",e:"🔟",n:"10 Places!",need:"Visit 10 places",t:s=>s.v>=10},
  {id:"champ",e:"🏆",n:"Travel Champ",need:"Visit 25 places",t:s=>s.v>=25},
  {id:"hill",e:"⛰️",n:"Mountain Lover",need:"Visit 3 hill stations",t:s=>(s.cat.hill||0)>=3},
  {id:"beach",e:"🏖️",n:"Beach Explorer",need:"Visit 3 beaches",t:s=>(s.cat.beach||0)>=3},
  {id:"temple",e:"🛕",n:"Temple Trail",need:"Visit 3 temples",t:s=>(s.cat.temple||0)>=3},
  {id:"fort",e:"🏰",n:"Fort Hunter",need:"Visit 3 forts or monuments",t:s=>(s.cat.fort||0)>=3},
  {id:"wild",e:"🐯",n:"Jungle Buddy",need:"Visit 2 wildlife places",t:s=>(s.cat.wildlife||0)>=2},
  {id:"hop",e:"🦘",n:"State Hopper",need:"Visit 5 different states",t:s=>s.states>=5},
  {id:"bharat",e:"🇮🇳",n:"Bharat Darshan",need:"Visit 15 different states",t:s=>s.states>=15},
  {id:"road",e:"🛣️",n:"Road Warrior",need:"Travel 5,000 km",t:s=>s.km>=5000},
  {id:"dream",e:"💭",n:"Big Dreamer",need:"Put 3 places on your wishlist",t:s=>s.w>=3},
  {id:"memory",e:"📸",n:"Memory Keeper",need:"Add a note or your own photo to 3 places",t:s=>s.mem>=3}
];
let earnedBadges=null;       // null until the first render, so old badges do not pop up again on page load
let badgeQueue=Promise.resolve();
function updateBadges(st){
  const now=BADGES.filter(b=>b.t(st)).map(b=>b.id);
  if(earnedBadges){
    BADGES.filter(b=>now.includes(b.id) && !earnedBadges.includes(b.id)).forEach(b=>{
      badgeQueue=badgeQueue.then(()=>kidPopup("You won a new badge: "+b.n+"!",{emoji:b.e,yes:"Woohoo! 🥳",no:null}));
    });
  }
  earnedBadges=now;
  document.getElementById("badges").innerHTML=BADGES.map(b=>{
    const got=now.includes(b.id);
    return '<span class="bdg'+(got?'':' locked')+'" title="'+escapeHtml(b.need)+'" onclick="badgeInfo(\''+b.id+'\')">'+(got?b.e:'🔒')+' '+escapeHtml(b.n)+'</span>';
  }).join("");
}
function badgeInfo(id){
  const b=BADGES.find(x=>x.id===id), got=earnedBadges && earnedBadges.includes(id);
  kidSay(b.n+(got?" — you got it! ":" — how to win: ")+b.need+".",got?b.e:"🔒");
}

function titleText(){
  const n=(document.getElementById("travellerName").value||"").trim();
  return n ? n+(/s$/i.test(n)?"'":"'s")+" Visiting Places in India" : "My Visiting Places in India";
}

function render() {
  const layer = document.getElementById("markers");
  const shown=shownPlaces();
  layer.innerHTML = "";
  shown.forEach(p=>{
    const q=project(p.lat,p.lon), ph=photoOf(p);
    const el=document.createElement("div");
    el.className="marker "+p.status;

    ? places.length+" place"+(places.length===1?"":"s")+(st.w?" · "+st.v+" visited, "+st.w+" wishlist":"")
    : "Showing "+shown.length+" of "+places.length+" places";

  catch(e){ console.warn(e); kidSay("Uh-oh! Your browser storage is full. Try removing some of your own photos.","📦"); }

}

const imgPending=new Set();
async function findPlaceImage(name){
  const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=pageimages&piprop=thumbnail&pithumbsize=200&generator=search&gsrlimit=4&gsrsearch="+encodeURIComponent(name+" India");
  const r=await fetch(url);
  const d=await r.json();
  const pages=Object.values(d.query?.pages||{}).sort((a,b)=>a.index-b.index);
  const hit=pages.find(x=>x.thumbnail && x.thumbnail.source);
  return hit ? hit.thumbnail.source : "";
}
async function loadPlaceImage(p){
  if(imgPending.has(p)) return;
  imgPending.add(p);
  try{
    p.img=await findPlaceImage(p.name);   // "" = no photo exists, keep emoji icon
    if(places.includes(p)) render();
  }catch(e){
    console.warn("Photo lookup failed for "+p.name+"; will retry next time.",e);
  }
}

function localSuggest(q){
  const k=norm(q); if(!k) return [];
  const starts=[], has=[];
  for(const p of LOCAL_PLACES){
    const n=norm(p.main);
    if(n.startsWith(k)) starts.push(p); else if(k.length>=3 && (n.includes(k) || norm(p.sub).startsWith(k))) has.push(p);
  }
  return starts.concat(has).slice(0,6);
}
function mergeSuggestions(a,b){
  const seen=new Set(), out=[];
  for(const x of a.concat(b)){ const k=norm(x.main); if(!k || seen.has(k)) continue; seen.add(k); out.push(x); }
  return out.slice(0,8);
}

function groqReady(){return !!GROQ_API_KEY && GROQ_API_KEY.indexOf("PASTE_YOUR")!==0;}
const suggestCache=new Map();

// Calls Groq; if the chosen model is not available it automatically tries the next one.
let groqModels=[GROQ_MODEL,"llama-3.3-70b-versatile","llama-3.1-8b-instant"].filter((m,i,a)=>m && a.indexOf(m)===i);
async function groqChat(messages,maxTokens,signal){
  let lastErr=null;
  for(const model of groqModels.slice()){
    const r=await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST",
      signal,
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_API_KEY},
      body:JSON.stringify({model,messages,temperature:0.1,max_tokens:maxTokens,response_format:{type:"json_object"}})
    });
    const data=await r.json().catch(()=>({}));
    if(r.ok){
      groqModels=[model].concat(groqModels.filter(m=>m!==model));   // remember the model that works
      return JSON.parse(data.choices?.[0]?.message?.content || "{}");
    }
    lastErr=new Error(data.error?.message || ("Groq API request failed ("+r.status+")."));
    if(r.status===401 || r.status===429) break;                     // wrong key / rate limit: other models won't help
  }
  throw lastErr || new Error("Groq API request failed.");
}

// Ask Groq for India place names matching what the user has typed so far.
async function groqSuggest(q,signal){
  const out=await groqChat([
    {role:"system",content:"You are an autocomplete engine for places in India. Return only valid JSON."},
    {role:"user",content:`The user is typing an India place name. Typed so far: "${q}"

Suggest up to 6 real places in India (cities, towns, states, temples, tourist attractions) whose name starts with or closely matches the typed text, most well-known first. Tolerate spelling mistakes.

Return ONLY JSON:
{"suggestions":[{"name":"place name","state":"state or union territory","lat":0.0000,"lon":0.0000,"category":"temple|beach|hill|fort|wildlife|city"}]}

Rules:
- Only places inside India (lat 5-38, lon 65-100).
- No duplicates, no markdown, no explanation.`}
  ],600,signal);
  const list=out.suggestions;
  return (Array.isArray(list)?list:[]).map(x=>({main:String(x.name||"").trim(),sub:String(x.state||"").trim(),lat:Number(x.lat),lon:Number(x.lon),cat:String(x.category||"").trim()}))
    .filter(x=>x.main && x.lat>=5 && x.lat<=38 && x.lon>=65 && x.lon<=100);
}

// Free place search made for autocomplete (used when Groq is not set up or fails).
async function photonSuggest(q,signal){
  const r=await fetch("https://photon.komoot.io/api/?limit=8&lang=en&bbox=68,6,97.5,37.5&q="+encodeURIComponent(q),{signal});
  const data=await r.json();
  return (data.features||[]).filter(f=>f.properties && f.properties.countrycode==="IN" && f.properties.name).map(f=>({
    main:f.properties.name,
    sub:[f.properties.county||f.properties.city,f.properties.state].filter((v,i,a)=>v && v!==f.properties.name && a.indexOf(v)===i).join(", "),
    lat:Number(f.geometry.coordinates[1]),lon:Number(f.geometry.coordinates[0])}));
}

async function fetchSuggestions(q){
  const controller=suggestController=new AbortController();
  const key=q.toLowerCase();
  const status=document.getElementById("aiStatus");
  try{
    let remote=suggestCache.get(key);
    if(!remote){
      remote=[];
      if(groqReady()){
        try{ remote=await groqSuggest(q,controller.signal); status.textContent=""; }
        catch(e){
          if(e.name==="AbortError") throw e;
          console.warn("Groq suggestions failed.",e);
          status.textContent="Groq suggestions are off: "+e.message;
        }
      }
      if(!remote.length){
        try{ remote=await photonSuggest(q,controller.signal); }
        catch(e){ if(e.name==="AbortError") throw e; console.warn("Online place search failed.",e); }
      }
      suggestCache.set(key,remote);
    }
    // Ignore answers that arrive after the user has typed something else.
    const input=document.getElementById("placeName");
    if(controller!==suggestController || input.value.trim()!==q || document.activeElement!==input) return;
    showSuggestions(mergeSuggestions(localSuggest(q),remote),false);
  }catch(e){
    if(e.name!=="AbortError") console.warn("Autocomplete error",e);
  }
}

async function addPlace(){
  const name=document.getElementById("placeName").value.trim();
  if(!name) { kidSay("Oopsie! Type a place name first!","✏️"); return; }

  hideSuggestions();

  // If the user selected an autocomplete result, coordinates are stored
  // temporarily in data attributes and are never shown in the UI.
  const input=document.getElementById("placeName");
  const selectedLat=Number(input.dataset.lat);
  const selectedLon=Number(input.dataset.lon);
  const selectedName=input.dataset.selectedName;

  if(selectedName===name && Number.isFinite(selectedLat) && Number.isFinite(selectedLon)){
    addResolvedPlace(selectedName,selectedLat,selectedLon,input.dataset.cat);
    return;
  }

  const known=LOCAL_PLACES.find(p=>norm(p.main)===norm(name));
  if(known){ addResolvedPlace(known.main,known.lat,known.lon); return; }

  // Try normal India geocoding first.
  try{
    input.disabled=true;
    const url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&addressdetails=1&accept-language=en&q="+encodeURIComponent(name);
    const r=await fetch(url,{headers:{"Accept":"application/json"}});
    const data=await r.json();
    if(data.length){
      addResolvedPlace(data[0].name || name,Number(data[0].lat),Number(data[0].lon));
      return;
    }
  }catch(e){
    console.warn("Geocoding failed; trying Groq.",e);
  }finally{
    input.disabled=false;
  }

  await addPlaceWithGroq(name);
}

function addResolvedPlace(name,lat,lon,cat){
  if(lat<5||lat>38||lon<65||lon>100){
    kidSay("Uh-oh! That place is not in India!","🌏");
    return false;
  }

  const dup=findDuplicate(name,lat,lon);
  if(dup){
    kidSay(dup.name+" is already on your map, silly!","🙃");
    return false;
  }

  const status=document.querySelector("#statusSeg button.on").dataset.v;
  const picked=document.getElementById("catSel").value;
  places.push({name,lat,lon,status,cat:picked || (CATS[cat]?cat:guessCat(name))});
  if(fStatus!=="all" && fStatus!==status) fStatus="all";      // make sure the new pin is visible
  fCat="all";

  const input=document.getElementById("placeName");
  input.value="";
  delete input.dataset.lat;
  delete input.dataset.lon;
  delete input.dataset.selectedName;
  delete input.dataset.cat;
  document.getElementById("catSel").value="";

  render();
  return true;
}

async function addPlaceWithGroq(name){
  if(!GROQ_API_KEY || GROQ_API_KEY==="PASTE_YOUR_GROQ_API_KEY_HERE"){
    kidSay("Please add your Groq API key in the GROQ_API_KEY constant in this HTML file.","🔑");
    return;
  }

  const status=document.getElementById("aiStatus");
  status.textContent="Groq AI is finding the place…";

  const prompt=`Identify this Indian travel place and return its approximate geographic coordinates.

Place: ${name}

Return ONLY JSON:
{"name":"canonical place name","lat":0.0000,"lon":0.0000}

Rules:
- The place must be in India.
- For a city use the city center.
- For a tourist attraction use the attraction's approximate coordinates.
- Latitude must be between 5 and 38.
- Longitude must be between 65 and 100.
- No markdown or explanation.`;

  try{
    const result=await groqChat([
      {role:"system",content:"You are a precise India geography assistant. Return only valid JSON."},
      {role:"user",content:prompt}
    ],250);
    const lat=Number(result.lat), lon=Number(result.lon);

    if(!result.name || !Number.isFinite(lat) || !Number.isFinite(lon)){
      throw new Error("Groq returned invalid location data.");
    }

    status.textContent=addResolvedPlace(result.name,lat,lon) ? "Added: "+result.name : "";
  }catch(e){
    status.textContent="Groq error: "+e.message;
    kidSay("Hmm, I could not find that place! Try picking one from the suggestions.","🔍");
  }
}

async function removePlace(p){
  if(await kidAsk("Bye-bye "+p.name+"? Really take it off the map?",{emoji:"🥺",yes:"Yes, bye-bye! 👋",no:"No, keep it! 💖"})){
    const k=places.indexOf(p);
    if(k>-1){places.splice(k,1);render();}
    return true;
  }
  return false;
}
async function resetPlaces(){
  if(!places.length){ kidSay("Your map is already empty! Add a place first.","🗺️"); return; }
  if(await kidAsk("Whoa! Wipe ALL "+places.length+" places off the map and start fresh?",{emoji:"🙈",yes:"Yes, start over! 🔄",no:"Nooo, keep them! 🛑"})){
    places=[]; fStatus="all"; fCat="all";

    input.value=""; delete input.dataset.lat; delete input.dataset.lon; delete input.dataset.selectedName; delete input.dataset.cat;

}

// Shrinks the user's own photo so it fits in browser storage.
function readPhoto(file){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file), im=new Image();
    im.onload=()=>{
      const S=240, c=document.createElement("canvas"); c.width=c.height=S;
      const k=Math.max(S/im.naturalWidth,S/im.naturalHeight), w=im.naturalWidth*k, h=im.naturalHeight*k;
      c.getContext("2d").drawImage(im,(S-w)/2,(S-h)/2,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg",0.82));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("bad image"));};
    im.src=url;
  });
}

// A short fun fact: from Groq when the key is set, otherwise from Wikipedia.
const factsSeen=new Map();
async function funFact(p){
  const seen=factsSeen.get(p)||[];
  if(groqReady()){
    try{
      const out=await groqChat([
        {role:"system",content:"You tell short, true, kid-friendly travel facts about places in India. Return only valid JSON."},
        {role:"user",content:`Give ONE surprising, true fun fact about ${p.name}${stateOf(p)?", "+stateOf(p):""}, India, in at most 35 simple words.${seen.length?" Do not repeat these: "+seen.join(" | "):""}

Return ONLY JSON: {"fact":"..."}`}
      ],200);
      if(out.fact){ seen.push(String(out.fact)); factsSeen.set(p,seen); return String(out.fact); }
    }catch(e){ console.warn("Groq fun fact failed; using Wikipedia.",e); }
  }
  try{
    const url="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&exsentences=2&generator=search&gsrlimit=1&gsrsearch="+encodeURIComponent(p.name+" India");
    const d=await (await fetch(url)).json();
    const page=Object.values(d.query?.pages||{})[0];
    if(page && page.extract) return page.extract.trim();
  }catch(e){ console.warn("Wikipedia fact failed.",e); }
  return "I could not find a fact right now. Check your internet and try again!";
}

// "Where should I go next?" — Groq picks from what you have visited; a built-in picker is the backup.
async function whereNext(){
  const card=kidCard('<div class="kid-emoji">🧭</div><h3>Where next?</h3><div class="sub" id="wnSub">Thinking… 🤔</div><div id="wnList"></div>');
  const st=getStats(), have=places.map(p=>p.name);
  let picks=[], byAI=false;
  if(groqReady()){
    try{
      const out=await groqChat([
        {role:"system",content:"You are a fun India travel buddy. Return only valid JSON."},
        {role:"user",content:`I have visited these places in India: ${places.filter(p=>p.status==="visited").map(p=>p.name).join(", ")||"none yet"}.
My wishlist: ${places.filter(p=>p.status==="wish").map(p=>p.name).join(", ")||"empty"}.

Suggest 3 NEW places in India I should visit next (not in either list). Prefer states I have not visited and match the kind of places I seem to like.

Return ONLY JSON:
{"suggestions":[{"name":"place","state":"state","lat":0.0000,"lon":0.0000,"category":"temple|beach|hill|fort|wildlife|city","why":"one short playful reason, max 15 words"}]}`}
      ],500);
      picks=(Array.isArray(out.suggestions)?out.suggestions:[]).map(x=>({main:String(x.name||"").trim(),sub:String(x.state||"").trim(),lat:Number(x.lat),lon:Number(x.lon),cat:String(x.category||""),why:String(x.why||"")}))
        .filter(x=>x.main && x.lat>=5 && x.lat<=38 && x.lon>=65 && x.lon<=100 && !findDuplicate(x.main,x.lat,x.lon)).slice(0,3);
      byAI=picks.length>0;
    }catch(e){ console.warn("Groq ideas failed; using built-in ideas.",e); }
  }
  if(!picks.length){
    const pool=LOCAL_PLACES.filter(x=>x.sub!=="State" && x.sub!=="Union Territory" && !findDuplicate(x.main,x.lat,x.lon));
    const score=x=>(st.regions.has(x.sub.split(", ").pop())?0:2)+Math.random();
    picks=pool.map(x=>({x,s:score(x)})).sort((a,b)=>b.s-a.s).slice(0,3).map(o=>{
      const cat=guessCat(o.x.main), fresh=!st.regions.has(o.x.sub.split(", ").pop());
      return Object.assign({},o.x,{cat,why:(fresh?"A brand new state to colour in! ":"")+"Famous "+CATS[cat][1].toLowerCase()+" spot."});
    });
  }
  if(!document.body.contains(card.box)) return;
  card.box.querySelector("#wnSub").textContent=picks.length ? (byAI?"Picked for you by Groq AI":"Here are some ideas!") : "Wow, you have been everywhere I know!";
  const list=card.box.querySelector("#wnList");
  picks.forEach(x=>{
    const cat=CATS[x.cat]?x.cat:guessCat(x.main);
    const row=document.createElement("div");
    row.className="kid-row";
    row.innerHTML='<span class="em">'+CATS[cat][0]+'</span><div><b></b><small class="st"></small><small class="why"></small></div><button class="kid-mini">⭐ Add</button>';
    row.querySelector("b").textContent=x.main;
    row.querySelector(".st").textContent=x.sub;
    row.querySelector(".why").textContent=x.why;
    row.querySelector("button").onclick=function(){
      if(findDuplicate(x.main,x.lat,x.lon)) return;
      places.push({name:x.main,lat:x.lat,lon:x.lon,status:"wish",cat});
      if(fStatus==="visited") fStatus="all"; fCat="all";
      this.textContent="Added ✓"; this.disabled=true;
      render();
    };
    list.appendChild(row);
  });
}

function loadCanvasImage(src){
  return new Promise(resolve=>{
    const im=new Image();
    im.crossOrigin="anonymous";
    const t=setTimeout(()=>resolve(null),6000);
    im.onload=()=>{clearTimeout(t);resolve(im);};
    im.onerror=()=>{clearTimeout(t);resolve(null);};
    im.src=src;
  });
}

// The map (with coloured states, journey line and title) as an image for the picture.
function svgImage(){
  return new Promise((resolve,reject)=>{
    const clone=mapSvg.cloneNode(true);
    clone.setAttribute("width",MAP_W); clone.setAttribute("height",MAP_H);
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=()=>reject(new Error("Map picture could not be made."));
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(new XMLSerializer().serializeToString(clone));
  });
}
function fitText(ctx,text,maxW){
  if(ctx.measureText(text).width<=maxW) return text;
  let t=text;
  while(t.length>1 && ctx.measureText(t+"…").width>maxW) t=t.slice(0,-1);
  return t+"…";
}

async function buildCanvas(){
  const shown=shownPlaces(), st=getStats();
  const w=MAP_W, h=MAP_H, PW=shown.length?440:0;        // PW = places-list panel on the right
  const canvas=document.createElement("canvas"); canvas.width=w+PW; canvas.height=h;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(await svgImage(),0,0,w,h);

  const COL={visited:"#1faa59",wish:"#f5b301"};
  const photos=await Promise.all(shown.map(p=>photoOf(p)?loadCanvasImage(photoOf(p)):null));

  shown.forEach((p,i)=>{
    const q=project(p.lat,p.lon), x=q.x*w/100, y=q.y*h/100, col=COL[p.status];
    // round photo icon
    const cx=x-36, cy=y-24, R=25, ph=photos[i];
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx,cy,R+3,0,Math.PI*2); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.clip();
    if(ph){
      const s=Math.max(2*R/ph.naturalWidth,2*R/ph.naturalHeight), dw=ph.naturalWidth*s, dh=ph.naturalHeight*s;
      ctx.drawImage(ph,cx-dw/2,cy-dh/2,dw,dh);
    }else{
      const g=ctx.createLinearGradient(cx-R,cy-R,cx+R,cy+R); g.addColorStop(0,"#ffd86b"); g.addColorStop(1,"#ff8a5c");
      ctx.fillStyle=g; ctx.fillRect(cx-R,cy-R,2*R,2*R);
      ctx.font="26px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#fff"; ctx.fillText(catIcon(p),cx,cy+2);
    }
    ctx.restore();
    if(ph){   // small category icon on the photo
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(cx-R+4,cy+R-6,11,0,Math.PI*2); ctx.fill();
      ctx.font="13px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle="#000"; ctx.fillText(catIcon(p),cx-R+4,cy+R-5);
    }
    // pin: green = visited, yellow = wishlist
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,14,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill();
    // label
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.font="bold 18px Arial";
    const text=p.name+(p.year?" "+p.year:"");
    const tw=ctx.measureText(text).width;
    const bx=x+17, by=y-29;
    ctx.fillStyle="rgba(255,255,255,.96)"; roundRect(ctx,bx,by,tw+18,27,7); ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle="#172033"; ctx.fillText(text,bx+9,by+19);
  });

  if(PW){
    const X=w, name=(document.getElementById("travellerName").value||"").trim();
    ctx.fillStyle="#ffffff"; ctx.fillRect(X,0,PW,h);
    ctx.fillStyle="#0b3b73"; ctx.fillRect(X,0,PW,118);
    ctx.textAlign="left"; ctx.textBaseline="alphabetic";
    ctx.fillStyle="#fff"; ctx.font="bold 32px Arial"; ctx.fillText("📍 Places List",X+24,58);
    ctx.font="18px Arial"; ctx.fillStyle="#cfe1f7";
    ctx.fillText(fitText(ctx,(name?name+" · ":"")+shown.length+" place"+(shown.length===1?"":"s"),PW-48),X+24,92);
    // legend
    ctx.font="bold 15px Arial"; ctx.fillStyle="#475467";
    ctx.fillStyle=COL.visited; ctx.beginPath(); ctx.arc(X+32,146,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#475467"; ctx.fillText("Visited",X+46,151);
    ctx.fillStyle=COL.wish; ctx.beginPath(); ctx.arc(X+132,146,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#475467"; ctx.fillText("Wishlist",X+146,151);
    // numbered list (one column, or two when it is long)
    const top=176, bottom=h-190, n=shown.length;
    const cols=n>38?2:1, perCol=Math.ceil(n/cols);
    const rowH=Math.max(13,Math.min(30,(bottom-top)/perCol)), fs=Math.max(10,Math.min(19,rowH-7));
    const colW=(PW-40)/cols;
    shown.forEach((p,i)=>{
      const c=Math.floor(i/perCol), r=i%perCol, x0=X+24+c*colW, y0=top+r*rowH+rowH*0.72;
      ctx.fillStyle=COL[p.status]; ctx.beginPath(); ctx.arc(x0+5,y0-fs*0.33,Math.min(5,fs*0.3),0,Math.PI*2); ctx.fill();
      ctx.font=fs+"px Arial"; ctx.fillStyle="#172033";
      ctx.fillText(fitText(ctx,(i+1)+". "+catIcon(p)+" "+p.name+(p.year?" ("+p.year+")":""),colW-26),x0+16,y0);
    });
    // progress
    ctx.strokeStyle="#e3e9f1"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X+24,h-172); ctx.lineTo(X+PW-24,h-172); ctx.stroke();
    ctx.font="bold 19px Arial"; ctx.fillStyle="#0b3b73";
    ctx.fillText("🗺️ "+st.states+" of 28 states visited",X+24,h-136);
    ctx.fillText("🛣️ "+st.km.toLocaleString("en-IN")+" km travelled",X+24,h-104);
    const got=BADGES.filter(b=>b.t(st));
    if(got.length){
      ctx.font="16px Arial"; ctx.fillStyle="#475467"; ctx.fillText("Badges",X+24,h-68);
      ctx.font="26px serif"; ctx.fillStyle="#000";
      ctx.fillText(got.map(b=>b.e).join(" "),X+24,h-30,PW-48);
    }
  }
  return canvas;
}

const PNG_NAME="my-visiting-places-india.png";
function saveBlob(blob){
  const a=document.createElement("a"); a.download=PNG_NAME; a.href=URL.createObjectURL(blob);

  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}

// Share only to WhatsApp or Instagram: one click saves the picture and opens the app.
async function shareMap(app){
  const isWA=app==="whatsapp", label=isWA?"WhatsApp":"Instagram";
  const ua=navigator.userAgent, android=/Android/i.test(ua), mobile=android||/iPhone|iPad|iPod/i.test(ua);
  const text=encodeURIComponent("My Visiting Places in India 🇮🇳 — "+places.length+" place"+(places.length===1?"":"s")+"!");
  const webUrl=isWA ? (mobile?"https://wa.me/?text="+text:"https://web.whatsapp.com/send?text="+text) : "https://www.instagram.com/";
  const appUrl=isWA ? "whatsapp://send?text="+text
                    : (android ? "intent://instagram.com/#Intent;package=com.instagram.android;scheme=https;end" : "instagram://app");

  // Computers: open the app's page right away (must happen inside the click).
  const tab=mobile ? null : window.open(webUrl,"_blank");

  const blob=mapBlobCache || await mapBlob();
  saveBlob(blob);                                   // picture goes to Downloads / Gallery
  let copied=false;
  if(isWA && navigator.clipboard && window.ClipboardItem){
    try{
      copied=await Promise.race([
        navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(()=>true),
        new Promise(res=>setTimeout(()=>res(false),700))
      ]);
    }catch(e){}
  }

  if(mobile){
    setTimeout(()=>{
      location.href=appUrl;                         // opens the installed app directly
      setTimeout(()=>{ if(!document.hidden) location.href=webUrl; },2000);   // app not installed
    },350);
  }else if(!tab){
    location.href=webUrl;
  }
  kidSay("Your map picture is saved"+(copied?" and copied":"")+"! "+(copied?"Paste or attach":"Attach")+" it in "+label+".","🎉");
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}


// ---- controls ----
document.getElementById("catSel").innerHTML='<option value="">🪄 Category: pick for me</option>'+Object.keys(CATS).map(c=>'<option value="'+c+'">'+CATS[c][0]+' '+CATS[c][1]+'</option>').join("");
document.querySelectorAll("#statusSeg button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("#statusSeg button").forEach(x=>x.classList.toggle("on",x===b));
});
const nameInput=document.getElementById("travellerName"), journeyToggle=document.getElementById("journeyToggle");
nameInput.value=localStorage.getItem("myIndiaNameV2")||"";
journeyToggle.checked=localStorage.getItem("myIndiaJourneyV2")!=="off";
nameInput.addEventListener("input",()=>{ localStorage.setItem("myIndiaNameV2",nameInput.value.trim()); render(); });
journeyToggle.addEventListener("change",()=>{ localStorage.setItem("myIndiaJourneyV2",journeyToggle.checked?"on":"off"); render(); });

// ---- zoom & pan: buttons, pinch, double-tap/double-click, Ctrl + mouse wheel, drag when zoomed ----
const mapWrap=document.getElementById("mapWrap"), mapInner=document.getElementById("mapInner");
let Z=1, TX=0, TY=0, dragMoved=false;
const Z_MAX=6;
function applyZoom(){
  const w=mapWrap.clientWidth, h=mapWrap.clientHeight;
  TX=Math.min(0,Math.max(w*(1-Z),TX));
  TY=Math.min(0,Math.max(h*(1-Z),TY));
  mapInner.style.transform="translate("+TX+"px,"+TY+"px) scale("+Z+")";
  mapInner.style.setProperty("--inv",1/Z);            // pins keep their size while the map grows
  const zoomed=Z>1.01;
  mapWrap.classList.toggle("zoomed",zoomed);
  mapWrap.style.touchAction=zoomed?"none":"pan-y";
  document.getElementById("zoomOut").disabled=!zoomed;
  document.getElementById("zoomReset").disabled=!zoomed;
  document.getElementById("zoomIn").disabled=Z>=Z_MAX-0.01;
  document.getElementById("zoomHint").textContent=Math.round(Z*100)+"%";
}
function zoomAt(factor,cx,cy){
  const nz=Math.min(Z_MAX,Math.max(1,Z*factor)), k=nz/Z;
  TX=cx-(cx-TX)*k; TY=cy-(cy-TY)*k; Z=nz;
  applyZoom();
}
function zoomCentre(factor){ zoomAt(factor,mapWrap.clientWidth/2,mapWrap.clientHeight/2); }
function wrapPoint(e){ const r=mapWrap.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
document.getElementById("zoomIn").onclick=()=>zoomCentre(1.5);
document.getElementById("zoomOut").onclick=()=>zoomCentre(1/1.5);
document.getElementById("zoomReset").onclick=()=>{ Z=1; TX=TY=0; applyZoom(); };
mapWrap.addEventListener("wheel",e=>{
  if(!(e.ctrlKey||e.metaKey)) return;                // plain wheel still scrolls the page
  e.preventDefault();
  const p=wrapPoint(e); zoomAt(Math.exp(-e.deltaY*0.01),p.x,p.y);
},{passive:false});
mapWrap.addEventListener("dblclick",e=>{
  if(e.target.closest(".marker,.zoom")) return;
  const p=wrapPoint(e); zoomAt(2,p.x,p.y);
});
const pointers=new Map(); let pinchDist=0;
mapWrap.addEventListener("pointerdown",e=>{
  if(e.target.closest(".zoom")) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  dragMoved=false;
  if(pointers.size===2){ const a=[...pointers.values()]; pinchDist=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); }
});
window.addEventListener("pointermove",e=>{
  const prev=pointers.get(e.pointerId); if(!prev) return;
  const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
  if(pointers.size===1){
    if(Z>1.01){
      if(!dragMoved && Math.hypot(dx,dy)<5) return;  // ignore tiny wobbles so taps still work
      dragMoved=true; mapWrap.classList.add("dragging");
      TX+=dx; TY+=dy; applyZoom();
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    }
  }else if(pointers.size===2){
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const a=[...pointers.values()], d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), r=mapWrap.getBoundingClientRect();
    if(pinchDist>0){ dragMoved=true; zoomAt(d/pinchDist,(a[0].x+a[1].x)/2-r.left,(a[0].y+a[1].y)/2-r.top); }
    pinchDist=d;
  }
});
function endPointer(e){ pointers.delete(e.pointerId); pinchDist=0; mapWrap.classList.remove("dragging"); }
window.addEventListener("pointerup",endPointer);
window.addEventListener("pointercancel",endPointer);
mapWrap.addEventListener("click",e=>{ if(dragMoved){ e.stopPropagation(); e.preventDefault(); dragMoved=false; } },true);   // a drag is not a tap on a pin
window.addEventListener("resize",applyZoom);
applyZoom();

render();
</script>
