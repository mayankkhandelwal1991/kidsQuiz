        <div class="stat-label">Score</div>

    <div class="options" id="options"></div>

    </div>
  </div>

  <!-- END SCREEN -->

    <h1>⏰ Time's Up!</h1>
    <p class="subtitle" id="endSubtitle">Here's how you did:</p>
    <div class="final-score" id="finalScore">0</div>
    <div class="center" id="bestComparison" style="font-size:13px; color:#666; margin-bottom:10px;"></div>
    <div class="summary">
      <div class="summary-item">
        <div class="value" id="correctCount">0</div>
        <div class="label">Correct</div>
      </div>
      <div class="summary-item">
        <div class="value" id="wrongCount">0</div>
        <div class="label">Wrong</div>
      </div>
      <div class="summary-item">
        <div class="value" id="totalCount">0</div>
        <div class="label">Attempted</div>
      </div>
    </div>
    <div class="button-row">
      <button class="btn btn-secondary" onclick="goToMenu()">Main Menu</button>
      <button class="btn btn-secondary" onclick="goToHistory()">📊 History</button>
      <button class="btn btn-secondary" onclick="openQuizBoard()">🏆 Leaderboard</button>
      <button class="btn btn-secondary" onclick="changeLevel()">Change Level</button>
      <button class="btn" onclick="restartQuiz()">Play Again</button>
    </div>
    <div class="android-actions">
      <button class="android-action-btn rate-btn" onclick="rateApp()">
        <span class="aa-icon">⭐</span>
        <span class="aa-text">
          <span class="aa-title">Rate Us</span>
          <span class="aa-sub">Enjoying the app? Let us know!</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn share-btn" onclick="shareApp()">
        <span class="aa-icon">📤</span>
        <span class="aa-text">
          <span class="aa-title">Share with Friends</span>
          <span class="aa-sub">Spread the fun to others</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
    </div>
  </div>

</div>

<!-- ============================================================
     QUIZ QUESTION LOADER
     Questions live in editable files under  quiz/<subject>/class<N>.js
     Each of those files calls registerQuiz(subject, class, [...]).
     To change questions: open the matching file, edit, save, refresh.
     ============================================================ -->
<script>
  window.QUIZ_REGISTRY = {};
  function registerQuiz(subject, level, questions) {
    if (!window.QUIZ_REGISTRY[subject]) window.QUIZ_REGISTRY[subject] = {};
    window.QUIZ_REGISTRY[subject][level] = questions;
  }
</script>

<script>
/* ============================================================
   AUTH GUARD — this page requires a session set up by quiz2.html.
   ============================================================ */
window.isGuestUser = false;
const __cachedAuth = getCachedAuth();
if (__cachedAuth && __cachedAuth.name) {
  currentUser = __cachedAuth.name;
} else if (getCachedGuest()) {
  window.isGuestUser = true;
  currentUser = 'Guest';
} else {
  window.location.href = 'quiz2.html';
}
getOrCreateUser(currentUser);

/* ============================================================
   READ ?cat=&level= FROM THE URL
   ============================================================ */
const __params = new URLSearchParams(window.location.search);
let currentCategory = __params.get('cat') || '';
let currentLevel = parseInt(__params.get('level'), 10) || 1;

if (!getCatInfo(currentCategory)) {
  // Unknown/missing category — nothing sensible to quiz on, back to picking one.
  window.location.href = 'quiz-home.html';
}

/* ============================================
   QUIZ STATE
   ============================================ */
let timeLeft = 180;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let questionCount = 0;
let currentAnswer = null;
let timerInterval = null;
let acceptingAnswers = false;
let recentQuestions = [];

function showScreen(id) {
  ['quizScreen','endScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* ============================================
   NAVIGATION OUT OF THE QUIZ
   ============================================ */
function goToMenu() { window.location.href = 'quiz-home.html'; }
function goToHistory() { window.location.href = 'quiz-home.html?screen=history'; }
function changeLevel() { window.location.href = 'quiz-home.html?cat=' + encodeURIComponent(currentCategory); }

function pickFromPoolNoRepeat(pool) {
  if (pool.length <= 4) return pickRandom(pool);
  let q;
  let tries = 0;
  do {
    q = pickRandom(pool);
    tries++;
  } while (recentQuestions.includes(q.question) && tries < 20);
  recentQuestions.push(q.question);
  if (recentQuestions.length > Math.min(15, Math.floor(pool.length / 2))) recentQuestions.shift();
  return { question: q.question, answer: q.answer, options: shuffle(q.options.slice()), size: q.size || 'small' };
}

/* ============================================
   QUIZ FLOW
   ============================================ */
function startQuiz(level) {
  if (typeof Android !== "undefined" && Android.showAd) {
    //Android.showAd("interstitial");
  }

  currentLevel = level;
  timeLeft = 180;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  questionCount = 0;
  recentQuestions = [];
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = '3:00';
  document.getElementById('timer').classList.remove('warning');

  const cat = getCatInfo(currentCategory);
  document.getElementById('quizBreadcrumb').textContent = cat.icon + ' ' + cat.title + ' • Class ' + level;

  showScreen('quizScreen');
  nextQuestion();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);
}

function updateTimer() {
  timeLeft--;
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const t = document.getElementById('timer');
  t.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  if (timeLeft <= 30) t.classList.add('warning');
  if (timeLeft <= 0) endQuiz();
}

function quitQuiz() {
  if (confirm('Are you sure you want to quit this quiz?')) {
    clearInterval(timerInterval);
    timerInterval = null;
    if (typeof Android !== "undefined" && Android.showAd) {
      Android.showAd("interstitial");
    }
    goToMenu();
  }
}

function nextQuestion() {
  questionCount++;
  document.getElementById('qCount').textContent = questionCount;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const q = generateQuestion(currentCategory, currentLevel);
  currentAnswer = q.answer;

  const qEl = document.getElementById('question');
  qEl.textContent = q.question;
  qEl.className = 'question';
  if (q.size === 'large') qEl.classList.add('large');
  if (q.size === 'small') qEl.classList.add('small');

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  q.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.onclick = () => checkAnswer(opt, btn);
    optionsEl.appendChild(btn);
  });
  acceptingAnswers = true;
}

function checkAnswer(selected, btn) {
  if (!acceptingAnswers) return;
  acceptingAnswers = false;
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');

  if (String(selected) === String(currentAnswer)) {
    btn.classList.add('correct');
    score++;
    correctCount++;
    feedback.textContent = '✓ Correct!';
    feedback.className = 'feedback correct';
    try { if (window.KQFX) KQFX.play('success'); } catch (e) {}
  } else {
    btn.classList.add('wrong');
    score--;
    wrongCount++;
    feedback.textContent = '✗ Wrong! Answer: ' + currentAnswer;
    feedback.className = 'feedback wrong';
    try { if (window.KQFX) KQFX.play('wrong'); } catch (e) {}
    buttons.forEach(b => {
      if (String(b.textContent) === String(currentAnswer)) b.classList.add('correct');
    });
  }
  document.getElementById('score').textContent = score;
  setTimeout(() => { if (timeLeft > 0) nextQuestion(); }, 850);
}

function endQuiz() {
  clearInterval(timerInterval);
  timerInterval = null;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('totalCount').textContent = correctCount + wrongCount;
  let msg = "Here's how you did:";
  if (score >= 30) msg = "Outstanding! 🏆";
  else if (score >= 20) msg = "Great job! ⭐";
  else if (score >= 10) msg = "Good effort! 👍";
  else if (score >= 0) msg = "Keep practicing! 💪";
  else msg = "Try again to improve! 🎯";
  document.getElementById('endSubtitle').textContent = msg;

  const prevBest = getBestScore(currentCategory, currentLevel);
  saveScoreToHistory(currentCategory, currentLevel, score, correctCount, wrongCount);
  try {
    if (window.KQ && KQ.submit) {
      const cat = getCatInfo(currentCategory);
      window.KQ_CONTEXT = { category: 'quiz', gameId: currentCategory + '__' + currentLevel,
        title: (cat.icon + ' ' + cat.title + ' • Class ' + currentLevel) };
      KQ.submit('quiz', currentCategory + '__' + currentLevel, score,
        { meta: { correct: correctCount, wrong: wrongCount, cat: cat.title, level: currentLevel } });
    }
  } catch (e) {}
  try { markDailyDoneIfMatches(); } catch (e) {}
  try { if (window.KQFX) KQFX.quizComplete(score); } catch (e) {}
  const bestEl = document.getElementById('bestComparison');
  if (prevBest === null) {
    bestEl.innerHTML = '🌟 First attempt at this level — saved as your best!';
  } else if (score > prevBest) {
    bestEl.innerHTML = '🎉 New personal best! Previous: ' + prevBest;
  } else if (score === prevBest) {
    bestEl.innerHTML = '🤝 Tied your personal best of ' + prevBest;
  } else {
    bestEl.innerHTML = '📊 Your personal best at this level: ' + prevBest;
  }

  showScreen('endScreen');
  if (typeof Android !== "undefined" && Android.showAd) {
    setTimeout(function () { Android.showAd("interstitial"); }, 1500);
  }
}

function restartQuiz() { startQuiz(currentLevel); }

function openQuizBoard() {
  if (!window.KQ || !KQ.open) return;
  const cat = getCatInfo(currentCategory);
  KQ.open('quiz', currentCategory + '__' + currentLevel,
    cat.icon + ' ' + cat.title + ' • Class ' + currentLevel);
}

function markDailyDoneIfMatches() {
  const dc = getDailyChallenge();
  if (currentCategory === dc.catId && +currentLevel === +dc.level) {
    const st = loadDaily();
    const tk = todayKey();
    if (st.date !== tk || !st.done) {
      let streak = 1;
      if (st.lastDate === dateKeyOffset(-1)) streak = (st.streak || 0) + 1;
      else if (st.lastDate === tk) streak = st.streak || 1;
      saveDaily({ date: tk, done: true, streak: streak, lastDate: tk });
    }
  }
}

/* ============================================
   QUESTION ROUTER
   ============================================ */
function generateQuestion(cat, level) {
  switch(cat) {
    case 'addsub':    return genAddSub(level);
    case 'multiply':  return genMultiply(level);
    case 'divide':    return genDivide(level);
    case 'mixedmath': return genMixedMath(level);
    case 'patterns':  return genPatterns(level);
    case 'reasoning': return genReasoning(level);
    default:
      return pickFromPoolNoRepeat(getPool(cat, level));
  }
}

function getPool(cat, level) {
  var pool = (window.QUIZ_REGISTRY[cat] && window.QUIZ_REGISTRY[cat][level]) || [];
  if (!pool.length) {
    return [{
      question: "No questions yet for this class. Add some in quiz/" + cat + "/class" + level + ".js",
      answer: "OK", options: ["OK", "OK", "OK", "OK"], size: "small"
    }];
  }
  return pool;
}

/* ============================================
   MATH GENERATORS - PROCEDURAL (infinite questions)
   ============================================ */
function genAddSub(level) {
  let a, b, op, answer, qText, size = 'large';
  if (level === 1) { a = rand(0, 9); b = rand(0, 9); }
  else if (level === 2) { a = rand(5, 30); b = rand(1, 20); }
  else if (level === 3) { a = rand(20, 99); b = rand(10, 70); }
  else if (level === 4) { a = rand(100, 500); b = rand(50, 300); size='medium'; }
  else { a = rand(200, 999); b = rand(100, 800); size='medium'; }
  op = Math.random() < 0.5 ? '+' : '−';
  if (op === '+') { answer = a + b; qText = a + ' + ' + b; }
  else {
    if (b > a) [a, b] = [b, a];
    answer = a - b; qText = a + ' − ' + b;
  }
  const range = Math.max(3, Math.floor(answer * 0.15) + 2);
  return { question: qText, answer: answer, options: buildNumericOptions(answer, range), size: size };
}

function genMultiply(level) {
  let a, b;
  if (level === 1) { a = rand(1, 5); b = rand(1, 5); }
  else if (level === 2) { a = rand(2, 10); b = rand(1, 10); }
  else if (level === 3) { a = rand(2, 12); b = rand(2, 10); }
  else if (level === 4) { a = rand(10, 25); b = rand(2, 9); }
  else { a = rand(11, 25); b = rand(11, 20); }
  const answer = a * b;
  const qText = a + ' × ' + b;
  const range = Math.max(5, Math.floor(answer * 0.2) + 3);
  return { question: qText, answer: answer, options: buildNumericOptions(answer, range), size: 'large' };
}

function genDivide(level) {
  let divisor, quotient;
  if (level === 1) { divisor = rand(1, 5); quotient = rand(1, 5); }
  else if (level === 2) { divisor = rand(2, 5); quotient = rand(2, 10); }
  else if (level === 3) { divisor = rand(2, 9); quotient = rand(2, 10); }
  else if (level === 4) { divisor = rand(2, 10); quotient = rand(5, 15); }
  else { divisor = rand(3, 12); quotient = rand(5, 25); }
  const dividend = divisor * quotient;
  const qText = dividend + ' ÷ ' + divisor;
  const range = Math.max(3, Math.floor(quotient * 0.3) + 2);
  return { question: qText, answer: quotient, options: buildNumericOptions(quotient, range), size: 'large' };
}

function genMixedMath(level) {
  const ops = level <= 2 ? ['+', '−'] : level <= 3 ? ['+', '−', '×'] : ['+', '−', '×', '÷'];
  const op = pickRandom(ops);
  if (op === '+' || op === '−') return genAddSub(level);
  if (op === '×') return genMultiply(Math.max(1, level - 1));
  return genDivide(Math.max(1, level - 1));
}

function genPatterns(level) {
  const types = level <= 2 ? ['arith'] : level <= 3 ? ['arith', 'arith2'] : ['arith', 'arith2', 'mult'];
  const type = pickRandom(types);
  let seq, next, qText;
  if (type === 'arith') {
    const start = rand(1, level <= 2 ? 10 : 30);
    const step = rand(1, level <= 2 ? 3 : 6);
    seq = [start, start + step, start + 2*step, start + 3*step];
    next = start + 4*step;
  } else if (type === 'arith2') {
    const start = rand(2, 20);
    const step = rand(2, 8);
    seq = [start, start + step, start + 2*step, start + 3*step];
    next = start + 4*step;
  } else {
    const start = rand(2, 5);
    const factor = rand(2, 3);
    seq = [start, start * factor, start * factor * factor];
    next = start * factor * factor * factor;
  }
  qText = 'Next number? ' + seq.join(', ') + ', __';
  const range = Math.max(3, Math.floor(next * 0.2) + 2);
  return { question: qText, answer: next, options: buildNumericOptions(next, range), size: 'small' };
}

function genReasoning(level) {
  const types = ['compare', 'missing', 'word'];
  const type = pickRandom(types);
  if (type === 'compare') {
    const a = rand(1, level * 20);
    const b = rand(1, level * 20);
    if (a === b) return genReasoning(level);
    const correct = a > b ? 'Greater' : 'Smaller';
    return {
      question: 'Is ' + a + ' greater or smaller than ' + b + '?',
      answer: correct,
      options: shuffle(['Greater', 'Smaller', 'Equal', 'Cannot say']),
      size: 'small'
    };
  } else if (type === 'missing') {
    const a = rand(2, level * 10);
    const b = rand(2, level * 10);
    const sum = a + b;
    return {
      question: a + ' + __ = ' + sum,
      answer: b,
      options: buildNumericOptions(b, Math.max(3, Math.floor(b*0.3)+2)),
      size: 'large'
    };
  } else {
    const items = level <= 2 ? rand(2, 8) : rand(5, 30);
    const more = level <= 2 ? rand(1, 5) : rand(2, 20);
    const total = items + more;
    return {
      question: 'Ravi has ' + items + ' apples. He gets ' + more + ' more. How many now?',
      answer: total,
      options: buildNumericOptions(total, 4),
      size: 'small'
    };
  }
}

/* ============================================
   BACK BUTTON: confirm-quit while a quiz is in progress
   ============================================ */
window.addEventListener('popstate', function () {
  const quizVisible = !document.getElementById('quizScreen').classList.contains('hidden');
  if (quizVisible && timerInterval) {
    const wantQuit = confirm('Are you sure you want to quit this quiz?');
    if (!wantQuit) {
      history.pushState({ screen: 'quizScreen' }, '', '');
      return;
    }
    clearInterval(timerInterval);
    timerInterval = null;
    goToMenu();
  }
});
history.pushState({ screen: 'quizScreen' }, '', '');

/* ============================================
   INIT
   ============================================ */
initBackgroundDecor();
attachRipple('.btn');
attachRipple('.option-btn');
attachRipple('.android-action-btn');

startQuiz(currentLevel);
</script>
