<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Quiz</title>
<link rel="stylesheet" href="../quiz-theme.css">
</head>
<body>

<div class="bg-decor" id="bgDecor"></div>

<div class="container">

  <!-- QUIZ SCREEN -->
  <div id="quizScreen" class="hidden">
    <button class="modal-close-x quiz-quit-x" onclick="quitQuiz()" aria-label="Quit quiz">×</button>
    <div class="breadcrumb" id="quizBreadcrumb"></div>
    <div class="stats">
      <div class="summary-item">
        <div class="stat-label">Time Left</div>
        <div class="stat-value" id="timer">1:00</div>
      </div>
      <div class="summary-item">
        <div class="stat-label">Score</div>
        <div class="stat-value" id="score">0</div>
      </div>
      <div class="summary-item">
        <div class="stat-label">Question</div>
        <div class="stat-value" id="qCount">1</div>
      </div>
    </div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="hidden">
    <h1>⏰ Time's Up!</h1>
    <p class="subtitle" id="endSubtitle">Here's how you did:</p>
    <div class="final-score" id="finalScore">0</div>
    <div class="center" id="bestComparison" style="font-size:13px; color:#666; margin-bottom:10px;"></div>
    <div class="summary">
      <div class="summary-item">
        <div class="value" id="correctCount">0</div>
        <div class="label">Correct</div>
      </div>
      <div class="summary-item">
        <div class="value" id="wrongCount">0</div>
        <div class="label">Wrong</div>
      </div>
      <div class="summary-item">
        <div class="value" id="totalCount">0</div>
        <div class="label">Attempted</div>
      </div>
    </div>
    <div class="button-row">
      <button class="btn btn-secondary" onclick="goToMenu()">Main Menu</button>
      <button class="btn btn-secondary" onclick="goToHistory()">📊 History</button>
      <button class="btn btn-secondary" onclick="openQuizBoard()">🏆 Leaderboard</button>
      <button class="btn btn-secondary" onclick="changeLevel()">Change Level</button>
      <button class="btn" onclick="restartQuiz()">Play Again</button>
    </div>
    <div class="android-actions">
      <button class="android-action-btn rate-btn" onclick="rateApp()">
        <span class="aa-icon">⭐</span>
        <span class="aa-text">
          <span class="aa-title">Rate Us</span>
          <span class="aa-sub">Enjoying the app? Let us know!</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn share-btn" onclick="shareApp()">
        <span class="aa-icon">📤</span>
        <span class="aa-text">
          <span class="aa-title">Share with Friends</span>
          <span class="aa-sub">Spread the fun to others</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
    </div>
  </div>

</div>

<!-- QUIT CONFIRMATION POPUP — outside .container so it always stacks on top -->
<div id="quitConfirmModal" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:99999; display:none; align-items:center; justify-content:center; padding:20px;">
  <div style="background:linear-gradient(180deg,#ffffff,#fef6ff); border:6px solid #fff; border-radius:28px; padding:28px 24px 22px; max-width:340px; width:100%; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.35);">
    <div style="font-size:44px; margin-bottom:8px;">🤔</div>
    <h2 style="color:#ff5a8a; font-size:22px; margin-bottom:8px;">Are You Sure?</h2>
    <p class="subtitle" style="margin-bottom:22px; font-size:14px;">Your progress and score in this quiz will be lost if you quit now.</p>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button class="btn btn-secondary" onclick="cancelQuit()">Keep Playing</button>
      <button class="btn" style="background:linear-gradient(135deg,#f59e0b,#f43f5e); box-shadow:0 8px 18px rgba(244,63,94,.35);" onclick="confirmQuit()">Yes, Quit</button>
    </div>
  </div>
</div>

<!-- ============================================================
     QUIZ QUESTION LOADER
     Questions live in editable files under  <subject>/class<N>.js
     Each of those files calls registerQuiz(subject, class, [...]).
     To change questions: open the matching file, edit, save, refresh.
     ============================================================ -->
<script>
  window.QUIZ_REGISTRY = {};
  function registerQuiz(subject, level, questions) {
    if (!window.QUIZ_REGISTRY[subject]) window.QUIZ_REGISTRY[subject] = {};
    window.QUIZ_REGISTRY[subject][level] = questions;
  }
</script>

<script>
/* ============================================================
   AUTH GUARD — this page requires a session set up by quiz2.html.
   ============================================================ */
window.isGuestUser = false;
const __cachedAuth = getCachedAuth();
if (__cachedAuth && __cachedAuth.name) {
  currentUser = __cachedAuth.name;
} else if (getCachedGuest()) {
  window.isGuestUser = true;
  currentUser = 'Guest';
} else {
  window.location.href = '../quiz2.html';
}
getOrCreateUser(currentUser);

/* ============================================================
   READ ?cat=&level= FROM THE URL
   ============================================================ */
const __params = new URLSearchParams(window.location.search);
let currentCategory = __params.get('cat') || '';
let __levelParam = parseInt(__params.get('level'), 10);
let currentLevel = Number.isNaN(__levelParam) ? 1 : __levelParam; // 0 = LKG

if (!getCatInfo(currentCategory)) {
  // Unknown/missing category — nothing sensible to quiz on, back to picking one.
  window.location.href = '../quiz-home.html';
}

/* ============================================
   QUIZ STATE
   ============================================ */
let timeLeft = 180;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let questionCount = 0;
let currentAnswer = null;
let currentAnswerSpoken = null; // readable label for currentAnswer — pure-emoji answers (listen mode) have no text to speak, so this carries q.speak instead
let timerInterval = null;
let quizInProgress = false;
let acceptingAnswers = false;
let recentQuestions = [];

function showScreen(id) {
  ['quizScreen','endScreen'].forEach(s => document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

/* ============================================
   NAVIGATION OUT OF THE QUIZ
   ============================================ */
function goToMenu() { window.location.href = '../quiz-home.html'; }
function goToHistory() { window.location.href = '../quiz-home.html?screen=history'; }
function changeLevel() { window.location.href = '../quiz-home.html?cat=' + encodeURIComponent(currentCategory); }

function pickFromPoolNoRepeat(pool) {
  if (pool.length <= 4) return pickRandom(pool);
  let q;
  let tries = 0;
  do {
    q = pickRandom(pool);
    tries++;
  } while (recentQuestions.includes(q.question) && tries < 20);
  recentQuestions.push(q.question);
  if (recentQuestions.length > Math.min(15, Math.floor(pool.length / 2))) recentQuestions.shift();
  return {
    question: q.question, answer: q.answer, options: shuffle(q.options.slice()),
    size: q.size || (currentLevel === 0 ? 'pico' : 'small'),
    mode: q.mode, speak: q.speak
  };
}

/* ============================================
   QUIZ FLOW
   ============================================ */
// Pictures only need fetching once per device (they're cached after), but
// on that very first LKG round we make sure every picture the quiz could
// possibly show is already downloaded BEFORE the first question appears —
// no popping-in / broken-image flash mid-quiz. Capped so a slow connection
// never blocks the quiz for long; it just starts with whatever landed.
let __picoImagesPreloaded = false;
function preloadPicoImages(maxWaitMs) {
  if (__picoImagesPreloaded || typeof EMOJI_IMG !== 'object') return Promise.resolve();
  const urls = Object.values(EMOJI_IMG).map(function (rel) { return '../' + rel; });
  const loaders = urls.map(function (src) {
    return new Promise(function (resolve) {
      const img = new Image();
      img.onload = img.onerror = function () { resolve(); };
      img.src = src;
    });
  });
  const allDone = Promise.all(loaders).then(function () { __picoImagesPreloaded = true; });
  const timeout = new Promise(function (resolve) { setTimeout(resolve, maxWaitMs || 900); });
  return Promise.race([allDone, timeout]);
}

function startQuiz(level) {
  if (typeof Android !== "undefined" && Android.showAd) {
    //Android.showAd("interstitial");
  }

  currentLevel = level;
  timeLeft = 180;
  score = 0;
  correctCount = 0;
  wrongCount = 0;
  questionCount = 0;
  recentQuestions = [];
  document.getElementById('score').textContent = '0';
  document.getElementById('timer').textContent = '3:00';
  document.getElementById('timer').classList.remove('warning');

  const cat = getCatInfo(currentCategory);
  document.getElementById('quizBreadcrumb').textContent = cat.icon + ' ' + cat.title + ' • ' + classLabel(level);

  showScreen('quizScreen');
  quizInProgress = true;
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);

  if (level === 0 && !__picoImagesPreloaded) {
    const qEl = document.getElementById('question');
    qEl.className = 'question pico pico-1';
    qEl.textContent = '🖼️ Getting your pictures ready…';
    const optionsEl = document.getElementById('options');
    optionsEl.innerHTML = '';
    optionsEl.className = 'options';
    preloadPicoImages(900).then(nextQuestion);
  } else {
    nextQuestion();
  }
}

function updateTimer() {
  timeLeft--;
  const m = Math.floor(timeLeft / 60);
  const s = timeLeft % 60;
  const t = document.getElementById('timer');
  t.textContent = m + ':' + (s < 10 ? '0' : '') + s;
  if (timeLeft <= 30) t.classList.add('warning');
  if (timeLeft <= 0) endQuiz();
}

let __quitFromPopstate = false;

function quitQuiz() {
  __quitFromPopstate = false;
  pauseTimerForQuitPopup();
  var m = document.getElementById('quitConfirmModal');
  if (!m) return;
  m.classList.remove('hidden');
  m.style.display = 'flex';
}

// Pausing/resuming the countdown while the "Are you sure?" popup is open —
// without this, time kept ticking down (and could even hit 0) behind the
// popup while the player was just deciding whether to quit.
function pauseTimerForQuitPopup() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}
function resumeTimerAfterQuitPopup() {
  if (quizInProgress && !timerInterval) {
    timerInterval = setInterval(updateTimer, 1000);
  }
}

function cancelQuit() {
  var m = document.getElementById('quitConfirmModal');
  if (m) {
    m.classList.add('hidden');
    m.style.display = 'none';
  }
  resumeTimerAfterQuitPopup();
  if (__quitFromPopstate) {
    __quitFromPopstate = false;
    history.pushState({ screen: 'quizScreen' }, '', '');
  }
}

function confirmQuit() {
  var m = document.getElementById('quitConfirmModal');
  if (m) {
    m.classList.add('hidden');
    m.style.display = 'none';
  }
  clearInterval(timerInterval);
  timerInterval = null;
  quizInProgress = false;
  if (typeof Android !== "undefined" && Android.showAd) {
    Android.showAd("interstitial");
  }
  goToMenu();
}

/* LKG (level 0) pastel card backdrops — cycled per question so the
   pictorial screen doesn't look the same twice in a row. */
const PICO_THEMES = ['pico-1', 'pico-2', 'pico-3', 'pico-4'];

function nextQuestion() {
  questionCount++;
  document.getElementById('qCount').textContent = questionCount;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';

  const q = generateQuestion(currentCategory, currentLevel);
  currentAnswer = q.answer;
  currentAnswerSpoken = q.speak || String(q.answer);
  const isPico = q.size === 'pico';
  const isListen = isPico && q.mode === 'listen';

  const qEl = document.getElementById('question');
  qEl.innerHTML = '';
  qEl.className = 'question';
  if (q.size === 'large') qEl.classList.add('large');
  if (q.size === 'small') qEl.classList.add('small');
  if (isPico) {
    qEl.classList.add('pico', PICO_THEMES[questionCount % PICO_THEMES.length]);
    if (isListen) qEl.classList.add('listen');
  }

  const qTextSpan = document.createElement('span');
  if (isPico && typeof emojiImgHtml === 'function') {
    // Real downloaded pictures instead of the OS/browser emoji font, so
    // LKG cards look the same (and don't come out tiny/monochrome) on
    // every device. Falls back to plain emoji text if images ever fail.
    qTextSpan.innerHTML = emojiImgHtml(q.question, 58, '../');
  } else {
    qTextSpan.textContent = q.question;
  }
  qEl.appendChild(qTextSpan);

  const spokenText = q.speak || q.question;
  const spokenLang = currentCategory === 'hindi' ? 'hi-IN' : 'en-US';
  if (isPico) {
    const speakBtn = document.createElement('button');
    speakBtn.type = 'button';
    speakBtn.className = 'q-speak-btn';
    speakBtn.setAttribute('aria-label', 'Hear it again');
    speakBtn.textContent = '🔊';
    speakBtn.onclick = function (e) { e.stopPropagation(); speak(spokenText, { rate: 0.82, lang: spokenLang }); };
    qEl.appendChild(speakBtn);
    // Auto-narrate once the card is on screen — helps pre-readers answer
    // without needing to read anything.
    setTimeout(function () { speak(spokenText, { rate: 0.82, lang: spokenLang }); }, 350);
  }

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  optionsEl.className = 'options' + (isPico ? ' pico' : '') + (isListen ? ' listen' : '');
  const optPx = isListen ? 84 : 54;
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.style.animationDelay = (i * 0.06) + 's';
    btn.dataset.value = opt; // checkAnswer compares this, since pico buttons hold <img>, not text
    if (isPico && typeof emojiImgHtml === 'function') {
      btn.innerHTML = emojiImgHtml(opt, optPx, '../');
    } else {
      btn.textContent = opt;
    }
    btn.onclick = () => checkAnswer(opt, btn);
    optionsEl.appendChild(btn);
  });
  acceptingAnswers = true;
}

// A few different cheerful cues instead of always the same one sound —
// keeps LKG rounds feeling lively rather than repetitive.
const LKG_CORRECT_SOUNDS = ['success', 'chime', 'ding', 'levelup'];
const LKG_PRAISE = ['Yay! Well done!', 'Correct! You got it!', 'Super! That’s right!', 'Great job!'];

function checkAnswer(selected, btn) {
  if (!acceptingAnswers) return;
  acceptingAnswers = false;
  const isPico = currentLevel === 0;
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);
  const feedback = document.getElementById('feedback');

  if (String(selected) === String(currentAnswer)) {
    btn.classList.add('correct');
    score++;
    correctCount++;
    feedback.textContent = '✓ Correct!';
    feedback.className = 'feedback correct';
    if (isPico) {
      try { if (window.KQFX) { KQFX.play(pickRandom(LKG_CORRECT_SOUNDS)); KQFX.celebrate({ power: 0.8 }); } } catch (e) {}
      speak(pickRandom(LKG_PRAISE), { raw: true, pitch: 1.3, lang: 'en-US' });
    } else {
      try { if (window.KQFX) KQFX.play('success'); } catch (e) {}
    }
  } else {
    btn.classList.add('wrong');
    score--;
    wrongCount++;
    feedback.textContent = '✗ Wrong! Answer: ' + currentAnswer;
    feedback.className = 'feedback wrong';
    if (isPico) {
      try { if (window.KQFX) KQFX.play('boing'); } catch (e) {}
      // Mixing an English preamble with a Hindi voice mispronounces both,
      // so Hindi questions just speak the answer word on its own.
      if (currentCategory === 'hindi') {
        speak(stripEmojiForSpeech(currentAnswerSpoken), { raw: true, lang: 'hi-IN' });
      } else {
        speak('Not quite! It’s ' + stripEmojiForSpeech(currentAnswerSpoken), { raw: true, lang: 'en-US' });
      }
    } else {
      try { if (window.KQFX) KQFX.play('wrong'); } catch (e) {}
    }
    buttons.forEach(b => {
      if (String(b.dataset.value != null ? b.dataset.value : b.textContent) === String(currentAnswer)) b.classList.add('correct');
    });
  }
  document.getElementById('score').textContent = score;
  setTimeout(() => { if (timeLeft > 0) nextQuestion(); }, isPico ? 1200 : 850);
}

function endQuiz() {
  clearInterval(timerInterval);
  timerInterval = null;
  quizInProgress = false;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('correctCount').textContent = correctCount;
  document.getElementById('wrongCount').textContent = wrongCount;
  document.getElementById('totalCount').textContent = correctCount + wrongCount;
  let msg = "Here's how you did:";
  if (score >= 30) msg = "Outstanding! 🏆";
  else if (score >= 20) msg = "Great job! ⭐";
  else if (score >= 10) msg = "Good effort! 👍";
  else if (score >= 0) msg = "Keep practicing! 💪";
  else msg = "Try again to improve! 🎯";
  document.getElementById('endSubtitle').textContent = msg;

  const prevBest = getBestScore(currentCategory, currentLevel);
  saveScoreToHistory(currentCategory, currentLevel, score, correctCount, wrongCount);
  try {
    if (window.KQ && KQ.submit) {
      const cat = getCatInfo(currentCategory);
      window.KQ_CONTEXT = { category: 'quiz', gameId: currentCategory + '__' + currentLevel,
        title: (cat.icon + ' ' + cat.title + ' • ' + classLabel(currentLevel)) };
      KQ.submit('quiz', currentCategory + '__' + currentLevel, score,
        { meta: { correct: correctCount, wrong: wrongCount, cat: cat.title, level: currentLevel } });
    }
  } catch (e) {}
  try { markDailyDoneIfMatches(); } catch (e) {}
  try { if (window.KQFX) KQFX.quizComplete(score); } catch (e) {}
  const bestEl = document.getElementById('bestComparison');
  if (prevBest === null) {
    bestEl.innerHTML = '🌟 First attempt at this level — saved as your best!';
  } else if (score > prevBest) {
    bestEl.innerHTML = '🎉 New personal best! Previous: ' + prevBest;
  } else if (score === prevBest) {
    bestEl.innerHTML = '🤝 Tied your personal best of ' + prevBest;
  } else {
    bestEl.innerHTML = '📊 Your personal best at this level: ' + prevBest;
  }

  showScreen('endScreen');
  if (typeof Android !== "undefined" && Android.showAd) {
    setTimeout(function () { Android.showAd("interstitial"); }, 1500);
  }
}

function restartQuiz() { startQuiz(currentLevel); }

function openQuizBoard() {
  if (!window.KQ || !KQ.open) return;
  const cat = getCatInfo(currentCategory);
  KQ.open('quiz', currentCategory + '__' + currentLevel,
    cat.icon + ' ' + cat.title + ' • ' + classLabel(currentLevel));
}

function markDailyDoneIfMatches() {
  const dc = getDailyChallenge();
  if (currentCategory === dc.catId && +currentLevel === +dc.level) {
    const st = loadDaily();
    const tk = todayKey();
    if (st.date !== tk || !st.done) {
      let streak = 1;
      if (st.lastDate === dateKeyOffset(-1)) streak = (st.streak || 0) + 1;
      else if (st.lastDate === tk) streak = st.streak || 1;
      saveDaily({ date: tk, done: true, streak: streak, lastDate: tk });
    }
  }
}

/* ============================================
   QUESTION ROUTER
   ============================================ */
function generateQuestion(cat, level) {
  // LKG (level 0) only has a dedicated picture-counting mode for Add & Subtract;
  // the other procedural math generators don't have age-appropriate LKG logic
  // (their level branches would fall through to the hardest tier), so treat
  // LKG the same as Class 1 for just those. Content-pool subjects (gk,
  // animals, science, ...) have their own class0.js pool and are untouched.
  const NO_LKG_MATH = ['multiply', 'divide', 'mixedmath', 'patterns', 'reasoning'];
  if (level === 0 && NO_LKG_MATH.indexOf(cat) !== -1) level = 1;
  switch(cat) {
    case 'addsub':    return genAddSub(level);
    case 'multiply':  return genMultiply(level);
    case 'divide':    return genDivide(level);
    case 'mixedmath': return genMixedMath(level);
    case 'patterns':  return genPatterns(level);
    case 'reasoning': return genReasoning(level);
    default:
      return pickFromPoolNoRepeat(getPool(cat, level));
  }
}

function getPool(cat, level) {
  var pool = (window.QUIZ_REGISTRY[cat] && window.QUIZ_REGISTRY[cat][level]) || [];
  if (!pool.length) {
    return [{
      question: "No questions yet for this class. Add some in " + cat + "/class" + level + ".js",
      answer: "OK", options: ["OK", "OK", "OK", "OK"], size: "small"
    }];
  }
  return pool;
}

/* ============================================
   MATH GENERATORS - PROCEDURAL (infinite questions)
   ============================================ */
const LKG_COUNT_ICONS = ['🍎','⭐','🎈','🐶','🐱','🧸','🚗','🌸','🍭','⚽','🦋','🐣'];

function genAddSub(level) {
  let a, b, op, answer, qText, size = 'large';
  if (level === 0) {
    // LKG — pure picture counting or tiny picture addition (numbers 1-5),
    // no operators to read, just pictures a pre-reader can count.
    const icon = pickRandom(LKG_COUNT_ICONS);
    if (Math.random() < 0.5) {
      a = rand(1, 5);
      qText = icon.repeat(a) + '  —  Count them!';
      answer = a;
    } else {
      a = rand(1, 3); b = rand(1, 3);
      qText = icon.repeat(a) + ' + ' + icon.repeat(b) + ' = ?';
      answer = a + b;
    }
    return { question: qText, answer: answer, options: buildNumericOptions(answer, 3), size: 'pico' };
  }
  if (level === 1) { a = rand(0, 9); b = rand(0, 9); }
  else if (level === 2) { a = rand(5, 30); b = rand(1, 20); }
  else if (level === 3) { a = rand(20, 99); b = rand(10, 70); }
  else if (level === 4) { a = rand(100, 500); b = rand(50, 300); size = 'medium'; }
  else if (level === 5) { a = rand(200, 999); b = rand(100, 800); size = 'medium'; }
  else if (level <= 7) { a = rand(500, 5000); b = rand(200, 2500); size = 'medium'; }
  else if (level <= 9) { a = rand(1000, 25000); b = rand(500, 12000); size = 'small'; }
  else { a = rand(5000, 99999); b = rand(1000, 50000); size = 'small'; }
  op = Math.random() < 0.5 ? '+' : '−';
  if (op === '+') { answer = a + b; qText = a + ' + ' + b; }
  else {
    if (b > a) { const t = a; a = b; b = t; }
    answer = a - b; qText = a + ' − ' + b;
  }
  // Integers for class 8+
  if (level >= 8 && Math.random() < 0.35) {
    a = rand(-50, 80); b = rand(-40, 60);
    if (Math.random() < 0.5) { answer = a + b; qText = '(' + a + ') + (' + b + ')'; }
    else { answer = a - b; qText = '(' + a + ') − (' + b + ')'; }
    size = 'small';
  }
  const range = Math.max(3, Math.floor(Math.abs(answer) * 0.15) + 2);
  return { question: qText, answer: answer, options: buildNumericOptions(answer, range), size: size };
}

function genMultiply(level) {
  let a, b;
  if (level === 1) { a = rand(1, 5); b = rand(1, 5); }
  else if (level === 2) { a = rand(2, 10); b = rand(1, 10); }
  else if (level === 3) { a = rand(2, 12); b = rand(2, 10); }
  else if (level === 4) { a = rand(10, 25); b = rand(2, 9); }
  else if (level === 5) { a = rand(11, 25); b = rand(11, 20); }
  else if (level <= 7) { a = rand(12, 99); b = rand(3, 25); }
  else if (level <= 9) { a = rand(-20, 40); b = rand(-12, 18); if (a === 0) a = 7; if (b === 0) b = 5; }
  else { a = rand(15, 120); b = rand(11, 35); }
  // Fractions of a number (class 6–8)
  if (level >= 6 && level <= 8 && Math.random() < 0.3) {
    const whole = rand(12, 120);
    const num = pickRandom([1, 1, 2, 3]);
    const den = pickRandom([2, 3, 4, 5]);
    if (whole % den !== 0) {
      const w2 = Math.floor(whole / den) * den || den * rand(3, 20);
      const answer = (w2 / den) * num;
      return {
        question: 'Find ' + num + '/' + den + ' of ' + w2,
        answer: answer,
        options: buildNumericOptions(answer, Math.max(3, Math.floor(answer * 0.25) + 2)),
        size: 'small'
      };
    }
    const answer = (whole / den) * num;
    return {
      question: 'Find ' + num + '/' + den + ' of ' + whole,
      answer: answer,
      options: buildNumericOptions(answer, Math.max(3, Math.floor(answer * 0.25) + 2)),
      size: 'small'
    };
  }
  // Percent (class 7+)
  if (level >= 7 && Math.random() < 0.25) {
    const base = rand(2, 20) * 10;
    const pct = pickRandom([5, 10, 15, 20, 25, 50]);
    const answer = (base * pct) / 100;
    return {
      question: pct + '% of ' + base + ' = ?',
      answer: answer,
      options: buildNumericOptions(answer, Math.max(3, Math.floor(answer * 0.3) + 2)),
      size: 'small'
    };
  }
  const answer = a * b;
  const qText = a + ' × ' + b;
  const range = Math.max(5, Math.floor(Math.abs(answer) * 0.2) + 3);
  return { question: qText, answer: answer, options: buildNumericOptions(answer, range), size: level >= 6 ? 'medium' : 'large' };
}

function genDivide(level) {
  let divisor, quotient;
  if (level === 1) { divisor = rand(1, 5); quotient = rand(1, 5); }
  else if (level === 2) { divisor = rand(2, 5); quotient = rand(2, 10); }
  else if (level === 3) { divisor = rand(2, 9); quotient = rand(2, 10); }
  else if (level === 4) { divisor = rand(2, 10); quotient = rand(5, 15); }
  else if (level === 5) { divisor = rand(3, 12); quotient = rand(5, 25); }
  else if (level <= 7) { divisor = rand(4, 25); quotient = rand(6, 40); }
  else if (level <= 9) { divisor = rand(5, 30); quotient = rand(8, 50); }
  else { divisor = rand(6, 40); quotient = rand(10, 60); }
  // Simple linear: ax = b (class 8+)
  if (level >= 8 && Math.random() < 0.35) {
    const x = rand(2, 25);
    const coef = rand(2, 12);
    return {
      question: 'Solve: ' + coef + 'x = ' + (coef * x),
      answer: x,
      options: buildNumericOptions(x, Math.max(3, Math.floor(x * 0.3) + 2)),
      size: 'small'
    };
  }
  const dividend = divisor * quotient;
  const qText = dividend + ' ÷ ' + divisor;
  const range = Math.max(3, Math.floor(quotient * 0.3) + 2);
  return { question: qText, answer: quotient, options: buildNumericOptions(quotient, range), size: level >= 6 ? 'medium' : 'large' };
}

function genMixedMath(level) {
  const ops = level <= 2 ? ['+', '−']
    : level <= 3 ? ['+', '−', '×']
    : level <= 5 ? ['+', '−', '×', '÷']
    : ['+', '−', '×', '÷', '×', '÷'];
  const op = pickRandom(ops);
  if (op === '+' || op === '−') return genAddSub(level);
  if (op === '×') return genMultiply(Math.max(1, level - 1));
  return genDivide(Math.max(1, level - 1));
}

function genPatterns(level) {
  let types = ['arith'];
  if (level >= 3) types.push('arith2');
  if (level >= 4) types.push('mult');
  if (level >= 6) types.push('square');
  if (level >= 8) types.push('fib');
  const type = pickRandom(types);
  let seq, next, qText;
  if (type === 'arith') {
    const start = rand(1, level <= 2 ? 10 : level <= 5 ? 30 : 80);
    const step = rand(1, level <= 2 ? 3 : level <= 5 ? 6 : 12);
    seq = [start, start + step, start + 2 * step, start + 3 * step];
    next = start + 4 * step;
  } else if (type === 'arith2') {
    const start = rand(2, 40);
    const step = rand(2, level >= 6 ? 15 : 8);
    seq = [start, start + step, start + 2 * step, start + 3 * step];
    next = start + 4 * step;
  } else if (type === 'mult') {
    const start = rand(2, 5);
    const factor = rand(2, level >= 7 ? 4 : 3);
    seq = [start, start * factor, start * factor * factor];
    next = start * factor * factor * factor;
  } else if (type === 'square') {
    const n = rand(2, level >= 8 ? 12 : 8);
    seq = [n * n, (n + 1) * (n + 1), (n + 2) * (n + 2)];
    next = (n + 3) * (n + 3);
  } else {
    let a = 1, b = 1;
    seq = [a, b];
    for (let i = 0; i < 3; i++) { const c = a + b; a = b; b = c; seq.push(c); }
    next = a + b;
    seq = seq.slice(0, 5);
  }
  qText = 'Next number? ' + seq.join(', ') + ', __';
  const range = Math.max(3, Math.floor(Math.abs(next) * 0.2) + 2);
  return { question: qText, answer: next, options: buildNumericOptions(next, range), size: 'small' };
}

function genReasoning(level) {
  const types = level >= 6 ? ['compare', 'missing', 'word', 'ratio'] : ['compare', 'missing', 'word'];
  const type = pickRandom(types);
  if (type === 'compare') {
    const a = rand(1, level * 25);
    const b = rand(1, level * 25);
    if (a === b) return genReasoning(level);
    const correct = a > b ? 'Greater' : 'Smaller';
    return {
      question: 'Is ' + a + ' greater or smaller than ' + b + '?',
      answer: correct,
      options: shuffle(['Greater', 'Smaller', 'Equal', 'Cannot say']),
      size: 'small'
    };
  } else if (type === 'missing') {
    const a = rand(2, level * 12);
    const b = rand(2, level * 12);
    const sum = a + b;
    return {
      question: a + ' + __ = ' + sum,
      answer: b,
      options: buildNumericOptions(b, Math.max(3, Math.floor(b * 0.3) + 2)),
      size: 'large'
    };
  } else if (type === 'ratio') {
    const a = rand(2, 9);
    const b = rand(2, 9);
    const k = rand(2, 8);
    return {
      question: 'If ratio is ' + a + ':' + b + ', find part when total is ' + ((a + b) * k) + ' for first part',
      answer: a * k,
      options: buildNumericOptions(a * k, Math.max(3, a + 2)),
      size: 'small'
    };
  } else {
    const items = level <= 2 ? rand(2, 8) : level <= 5 ? rand(5, 30) : rand(20, 120);
    const more = level <= 2 ? rand(1, 5) : level <= 5 ? rand(2, 20) : rand(10, 80);
    const total = items + more;
    return {
      question: 'Ravi has ' + items + ' apples. He gets ' + more + ' more. How many now?',
      answer: total,
      options: buildNumericOptions(total, 4),
      size: 'small'
    };
  }
}

/* ============================================
   BACK BUTTON: confirm-quit while a quiz is in progress
   ============================================ */
// Some browsers/WebViews can fire a spurious popstate event in the brief
// window right after a page loads and calls history.pushState() below —
// not from an actual back-button press. That was making the "Are you
// sure?" popup appear immediately when the quiz started. This short grace
// window ignores any popstate before a real back-press could plausibly
// have happened.
let __backGuardReady = false;
setTimeout(function () { __backGuardReady = true; }, 700);

window.addEventListener('popstate', function () {
  if (!__backGuardReady) return;
  const quizVisible = !document.getElementById('quizScreen').classList.contains('hidden');
  if (quizVisible && quizInProgress) {
    __quitFromPopstate = true;
    pauseTimerForQuitPopup();
    var m = document.getElementById('quitConfirmModal');
    if (m) {
      m.classList.remove('hidden');
      m.style.display = 'flex';
    }
  }
});
history.pushState({ screen: 'quizScreen' }, '', '');

/* ============================================
   INIT
   ============================================ */
initBackgroundDecor();
attachRipple('.btn');
attachRipple('.option-btn');
attachRipple('.android-action-btn');

startQuiz(currentLevel);
</script>
