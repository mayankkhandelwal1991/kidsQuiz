<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Quiz - Sign In</title>
<link rel="stylesheet" href="quiz-theme.css">
</head>
<body>

<div class="bg-decor" id="bgDecor"></div>

<!-- FULL-PAGE AUTH-CHECK LOADER -->
<!-- Shown immediately on load and kept up while we ask Firebase whether the
     user already has a session. If they do, we skip straight to quiz-home.html
     (no flash of this sign-in screen). If they don't, we hide this and show
     the normal sign-in screen exactly as before. -->
<div id="authLoader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);">
  <div style="width:52px;height:52px;border-radius:50%;border:5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:authSpin .8s linear infinite;"></div>
  <div style="color:#fff;font-family:inherit;font-weight:700;font-size:15px;letter-spacing:.3px;">Loading…</div>
</div>
<style>@keyframes authSpin{to{transform:rotate(360deg)}}</style>

<div class="container">

  <!-- NAME ENTRY SCREEN -->
  <div id="nameScreen" class="hidden">
    <h1>🎯 Kids Quiz</h1>
    <p class="subtitle">Sign in with Google, or continue as a guest</p>
    <div class="center" style="margin-top:20px">
      <button class="btn" id="googleGateBtn" onclick="gateSignIn()" style="display:inline-flex;align-items:center;gap:10px">
        <span style="width:22px;height:22px;border-radius:50%;background:#fff;color:#4285F4;font-weight:800;display:inline-flex;align-items:center;justify-content:center">G</span>
        Sign in with Google
      </button>
    </div>
    <p id="gateMsg" class="subtitle" style="margin-top:14px;font-size:12px;color:#ffd1d1;min-height:16px"></p>
    <div class="center" style="margin-top:8px">
      <button class="btn" id="guestGateBtn" onclick="continueAsGuest()" style="background:transparent;border:1px solid rgba(255,255,255,.6)">
        Continue as Guest
      </button>
    </div>
    <p class="subtitle" style="margin-top:6px;font-size:11px;opacity:.75">Sign in to save scores to your account and appear on the leaderboard. Guest progress is saved only on this device.</p>

    <div class="android-actions">
      <button class="android-action-btn rate-btn" onclick="rateApp()">
        <span class="aa-icon">⭐</span>
        <span class="aa-text">
          <span class="aa-title">Rate Us</span>
          <span class="aa-sub">Enjoying the app? Let us know!</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn share-btn" onclick="shareApp()">
        <span class="aa-icon">📤</span>
        <span class="aa-text">
          <span class="aa-title">Share with Friends</span>
          <span class="aa-sub">Spread the fun to others</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn" onclick="moreGames()">
        <span class="aa-icon">🎮</span>
        <span class="aa-text">
          <span class="aa-title">More Games</span>
          <span class="aa-sub">See all our apps on Google Play</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn insta-btn" onclick="openInstagram()">
        <span class="aa-icon">📷</span>
        <span class="aa-text">
          <span class="aa-title">Follow us on Instagram</span>
          <span class="aa-sub">Updates, tips &amp; fun content</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
    </div>

  </div>

</div>

<script src="quiz-shared.js"></script>
<script>
/* ============================================
   INIT
   ============================================ */
initBackgroundDecor();

function initRipples() {
  attachRipple('.android-action-btn');
}
initRipples();

// ---- Mandatory Google sign-in gate ----------------------------------------
// The app cannot be used until the user is signed in with Google (or chooses
// Guest). Once resolved, we hand off to quiz-home.html — this page's only job
// is the sign-in / guest decision.
function gateSignIn() {
  const msg = document.getElementById('gateMsg');
  if (msg) msg.textContent = '';
  if (!window.KQ || !KQ.signIn) {
    if (msg) msg.textContent = 'Sign-in is still loading, please wait a moment…';
    return;
  }
  KQ.signIn().then(function (u) {
    // onAuth (below) redirects to quiz-home.html on success; show a hint on cancel.
    if (!u && msg) msg.textContent = 'Sign-in was not completed. Please try again.';
  });
}

function goToQuizHome() {
  window.location.href = 'quiz-home.html';
}

function continueAsGuest() {
  setCachedGuest(true);
  clearCachedAuth();
  goToQuizHome();
}

function showLoginGate() {
  clearCachedAuth();
  setCachedGuest(false);
  document.getElementById('nameScreen').classList.remove('hidden');
  hideAuthLoader();
}

function hideAuthLoader() {
  const el = document.getElementById('authLoader');
  if (el) el.style.display = 'none';
}

(function initAuthGate() {
  // Don't show the login gate yet — keep the full-page loader up instead, so
  // an already-logged-in user never sees the sign-in screen flash by. If we
  // already know from last time that this browser was signed in (or chose
  // Guest), skip the wait entirely and go straight to the home page.
  if (getCachedAuth() || getCachedGuest()) {
    goToQuizHome();
    return;
  }

  let authChecked = false;
  function start() {
    KQ.onAuth(function (u) {
      authChecked = true;
      if (u && !u.isGuest) {
        setCachedAuth(u);
        goToQuizHome();
      } else {
        showLoginGate();
      }
    });
  }
  if (window.KQ) { start(); }
  else {
    const t = setInterval(function () {
      if (window.KQ) { clearInterval(t); start(); }
    }, 50);
    setTimeout(function () { clearInterval(t); }, 20000);
  }
  // Safety net: if auth state hasn't resolved after a few seconds (e.g. KQ
  // failed to load), fall back to the normal sign-in screen instead of
  // leaving the user stuck on the loader forever.
  setTimeout(function () {
    if (!authChecked) showLoginGate();
  }, 8000);
})();
</script>
<script src="Game/kq-leaderboard.js"></script>
</body>
</html>
