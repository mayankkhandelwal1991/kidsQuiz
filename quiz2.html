<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Quiz</title>
<link rel="stylesheet" href="quiz-theme.css">
<style>
  html, body {
    margin: 0;
    min-height: 100%;
  }
  /* While the splash is up we lock scrolling; showGate() releases it. */
  html.splash-locked, body.splash-locked { height: 100%; overflow: hidden; }

  #splashScreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }

  /* Logo image (or emoji fallback) with a gentle pop-in + breathing loop */
  .splash-logo-wrap {
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 28px;
    background: rgba(255,255,255,.14);
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
    animation: splashPop .6s cubic-bezier(.34,1.56,.64,1) both,
               splashBreathe 2.4s ease-in-out .6s infinite;
  }
  #splashLogoImg {
    width: 78px;
    height: 78px;
    object-fit: contain;
    border-radius: 18px;
  }
  #splashLogoFallback {
    font-size: 56px;
    line-height: 1;
    display: none;
  }

  #splashTitle {
    color: #fff;
    font-family: inherit;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: .4px;
    margin: 0;
    opacity: 0;
    animation: splashFadeUp .6s ease-out .25s forwards;
  }
  #splashSubtitle {
    color: rgba(255,255,255,.85);
    font-family: inherit;
    font-size: 13px;
    margin: -12px 0 0;
    opacity: 0;
    animation: splashFadeUp .6s ease-out .4s forwards;
  }

  /* Bouncing-dots loading indicator */
  .splash-dots {
    display: flex;
    gap: 8px;
    margin-top: 6px;
    opacity: 0;
    animation: splashFadeUp .5s ease-out .6s forwards;
  }
  .splash-dots span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    display: inline-block;
    animation: splashDotBounce 1.1s ease-in-out infinite both;
  }
  .splash-dots span:nth-child(1) { animation-delay: 0s; }
  .splash-dots span:nth-child(2) { animation-delay: .15s; }
  .splash-dots span:nth-child(3) { animation-delay: .3s; }

  #splashStatus {
    color: rgba(255,255,255,.7);
    font-family: inherit;
    font-size: 11px;
    margin-top: 2px;
    min-height: 14px;
    opacity: 0;
    animation: splashFadeUp .5s ease-out .75s forwards;
  }

  @keyframes splashPop {
    0%   { transform: scale(.4); opacity: 0; }
    100% { transform: scale(1);  opacity: 1; }
  }
  @keyframes splashBreathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  @keyframes splashFadeUp {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes splashDotBounce {
    0%, 80%, 100% { transform: scale(.6); opacity: .5; }
    40%           { transform: scale(1);  opacity: 1; }
  }
</style>
</head>
<body class="splash-locked">

<div class="bg-decor" id="bgDecor"></div>

<!-- SPLASH SCREEN -->
<!-- Shown immediately on load. Plays the logo/loading animation while we ask
     Firebase (in the background) whether the user already has a Google
     session. Once we know:
       - signed in  -> go straight to quiz-home.html
       - not signed -> hide this splash and reveal the sign-in gate BELOW
                       (Google + Guest). We never redirect a signed-out user
                       to a page that needs a session, so there is no bounce. -->
<div id="splashScreen">
  <div class="splash-logo-wrap">
    <img id="splashLogoImg" src="images/splash-logo.png" alt="Kids Quiz"
         onerror="this.style.display='none'; document.getElementById('splashLogoFallback').style.display='block';">
    <div id="splashLogoFallback">🎯</div>
  </div>
  <h1 id="splashTitle">Kids Quiz</h1>
  <p id="splashSubtitle">Learning made fun!</p>
  <div class="splash-dots"><span></span><span></span><span></span></div>
  <p id="splashStatus"></p>
</div>

<!-- SIGN-IN GATE (revealed only when the user is NOT signed in) -->
<div class="container">
  <div id="nameScreen" class="hidden">
    <h1>🎯 Kids Quiz</h1>
    <p class="subtitle">Sign in with Google, or continue as a guest</p>
    <div class="center" style="margin-top:20px">
      <button class="btn" id="googleGateBtn" onclick="gateSignIn()" style="display:inline-flex;align-items:center;gap:10px">
        <span style="width:22px;height:22px;border-radius:50%;background:#fff;color:#4285F4;font-weight:800;display:inline-flex;align-items:center;justify-content:center">G</span>
        Sign in with Google
      </button>
    </div>
    <p id="gateMsg" class="subtitle" style="margin-top:14px;font-size:12px;color:#ffd1d1;min-height:16px"></p>
    <div class="center" style="margin-top:8px">
      <button class="btn" id="guestGateBtn" onclick="continueAsGuest()" style="background:transparent;border:1px solid rgba(255,255,255,.6)">
        Continue as Guest
      </button>
    </div>
    <p class="subtitle" style="margin-top:6px;font-size:11px;opacity:.75">Sign in to save scores to your account and appear on the leaderboard. Guest progress is saved only on this device.</p>

    <div class="android-actions">
      <button class="android-action-btn rate-btn" onclick="rateApp()">
        <span class="aa-icon">⭐</span>
        <span class="aa-text">
          <span class="aa-title">Rate Us</span>
          <span class="aa-sub">Enjoying the app? Let us know!</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn share-btn" onclick="shareApp()">
        <span class="aa-icon">📤</span>
        <span class="aa-text">
          <span class="aa-title">Share with Friends</span>
          <span class="aa-sub">Spread the fun to others</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn" onclick="moreGames()">
        <span class="aa-icon">🎮</span>
        <span class="aa-text">
          <span class="aa-title">More Games</span>
          <span class="aa-sub">See all our apps on Google Play</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
      <button class="android-action-btn insta-btn" onclick="openInstagram()">
        <span class="aa-icon">📷</span>
        <span class="aa-text">
          <span class="aa-title">Follow us on Instagram</span>
          <span class="aa-sub">Updates, tips &amp; fun content</span>
        </span>
        <span class="aa-chevron">›</span>
      </button>
    </div>
  </div>
</div>

<script src="quiz-shared.js"></script>
<script>
/* ============================================
   INIT
   ============================================ */
initBackgroundDecor();

/* ============================================================
   SPLASH -> AUTH CHECK -> (home | sign-in gate)
   ============================================================
   Routing rules:
     - Cached Google session, or previously chose Guest -> quiz-home.html
     - Real Google session confirmed by Firebase         -> quiz-home.html
     - Nobody signed in                                  -> show the gate here
   The gate is shown ON THIS PAGE, so a signed-out user is never redirected
   to a session-required page (which is what caused the reload loop).
============================================================ */
const MIN_SPLASH_MS  = 1500;   // keep the splash up at least this long (no flash)
const AUTH_TIMEOUT_MS = 8000;  // fall back to the gate if auth never resolves

function setSplashStatus(text) {
  const el = document.getElementById('splashStatus');
  if (el) el.textContent = text || '';
}

function releaseScroll() {
  document.documentElement.classList.remove('splash-locked');
  document.body.classList.remove('splash-locked');
}

function goHome() {
  // replace() so the back button can't return here and re-trigger routing.
  window.location.replace('quiz-home.html');
}

let gateShown = false;
function showGate() {
  if (gateShown) return;
  gateShown = true;
  const splash = document.getElementById('splashScreen');
  if (splash) splash.style.display = 'none';
  releaseScroll();
  document.getElementById('nameScreen').classList.remove('hidden');
  try { attachRipple('.android-action-btn'); } catch (e) {}

  // If a real Google sign-in completes later (web popup, native, or redirect),
  // send them home. We only react to a genuine (non-guest) user, so the
  // transient guest KQ reports before it's ready is safely ignored.
  if (window.KQ && KQ.onAuth) {
    KQ.onAuth(function (u) {
      if (u && !u.isGuest) { setCachedAuth(u); goHome(); }
    });
  }
}

/* ---- Gate button handlers ------------------------------------------------ */
function gateSignIn() {
  const msg = document.getElementById('gateMsg');
  if (msg) msg.textContent = '';
  if (!window.KQ || !KQ.signIn) {
    if (msg) msg.textContent = 'Sign-in is still loading, please wait a moment…';
    return;
  }
  KQ.signIn().then(function (u) {
    if (u && !u.isGuest) {
      setCachedAuth(u);
      goHome();
    } else if (!u && msg) {
      // Native / redirect sign-in resolves via the onAuth listener in showGate();
      // only show this hint if the user actually cancelled a popup.
      msg.textContent = 'Sign-in was not completed. Please try again.';
    }
  }).catch(function () {
    if (msg) msg.textContent = 'Sign-in failed. Please try again.';
  });
}

function continueAsGuest() {
  setCachedGuest(true);
  clearCachedAuth();
  goHome();
}

/* ---- Splash + decision --------------------------------------------------- */
(function initSplash() {
  const startTime = Date.now();
  setSplashStatus('Checking your account…');

  function afterMinSplash(fn) {
    const remaining = Math.max(0, MIN_SPLASH_MS - (Date.now() - startTime));
    setTimeout(fn, remaining);
  }

  // A deliberate sign-out sets this flag so we always land on the gate and
  // never auto-home from a cached or still-clearing session.
  let signingOut = false;
  try {
    signingOut = sessionStorage.getItem('kq_signing_out') === '1';
    sessionStorage.removeItem('kq_signing_out');
  } catch (e) {}

  // Fast path: returning user (cached Google login, or chose Guest before).
  if (!signingOut && (getCachedAuth() || getCachedGuest())) {
    afterMinSplash(goHome);
    return;
  }

  let settled = false;
  function decideHome() { if (settled) return; settled = true; afterMinSplash(goHome); }
  function decideGate() { if (settled) return; settled = true; afterMinSplash(showGate); }

  function start() {
    // Wait for KQ.ready: it now resolves only after Firebase reports the real
    // auth state, so KQ.user() here is authoritative (not the transient guest).
    KQ.ready.then(function () {
      const u = KQ.user();
      if (u && !u.isGuest) { setCachedAuth(u); decideHome(); }
      else { decideGate(); }
    });
  }

  if (window.KQ) {
    start();
  } else {
    const t = setInterval(function () {
      if (window.KQ) { clearInterval(t); start(); }
    }, 50);
    setTimeout(function () { clearInterval(t); }, AUTH_TIMEOUT_MS);
  }

  // Safety net: if auth never resolves (KQ failed to load / slow network),
  // fall back to the sign-in gate rather than hang on the splash.
  setTimeout(function () {
    setSplashStatus('Taking a bit longer than usual…');
    decideGate();
  }, AUTH_TIMEOUT_MS);
})();
</script>
<script src="Game/kq-leaderboard.js"></script>
</body>
</html>
