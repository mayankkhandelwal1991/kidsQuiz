  sentence highlighted, then 3 questions. Scenes are drawn from a sky/ground
  backdrop plus Twemoji "actors" with simple animations, so a new story is just

<style>

  .hello h2 { margin: 0; font-size: 21px; line-height: 1.1; } .hello p { margin: 2px 0 0; color: var(--muted); font-weight: 700; font-size: 14px; }
  .owl { width: 64px; height: 64px; flex: 0 0 auto; animation: bob 2.6s ease-in-out infinite; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: none; border-radius: 999px; padding: 8px 16px; background: #fff; color: var(--ink); font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 rgba(0,0,0,.08); }
  .chip.on { background: #7c3aed; color: #fff; box-shadow: 0 3px 0 #5b21b6; }

  .card { position: relative; border: none; background: #fff; border-radius: 26px; padding: 0; overflow: hidden; text-align: left; box-shadow: 0 7px 0 rgba(124,58,237,.12), 0 10px 22px rgba(30,27,75,.08); animation: pop .4s cubic-bezier(.34,1.56,.64,1) backwards; }
  .card:active { transform: translateY(4px); }
  .card .sc { border-radius: 0; }

  .card .info { display: block; padding: 8px 10px 10px; }
  .card b { display: block; font-size: 16px; line-height: 1.15; }
  .card small { display: block; color: var(--muted); font-weight: 700; font-size: 11.5px; line-height: 1.25; margin-top: 2px; }
  .card .stars { font-size: 14px; }
  .tag { position: absolute; top: 8px; left: 8px; z-index: 5; background: #facc15; color: #713f12; border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 800; box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .tag.me { left: auto; right: 8px; background: #fff; color: #7c3aed; }
  .stars { color: #f59e0b; letter-spacing: 2px; font-size: 17px; }
  .soon { background: rgba(255,255,255,.7); border-radius: 22px; padding: 16px; text-align: center; color: var(--muted); font-weight: 700; }

  /* ---------- scene ---------- */
  .sc { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 26px; overflow: hidden; background: linear-gradient(180deg, var(--s1), var(--s2)); }
  .sc .gd { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 38%; }
  .sc .stars-bg { position: absolute; inset: 0; background: radial-gradient(circle, #fff 0 1.2px, transparent 2px) 0 0 / 38px 38px, radial-gradient(circle, rgba(255,255,255,.7) 0 1px, transparent 1.6px) 19px 13px / 52px 52px; }
  .sc .ac { position: absolute; transform: translate(-50%, -100%); animation: acIn .5s cubic-bezier(.34,1.56,.64,1) backwards; z-index: 2; }
  .sc .ac .fl { display: block; }
  .sc .ac.flip .fl { transform: scaleX(-1); }
  .sc .ac img { display: block; width: 100%; height: auto; filter: drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
  .a-bob img { animation: bob 2.4s ease-in-out infinite; }
  .a-hop img { animation: hop 1.1s ease-in-out infinite; }
  .a-fly img { animation: fly 3s ease-in-out infinite; }
  .a-walk img { animation: walk .9s ease-in-out infinite; }
  .a-shake img { animation: shake .7s ease-in-out infinite; }
  .a-grow img { animation: grow 1.8s ease-in-out infinite; }
  .a-spin img { animation: spin 10s linear infinite; }
  .a-float img { animation: float 4s ease-in-out infinite; }
  .a-gold img { filter: drop-shadow(0 0 8px #fde047); }
  .sc .ac .fl { position: relative; }
  .sc .ac .gm { position: absolute; inset: 0; background: linear-gradient(135deg, #fef08a, #f59e0b 60%, #b45309); mix-blend-mode: multiply; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; pointer-events: none; }
  .a-tint-green img { filter: sepia(1) saturate(5) hue-rotate(55deg) drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
  .a-tint-blue img { filter: sepia(1) saturate(5) hue-rotate(170deg) drop-shadow(0 4px 3px rgba(0,0,0,.18)); }
  @keyframes acIn { from { opacity: 0; transform: translate(-50%, -80%) scale(.3); } }
  @keyframes bob { 50% { transform: translateY(-6%); } }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-22%); } 60% { transform: translateY(-18%); } }
  @keyframes fly { 25% { transform: translate(6%, -10%) rotate(-4deg); } 75% { transform: translate(-6%, 6%) rotate(4deg); } }
  @keyframes walk { 25% { transform: rotate(-6deg) translateY(-3%); } 75% { transform: rotate(6deg) translateY(-3%); } }
  @keyframes shake { 20% { transform: rotate(-9deg); } 40% { transform: rotate(8deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
  @keyframes grow { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes float { 50% { transform: translate(4%, -10%); } }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } }

  /* ---------- reader ---------- */
  .dots { display: flex; gap: 5px; justify-content: center; margin: 10px 0 8px; flex-wrap: wrap; }
  .dots i { width: 22px; height: 8px; border-radius: 4px; background: #e9d5ff; } .dots i.on { background: #7c3aed; } .dots i.done { background: #c4b5fd; }
  .txt { background: #fff; border-radius: 24px; padding: 14px 16px; font-size: var(--fs, 21px); font-weight: 700; line-height: 1.45; min-height: 96px; box-shadow: 0 6px 18px rgba(76,29,149,.08); animation: pop .35s ease-out; }
  .txt span { border-radius: 8px; transition: background .2s, color .2s; padding: 0 2px; }
  .txt span.on { background: #fef08a; color: #1e1b4b; }
  .ctl { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; margin-top: 12px; align-items: center; }
  .cb { height: 60px; border: none; border-radius: 20px; font-size: 26px; font-weight: 800; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.18); display: flex; align-items: center; justify-content: center; gap: 8px; }
  .cb:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.18); }
  .cb:disabled { opacity: .35; }
  .cb.prev { background: #a78bfa; } .cb.next { background: linear-gradient(135deg, #22c55e, #16a34a); }
  .cb.say { background: #0ea5e9; font-size: 18px; }
  .cb.say.playing { background: #f59e0b; }
  .auto { height: 6px; border-radius: 3px; background: rgba(124,58,237,.12); margin: 12px 4px 0; overflow: hidden; }
  .auto i { display: block; height: 100%; width: 0; background: #7c3aed; border-radius: 3px; }
  .auto i.run { width: 100%; transition: width 1.6s linear; }
  .chips.gen { padding-top: 0; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .tab { border: none; border-radius: 18px; padding: 10px 6px; background: #fff; font-weight: 800; font-size: 16px; color: var(--ink); display: flex; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .tab.on { background: linear-gradient(135deg, #f97316, #ec4899); color: #fff; box-shadow: 0 4px 0 #be185d; }
  .txt.lines span { display: block; padding: 2px 6px; }
  .read { color: #16a34a; font-weight: 800; font-size: 13px; }
  .big.skip { background: #94a3b8; }
  .qskip { display: block; margin: 14px auto 0; border: none; background: none; color: #6b7280; font-weight: 800; font-size: 15px; text-decoration: underline; }
  .chip.g { display: inline-flex; align-items: center; gap: 4px; font-size: 14px; padding: 6px 12px; }
  .chip.g.on { background: #f59e0b; box-shadow: 0 3px 0 #b45309; }
  .q { background: #fff; border-radius: 26px; padding: 16px; box-shadow: 0 6px 18px rgba(76,29,149,.08); animation: pop .35s ease-out; }
  .q h3 { margin: 0 0 12px; font-size: 22px; line-height: 1.2; text-align: center; }
  .opts { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .opts.pics { grid-template-columns: repeat(3, 1fr); }
  .opts.pics.n4 { grid-template-columns: 1fr 1fr; }
  .op { border: none; border-radius: 20px; padding: 12px; min-height: 62px; font-size: 18px; font-weight: 800; color: #fff; background: var(--c); box-shadow: 0 5px 0 rgba(0,0,0,.18); line-height: 1.2; }
  .opts.pics .op { min-height: 104px; background: #f5f3ff; box-shadow: 0 5px 0 #ddd6fe; }
  .op:active { transform: translateY(3px); }
  .op.ok { background: #22c55e !important; animation: grow .5s; } .op.no { background: #ef4444 !important; animation: shake .45s; } .op.dim { opacity: .45; }
  .end { text-align: center; background: #fff; border-radius: 26px; padding: 22px 16px; box-shadow: 0 6px 18px rgba(76,29,149,.08); animation: pop .4s ease-out; }
  .end h2 { margin: 6px 0 2px; font-size: 28px; } .end .stars { font-size: 40px; }
  .end .moral { background: #fef3c7; border-radius: 16px; padding: 8px 12px; font-weight: 700; margin: 10px 0; }
  .big { width: 100%; border: none; border-radius: 20px; padding: 14px; font-size: 20px; font-weight: 800; color: #fff; margin-top: 10px; box-shadow: 0 5px 0 rgba(0,0,0,.18); }
  .big.go { background: linear-gradient(135deg, #f97316, #ec4899); } .big.alt { background: #7c3aed; }
  @media (max-width: 360px) { .bar h1 { font-size: 20px; } .txt { font-size: calc(var(--fs, 21px) - 2px); } .cb { height: 54px; } .ctl { grid-template-columns: 56px 1fr 56px; } }
  @media (min-width: 900px) and (min-height: 700px) { .reader { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; align-items: start; } .reader .dots { grid-column: 1 / -1; order: -1; } }
  @media (prefers-reduced-motion: reduce) { .sc *, .card { animation: none !important; } }

<script>
window.isGuestUser = false;
(function () {

  else if (getCachedGuest()) { window.isGuestUser = true; currentUser = 'Guest'; }

window.KQFX_NO_MUTE = true;
</script>
<script>
(function () {
  'use strict';
  const $app = document.getElementById('app');
  const LEVELS = [0, -1, 1, 2, 3, 4, 5];
  const LBL = (l) => (l === 0 ? 'LKG' : l === -1 ? 'UKG' : 'Class ' + l);
  const FONT = { '0': 26, '-1': 24, '1': 22, '2': 21, '3': 20, '4': 19, '5': 19 };
  const OPT_COLORS = ['#f43f5e', '#f59e0b', '#06b6d4', '#8b5cf6'];
  // sky (top, bottom), hills (back, front), extras
  const BG = {
    meadow: { s: ['#7dd3fc', '#e0f2fe'], h: ['#86efac', '#4ade80'] },
    garden: { s: ['#bae6fd', '#f0f9ff'], h: ['#bbf7d0', '#86efac'], flowers: 1 },
    park: { s: ['#93c5fd', '#eff6ff'], h: ['#a7f3d0', '#34d399'] },
    sky: { s: ['#38bdf8', '#e0f2fe'], h: null },
    desert: { s: ['#fdba74', '#fef3c7'], h: ['#fcd34d', '#f59e0b'] },
    river: { s: ['#7dd3fc', '#e0f2fe'], h: ['#86efac', '#4ade80'], water: 1 },
    forest: { s: ['#a7f3d0', '#ecfdf5'], h: ['#22c55e', '#15803d'], trees: 1 },
    village: { s: ['#fed7aa', '#fff7ed'], h: ['#bef264', '#84cc16'] },
    palace: { s: ['#fde68a', '#fef9c3'], h: null, floor: '#b45309', arches: 1 },
    night: { s: ['#1e1b4b', '#4338ca'], h: ['#312e81', '#1e1b4b'], stars: 1 },
    space: { s: ['#020617', '#312e81'], h: null, stars: 1 },
  };

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const cp = (e) => Array.from(String(e)).map((c) => c.codePointAt(0)).filter((c) => c !== 0xfe0f).map((c) => c.toString(16)).join('-');
  const emo = (e, px) => '<img class="e" src="../images/emoji/' + cp(e) + '.svg" alt="" width="' + px + '" height="' + px + '" onerror="this.replaceWith(document.createTextNode(\'' + esc(e) + '\'))">';
  const isPic = (s) => !/[A-Za-z]/.test(s);
  const GENRES = { rhyme: ['🎵', 'Rhymes'], song: ['🎤', 'Learning songs'], hindi: ['🇮🇳', 'Hindi'], animals: ['🐾', 'Animals'], moral: ['💡', 'Moral'], folk: ['🪔', 'Indian tales'], science: ['🔬', 'Science'], bedtime: ['🌙', 'Bedtime'], adventure: ['🚀', 'Adventure'], funny: ['😂', 'Funny'], habits: ['🧼', 'Good habits'] };
  let curGenre = 'all';
  function childName() {
    let n = window.isGuestUser ? (typeof kqGetNick === 'function' ? kqGetNick() : '') : (currentUser || '');
    n = String(n || '').trim().split(/\s+/)[0];
    return (!n || n === 'Guest') ? 'Champ' : n.slice(0, 16);
  }
  const fill = (s) => String(s).replace(/\{name\}/g, childName());
  const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const muted = () => { try { return localStorage.getItem('kq_muted') === '1'; } catch (e) { return false; } };
  function myLevel() { let l = null; try { l = parseInt(localStorage.getItem('kq_last_class'), 10); } catch (e) {} return LEVELS.indexOf(l) >= 0 ? l : 0; }
  function tap() { try { if (window.KQFX && KQFX.play) KQFX.play('tap'); } catch (e) {} }

  /* ---------- speech: one sentence at a time so it can be highlighted ---------- */
  let speechToken = 0;
  function stopSpeech() { speechToken++; try { speechSynthesis.cancel(); } catch (e) {} try { if (window.Android && Android.stopSpeaking) Android.stopSpeaking(); } catch (e) {} }
  let LANG = 'en-US', PITCH = 1.1;
  function sayOne(text, rate, done) {
    const words = text.split(/\s+/).length, est = 700 + words * 430 / rate;
    let finished = false; const fin = () => { if (finished) return; finished = true; done(); };
    if (muted()) return setTimeout(fin, est);
    try { if (typeof Android !== 'undefined' && Android && typeof Android.speak === 'function') { Android.speak(text, LANG); return setTimeout(fin, est); } } catch (e) {}
    try {
      const u = new SpeechSynthesisUtterance(text); u.rate = rate; u.pitch = PITCH; u.lang = LANG;
      u.onend = fin; u.onerror = fin; speechSynthesis.speak(u);
      setTimeout(fin, est * 1.8 + 1500);
    } catch (e) { setTimeout(fin, est); }
  }
  function readSentences(spans, rate, onDone) {
    stopSpeech(); const my = speechToken;
    let k = 0;
    const step = () => {
      if (my !== speechToken) return;
      spans.forEach((s, j) => s.classList.toggle('on', j === k));
      if (k >= spans.length) { if (onDone) onDone(); return; }
      sayOne(spans[k].textContent.replace(/[“”"]/g, ''), rate, () => { k++; step(); });
    };
    step();
  }

  /* ---------- scene ---------- */
  function sceneHtml(bgId, actors, extraCls) {
    const B = BG[bgId] || BG.meadow;
    let h = '<div class="sc ' + (extraCls || '') + '" style="--s1:' + B.s[0] + ';--s2:' + B.s[1] + '">';
    if (B.stars) h += '<div class="stars-bg"></div>';
    if (B.arches) h += '<svg class="gd" style="height:100%" viewBox="0 0 400 300" preserveAspectRatio="none" aria-hidden="true">' + [40, 140, 240, 340].map((x) => '<path d="M' + (x - 34) + ' 230 V120 Q' + x + ' 50 ' + (x + 34) + ' 120 V230Z" fill="#fcd34d" opacity=".55"/>').join('') + '<rect y="230" width="400" height="70" fill="' + B.floor + '"/><rect y="230" width="400" height="8" fill="#92400e"/></svg>';
    if (B.h) {
      h += '<svg class="gd" viewBox="0 0 400 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 50 Q 80 10 170 42 T 330 30 T 400 40 V120 H0Z" fill="' + B.h[0] + '"/><path d="M0 78 Q 110 44 220 74 T 400 66 V120 H0Z" fill="' + B.h[1] + '"/>';
      if (B.trees) h += [30, 110, 300, 370].map((x, i) => '<g opacity=".55"><rect x="' + (x - 3) + '" y="' + (40 + i % 2 * 8) + '" width="6" height="30" fill="#14532d"/><circle cx="' + x + '" cy="' + (36 + i % 2 * 8) + '" r="18" fill="#166534"/></g>').join('');
      if (B.flowers) h += [40, 90, 150, 260, 330, 380].map((x, i) => '<circle cx="' + x + '" cy="' + (96 + i % 3 * 6) + '" r="4" fill="' + ['#f472b6', '#facc15', '#fb923c'][i % 3] + '"/>').join('');
      if (B.water) h += '<path d="M0 92 Q 100 84 200 92 T 400 90 V120 H0Z" fill="#38bdf8"/><path d="M0 100 Q 100 94 200 100 T 400 98" stroke="#e0f2fe" stroke-width="2" fill="none" opacity=".8"/>';
      h += '</svg>';
    }
    (actors || []).forEach((a, i) => {
      const anim = String(a[4] || '').split(/\s+/).filter(Boolean);
      const cls = anim.filter((x) => x !== 'flip').map((x) => 'a-' + x).join(' ') + (anim.indexOf('flip') >= 0 ? ' flip' : '');
      h += '<div class="ac ' + cls + '" style="left:' + a[1] + '%;top:' + a[2] + '%;width:' + a[3] + '%;animation-delay:' + (i * 0.12) + 's"><span class="fl"><img src="../images/emoji/' + cp(a[0]) + '.svg" alt="" style="animation-delay:' + (i * 0.3) + 's">' +
        (anim.indexOf('gold') >= 0 ? '<span class="gm" style="-webkit-mask-image:url(../images/emoji/' + cp(a[0]) + '.svg);mask-image:url(../images/emoji/' + cp(a[0]) + '.svg)"></span>' : '') + '</span></div>';
    });
    return h + '</div>';
  }

  /* ---------- data ---------- */
  let STORIES = null, RHYMES = [];
  function load() {
    if (STORIES) return Promise.resolve(STORIES);
    const rh = fetch('../data/rhymes.json?v=20261126a', { cache: 'no-cache' }).then((r) => r.json()).then((j) => (RHYMES = j.rhymes || [])).catch(() => {});
    return Promise.all([fetch('../data/stories.json?v=20261126b', { cache: 'no-cache' }).then((r) => r.json()).then((j) => (STORIES = j.stories || [])), rh]);
  }
  const done = () => lsGet('kq_story_done', {});

  /* ---------- list ---------- */
  function showList(level, kind) {
    stopSpeech(); music(false);
    kind = kind === 'r' ? 'r' : 'c';
    level = LEVELS.indexOf(level) >= 0 ? level : myLevel();
    const all = (kind === 'r' ? RHYMES : STORIES).filter((s) => s.level === level), d = done();
    const gs = Object.keys(GENRES).filter((g) => all.some((s) => (s.genres || []).indexOf(g) >= 0));
    if (curGenre !== 'all' && gs.indexOf(curGenre) < 0) curGenre = 'all';
    const list = curGenre === 'all' ? all : all.filter((s) => (s.genres || []).indexOf(curGenre) >= 0);
    let h = '<div class="bar"><button class="rb" id="home" aria-label="Home">🏠</button><h1>' + emo('📚', 30) + ' Story Time</h1><button class="rb" id="snd" aria-label="Sound on/off">' + (muted() ? '🔇' : '🔊') + '</button></div>' +
      '<div class="hello">' + owlSvg() + '<div><h2>Hi ' + esc(childName()) + '! 👋</h2><p>' + (kind === 'r' ? 'Pick a rhyme. Let’s sing along!' : 'Pick a story. I will read it to you!') + '</p></div></div>' +
      '<div class="tabs"><button class="tab' + (kind === 'c' ? ' on' : '') + '" data-k="c">' + emo('📖', 24) + ' Stories</button><button class="tab' + (kind === 'r' ? ' on' : '') + '" data-k="r">' + emo('🎵', 24) + ' Rhymes &amp; Songs</button></div>' +
      '<div class="chips">' + LEVELS.map((l) => '<button class="chip' + (l === level ? ' on' : '') + '" data-lv="' + l + '">' + LBL(l) + '</button>').join('') + '</div>' +
      '<div class="chips gen">' + ['all'].concat(gs).map((g) => '<button class="chip g' + (g === curGenre ? ' on' : '') + '" data-g="' + g + '">' + (g === 'all' ? emo('📚', 20) + ' All' : emo(GENRES[g][0], 20) + ' ' + GENRES[g][1]) + '</button>').join('') + '</div><div class="list">';
    list.forEach((s, i) => {
      const st = d[s.id];
      h += '<button class="card" data-id="' + esc(s.id) + '" style="animation-delay:' + i * 0.06 + 's">' +
        (st == null ? '<span class="tag">NEW</span>' : '') + (s.personal ? '<span class="tag me">⭐ ' + esc(childName()) + '</span>' : '') +
        sceneHtml(s.pages[0].bg || s.bg, s.pages[0].actors) +
        '<span class="info"><b>' + esc(fill(s.title)) + '</b><small>' + (s.genres || []).filter((g) => GENRES[g]).map((g) => GENRES[g][0] + ' ' + GENRES[g][1]).join(' · ') + ' · ' + s.pages.length + (s.kind === 'rhyme' ? ' verses' : ' pages') + '</small> ' +
        (st > 0 ? '<span class="stars">' + '★★★'.slice(0, st) + '☆☆☆'.slice(0, 3 - st) + '</span>' : st === 0 ? '<span class="read">✓ Done</span>' : '') + '</span></button>';
    });
    h += '</div><div class="soon" style="margin-top:14px">' + emo('✨', 24) + ' More ' + (kind === 'r' ? 'rhymes' : 'stories') + ' are coming soon!</div>';
    $app.innerHTML = h;
    $app.querySelectorAll('[data-lv]').forEach((b) => b.onclick = () => { tap(); curGenre = 'all'; try { localStorage.setItem('kq_last_class', b.dataset.lv); } catch (e) {} location.hash = '#/' + kind + '/' + b.dataset.lv; });
    $app.querySelectorAll('[data-g]').forEach((b) => b.onclick = () => { tap(); curGenre = b.dataset.g; showList(level, kind); });
    $app.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { tap(); curGenre = 'all'; location.hash = '#/' + b.dataset.k + '/' + level; });
    $app.querySelectorAll('[data-id]').forEach((b) => b.onclick = () => { tap(); location.hash = '#/s/' + b.dataset.id; });
    $app.querySelector('#home').onclick = () => { stopSpeech(); location.href = '../quiz-home.html'; };
    $app.querySelectorAll('.chips').forEach((row) => { const on = row.querySelector('.chip.on'); if (on) row.scrollLeft = on.offsetLeft - 40; });
    bindSound();
  }
  function bindSound() {
    const b = $app.querySelector('#snd'); if (!b) return;
    b.onclick = () => { try { localStorage.setItem('kq_muted', muted() ? '0' : '1'); } catch (e) {} b.textContent = muted() ? '🔇' : '🔊'; if (muted()) stopSpeech(); };
  }

  /* ---------- reader ---------- */
  let R = null;
  function openStory(id) {
    const s = STORIES.find((x) => x.id === id) || RHYMES.find((x) => x.id === id);
    if (!s) { location.hash = '#/c/' + myLevel(); return; }
    const rhyme = s.kind === 'rhyme';
    LANG = s.lang || 'en-US'; PITCH = rhyme ? 1.25 : 1.1;
    R = { s, rhyme, page: 0, auto: lsGet('kq_story_autoplay', true) !== false, tok: 0, rate: rhyme ? 0.85 : s.level <= 0 ? 0.82 : s.level <= 2 ? 0.9 : 0.97 };
    renderPage();
  }
  function shell(inner) {
    return '<div class="bar"><button class="rb" id="back" aria-label="Back to stories">‹</button><h1>' + esc(fill(R.s.title)) + '</h1><button class="rb" id="snd" aria-label="Sound on/off">' + (muted() ? '🔇' : '🔊') + '</button></div>' + inner;
  }
  function bindShell() {
    $app.querySelector('#back').onclick = () => { stopSpeech(); music(false); tap(); location.hash = '#/' + (R.rhyme ? 'r' : 'c') + '/' + R.s.level; };
    bindSound();
  }
  function sentences(t) { if (t.indexOf('\n') >= 0) return t.split('\n').map((x) => x.trim()).filter(Boolean); return (t.match(/[^.!?…]+[.!?…]+["”]?|[^.!?…]+$/g) || [t]).map((x) => x.trim()).filter(Boolean); }
  function renderPage() {
    stopSpeech();
    const s = R.s, p = s.pages[R.page], n = s.pages.length;
    const txt = sentences(fill(p.text));
    $app.innerHTML = shell('<div class="reader"><div class="dots">' + s.pages.map((_, k) => '<i class="' + (k === R.page ? 'on' : k < R.page ? 'done' : '') + '"></i>').join('') + '</div>' +
      sceneHtml(p.bg || s.bg, p.actors) +
      '<div><div class="txt' + (R.rhyme ? ' lines' : '') + '" style="--fs:' + FONT[String(s.level)] + 'px">' + txt.map((t) => '<span>' + esc(t) + '</span>').join(R.rhyme ? '' : ' ') + '</div>' +
      '<div class="ctl"><button class="cb prev" id="prev" aria-label="Previous page"' + (R.page ? '' : ' disabled') + '>◀</button>' +
      '<button class="cb say' + (R.auto ? ' playing' : '') + '" id="say">' + (R.auto ? '⏸ Pause' : '▶ Play') + '</button>' +
      '<button class="cb next" id="next" aria-label="Next page">' + (R.page === n - 1 ? '✓' : '▶') + '</button></div>' +
      '<div class="auto"><i id="autoBar"></i></div></div></div>');
    bindShell();
    const spans = [...$app.querySelectorAll('.txt span')];
    const tok = ++R.tok;
    const goNext = () => { if (R.page < n - 1) { R.page++; renderPage(); } else theEnd(); };
    music(R.auto && R.rhyme);
    // Auto-play: read the page, wait a moment, turn the page; after the last page, the questions.
    const play = () => readSentences(spans, R.rate, () => {
      if (!R.auto || tok !== R.tok) return;
      const bar = document.getElementById('autoBar'); if (bar) bar.classList.add('run');
      setTimeout(() => { if (R.auto && tok === R.tok) goNext(); }, 1600);
    });
    $app.querySelector('#say').onclick = () => { tap(); R.auto = !R.auto; lsSet('kq_story_autoplay', R.auto); if (!R.auto) { stopSpeech(); R.tok++; } renderPage(); };
    $app.querySelector('#prev').onclick = () => { if (R.page) { tap(); R.page--; renderPage(); } };
    $app.querySelector('#next').onclick = () => { tap(); goNext(); };
    spans.forEach((sp, k) => sp.onclick = () => { if (!R.auto) readSentences([sp], R.rate); });
    if (R.auto) setTimeout(() => { if (tok === R.tok) play(); }, 600);
  }

  /* ---------- the end: answer questions about the story, or skip ---------- */
  function theEnd() {
    stopSpeech(); music(false);
    if (!R.s.quiz || !R.s.quiz.length) return finish(true);
    $app.innerHTML = shell('<div class="end">' + emo(R.rhyme ? '🎵' : '📖', 72) + '<h2>' + (R.rhyme ? 'Well sung' : 'The End') + ', ' + esc(childName()) + '!</h2>' +
      '<p style="font-weight:700;margin:6px 0 4px">Can you answer ' + R.s.quiz.length + ' questions about the ' + (R.rhyme ? 'rhyme' : 'story') + '?</p>' +
      '<button class="big go" id="quizGo">' + emo('🦉', 26) + ' Yes, ask me!</button><button class="big skip" id="quizSkip">Skip questions ›</button>' +
      '<button class="big alt" id="again">↺ ' + (R.rhyme ? 'Sing' : 'Read') + ' again</button></div>');
    bindShell();
    sayOne((R.rhyme ? 'Well sung, ' : 'The end! Well done, ') + childName() + '! Can you answer some questions?', 0.95, () => {});
    $app.querySelector('#quizGo').onclick = () => { tap(); startQuiz(); };
    $app.querySelector('#quizSkip').onclick = () => { tap(); finish(true); };
    $app.querySelector('#again').onclick = () => { tap(); R.page = 0; renderPage(); };
  }

  /* ---------- quiz ---------- */
  function startQuiz() { R.qi = 0; R.right = 0; showQ(); }
  function showQ() {
    stopSpeech();
    const q = R.s.quiz[R.qi], pics = q.o.every(isPic);
    const opts = q.o.slice().sort(() => Math.random() - 0.5);
    $app.innerHTML = shell('<div class="dots">' + R.s.quiz.map((_, k) => '<i class="' + (k === R.qi ? 'on' : k < R.qi ? 'done' : '') + '"></i>').join('') + '</div>' +
      '<div class="q"><h3>' + emo('🦉', 34) + ' ' + esc(fill(q.q)) + '</h3><div class="opts' + (pics ? ' pics n' + opts.length : '') + '">' +
      opts.map((o, k) => '<button class="op" data-o="' + esc(o) + '" style="--c:' + OPT_COLORS[k % 4] + '">' + (pics ? emo(o, 62) : esc(fill(o))) + '</button>').join('') + '</div>' +
      '<button class="qskip" id="qskip">Skip questions ›</button></div>');
    bindShell();
    $app.querySelector('#qskip').onclick = () => { tap(); stopSpeech(); finish(true); };
    let locked = false;
    $app.querySelectorAll('.op').forEach((b) => b.onclick = () => {
      if (locked) return; locked = true;
      const ok = b.dataset.o === q.a;
      if (ok) { R.right++; b.classList.add('ok'); try { KQFX.play('success'); } catch (e) {} }
      else {
        b.classList.add('no'); try { KQFX.play('wrong'); } catch (e) {}
        $app.querySelectorAll('.op').forEach((x) => { if (x.dataset.o === q.a) x.classList.add('ok'); else if (x !== b) x.classList.add('dim'); });
      }
      sayOne(ok ? 'Well done!' : (isPic(q.a) ? 'Good try!' : 'The answer is: ' + fill(q.a)), 0.95, () => {});
      setTimeout(() => { R.qi++; if (R.qi < R.s.quiz.length) showQ(); else finish(); }, ok ? 1300 : 2400);
    });
    setTimeout(() => sayOne(fill(q.q) + (pics ? '' : ' ' + opts.map(fill).join('? ') + '?'), R.rate, () => {}), 300);
  }
  function finish(skipped) {
    music(false);
    const s = R.s, stars = skipped ? 0 : R.right, d = done();
    d[s.id] = Math.max(d[s.id] || 0, stars); lsSet('kq_story_done', d);
    const plan = lsGet('kq_plan', {}); const today = new Date().toDateString();
    if (plan.d !== today) { plan.d = today; plan.done = {}; } plan.done.story = 1; lsSet('kq_plan', plan);
    try { if (stars && window.KQCoins) KQCoins.earn('quiz', 'story_' + s.id); } catch (e) {}
    try { if (stars === 3 && window.KQFX && KQFX.celebrate) KQFX.celebrate(); } catch (e) {}
    const last = s.pages[s.pages.length - 1].text;
    const nm = childName();
    const title = skipped ? (R.rhyme ? 'Well sung, ' : 'Well read, ') + nm + '!' : stars === 3 ? 'Super ' + (R.rhyme ? 'singer' : 'reader') + ', ' + nm + '!' : stars ? 'Well done, ' + nm + '!' : 'Good try, ' + nm + '!';
    $app.innerHTML = shell('<div class="end">' + emo(!skipped && stars === 3 ? '🏆' : R.rhyme ? '🎵' : '📚', 72) + '<h2>' + esc(title) + '</h2>' +
      (skipped ? '' : '<div class="stars">' + '★★★'.slice(0, stars) + '☆☆☆'.slice(0, 3 - stars) + '</div><p style="font-weight:700;margin:4px 0">' + stars + ' of ' + s.quiz.length + ' answers right</p>') +
      (s.level >= 1 && !R.rhyme ? '<div class="moral">' + emo('💡', 22) + ' ' + esc(fill(last)) + '</div>' : '') +
      '<button class="big go" id="more">' + emo(R.rhyme ? '🎵' : '📚', 26) + ' More ' + (R.rhyme ? 'rhymes' : 'stories') + '</button><button class="big alt" id="again">↺ ' + (R.rhyme ? 'Sing' : 'Read') + ' again</button></div>');
    bindShell();
    sayOne(skipped ? title : title + ' You got ' + stars + ' out of ' + s.quiz.length + '.', 0.95, () => {});
    $app.querySelector('#more').onclick = () => { tap(); location.hash = '#/' + (R.rhyme ? 'r' : 'c') + '/' + s.level; };
    $app.querySelector('#again').onclick = () => { tap(); R.page = 0; renderPage(); };
  }

  /* soft background music while a rhyme plays */
  let bgm = null;
  function music(on) {
    try {
      if (on && !muted()) { if (!bgm) { bgm = new Audio('../games/sounds/bgm-loop.mp3'); bgm.loop = true; bgm.volume = 0.12; } const p = bgm.play(); if (p && p.catch) p.catch(() => {}); }
      else if (bgm) bgm.pause();
    } catch (e) {}
  }
  function owlSvg() {
    return '<svg class="owl" viewBox="0 0 120 120" aria-hidden="true"><path d="M30 30 L40 12 L50 30Z" fill="#7c3aed"/><path d="M70 30 L80 12 L90 30Z" fill="#7c3aed"/><ellipse cx="60" cy="70" rx="42" ry="44" fill="#8b5cf6"/><ellipse cx="60" cy="82" rx="26" ry="28" fill="#ede9fe"/><circle cx="44" cy="50" r="17" fill="#fff"/><circle cx="76" cy="50" r="17" fill="#fff"/><circle cx="46" cy="51" r="8" fill="#1e1b4b"/><circle cx="74" cy="51" r="8" fill="#1e1b4b"/><path d="M54 62 L66 62 L60 72Z" fill="#f59e0b"/><rect x="34" y="92" width="52" height="20" rx="4" fill="#f472b6"/><rect x="58" y="92" width="4" height="20" fill="#be185d"/></svg>';
  }

  function route() {
    const parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    window.scrollTo(0, 0);
    if (parts[0] === 's' && parts[1]) return openStory(decodeURIComponent(parts[1]));
    if ((parts[0] === 'c' || parts[0] === 'r') && parts[1] != null) return showList(parseInt(parts[1], 10), parts[0]);
    if (parts[0] === 'r') return showList(myLevel(), 'r');
    showList(myLevel());
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('pagehide', () => { stopSpeech(); music(false); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopSpeech(); music(false); } });
  load().then(route).catch(() => { $app.innerHTML = '<div class="soon" style="margin-top:40px">' + emo('📡', 40) + '<br>Stories could not load. Check the internet and try again.</div>'; });
})();
</script>
